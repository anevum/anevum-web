name: IREN
options:
  bundleIdPrefix: com.anevum
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targets:
  IREN:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IREN
      - path: Shared
    info:
      path: IREN/Info.plist
    entitlements:
      path: IREN/IREN.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.anevum.iren
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anevum.iren
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2.0
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - target: IRENWidgets
        embed: true

  IRENWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: IRENWidgets
      - path: Shared
    info:
      path: IRENWidgets/Info.plist
    entitlements:
      path: IRENWidgets/IRENWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.anevum.iren
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anevum.iren.widgets
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.2.0
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  IREN:
    build:
      targets:
        IREN: all
        IRENWidgets: all
    run:
      config: Debug
    archive:
      config: Release
