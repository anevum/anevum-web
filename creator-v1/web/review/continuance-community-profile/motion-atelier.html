.preview-window.viewport-phone .profile-header-row{display:grid;grid-template-columns:77px minmax(0,1fr);gap:12px}.preview-window.viewport-phone .profile-header-row>.pill.copper{grid-column:1 / -1;justify-self:start}.preview-window.viewport-phone .profile-id .nameplate{white-space:normal;word-break:normal;overflow-wrap:normal;line-height:1.4}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="app"></div>
<script>/* ANEVUM CONTINUANCE / MOTION ATELIER
   In-memory design review only. Every persona, card and submission is fictional.
   No fetch, no third-party code, no durable storage, no backend mutation.
*/
(() => {
  'use strict';
  const html = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const root = document.getElementById('app');
  const icon = (name,size=18) => {
    const p={
      community:'<path d="M20 13a7 7 0 0 0-7-7H6a4 4 0 0 0-4 4v4a4 4 0 0 0 4 4h6l4 3v-3a7 7 0 0 0 4-5Z"/><path d="M7 11h6M7 14h3"/>',
      profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
      creator:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 16 8-8M9 8h7v7"/>',
      tune:'<path d="M4 7h16M4 17h16M8 4v6M16 14v6"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="17" r="2"/>',
      bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/>',
      spark:'<path d="m12 2 2.6 6.9L21 12l-6.4 3.1L12 22l-2.7-6.9L3 12l6.3-3.1L12 2Z"/>',
      moon:'<path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5 8.6 8.6 0 1 0 20.5 14.6Z"/>',
      play:'<path d="m8 5 11 7-11 7V5Z"/>',
      arrow:'<path d="M5 12h14m-7-7 7 7-7 7"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      edit:'<path d="m4 16 11-11a2 2 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
      lock:'<rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
      globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a16 16 0 0 1 0 18M12 3a16 16 0 0 0 0 18"/>',
      search:'<circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 6 6"/>',
      close:'<path d="M4 4 20 20M20 4 4 20"/>',
      save:'<path d="M5 3h13l3 3v15H3V3h2ZM7 3v7h10V3M7 21v-8h10v8"/>',
      reset:'<path d="M3 11a9 9 0 1 1 2 6M3 4v7h7"/>',
      heart:'<path d="M20.6 4.8a5.5 5.5 0 0 0-7.8 0L12 5.6l-.8-.8a5.5 5.5 0 0 0-7.8 7.8L12 21l8.6-8.4a5.5 5.5 0 0 0 0-7.8Z"/>',
      compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2 6-6 2 2-6 6-2Z"/>',
      comment:'<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.5 8.5 0 0 1-4-.95L3 21l1.95-5.5a8.5 8.5 0 1 1 16.05-4Z"/>',
    };
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.spark}</svg>`;
  };
  // Geometry is transcribed from the existing repository OrbitalMark.tsx.
  // The mask makes the two actual core-cut circles transparent at any backdrop.
  const officialOrbitalMark = (className,maskId) => `<svg class="${className}" viewBox="0 0 512 512" fill="none" aria-hidden="true" focusable="false"><defs><mask id="${maskId}" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><rect width="512" height="512" fill="white"/><circle cx="269" cy="251" r="34" fill="black"/><circle cx="239" cy="230" r="8" fill="black" opacity=".82"/></mask></defs><g mask="url(#${maskId})"><ellipse cx="256" cy="256" rx="188" ry="76" transform="rotate(-17 256 256)" stroke="currentColor" stroke-width="34" stroke-linecap="round"/><path d="M256 56 274 211 326 256 274 301 256 456 238 301 186 256 238 211Z" fill="currentColor"/><circle cx="256" cy="256" r="72" fill="currentColor"/><circle cx="391" cy="132" r="20" fill="currentColor"/></g></svg>`;
  const logo=officialOrbitalMark('brand-mark','anext-brand-mark-cut');
  const palettes=[
    {key:'origin',name:'Origin',style:'linear-gradient(135deg,#7f7bcc,#e9b98a 80%)'},
    {key:'cinder',name:'Cinder',style:'linear-gradient(135deg,#8f3853,#eeb486 80%)'},
    {key:'halo',name:'Halo',style:'linear-gradient(135deg,#9569e9,#e5acd1 80%)'},
    {key:'glacier',name:'Glacier',style:'linear-gradient(135deg,#2c7095,#b3dcd9 80%)'},
    {key:'verdant',name:'Verdant',style:'linear-gradient(135deg,#4d8779,#ccd69b 80%)'}
  ];
  const banners=[['nebula','Nebula','Sculpted light'],['horizon','Horizon','Orbital sunrise'],['aurora','Aurora','Moving atmosphere'],['matrix','Signal grid','Spatial lines']];
  const frames=[['orbit','Orbital','Animated contour'],['comet','Comet','Drifting accent'],['crown','Radiant','Cosmic flare'],['minimal','Minimal','Clean silhouette']];
  const plates=[['holo','Iridescent','Prismatic title'],['copper','Copper','Warm metallic'],['signal','Signal','Technical glow'],['minimal','Plain','Essential']];
  const entrances=[['orbit','Orbit reveal','A new world opens'],['starfall','Starfall','Signals resolve'],['awakening','Aurora wake','Light through space'],['none','None','No entrance effect']];
  const posts=[
    {id:'p1',type:'discussion',title:'A small control scheme that makes a big world playable',summary:'Designing a game you can explore with one hand. Looking for thoughtful accessibility feedback and control ideas.',name:'Lina Vale',handle:'lina',role:'Playtester',initial:'L',topic:'Playtesting',date:'CONCEPT POST / 01'},
    {id:'p2',type:'project',title:'Field of Light — an interactive experiment',summary:'A study of particles, gestures and quiet exploration. Illustrated release card; no playable project is available in this concept.',name:'Marin Ash',handle:'marin',role:'Creator',initial:'M',topic:'Creative work',date:'CONCEPT RELEASE / 02'},
    {id:'p3',type:'discussion',title:'What should the very first moment of Creator Studio feel like?',summary:'One scene, one object and an immediate sense that making something here is possible.',name:'Aya Sol',handle:'aya',role:'Creator',initial:'A',topic:'Studio',date:'CONCEPT POST / 03'},
    {id:'p4',type:'project',title:'Atlas / a tiny toolkit for curious makers',summary:'An imagined open toolkit emphasizing clarity, local previews and sharing with credit.',name:'Nova Reed',handle:'nova',role:'Explorer',initial:'N',topic:'Tools',date:'CONCEPT RELEASE / 04'},
  ];
  const personas={
    nova:{name:'Nova Reed',handle:'nova',initial:'N',role:'Explorer',headline:'Collecting signals from unfamiliar worlds.',bio:'I love playable experiments, generous creators, thoughtful feedback, and strange little corners of the web.',type:'Member World'},
    marin:{name:'Marin Ash',handle:'marin',initial:'M',role:'Creator',headline:'Small tools. Strange worlds. Human-first interfaces.',bio:'Building interfaces, tiny games and experiments that help people create things of their own.',type:'Creator Channel'},
    lina:{name:'Lina Vale',handle:'lina',initial:'L',role:'Playtester',headline:'Making every interaction more reachable.',bio:'Exploring one-handed game controls, accessible interactions, and thoughtful feedback for makers.',type:'Public Member World'},
    aya:{name:'Aya Sol',handle:'aya',initial:'A',role:'Maker',headline:'Making playful things with light and sound.',bio:'An independent designer exploring creative code and new ways to learn by making.',type:'Public Creator World'}
  };
  const defaults=Object.freeze({name:'Nova Reed',headline:'Collecting signals from unfamiliar worlds.',bio:'I love playable experiments, generous creators, thoughtful feedback, and strange little corners of the web.'});
  const state={view:'atelier',editorTab:'appearance',profileTab:'work',theme:'origin',banner:'nebula',frame:'orbit',plate:'holo',entrance:'orbit',motion:'full',accent:'#e8b693',customAccent:false,visitor:false,screen:'desktop',publicVisible:false,name:defaults.name,headline:defaults.headline,bio:defaults.bio,feed:'all',room:'all',search:'',modal:null,previousFocus:null,toast:'',liked:new Set(),saved:new Set(),draft:'',creatorTab:'work'};
  const systemMotion=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  const updateSystemMotion=()=>document.documentElement.classList.toggle('system-reduced',!!systemMotion?.matches);
  updateSystemMotion(); if(systemMotion?.addEventListener)systemMotion.addEventListener('change',updateSystemMotion);
  const toasts=(label)=>{state.toast=label;const toast=document.getElementById('toast');if(toast)toast.innerHTML=`<strong>Local concept interaction</strong>${html(label)} <button type="button" aria-label="Dismiss notice" data-dismiss="1" class="text-button">Dismiss</button>`;if(toast)toast.hidden=false;};
  const assetStars=()=>{let seed=981332;let s='';for(let i=0;i<52;i++){seed=(seed*1664525+1013904223)>>>0;const x=(seed%990)/10;seed=(seed*1664525+1013904223)>>>0;const y=(seed%970)/10;seed=(seed*1664525+1013904223)>>>0;const op=.25+(seed%66)/100;const sz=(seed%7===0)?'3px':'1.5px';s+=`<i style="left:${x}%;top:${y}%;--s:${sz};--o:${Math.min(.98,op)};--delay:-${(i%13)*.37}s;--t:${3+(i%9)/2}s" aria-hidden="true"></i>`;}return s;};
  const STARS=assetStars();
  const sigil=officialOrbitalMark('cover-sigil-mark','anext-cover-mark-cut');
  const coverArt=()=>`<div class="profile-cover-art"></div><div class="cover-rays"></div><div class="cover-grid"></div><div class="banner-starfield" aria-hidden="true">${STARS}</div><div class="cover-orbital" aria-hidden="true"><i class="orbit one"></i><i class="orbit two"></i><i class="orbit three"></i><i class="orbit-dot"></i></div>`;
  const portrait=(person,frame=state.frame)=>`<div class="profile-portrait ${'frame-'+html(frame)}" aria-hidden="true"><span class="portrait-inner">${html(person.initial||'N')}</span></div>`;
  const pageClasses=()=>`page ${state.motion==='off'?'motion-off':state.motion==='gentle'?'motion-gentle motion-on':'motion-on'}`;
  const header=()=>`<header class="header"><a href="#atelier" class="brand" data-view="atelier" aria-label="ANEVUM — open profile motion atelier">${logo}<span class="brand-title"><strong>ANEVUM</strong><span>CONTINUANCE / STUDIO EXPERIMENTS</span></span></a><nav class="topnav" aria-label="Primary"><button class="navlink ${state.view==='community'?'active':''}" data-view="community" ${state.view==='community'?'aria-current="page"':''}>Community</button><button class="navlink ${state.view==='member'?'active':''}" data-view="member">Member world</button><button class="navlink ${state.view==='creator'?'active':''}" data-view="creator">Creator channel</button><button class="navlink ${state.view==='atelier'?'active':''}" data-view="atelier">Profile Atelier</button></nav><div class="head-actions"><span class="head-label">LOCAL CONCEPT / NO ACCOUNT</span><button class="chip-btn" data-motion-toggle aria-label="Toggle animation, current setting ${html(state.motion)}">${icon(state.motion==='off'?'moon':'spark',14)} <span>${state.motion==='off'?'Motion off':state.motion==='gentle'?'Gentle motion':'Pause motion'}</span></button><button class="button-primary" data-view="atelier">${icon('tune',15)} Customize</button></div></header>`;
  const rail=()=>`<aside class="rail" aria-label="Community navigation"><div class="rail-sticky"><div class="rail-heading eyebrow">WAYFINDER / 001</div><nav class="rail-nav" aria-label="Concept views"><button class="rail-link ${state.view==='community'?'active':''}" data-view="community" ${state.view==='community'?'aria-current="page"':''}>${icon('community')}<span>Community</span></button><button class="rail-link ${state.view==='member'?'active':''}" data-view="member" ${state.view==='member'?'aria-current="page"':''}>${icon('profile')}<span>Member world</span></button><button class="rail-link ${state.view==='creator'?'active':''}" data-view="creator" ${state.view==='creator'?'aria-current="page"':''}>${icon('creator')}<span>Creator channel</span></button><button class="rail-link ${state.view==='atelier'?'active':''}" data-view="atelier" ${state.view==='atelier'?'aria-current="page"':''}>${icon('tune')}<span>My space</span></button></nav><div class="rail-label">TOPIC SPACES</div><button class="room-link ${state.room==='Studio'?'active':''}" data-room="Studio"><span class="room-icon">⌘</span><span>Studio experiments</span></button><button class="room-link ${state.room==='Playtesting'?'active':''}" data-room="Playtesting"><span class="room-icon">◇</span><span>Playtest exchange</span></button><button class="room-link ${state.room==='Creative work'?'active':''}" data-room="Creative work"><span class="room-icon">◈</span><span>Creator showcase</span></button><button class="room-link ${state.room==='all'?'active':''}" data-room="all"><span class="room-icon">◎</span><span>All conversations</span></button><section class="rail-card"><span class="eyebrow">FIRST SIGNAL / 01</span><h3>Creativity has a place here.</h3><p>Discover work, exchange ideas, and make a world that feels like your own.</p></section><div class="rail-footer">ANEVUM / INTERACTIVE REVIEW</div></div></aside>`;
  const crumb=(title)=>`<div class="eyebrow">ANEVUM <span class="thin-sep"></span> CONTINUANCE <span class="thin-sep"></span> ${html(title)}</div>`;
  const headerTitle=(title,subtitle,tools='')=>`<div class="workspace-header"><div>${crumb(title)}<h1>${subtitle}</h1><div class="concept-note">PRIVATE OFFLINE DESIGN STUDY <span class="thin-sep"></span> NO LIVE USER DATA</div></div><div class="heading-tools">${tools}</div></div>`;
  const profileBody=(who,tab='work')=>{
    if(tab==='about')return `<div class="profile-copy-zone"><div class="section-micro">THE INTRODUCTION / OWNER-CONTROLLED</div><h4>A little about this world.</h4><p>${html(who.bio)}</p><div class="profile-stats"><span>INTERESTS / <strong>Games</strong></span><span><strong>Creative code</strong></span><span><strong>Accessibility</strong></span></div></div>`;
    if(tab==='recognition')return `<div class="profile-copy-zone"><div class="section-micro">RECOGNITION / SERVER-VERIFIED IN PRODUCT</div><h4>A place for genuine milestones.</h4><p>Actual earned awards and achievements would appear here only when verified by ANEVUM. This demo invents no badges, XP or account roles.</p></div>`;
    if(tab==='wall')return `<div class="profile-copy-zone"><div class="section-micro">PUBLIC WALL / OWNER-APPROVED ONLY</div><h4>Notes from the world.</h4><p>“A great community makes room for the person asking their very first question.”</p><div class="pill">FICTIONAL EXAMPLE / NOT PUBLISHED</div></div>`;
    return `<div class="profile-copy-zone"><div class="section-micro">SELECTED CREATIONS & CURIOSITIES / DESIGN FIXTURES</div><div class="profile-mini-grid"><div class="work-tile"><small>Field notes / 01</small><strong>Little Worlds</strong></div><div class="work-tile"><small>Interactive / 02</small><strong>Signal Garden</strong></div><div class="work-tile"><small>Collected / 03</small><strong>Orbit Atlas</strong></div></div></div>`;
  };
  const profileCard=({creator=false,embed=false}={})=>{
    const who=creator?personas.marin:{...personas.nova,name:state.name,headline:state.headline,bio:state.bio,initial:state.name.trim().charAt(0)||'N'};
    const localTheme=creator?'halo':state.theme;
    const localBanner=creator?'horizon':state.banner;
    const localFrame=creator?'comet':state.frame;
    const localPlate=creator?'signal':state.plate;
    const selected=creator?state.creatorTab:state.profileTab;
    const personal=creator?'Maker / Fictional':state.publicVisible?'Public-layout preview':'Private-by-default';
    const whoStyle=!creator&&state.customAccent?`style="--user-accent:${html(state.accent)}"`:'';
    return `<div id="profile-frame" ${whoStyle} class="profile-frame ${'theme-'+localTheme} ${!creator&&state.customAccent?'custom-accent':''} ${'banner-'+localBanner} ${'entrance-'+state.entrance}">
      <section class="profile-banner" aria-label="${creator?'Creator channel':'Member world'} custom profile cover">${coverArt()}<div class="profile-banner-top"><div class="eyebrow">${creator?'CREATOR CHANNEL':'MEMBER WORLD'} / ATMOSPHERE 0${palettes.findIndex(x=>x.key===localTheme)+1}</div><div class="profile-signal">${creator?'ORIGINAL WORK':'FICTIONAL IDENTITY'}</div></div><div class="profile-banner-copy"><span class="head-meta">✦ ${html(personal.toUpperCase())} · ${creator?'MARIN':html(who.handle.toUpperCase())}</span><h2 data-bind="name">${html(who.name)}</h2><p class="tagline" data-bind="headline">${html(who.headline)}</p></div><span class="cover-sigil">${sigil}</span></section>
      <div class="profile-reveal"><div class="profile-header-row">${portrait(who,localFrame)}<div class="profile-id"><span class="nameplate plate-${localPlate}" data-bind="plate">${creator?'WORLD MAKER':'EXPLORER / CONTINUANCE'}</span><h3 data-bind="idname">${html(who.name)}</h3><div class="handle">@${html(who.handle)} <span class="thin-sep"></span> ${creator?'CREATOR CHANNEL':'MEMBER WORLD'}</div></div><span class="pill copper">${icon(creator?'creator':'profile',13)} ${creator?'Published work':'Personal space'}</span></div><div class="profile-badges"><span class="pill">THEME / ${html(localTheme.toUpperCase())}</span><span class="pill">${html(localBanner.toUpperCase())} ATMOSPHERE</span><span class="pill">NO UNVERIFIED AWARDS</span></div><div class="profile-card-bottom"><p class="about" data-bind="bio">${html(who.bio)}</p><div class="profile-tabs" role="tablist" aria-label="${creator?'Creator':'Member'} profile sections">${[['work','Creations'],['wall','Journal'],['recognition','Recognition'],['about','About']].map(([id,label])=>`<button type="button" role="tab" id="tab-${id}" aria-controls="profile-tabpanel" tabindex="${selected===id?'0':'-1'}" aria-selected="${selected===id}" data-profile-tab="${id}" ${creator?'data-creator="1"':''}>${label}</button>`).join('')}</div><div role="tabpanel" id="profile-tabpanel" aria-labelledby="tab-${selected}">${profileBody(who,selected)}</div></div>${!creator&&state.visitor?'<div class="profile-visitor-note">'+icon('globe',13)+' Visitor preview only — unpublished details are not released here.</div>':''}</div>
      </div>`;
  };
  const swatchButtons=()=>`<div class="option-grid" role="group" aria-label="Profile atmosphere palette">${palettes.map(p=>`<button type="button" class="swatch-btn" data-theme="${p.key}" aria-pressed="${state.theme===p.key}" style="--swatch:${p.style}" title="Choose ${p.name} theme"><span>${p.name}</span></button>`).join('')}</div>`;
  const choiceButtons=(options,data,current)=>`<div class="choice-grid" role="group" aria-label="${data} options">${options.map(([id,name,desc])=>`<button type="button" class="choice" data-${data}="${id}" aria-pressed="${current===id}"><span>${html(name)}</span><small>${html(desc)}</small></button>`).join('')}</div>`;
  const atelierPanel=()=>`<section class="panel atelier" aria-labelledby="atelier-title"><div class="panel-header"><div class="atelier-title"><span class="eyebrow subtle">ANEVUM / PERSONALIZATION ENGINE</span><strong id="atelier-title">The Profile Atelier.</strong></div><span class="pill copper">LIVE PREVIEW</span></div><div class="atelier-nav" role="tablist" aria-label="Editor groups"><button type="button" role="tab" id="editor-tab-identity" tabindex="${state.editorTab==='identity'?'0':'-1'}" aria-selected="${state.editorTab==='identity'}" aria-controls="editor-panel" data-editor-tab="identity">Identity</button><button type="button" role="tab" id="editor-tab-appearance" tabindex="${state.editorTab==='appearance'?'0':'-1'}" aria-selected="${state.editorTab==='appearance'}" aria-controls="editor-panel" data-editor-tab="appearance">Appearance</button><button type="button" role="tab" id="editor-tab-effects" tabindex="${state.editorTab==='effects'?'0':'-1'}" aria-selected="${state.editorTab==='effects'}" aria-controls="editor-panel" data-editor-tab="effects">Effects</button></div><div id="editor-panel" role="tabpanel" aria-labelledby="editor-tab-${state.editorTab}" class="atelier-body">${state.editorTab==='identity'?identityFields():state.editorTab==='effects'?effectFields():appearanceFields()}</div><div class="atelier-foot"><div><div class="tiny">CHANGES REMAIN IN THIS BROWSER TAB ONLY</div><div class="small">Not saved or published to ANEVUM</div></div><button type="button" class="button-primary" data-local-save>${icon('save',14)} Preview receipt</button></div></section>`;
  const identityFields=()=>`<div class="atelier-section-head"><h3>Identity composition</h3><span class="index">01 / 03</span></div><p class="atelier-caption">A short introduction and a presence that belongs to you.</p><div class="field"><label for="f-name">Display name</label><input id="f-name" maxlength="64" data-field="name" value="${html(state.name)}"><div class="field-count" id="count-name">${state.name.length} / 64</div></div><div class="field"><label for="f-headline">Profile headline</label><input id="f-headline" maxlength="110" data-field="headline" value="${html(state.headline)}"><div class="field-count" id="count-headline">${state.headline.length} / 110</div></div><div class="field"><label for="f-bio">About this world</label><textarea id="f-bio" maxlength="420" data-field="bio">${html(state.bio)}</textarea><div class="field-count" id="count-bio">${state.bio.length} / 420</div></div><div class="field-divider"></div><div class="atelier-section-head"><h3>Visibility & boundaries</h3><span class="index">PRIVATE FIRST</span></div><label class="privacy-switch" for="f-public"><input id="f-public" type="checkbox" ${state.publicVisible?'checked':''}><div><strong>Preview a public member world</strong><small>This changes only the mockup. No account or publishing occurs.</small></div></label><p class="access-note">A real profile would require the signed-in owner, a server revision, deliberate publication and a separate preview of which fields are visible.</p>`;
  const appearanceFields=()=>`<div class="atelier-section-head"><h3>World atmosphere</h3><span class="index">02 / 03</span></div><p class="atelier-caption">Pick a signature mood. Text and accessibility contrast stay stable.</p>${swatchButtons()}<div class="atelier-section-head"><h3>Cover composition</h3><span class="index">02.1</span></div>${choiceButtons(banners,'banner',state.banner)}<div class="atelier-section-head"><h3>Avatar decoration</h3><span class="index">02.2</span></div>${choiceButtons(frames,'frame',state.frame)}<div class="atelier-section-head"><h3>Nameplate treatment</h3><span class="index">02.3</span></div>${choiceButtons(plates,'plate',state.plate)}<div class="atelier-section-head"><h3>Custom accent</h3><span class="index">02.4</span></div><p class="atelier-caption">Local accent color; never overrides body text contrast.</p><label class="palette-input"><span class="small">Use custom accent <input type="checkbox" id="f-custom" ${state.customAccent?'checked':''}></span><input id="f-accent" aria-label="Custom accent color" type="color" value="${html(state.accent)}"></label>`;
  const effectFields=()=>`<div class="atelier-section-head"><h3>Profile entrance</h3><span class="index">03 / 03</span></div><p class="atelier-caption">A signature entrance—not constant distraction. Replay it when exploring alternatives.</p>${choiceButtons(entrances,'entrance',state.entrance)}<button class="button-ghost" data-replay>${icon('play',13)} Replay entrance preview</button><div class="field-divider"></div><div class="atelier-section-head"><h3>Motion intensity</h3><span class="index">REAL CONTROL</span></div><div class="motion-values" role="group" aria-label="Animation intensity">${[['full','Full'],['gentle','Gentle'],['off','Off']].map(([key,label])=>`<button type="button" data-motion="${key}" aria-pressed="${state.motion===key}">${label}</button>`).join('')}</div><p class="access-note">Your system’s reduced-motion setting overrides this demo. Pausing stops ambient loops, entrance effects, and optional transitions. Visual identity remains legible without motion.</p><div class="field-divider"></div><div class="atelier-section-head"><h3>Effects budget</h3><span class="index">GPU / MOTION</span></div><div class="hint">${icon('spark',17)} Transforms and opacity drive ambient effects. No autoplay audio, network animation assets, or mandatory WebGL. Profiles remain functional on low-power devices.</div>`;
  const studioView=()=>`${headerTitle('Profile Atelier','Make your profile<br><em>a world.</em>',`<button class="button-ghost" data-reset>${icon('reset',14)} Reset study</button>`)}<div class="studio-layout"><div class="preview-column"><section class="panel"><div class="panel-header"><span class="preview-label">01 / YOUR IDENTITY — INSTANT PREVIEW</span><div class="panel-header-right"><div class="mode-switch" role="group" aria-label="Preview device"><button data-screen="desktop" aria-pressed="${state.screen==='desktop'}">Desktop</button><button data-screen="phone" aria-pressed="${state.screen==='phone'}">Phone</button></div></div></div><div class="panel-inner"><div id="preview-slot" class="preview-window ${state.screen==='phone'?'viewport-phone':''}">${profileCard()}</div><div class="kit-footer"><span class="pill">${icon('lock',12)} ${state.publicVisible?'PUBLIC-LAYOUT DEMO':'PRIVATE BY DEFAULT'}</span><button class="button-ghost tiny-btn" data-visitor>${icon('globe',13)} ${state.visitor?'Return to editor':'Preview as visitor'}</button><button class="button-ghost tiny-btn" data-replay>${icon('play',13)} Replay entrance</button></div></div></section><div class="hint">${icon('spark',18)} Personalization is cosmetic. Earned awards, roles and XP can never be minted by a theme picker; real publication remains a separate server-controlled step.</div></div>${atelierPanel()}</div>`;
  const signalCard=(p)=>`<article class="signal-card"><div class="signal-top"><button class="signal-author" data-profile="${p.handle}" aria-label="Open local ${html(p.name)} profile card"><div class="signal-avatar ${p.handle==='marin'?'decoration':''}">${html(p.initial)}</div><span><span class="signal-author-name">${html(p.name)}</span><br><span class="signal-meta">@${html(p.handle)} / ${html(p.role)}</span></span></button><span class="post-type">${html(p.type==='discussion'?'CONVERSATION':'PROJECT')} · ${html(p.topic)}</span></div><h4>${html(p.title)}</h4><p>${html(p.summary)}</p><div class="signal-actions"><div class="signal-stamps"><span class="pill">${html(p.date)}</span></div><span><button type="button" class="button-ghost tiny-btn" data-like="${p.id}" aria-pressed="${state.liked.has(p.id)}">${icon('heart',13)} ${state.liked.has(p.id)?'Appreciated':'Appreciate'}</button> <button type="button" class="button-ghost tiny-btn" data-openpost="${p.id}">${p.type==='discussion'?'Read conversation':'Project context'} ${icon('arrow',13)}</button></span></div></article>`;
  const visiblePosts=()=>posts.filter(p=>(state.feed==='all'||state.feed===p.type)&&(state.room==='all'||state.room===p.topic)&&(!state.search||[p.title,p.summary,p.name,p.topic].some(x=>x.toLowerCase().includes(state.search.toLowerCase()))));
  const feedMarkup=()=>{const filtered=visiblePosts();return filtered.length?filtered.map(signalCard).join(''):`<div class="blank"><strong>No matches in this view.</strong><p>Try a different term or clear the topic filter. The actual product should never manufacture content to fill empty states.</p><button class="button-ghost" data-clear-search>Clear filters</button></div>`;};
  const communityView=()=>`${headerTitle('Community','A place for<br><em>every kind of maker.</em>',`<button type="button" class="button-ghost" data-compose>${icon('edit',15)} Start a conversation</button>`)}<div class="community-layout"><div class="community-main"><section class="arrival"><span class="eyebrow">THE ANEVUM COMMUNITY / SIGNAL 001</span><div class="arrival-graphic" aria-hidden="true"></div><h2>Ideas find<br><em>their people.</em></h2><p>Discover work, exchange thoughtful feedback and meet the people building games, tools and strange little worlds.</p><div class="arrival-actions"><button class="button-primary" data-compose>Join a conversation ${icon('arrow',15)}</button><button class="button-ghost" data-view="member">Explore a member world ${icon('arrow',15)}</button></div></section><section class="panel" aria-labelledby="signal-title"><div class="panel-inner"><div class="surface-header"><div><span class="eyebrow">THE SIGNAL BOARD</span><h3 id="signal-title">What’s taking shape.</h3><p>Fictional discussion and project examples for layout review.</p></div><label class="sr-only" for="feed-search">Search example activity</label><input class="search" id="feed-search" type="search" placeholder="Search the signal..." value="${html(state.search)}" autocomplete="off"></div><div class="feed-filters" role="group" aria-label="Content types">${[['all','Everything'],['discussion','Discussions'],['project','Projects']].map(([id,label])=>`<button data-feed="${id}" class="filter-btn" aria-pressed="${state.feed===id}">${label}</button>`).join('')}<button class="text-button" data-clear-search>Clear filters</button></div><div id="feed" class="feed" aria-live="polite">${feedMarkup()}</div></div></section></div><aside class="side-stack"><section class="side-panel"><span class="eyebrow">WHY WE GATHER</span><h3>Make room for<br>the curious.</h3><p>ANEVUM is more than a catalogue. A project has a person behind it, a question worth discussing and an invitation to participate.</p><div class="rule"></div><div class="feature-rail"><span class="pill">Projects</span><span class="pill">Feedback</span><span class="pill">People</span></div></section><section class="collab-card"><span class="eyebrow">MAKER’S SIGNAL / CONCEPT</span><strong>The best thing you make might be what someone else learns.</strong><p>Show work in progress, ask for a second perspective, and discover creative collaborators.</p><button class="button-ghost" data-view="creator">Visit creator channel ${icon('arrow',13)}</button></section><section class="side-panel"><span class="eyebrow">EXPLORE PEOPLE</span><h3>Distinct worlds.</h3><p>Profiles are personal. They carry a creator’s style from community cards into their channel.</p><div class="community-carousel">${['marin','lina'].map(handle=>{const who=personas[handle];return `<button class="mini-creator" data-profile="${handle}"><span class="signal-avatar">${who.initial}</span><span><strong>${who.name}</strong><span>${who.role} ↗</span></span></button>`}).join('')}</div></section></aside></div>`;
  const visitorProfileView=(creator=false)=>{
    const title=creator?'Creator channel':'Member world';
    return `${headerTitle(title,creator?'Every creation<br><em>has a story.</em>':'Every person<br><em>has a world.</em>',`<button class="button-ghost" data-view="atelier">${icon('tune',14)} Customize member world</button>`)}<div class="studio-layout"><div class="preview-column"><section class="panel"><div class="panel-header"><span class="preview-label">${creator?'CREATOR CHANNEL':'PUBLIC PROFILE'} / DESIGN FIXTURE</span><span class="pill">FICTIONAL</span></div><div class="preview-window">${profileCard({creator})}</div></section></div><aside class="side-stack"><section class="side-panel"><span class="eyebrow">EXPRESSIVE IDENTITY</span><h3>Recognizable anywhere.</h3><p>One coherent visual signature travels from community discussions to compact identity cards and full member worlds.</p><button class="button-ghost" data-view="atelier">Open Profile Atelier ${icon('arrow',13)}</button></section><section class="side-panel"><span class="eyebrow">CREATIVE CONTROL / PUBLIC SAFETY</span><h3>Personal, not unbounded.</h3><p>Profiles can change approved themes, accents, banners, nameplates and motion. Arbitrary markup, scripts and fake achievement graphics never enter a public identity.</p></section></aside></div>`;
  };
  const composerModal=()=>`<div class="overlay" data-backdrop="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="compose-title"><button type="button" class="close" data-close aria-label="Close conversation composer">${icon('close',15)}</button><span class="eyebrow">CONTRIBUTE TO COMMUNITY / LOCAL DEMO</span><h2 id="compose-title">Start a conversation.</h2><p>Draft an idea. In the real experience an authorized account and staff moderation would be required; this preview sends nothing.</p><form id="composer" class="composer"><label for="topic-title">Topic title</label><input id="topic-title" name="title" minlength="10" maxlength="110" required placeholder="What are you making or wondering about?"><label for="topic-body">Your perspective</label><textarea id="topic-body" name="body" minlength="20" maxlength="1800" required placeholder="Write something someone can respond to thoughtfully..."></textarea><div class="end"><span class="small">Nothing is published or saved to an account</span><button class="button-primary" type="submit">Submit local demonstration ${icon('arrow',13)}</button></div></form></div></div>`;
  const profileModal=handle=>{const person=personas[handle]||personas.nova;return `<div class="overlay" data-backdrop="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mini-person"><button type="button" class="close" data-close aria-label="Close profile card">${icon('close',15)}</button><div class="dialog-banner profile-frame theme-${handle==='marin'?'halo':'origin'} banner-nebula">${coverArt()}</div><div class="dialog-id">${portrait(person,handle==='marin'?'comet':'orbit')}<div><div class="eyebrow">PROFILE MINI CARD / FICTIONAL</div><h2 id="mini-person">${html(person.name)}</h2><span class="small">@${html(person.handle)} · ${html(person.role)}</span></div></div><div class="dialog-text"><p>${html(person.bio)}</p><span class="pill">PERSONALIZED APPEARANCE / DEMO ONLY</span><div class="feature-rail"><button class="button-primary" data-view="${handle==='marin'?'creator':'member'}">Open full ${handle==='marin'?'channel':'world'} ${icon('arrow',13)}</button><button class="button-ghost" data-close>Close</button></div></div></div></div>`;};
  const postModal=id=>{const p=posts.find(x=>x.id===id)||posts[0];return `<div class="overlay" data-backdrop="true"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="post-title"><button type="button" class="close" data-close aria-label="Close content preview">${icon('close',15)}</button><span class="eyebrow">${p.type==='project'?'PROJECT PASSPORT':'PUBLIC DISCUSSION'} / FICTIONAL CONCEPT</span><h2 id="post-title">${html(p.title)}</h2><div class="label-row"><span class="pill">${html(p.topic)}</span><span class="small">By ${html(p.name)}</span></div><p style="margin-top:18px">${html(p.summary)}</p><p>${p.type==='project'?'In the real product, only an approved public release can appear and its playable destination or source must be explicit.':'In the real product, replies require authorized member access and moderation before public visibility.'}</p><div class="feature-rail"><button class="button-ghost" data-profile="${p.handle}">View author card ${icon('arrow',14)}</button><button class="button-primary" data-close>Return to Community</button></div></div></div>`;};
  const openModal=(kind,id)=>{state.previousFocus=document.activeElement;state.modal={kind,id};const anchor=document.getElementById('modal-root');anchor.innerHTML=kind==='compose'?composerModal():kind==='profile'?profileModal(id):postModal(id);anchor.querySelector('.close')?.focus();};
  const closeModal=()=>{state.modal=null;document.getElementById('modal-root').innerHTML='';if(state.previousFocus?.isConnected)state.previousFocus.focus();state.previousFocus=null;};
  const render=()=>{root.innerHTML=`<div class="${pageClasses()}">${header()}<div class="layout">${rail()}<main class="workspace" id="main" tabindex="-1">${state.view==='community'?communityView():state.view==='creator'?visitorProfileView(true):state.view==='member'?visitorProfileView(false):studioView()}</main></div><div id="modal-root"></div><div class="toast" id="toast" role="status" aria-live="polite" hidden></div></div>`;updateSystemMotion();};
  const switchView=v=>{if(!['community','member','creator','atelier'].includes(v))return;state.view=v;state.modal=null;state.toast='';history.replaceState(null,'','#'+encodeURIComponent(v));render();document.getElementById('main')?.focus({preventScroll:true});if(!systemMotion?.matches&&state.motion!=='off')window.scrollTo({top:0,behavior:'smooth'});else window.scrollTo(0,0);};
  const rerenderProfile=()=>{const slot=document.getElementById('preview-slot');if(slot)slot.innerHTML=profileCard();};
  const toggleMotion=v=>{state.motion=v;const p=document.querySelector('.page');if(p){p.classList.toggle('motion-off',v==='off');p.classList.toggle('motion-on',v!=='off');p.classList.toggle('motion-gentle',v==='gentle');}const head=document.querySelector('[data-motion-toggle]');if(head){head.innerHTML=`${icon(v==='off'?'moon':'spark',14)} <span>${v==='off'?'Motion off':v==='gentle'?'Gentle motion':'Pause motion'}</span>`;head.setAttribute('aria-label','Toggle animation, current setting '+v);}document.querySelectorAll('[data-motion]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.motion===v)));};
  const showText=()=>{document.querySelectorAll('[data-bind="name"]').forEach(n=>n.textContent=state.name);document.querySelectorAll('[data-bind="headline"]').forEach(n=>n.textContent=state.headline);document.querySelectorAll('[data-bind="bio"]').forEach(n=>n.textContent=state.bio);document.querySelectorAll('[data-bind="idname"]').forEach(n=>n.textContent=state.name);document.querySelectorAll('.portrait-inner').forEach(n=>n.textContent=state.name.trim().charAt(0)||'N');};
  const safeHex=value=>/^#[0-9a-f]{6}$/i.test(value);
  const replay=()=>{if(state.motion==='off'||systemMotion?.matches){toasts('Motion is disabled. Your profile appearance remains available without animation.');return;}const target=document.getElementById('profile-frame');if(!target)return;target.classList.remove('entrance-'+state.entrance);void target.offsetWidth;target.classList.add('entrance-'+state.entrance);toasts('The selected entrance effect was replayed in this local preview.');};
  const onClick=e=>{
    const el=e.target.closest('button, a');if(!el)return;
    if(el.dataset.view){e.preventDefault();switchView(el.dataset.view);return;}
    if(el.dataset.room){state.room=el.dataset.room;state.view='community';render();return;}
    if(el.dataset.motionToggle!==undefined){toggleMotion(state.motion==='off'?'full':'off');return;}
    if(el.dataset.motion){toggleMotion(el.dataset.motion);return;}
    if(el.dataset.editorTab){state.editorTab=el.dataset.editorTab;render();document.getElementById('editor-tab-'+state.editorTab)?.focus();return;}
    if(el.dataset.profileTab){const creator=el.dataset.creator==='1';if(creator)state.creatorTab=el.dataset.profileTab;else state.profileTab=el.dataset.profileTab;const card=document.getElementById('profile-frame');const parent=card?.parentElement; if(parent){parent.innerHTML=profileCard({creator});document.getElementById('tab-'+el.dataset.profileTab)?.focus();}return;}
    if(el.dataset.screen){state.screen=el.dataset.screen;const slot=document.getElementById('preview-slot');if(slot)slot.classList.toggle('viewport-phone',state.screen==='phone');document.querySelectorAll('[data-screen]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.screen===state.screen)));return;}
    for(const key of ['theme','banner','frame','plate','entrance']){if(el.dataset[key]){state[key]=el.dataset[key];if(key==='entrance')state.editorTab='effects';rerenderProfile();document.querySelectorAll('[data-'+key+']').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[key]===state[key])));return;}}
    if(el.dataset.replay!==undefined){replay();return;}
    if(el.dataset.visitor!==undefined){state.visitor=!state.visitor;rerenderProfile();const b=document.querySelector('[data-visitor]');if(b)b.innerHTML=`${icon('globe',13)} ${state.visitor?'Return to editor':'Preview as visitor'}`;return;}
    if(el.dataset.feed){state.feed=el.dataset.feed;document.querySelectorAll('[data-feed]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.feed===state.feed)));document.getElementById('feed').innerHTML=feedMarkup();return;}
    if(el.dataset.clearSearch!==undefined){state.feed='all';state.room='all';state.search='';render();document.getElementById('feed-search')?.focus();return;}
    if(el.dataset.profile){openModal('profile',el.dataset.profile);return;}
    if(el.dataset.openpost){openModal('post',el.dataset.openpost);return;}
    if(el.dataset.compose!==undefined){openModal('compose');return;}
    if(el.dataset.like){const id=el.dataset.like;if(state.liked.has(id))state.liked.delete(id);else state.liked.add(id);const pressed=state.liked.has(id);el.setAttribute('aria-pressed',String(pressed));el.innerHTML=icon('heart',13)+(pressed?' Appreciated':' Appreciate');toasts('Your appreciation exists only in local interface state, not in ANEVUM.');return;}
    if(el.dataset.close!==undefined){closeModal();return;}
    if(el.dataset.dismiss!==undefined){document.getElementById('toast').hidden=true;return;}
    if(el.dataset.localSave!==undefined){toasts('Preview receipt only. No account settings, theme, visibility or file was saved.');return;}
    if(el.dataset.reset!==undefined){Object.assign(state,{theme:'origin',banner:'nebula',frame:'orbit',plate:'holo',entrance:'orbit',motion:'full',accent:'#e8b693',customAccent:false,visitor:false,screen:'desktop',publicVisible:false,name:defaults.name,headline:defaults.headline,bio:defaults.bio,editorTab:'appearance',profileTab:'work'});render();toasts('Default concept style restored in memory. No account information changed.');return;}
  };
  document.addEventListener('click',e=>{
    if(e.target.matches('.overlay[data-backdrop]')){closeModal();return;}
    onClick(e);
  });
  document.addEventListener('input',e=>{
    if(e.target.dataset.field){const key=e.target.dataset.field;const limits={name:64,headline:110,bio:420};state[key]=String(e.target.value).slice(0,limits[key]);const count=document.getElementById('count-'+key);if(count)count.textContent=state[key].length+' / '+limits[key];showText();return;}
    if(e.target.id==='feed-search'){state.search=e.target.value.slice(0,100);document.getElementById('feed').innerHTML=feedMarkup();return;}
    if(e.target.id==='f-accent'){if(safeHex(e.target.value)){state.accent=e.target.value;document.querySelector('#profile-frame')?.style.setProperty('--user-accent',state.accent)}return;}
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='f-public'){state.publicVisible=e.target.checked;rerenderProfile();const badge=document.querySelector('.kit-footer .pill');if(badge)badge.innerHTML=`${icon('lock',12)} ${state.publicVisible?'PUBLIC-LAYOUT DEMO':'PRIVATE BY DEFAULT'}`;return;}
    if(e.target.id==='f-custom'){state.customAccent=e.target.checked;rerenderProfile();return;}
  });
  document.addEventListener('submit',e=>{if(e.target.id!=='composer')return;e.preventDefault();const title=e.target.elements.namedItem('title')?.value.trim();const body=e.target.elements.namedItem('body')?.value.trim();if(!title||title.length<10||!body||body.length<20)return;closeModal();toasts('Draft reviewed locally. No account request, moderation submission or public post occurred.');});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(state.modal)closeModal();else{const t=document.getElementById('toast');if(t)t.hidden=true;}return;}
    const tab=e.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
    const group=tab.closest('[role="tablist"]');const tabs=Array.from(group?.querySelectorAll('[role="tab"]')||[]);let index=tabs.indexOf(tab);if(index<0)return;e.preventDefault();if(e.key==='Home')index=0;else if(e.key==='End')index=tabs.length-1;else index=(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[index].click();
  });
  // Trap keyboard focus inside dialogs. Focus is restored to opener on close.
  document.addEventListener('keydown',e=>{if(e.key!=='Tab'||!state.modal)return;const dlg=document.querySelector('.dialog');if(!dlg)return;const focus=Array.from(dlg.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),[href]'));if(!focus.length)return;const first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
  document.addEventListener('visibilitychange',()=>document.querySelector('.page')?.classList.toggle('page-hidden',document.visibilityState==='hidden'));
  const initial=decodeURIComponent(location.hash.replace('#',''));if(['community','member','creator','atelier'].includes(initial))state.view=initial;
  render();
})();
</script>
</body>
</html>
