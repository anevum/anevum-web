<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="ANEVUM Cinematic NEXT - interactive source-only sitewide design study.">
  <title>ANEVUM / Continuance NEXT - Cinematic Design Review</title>
  <style>/* ANEVUM / CONTINUANCE NEXT
   Cinematic design review only. Scoped, standalone, local and no backend access.
   Canonical OrbitalMark path is inline in app.js; never replace with a generated logo.
*/
:root {
  color-scheme:dark;
  --void:#060a11; --deep:#0a1220; --navy:#0e1b2b; --glass:#111c2cd9;
  --glass-strong:#101b2beF; --panel:#152238; --line:#436078; --line-soft:#33475d;
  --text:#f6f0e7; --soft:#c9d3db; --muted:#9aacbf; --copper:#efc993;
  --blue:#75d8ef; --lilac:#c9b3ec; --signal:#8fe8ff; --radius:15px;
  --max-width:1730px; --body-font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display-font:"Arial Narrow","Roboto Condensed",Impact,system-ui,sans-serif;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box}
html{background:var(--void);scroll-behavior:smooth}
body{margin:0;min-width:320px;min-height:100vh;font:15px/1.55 var(--body-font);letter-spacing:.002em;color:var(--text);background:#060b14;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.55}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--signal);outline-offset:3px;position:relative;z-index:6}
button,a{-webkit-tap-highlight-color:transparent}
a{color:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.08}
h1,h2{letter-spacing:-.042em}
svg{flex-shrink:0}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-90px;left:22px;z-index:1000;border:1px solid var(--signal);padding:12px 20px;background:#071421;color:#fff}
.skip-link:focus{top:12px}
::selection{color:#091421;background:#c8d6e0}
.universe-atmosphere{position:fixed;z-index:-1;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 76% 19%,#172c4b 0%,transparent 38%),radial-gradient(ellipse at 7% 76%,#382342 0%,transparent 33%),#060a11}
.universe-atmosphere::before{position:absolute;content:"";inset:0;background-image:radial-gradient(#c2e5ff70 .8px,transparent 1px),radial-gradient(#f8d9a480 .6px,transparent 1px);background-size:87px 131px,151px 119px;background-position:17px 15px,80px 43px;opacity:.35}
.universe-atmosphere>span:nth-child(1){position:absolute;width:900px;height:650px;top:0;right:-400px;background:radial-gradient(ellipse,#4e80c930,transparent 66%);filter:blur(30px)}
.universe-atmosphere>span:nth-child(2){position:absolute;width:500px;height:480px;left:-200px;top:520px;background:radial-gradient(ellipse,#6b3f8327,transparent 70%);filter:blur(38px)}
.universe-atmosphere>span:nth-child(3){position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.96%,#849baf0a 50%,transparent 50.04%),linear-gradient(transparent 49.96%,#849baf08 50%,transparent 50.04%);background-size:110px 110px;opacity:.4}
.app-shell{position:relative;isolation:isolate;width:100%;min-height:100vh}
.review-strip{position:relative;z-index:11;display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:31px;padding:5px clamp(15px,3vw,50px);border-bottom:1px solid #3b4e5d;background:#0e1925;color:#b6c6d4;font-size:9px;letter-spacing:.19em;font-weight:750}
.review-strip>span{display:inline-flex;align-items:center;gap:8px}
.review-strip-muted{color:#dfbd84}
.live-pin,.status-dot{display:inline-block;width:6px;height:6px;flex:0 0 6px;background:#9ee6d8;border-radius:50%;box-shadow:0 0 12px #7fe7e4aa}
.site-header{position:sticky;top:0;z-index:50;min-height:78px;background:#091320ef;border-bottom:1px solid #41627bbd;box-shadow:0 14px 45px #02091183;backdrop-filter:blur(23px)}
.site-header::after{content:"";position:absolute;left:4%;right:4%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#75d9ee81 27%,transparent 65%,#e5b77a59,transparent)}
.header-shell{display:flex;align-items:center;gap:clamp(14px,2vw,30px);padding:11px clamp(20px,3vw,50px);max-width:1960px;margin:auto;min-height:79px}
.brand{display:flex;align-items:center;gap:11px;padding:0;margin:0;border:0;background:none;white-space:nowrap;text-align:left;flex-shrink:0}
.brand-mark{width:48px;height:48px;color:#ebce99;filter:drop-shadow(0 0 13px #8bafda55)}
.mark-core-cut{fill:#09131f}
.brand-copy{display:flex;flex-direction:column;gap:1px}
.brand-copy strong{font:850 25px/1.05 var(--body-font);letter-spacing:.16em}
.brand-copy small{color:#a6b9c6;font-size:8px;letter-spacing:.17em;white-space:nowrap}
.desktop-nav{display:flex;align-items:center;gap:4px;margin-left:clamp(5px,1.5vw,28px)}
.desktop-nav button{position:relative;min-height:45px;border:0;background:none;padding:10px clamp(9px,1.1vw,17px);color:#bdcad9;font-size:12px;font-weight:700;transition:color .2s}
.desktop-nav button:hover,.desktop-nav button[aria-current=page]{color:#f6f5ed}
.desktop-nav button[aria-current=page]::after{position:absolute;content:"";height:2px;left:16px;right:16px;bottom:-17px;background:linear-gradient(90deg,#e7b873,#8bd8ef);box-shadow:0 0 12px #5ccbf5}
.header-search{display:flex;align-items:center;gap:10px;min-width:190px;max-width:340px;flex:1 1 225px;min-height:43px;padding:0 15px;background:#152238cf;border:1px solid #496078;border-radius:7px;color:#aebcce;font-size:11px;text-align:left}
.header-search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-search kbd{font-size:10px;color:#b7c7da;background:#27384c;border:1px solid #354960;border-radius:4px;padding:2px 6px}
.header-utility{display:flex;gap:9px;align-items:center;margin-left:auto;flex-shrink:0}
.nav-join,.button-icon-header{border:1px solid #5a7990;background:#14263b;color:#f6f3ea;display:flex;align-items:center;justify-content:center;gap:7px;min-height:43px;border-radius:7px;font-size:12px;font-weight:750;transition:background .2s,border-color .2s}
.nav-join{padding:8px 13px;background:linear-gradient(105deg,#d8dfdf,#8ecbdc);color:#0b1b2a;border-color:#a1e7f5}
.button-icon-header{width:43px;padding:0}
.nav-join:hover,.button-icon-header:hover{filter:brightness(1.15)}
.mobile-dock{display:none}
#main{min-height:66vh;outline:none}
.section-wrap{width:min(100% - clamp(36px,7vw,112px),var(--max-width));margin-inline:auto}
.kicker,.cosmic-overline,.tiny-gold{font:750 10px/1.4 var(--body-font);letter-spacing:.15em;color:var(--copper);text-transform:uppercase}
.kicker.with-code{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--copper)}
.kicker.with-code span:last-child:not(:first-child){color:#8b9db2}
.cosmic-overline{display:flex;align-items:center;gap:14px;font-size:9px;white-space:nowrap;max-width:100%;color:#eac891}
.cosmic-overline-rule{display:block;width:38px;height:1px;background:var(--copper)}
.cosmic-overline i{display:block;width:4px;height:4px;transform:rotate(45deg);border:1px solid #74b9d5}
.glass{background:linear-gradient(140deg,#1a2a3dc9,#0b1729eb);border:1px solid #45627aaf;box-shadow:inset 0 1px 0 #bfe7ff19,0 19px 56px #02040b72;backdrop-filter:blur(17px)}
.btn{display:inline-flex;align-items:center;justify-content:space-between;gap:20px;min-height:54px;padding:13px 19px;border-radius:6px;border:1px solid #799bb1;font:800 12px/1.2 var(--body-font);letter-spacing:.07em;text-align:left;transition:transform .22s var(--ease),background .22s,border-color .22s}
.btn svg{margin-left:8px}
.btn:hover{transform:translateY(-2px)}
.btn-primary{background:linear-gradient(110deg,#e6efe9,#b7d7e4 75%,#80c8e7);color:#0b1b29;border-color:#b3e4f6;box-shadow:0 4px 24px #8ec8ee26}
.btn-primary:hover{background:linear-gradient(100deg,#fff7df,#bcdff0)}
.btn-ghost{background:#0c1c2cbb;color:#edf5fb;border-color:#69849a}
.btn-secondary{background:#24354a;color:#f2ebdb}
.text-link{display:inline-flex;align-items:center;gap:10px;background:none;border:0;padding:5px 0;color:#f2d4a2;font-size:12px;font-weight:800;letter-spacing:.03em;text-align:left}
.text-link svg{transition:transform .2s}.text-link:hover svg{transform:translate(3px,-2px)}
/* Arrival hero */
.arrival-hero{position:relative;display:flex;align-items:center;min-height:clamp(640px,57vw,850px);padding:clamp(90px,9vw,130px) clamp(24px,5.5vw,100px) 95px;border-bottom:1px solid #536981;overflow:hidden;isolation:isolate;background:#071420}
.hero-image-wrap{position:absolute;z-index:-2;inset:0;overflow:hidden}
.hero-image-wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06101cf2 0%,#07121fda 22%,#06142155 51%,#0a14213d 78%,#07121db3 100%),linear-gradient(0deg,#050910 0%,transparent 25%,#06101a18 60%,#050a119b 100%)}
.hero-image{width:100%;height:100%;object-fit:cover;object-position:center 38%;filter:contrast(1.14) saturate(1.24) brightness(.91);transform:scale(1.03)}
.hero-grain{position:absolute;inset:0;opacity:.23;background:repeating-linear-gradient(0deg,transparent 0 3px,#cde3f004 3px 4px)}
.hero-scanner{position:absolute;left:57%;top:5%;height:85%;width:1px;transform:rotate(14deg);background:linear-gradient(transparent,#bceafa61,transparent);box-shadow:0 0 30px #7ddff877;opacity:.35}
.arrival-hero-content{position:relative;width:min(850px,69%);z-index:2;max-width:980px;text-shadow:0 2px 36px #07111ede}
.arrival-hero .edition{margin:25px 0 12px;color:#a4cce0;letter-spacing:.24em;font-size:11px;font-weight:750}
.arrival-hero .edition span{color:#8a9ead}
.arrival-hero h1{font:900 clamp(68px,7.65vw,137px)/.89 var(--display-font);letter-spacing:-.05em;color:#f6f4eb;text-transform:uppercase;max-width:1000px;text-shadow:0 5px 25px #06101bdb}
.arrival-hero h1 .hero-italic{font-style:italic;font-weight:650;color:#f0d2a3}
.arrival-hero h1 em{color:#b3eaff;font-style:normal;text-shadow:0 0 30px #5d9dc75a}
.hero-deck{max-width:600px;margin:27px 0 23px;color:#d4e2ed;font-size:clamp(15px,1.25vw,19px);line-height:1.7;text-wrap:pretty}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0 26px}
.hero-footnote{font-size:11px;color:#b7c7d3;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.divider-dot{color:#b4a7a0;padding:0 4px}
.hero-console{position:absolute;z-index:3;right:clamp(26px,4vw,66px);bottom:clamp(97px,11vw,155px);width:260px;padding:17px 20px 22px;border-radius:12px;box-shadow:0 0 45px #0cbfff19,0 23px 90px #02040899}
.console-top{display:flex;align-items:center;justify-content:space-between;gap:6px;color:#c3d4e1;font-size:9px;font-weight:750;letter-spacing:.10em}
.console-lights{display:flex;gap:4px}.console-lights i{width:4px;height:4px;border-radius:50%;background:#97b7d5}.console-lights i:first-child{background:#96ebfd;box-shadow:0 0 6px #70dcf5}
.console-orbit{height:130px;position:relative;display:grid;place-items:center;isolation:isolate}
.console-orbit::before{content:"";position:absolute;width:95px;height:95px;border-radius:50%;background:radial-gradient(circle at 35% 26%,#3967b6,#101632 66%,#071222);box-shadow:inset 0 0 0 1px #7b9bd6,0 0 31px #4285df78}
.console-mark{z-index:1;width:68px;height:68px;color:#e6d2af;filter:drop-shadow(0 0 18px #a5d7f6aa)}
.console-mark .mark-core-cut{fill:#172849}
.orbital-arc{position:absolute;border-radius:50%;border:1px solid #91daff9c;width:135px;height:56px;transform:rotate(-25deg)}
.arc-b{width:110px;height:100px;border-color:#bfc2f155;transform:rotate(52deg)}
.orbit-tick{position:absolute;width:4px;height:4px;border-radius:50%;background:#aaf1ff;box-shadow:0 0 12px #b1f7ff}.tick-a{top:35px;right:55px}.tick-b{bottom:26px;left:60px;background:#e8c395}
.hero-console .tiny-gold{display:block;margin-bottom:10px;font-size:9px}
.hero-console strong{display:block;font-size:18px;line-height:1.28;letter-spacing:-.02em}
.hero-console p{font-size:11px;color:#b7cbd6;margin-top:11px;line-height:1.5}
.console-action{margin-top:16px;display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid #7396a8;padding:9px 12px;background:#1d354c;color:#dbedf4;border-radius:6px;font-size:11px;font-weight:750}
.console-action:hover{background:#294c62}
.hero-bottom{position:absolute;bottom:22px;left:clamp(24px,5.5vw,100px);right:clamp(24px,5.5vw,100px);display:flex;align-items:center;justify-content:space-between;gap:20px;color:#a8b8cb;font-size:9px;letter-spacing:.14em;border-top:1px solid #a0b1c544;padding-top:17px}
.frequency-line{display:flex;align-items:center;gap:15px;color:#c5e1e6}.frequency-line i{width:85px;height:1px;background:linear-gradient(90deg,transparent,#78d6ef88,transparent)}
/* Journey and common sections */
.path-section{padding-top:86px;padding-bottom:90px}
.section-header{display:grid;grid-template-columns:1fr auto;align-items:end;column-gap:38px;margin-bottom:28px}
.section-header .kicker{grid-column:1/-1;margin-bottom:15px}
.section-header h2{font-size:clamp(38px,4vw,64px);font-weight:800;line-height:1.04}
.section-header h2 em,.manifesto-band h2 em{font-style:normal;color:var(--copper)}
.section-header p{color:var(--soft);max-width:380px;text-align:right;font-size:14px}
.path-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.path-card{position:relative;overflow:hidden;border:1px solid #466278;background:linear-gradient(152deg,#182a41,#0c1421);border-radius:10px;box-shadow:0 22px 60px #0005;transition:border-color .2s,transform .25s var(--ease)}
.path-card:hover{transform:translateY(-6px);border-color:#8ecce0}
.path-card-art{position:relative;height:clamp(170px,19vw,250px);overflow:hidden}
.path-card-art img{width:100%;height:100%;object-fit:cover;filter:saturate(1.25) contrast(1.16)}
.path-card-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0e1b2c 0%,transparent 57%)}
.path-card-index{position:absolute;z-index:1;top:14px;left:16px;font-size:10px;font-weight:800;color:#ffe1b1;letter-spacing:.1em;background:#0a1420c9;padding:5px 9px;border:1px solid #677e8d}
.path-card-copy{padding:21px 22px 23px}
.path-card h3{font-size:clamp(22px,1.8vw,29px);font-weight:770}
.path-card p{margin:9px 0 20px;color:var(--soft);font-size:13px;min-height:44px}
.path-card button{display:flex;justify-content:space-between;align-items:center;gap:15px;width:100%;border:0;border-top:1px solid #466077;background:none;padding:16px 0 0;color:var(--copper);font-size:10px;font-weight:800;letter-spacing:.1em;text-align:left}
.manifesto-band{padding:50px 0 100px;display:grid;grid-template-columns:1.1fr .8fr;gap:clamp(24px,8vw,120px);border-top:1px solid #3d536a}
.manifesto-band h2{font-size:clamp(37px,4vw,66px);margin-top:14px}
.manifesto-band>div:last-child{padding-top:40px}
.manifesto-band p{color:#c4cdd5;font-size:16px;line-height:1.8}
.manifesto-actions{display:flex;gap:25px;flex-wrap:wrap;margin-top:23px}
/* Inner cinematic gateway */
.interior-hero{height:clamp(360px,33vw,510px);min-height:360px;position:relative;isolation:isolate;overflow:hidden;background:#0b1624;border-bottom:1px solid #4a677f}
.interior-art,.interior-overlays{position:absolute;z-index:-1;inset:0}
.interior-art>img{width:100%;height:100%;object-fit:cover;object-position:center 50%;filter:contrast(1.19) saturate(1.27) brightness(.84)}
.interior-overlays{z-index:1;background:linear-gradient(90deg,#07111cef 0%,#07121fbf 36%,#08162342 73%,#06111d8f 100%),linear-gradient(0deg,#050b13df 0%,transparent 48%,#07121e54 100%)}
.interior-inner{width:min(100% - clamp(36px,9vw,152px),var(--max-width));height:100%;margin:auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;position:relative;z-index:2;padding:28px 0 38px}
.interior-inner h1{font:900 clamp(48px,5.9vw,90px)/.95 var(--display-font);letter-spacing:-.045em;margin:20px 0 16px;max-width:990px}
.interior-inner h1 em{color:#bce6f6;font-style:normal;text-shadow:0 0 35px #59a2b778}
.interior-inner>p{max-width:610px;color:#d0deea;font-size:clamp(14px,1.15vw,17px);line-height:1.65}
.interior-index{position:absolute;right:clamp(30px,6vw,100px);bottom:24px;z-index:2;color:#c8d1df;font-size:10px;letter-spacing:.18em}
.surface-content{padding-top:24px;padding-bottom:100px}
.specimen-alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 26px;background:#122134d8;border:1px solid #526982;padding:11px 14px;color:#c6d7e1;font-size:9px;font-weight:750;letter-spacing:.12em}
.specimen-alert .symbol{display:flex;color:var(--copper)}
.specimen-alert span:last-child{color:#b7c0c8}
.content-heading h2{font-size:clamp(31px,3vw,45px);margin:12px 0 10px}
.content-heading>p{max-width:680px;color:var(--soft)}
/* Discover */
.discover-layout{display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start;gap:26px}
.filter-rail{border-radius:10px;padding:24px 15px 16px;position:sticky;top:115px}
.rail-head{padding:0 9px 16px;border-bottom:1px solid #43596a;margin-bottom:8px}
.rail-head h2{font-size:23px;margin-top:13px}
.filter-rail nav{display:flex;flex-direction:column;gap:3px}
.filter-rail nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px;text-align:left;background:none;border:1px solid transparent;border-radius:5px;color:#b9cbd8;font-size:12px;min-height:44px}
.filter-rail nav button>span{flex:1}
.filter-rail nav button:hover{background:#22344a}
.filter-rail nav button[aria-pressed=true]{border-color:#6796a9;background:#263950;color:#f6f5eb;box-shadow:inset 3px 0 #d8bd9f}
.rail-note{font-size:11px;color:#91a7b8;border-top:1px solid #354b5d;padding:18px 8px 0;margin-top:20px;line-height:1.65}
.discovery-main{min-width:0}
.discovery-toolbar{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:21px}
.discovery-toolbar h2{font-size:clamp(31px,2.5vw,43px);margin-top:9px}
.view-toggle{display:flex;border:1px solid #506982;background:#102036;border-radius:7px;padding:3px}
.view-toggle button{display:grid;place-items:center;width:41px;height:37px;background:transparent;border:0;border-radius:4px;color:#b8cad9}
.view-toggle button[aria-pressed=true]{background:#314860;color:#efffff}
.search-large{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#152c42,#0d1b2d);border:1px solid #58778c;border-radius:8px;padding:6px 8px 6px 17px;box-shadow:inset 0 1px 0 #fff1}
.search-large>.glyph{color:#a9d6e4}
.search-large input{flex:1;min-width:0;min-height:39px;color:#f2f4ef;background:none;border:0;outline:none;font-size:13px}
.search-large input:focus-visible{outline:none}
.search-large button{display:flex;align-items:center;gap:15px;border:1px solid #679db3;border-radius:5px;padding:10px 15px;background:#c7e2e8;color:#082031;font-weight:800;font-size:12px;min-height:41px}
.category-chips{display:flex;flex-wrap:wrap;gap:7px;margin:19px 0 27px}
.category-chips button{min-height:38px;border:1px solid #53687e;background:#142638;padding:8px 13px;border-radius:40px;color:#c8d4df;font-size:12px}
.category-chips button[aria-pressed=true]{background:#35566d;border-color:#93d5eb;color:#f2fcfe}
.results-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:13px;color:#96b0c0;font-size:10px;letter-spacing:.1em;font-weight:700}
.specimen-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.specimen-card{min-width:0;overflow:hidden;border:1px solid #456c86;border-radius:9px;background:linear-gradient(140deg,#182b41,#0d1625);box-shadow:0 19px 40px #0005;transition:border-color .2s,transform .2s}
.specimen-card:hover{transform:translateY(-3px);border-color:#b7dce3}
.specimen-media{position:relative;overflow:hidden;height:210px}
.specimen-media img{width:100%;height:100%;object-fit:cover;filter:saturate(1.24) contrast(1.15)}
.specimen-media::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0b172a 0%,transparent 57%)}

.empty-hall{padding:31px;border-radius:9px;color:#d3dfe6}

/* Living Commons */
.commons-tabs{display:flex;gap:9px;flex-wrap:wrap;border-bottom:1px solid #496174;margin-bottom:28px;padding-bottom:19px}

.commons-layout{display:grid;grid-template-columns:203px minmax(0,1fr) 240px;gap:21px;align-items:start}
.commons-sidebar{border-radius:8px;padding:19px 12px}
.commons-sidebar .rail-head h2{font-size:21px}
.district-list button{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;border-bottom:1px solid #2c4054;padding:14px 4px;background:none;color:#bdcbd8;font-size:12px;min-height:45px}
.district-list button>span:nth-child(2){flex:1}.district-number{color:#e2bd85;font-size:10px}
.district-list button:hover{background:#263b52}
.sidebar-minicard{border:1px solid #41627a;background:#15263c;padding:17px;margin-top:23px;border-radius:7px}
.sidebar-minicard span{font-size:10px;letter-spacing:.1em;color:#eed2a8}.sidebar-minicard p{font-size:11px;line-height:1.7;color:#9bb3c6;margin-top:9px}
.commons-primary{min-width:0}
.featured-signal{margin-top:22px;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1fr 1.2fr;min-height:310px}
.signal-art{min-height:290px;overflow:hidden;position:relative}
.signal-art img{height:100%;width:100%;object-fit:cover;filter:saturate(1.2)}
.signal-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#0b1925a5)}
.signal-content{padding:clamp(20px,2vw,36px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center}
.signal-tag{font-size:9px;letter-spacing:.1em;color:#e4b985;font-weight:750;margin-bottom:16px}
.signal-content h3{font-size:clamp(29px,2.7vw,42px)}
.signal-content h3 em{font-style:normal;color:var(--copper)}
.signal-content p{font-size:12px;color:#c0cad4;line-height:1.68;margin:14px 0 20px}
.signal-content button{display:flex;align-items:center;gap:10px;border:1px solid #648195;background:#1e3b50;padding:10px 13px;border-radius:5px;font-size:12px}
.signal-mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:16px}
.signal-mini{min-height:197px;display:flex;flex-direction:column;border-radius:9px;padding:21px}
.signal-mini h3{font-size:23px;margin:13px 0 9px}.signal-mini p{font-size:12px;color:var(--soft)}.mini-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:9px;letter-spacing:.06em;color:#9eabb8;margin-top:auto;padding-top:12px}
.context-card{border-radius:8px;padding:20px 17px;position:sticky;top:115px}
.context-card h3{font-size:26px;margin:7px 0 9px}.context-card p{font-size:12px;color:#b4c7d3;line-height:1.7}
.lens-sphere{height:126px;display:grid;place-items:center;position:relative;margin-top:16px}
.lens-sphere::before{content:"";position:absolute;width:105px;height:105px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#648ebd,#15223c 60%,#0e1925);box-shadow:0 0 34px #7aaad951}
.lens-sphere::after{content:"";position:absolute;width:142px;height:68px;border:1px solid #d8b38966;border-radius:50%;transform:rotate(-24deg)}
.lens-mark{z-index:1;width:74px;height:74px;color:#e9d1ac}.lens-mark .mark-core-cut{fill:#233451}
.context-links{margin:20px 0 15px}.context-links>div{display:flex;justify-content:space-between;gap:9px;padding:11px 0;border-bottom:1px solid #405367;color:#b7c8d8;font-size:10px;letter-spacing:.06em}
.context-iren{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;background:linear-gradient(90deg,#2c3357,#20445d);border:1px solid #796f9b;border-radius:5px;padding:10px 7px;font-size:10px;font-weight:800;color:#d7e8fa}
.atlas-map{margin-top:20px;height:390px;position:relative;overflow:hidden;display:grid;place-items:center;border-radius:10px;background:radial-gradient(circle at 47% 48%,#443967bb,#101d33 48%,#091522 84%),repeating-radial-gradient(circle at center,#9fd5f507 0 1px,transparent 1px 68px)}

.atlas-core{width:143px;height:143px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 25%,#566e9f,#211e3a 62%,#0d1324);box-shadow:0 0 65px #a392ea66,inset 0 0 0 1px #b8cbec66;position:relative;z-index:2}
.atlas-mark{width:115px;height:115px;color:#e8cfaf}.atlas-mark .mark-core-cut{fill:#252542}
.atlas-orbit{position:absolute;border:1px solid #8ed5f5a6;width:68%;height:32%;border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 20px #70bbff36;z-index:1}
.atlas-orbit.b{width:60%;height:66%;border-color:#bb9dd88a;transform:rotate(31deg)}
.atlas-star{width:7px;height:7px;position:absolute;z-index:3;border-radius:50%;background:#b6e7fc;box-shadow:0 0 21px #bbebff}.atlas-star.x{left:22%;top:31%}.atlas-star.y{right:18%;top:55%}.atlas-star.z{bottom:17%;left:44%;background:#f1d2aa}
.atlas-axis{position:absolute;bottom:21px;letter-spacing:.2em;font-size:10px;color:#b7c6d2}
.atlas-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:13px}
.atlas-links button{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1a2e42;border:1px solid #54738a;padding:13px 12px;border-radius:6px;text-align:left;font-size:12px;min-height:48px}
.people-specimen{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:27px;margin-top:20px;padding:21px;border:1px solid #425f76;border-radius:9px;background:#142339}

.people-specimen h3{font-size:34px;margin:11px 0}.people-specimen p{color:var(--soft);font-size:13px;line-height:1.7;margin-bottom:15px}
.people-specimen+.empty-hall{margin-top:18px}
/* Member worlds */
.profile-layout{display:grid;grid-template-columns:minmax(0,1fr) 295px;gap:20px;align-items:start}
.profile-main{min-width:0}
.profile-identity-card{border-radius:11px;overflow:hidden;--theme:#c6a5ff}
.profile-identity-card[data-theme=copper]{--theme:#f0c395}.profile-identity-card[data-theme=glacial]{--theme:#84e7ff}
.profile-cover{height:300px;position:relative;overflow:hidden}
.profile-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0c1a2c 0%,transparent 74%),linear-gradient(90deg,#0b152050,transparent)}
.profile-cover img{height:100%;width:100%;object-fit:cover;filter:saturate(1.27) contrast(1.13)}
.profile-cover-label{position:absolute;z-index:2;top:20px;left:23px;background:#111d2a9e;border:1px solid #6485a55e;color:#cbd5e0;padding:8px 11px;font-size:10px;letter-spacing:.1em}
.profile-identity-content{display:flex;align-items:center;gap:25px;margin-top:-53px;padding:0 28px 26px;position:relative;z-index:2}
.profile-avatar{flex-shrink:0;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 30% 26%,#615f90,#1b243b 64%,#101b2b);border:4px solid #15283c;box-shadow:0 0 0 2px var(--theme),0 0 34px color-mix(in srgb,var(--theme),transparent 48%);display:grid;place-items:center}
.profile-avatar-mark{width:83px;height:83px;color:#ebdfd1}.profile-avatar-mark .mark-core-cut{fill:#30354c}
.profile-identity-content>div:last-child{padding-top:42px}
.profile-identity-content h2{font-size:clamp(29px,2.8vw,45px);margin:7px 0 8px}
.profile-identity-content p{font-size:13px;color:#bfceda;line-height:1.6}
.profile-identity-bottom{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 25px;border-top:1px solid #476178;font-size:9px;letter-spacing:.08em;color:#b2c6d6;flex-wrap:wrap}
.profile-identity-bottom span:first-child{display:flex;align-items:center;gap:6px}
.profile-split{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:18px}
.profile-module,.aside-module{border-radius:9px;padding:23px;min-width:0}
.profile-module h3,.aside-module h3{font-size:23px;line-height:1.14;margin:11px 0 10px}
.profile-module p,.aside-module p{font-size:12px;color:#bccbd7;line-height:1.7}
.palette-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.palette-options button{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;background:#17283f;border:1px solid #50667c;padding:10px 5px;border-radius:6px;font-size:11px}
.palette-options button[aria-pressed=true]{border-color:#addbef;background:#294459;box-shadow:inset 0 0 0 1px #93d1ed66}
.swatch{display:block;width:29px;height:29px;background:var(--swatch);border-radius:50%;box-shadow:0 0 0 3px #13253d,0 0 14px var(--swatch)}
.profile-module>.text-link{margin-top:19px}
.profile-aside{display:grid;gap:18px}
.privacy-row{display:flex;gap:12px;align-items:flex-start;border-top:1px solid #3f536a;padding:14px 0}
.privacy-row>svg{color:#ebca9d;margin-top:3px}
.privacy-row strong{font-size:13px}.privacy-row p{font-size:11px;margin-top:3px}
.collection-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}
.collection-tiles span{border:1px solid #4b677d;border-radius:5px;padding:14px 10px;color:#d4dfeb;font-size:11px;background:#1a2f43}
/* Evolution */
.evolution-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:20px}
.evolution-main,.evo-side{border-radius:10px;padding:clamp(24px,3vw,45px)}
.evolution-main{display:grid;grid-template-columns:185px 1fr;align-items:center;gap:35px;min-height:300px}
.evo-insignia{height:185px;width:185px;display:grid;place-items:center;position:relative;border-radius:50%;background:radial-gradient(circle at 35% 20%,#68749c,#292643 64%,#141b2f);box-shadow:0 0 80px #a49be146,inset 0 0 0 1px #bba9d8}
.evo-mark{color:#f2d8af;width:120px;height:120px;z-index:1}.evo-mark .mark-core-cut{fill:#35324e}
.evo-orbit{position:absolute;inset:19px;border:1px solid #b9e3ff8b;border-radius:50%;transform:rotate(-25deg) scaleY(.45)}
.evolution-main h2{font-size:clamp(30px,2.6vw,44px);margin:14px 0}
.evolution-main p{color:#bfcfdf;font-size:13px;line-height:1.8;margin-bottom:19px}
.evo-side h3{font-size:24px;margin:13px 0 16px}.reward-lines>div{display:grid;grid-template-columns:25px 1fr;column-gap:8px;padding:12px 0;border-top:1px solid #41566b}
.reward-lines span{grid-row:span 2;color:#e2c490;font-size:11px}.reward-lines strong{font-size:13px}.reward-lines small{font-size:11px;color:#9cb0c1;margin-top:3px}
/* Studio */
body[data-page=studio] .site-header{background:#08121eec}
body[data-page=studio] #main{background:#07111d}
.studio-shell{position:relative;isolation:isolate;max-width:1950px;margin:auto;padding:22px clamp(15px,2vw,33px) 65px}
.studio-shell::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 42% 25%,#24406454,transparent 47%);pointer-events:none;z-index:-1}
.studio-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 0 16px}
.studio-project{display:flex;align-items:center;gap:12px}
.studio-head-mark{width:43px;height:43px;color:#edc994}
.studio-project h1{font-size:22px;line-height:1.3;margin-top:3px}
.studio-project h1 span{color:#9db1c6;font-size:11px;letter-spacing:.06em;font-weight:500}
.studio-head-actions{display:flex;align-items:center;gap:8px}
.studio-saved{display:flex;gap:7px;align-items:center;color:#9db7ca;font-size:9px;letter-spacing:.09em;margin-right:9px}
.studio-outline,.studio-play{display:flex;align-items:center;gap:8px;justify-content:center;padding:9px 14px;min-height:40px;background:#15283b;border:1px solid #5d7892;border-radius:5px;font-size:11px;font-weight:800}
.studio-play{background:linear-gradient(110deg,#c6eefa,#7dd1ef);color:#0a1b29;border-color:#a2e4f7}
.studio-tabs{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:thin;border:1px solid #435e77;border-bottom:0;background:linear-gradient(100deg,#101b2b,#122338);border-radius:9px 9px 0 0;padding:0 12px;min-height:52px}
.studio-tabs button{display:flex;align-items:center;gap:7px;min-height:49px;white-space:nowrap;background:none;border:0;border-bottom:2px solid transparent;padding:11px 15px;color:#adbece;font-size:11px;font-weight:800}
.studio-tabs button[aria-pressed=true]{color:#f0f8fd;border-bottom-color:#69d4fd;background:#1d3655}
.studio-tabs button:hover{background:#20374e}
.studio-tabs .tab-fill{flex:1}
.studio-tabs button:last-child{color:#e2c6ff}
.studio-main{display:grid;grid-template-columns:minmax(150px,.65fr) minmax(190px,.8fr) minmax(360px,3.15fr) minmax(220px,1.05fr);align-items:stretch;gap:0;min-height:715px;border:1px solid #52738f;border-radius:0 0 11px 11px;overflow:hidden;box-shadow:0 0 0 1px #34638832,0 24px 75px #02060d9e}
.studio-rail,.studio-explorer,.studio-inspector{border:0;border-right:1px solid #3c5b71;border-radius:0;background:linear-gradient(180deg,#102237,#0b1524);box-shadow:none;backdrop-filter:none;min-width:0}
.studio-rail{padding:13px 8px;display:flex;flex-direction:column;gap:4px}
.studio-rail-title{font-size:10px;color:#e7c99e;letter-spacing:.1em;display:flex;justify-content:space-between;gap:5px;padding:11px 10px 15px}
.studio-rail-title span{color:#84a5bf;font-size:9px}
.studio-rail>button{display:flex;align-items:center;gap:10px;text-align:left;min-height:45px;border:1px solid transparent;background:none;border-radius:5px;color:#b3c6d9;padding:10px 9px;font-size:11px}
.studio-rail>button svg{color:#90b6d4}
.studio-rail>button[aria-pressed=true],.studio-rail>button:hover{background:#213e59;border-color:#507a98;color:#f1f5f9}
.studio-rail-bottom{margin-top:auto;border-top:1px solid #375772;padding:16px 8px 8px;display:flex;align-items:center;gap:9px;color:#9eaebe;font-size:9px;letter-spacing:.08em}
.studio-explorer{padding:20px 13px}
.explorer-head{padding:0 8px 16px;border-bottom:1px solid #35556c}
.explorer-head h2{font-size:19px;margin:10px 0 2px}.explorer-head p{color:#9fb4c7;font-size:11px}
.tree{padding:15px 0}.tree-line{display:flex;align-items:center;gap:9px;width:100%;min-height:38px;padding:8px 9px;border:0;background:none;color:#bdcce0;font-size:11px;text-align:left;white-space:nowrap}
.tree-line.parent{font-size:9px;font-weight:800;color:#e1cb9d}.tree-line.child{padding-left:18px;color:#c4cddd}.tree-line.nested{padding-left:30px;border-radius:5px;min-width:0}
.tree-line.nested span{overflow:hidden;text-overflow:ellipsis}
.tree-line.nested[aria-pressed=true]{background:#234465;box-shadow:inset 3px 0 #79d4f1;color:#fff}
.explorer-footer{margin-top:24px;border-top:1px solid #36546e;padding:19px 5px}
.explorer-footer button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:39px;background:#20405b;border:1px solid #5885a1;border-radius:5px;font-size:11px}
.explorer-footer p{color:#849bac;font-size:10px;line-height:1.5;margin-top:10px}
.studio-center{min-width:0;background:#081521;display:flex;flex-direction:column}
.canvas-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;background:#111f30;border-bottom:1px solid #425e75}
.tool-actions{display:flex;flex-wrap:wrap;gap:5px}
.tool-actions button{display:flex;align-items:center;gap:6px;min-height:35px;padding:8px 9px;border:1px solid #40566c;background:#16283c;border-radius:4px;font-size:10px;text-transform:capitalize}
.tool-actions button[aria-pressed=true]{background:#29526b;border-color:#8bd4ec}
.canvas-modes{display:flex;align-items:center;gap:10px;white-space:nowrap}
.canvas-modes span{color:#a5b7c8;font-size:9px;letter-spacing:.09em}
.canvas-modes button{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid #4d6982;background:#162c41;border-radius:4px;font-size:10px}
.studio-viewport{position:relative;min-height:475px;flex:1;overflow:hidden;isolation:isolate;background:#071b2a;--scene-brightness:1}
.viewport-art{position:absolute;inset:0;z-index:-2;overflow:hidden}
.viewport-art img{width:100%;height:100%;object-fit:cover;object-position:center;filter:contrast(1.2) saturate(1.4) brightness(var(--scene-brightness))}
.viewport-art::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#09182abb,transparent 25%),linear-gradient(90deg,#0b1c293b,transparent 55%)}
.viewport-scanlines{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 98.5%,#99d8eb0b 100%);background-size:100% 5px;opacity:.6}
.viewport-breadcrumb,.viewport-footer{position:absolute;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#e8eef7;font-size:10px;letter-spacing:.09em;text-shadow:0 2px 5px #000}
.viewport-breadcrumb{top:15px;left:17px;gap:8px;background:#0c2637cb;border:1px solid #6dabc552;padding:6px 9px;border-radius:5px}
.viewport-footer{left:13px;bottom:14px;right:13px;flex-wrap:wrap}
.viewport-pill{display:flex;gap:7px;align-items:center;background:#0b2334d4;border:1px solid #61859e;padding:7px 9px;border-radius:5px}
.viewport-target{position:absolute;top:47%;left:52%;transform:translate(-50%,-50%);width:98px;height:98px;border:1px solid #83d5ee99;border-radius:50%;box-shadow:0 0 35px #4acef024, inset 0 0 25px #82c4e81c}
.viewport-target:before,.viewport-target:after{position:absolute;content:"";background:#7addf5a0}
.viewport-target:before{height:1px;left:-25px;right:-25px;top:50%}.viewport-target:after{width:1px;top:-25px;bottom:-25px;left:50%}
.axis{position:absolute;z-index:2}.axis-x{left:50%;right:-34px;top:50%;height:2px;background:#ff6866;transform:rotate(22deg);transform-origin:left center}.axis-y{top:-39px;bottom:50%;left:50%;width:2px;background:#70eea2}
.axis-label{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);font-size:10px;letter-spacing:.1em;color:#e4fbff;background:#18384d;padding:3px 7px}
.viewport-orbit{position:absolute;z-index:-1;width:75%;height:60%;border:1px solid #c7eaff23;border-radius:50%;top:17%;left:14%;transform:rotate(-25deg) scaleY(.55)}
.studio-asset-tray{min-height:174px;background:#0d1b2b;border-top:1px solid #527189;padding:13px 15px 17px}
.tray-header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:12px}
.tray-header strong{display:block;font-size:12px;margin-top:5px}

 .studio-explorer{order:2;border:0;border-top:1px solid #435c73;padding:11px}.studio-explorer .explorer-head{padding:3px 8px 8px}.studio-explorer .explorer-head h2{font-size:16px;margin:3px 0}.studio-explorer .tree{display:flex;overflow-x:auto;gap:7px;padding:10px 0}.studio-explorer .tree-line{min-width:max-content;width:auto;border:1px solid #3c5770;border-radius:4px;padding:8px!important;min-height:33px;font-size:10px}.studio-explorer .tree-line.nested{padding-inline:10px}.studio-explorer .tree-line.parent{display:none}.studio-explorer .explorer-footer{display:none}
 .studio-center{order:1}.canvas-toolbar{padding:7px}.tool-actions{gap:2px}.tool-actions button{gap:3px;padding:7px;min-height:34px}.tool-actions button span{display:none}.canvas-modes span{display:none}.canvas-modes button{padding:8px;font-size:9px}
 .studio-viewport{min-height:315px;height:315px;flex:none}.viewport-footer{font-size:8px}.viewport-target{width:73px;height:73px}.viewport-breadcrumb{font-size:9px;left:9px;top:9px}
 .studio-asset-tray{padding:10px}.tray-cards button span{font-size:9px}.tray-cards img{height:67px}
 .studio-inspector{order:3;display:block;padding:14px}.studio-inspector .inspector-tabs{display:flex}.studio-inspector .inspector-block{padding:13px 0;border-bottom:1px solid #41576b}.studio-inspector .inspector-thumbnail{height:155px}.studio-inspector .inspector-iren{margin:15px 0}.studio-inspector .inspector-disclaimer{font-size:9px}

/* Responsive header motion control and working isolated Interface Builder. */
.header-motion{color:#a6e2f0}
.studio-default-scene{display:flex;flex-direction:column;flex:1;min-width:0}
.interface-builder,.studio-alternate{padding:clamp(17px,2.5vw,34px);min-width:0;flex:1;background:radial-gradient(ellipse at 80% 1%,#2042675a,transparent 53%),#0b1a2b}
.builder-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}
.builder-top h2,.studio-alternate h2{font-size:clamp(24px,2.4vw,37px);margin:10px 0}
.builder-top p,.studio-alternate p{color:#b7cbda;font-size:12px;line-height:1.7;max-width:580px}
.builder-top>button{min-width:max-content;align-self:flex-start;padding:10px 12px;border-radius:5px;border:1px solid #587a90;background:#193149;font-size:11px}
.builder-split{display:grid;grid-template-columns:1.05fr 1fr;gap:12px;min-height:465px}
.builder-source,.builder-preview{min-width:0;border:1px solid #48657a;background:#0c1a2b;border-radius:7px;overflow:hidden;display:flex;flex-direction:column}
.builder-editor-head{min-height:38px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#172f43;border-bottom:1px solid #42647c;font-size:10px;font-weight:750;letter-spacing:.05em;color:#c9ddeb}
.builder-editor-head span:first-child{display:flex;gap:6px;align-items:center}
.builder-editor-head span:last-child{font-size:8px;color:#96b2c7;text-align:right}
.builder-source textarea{color:#cce7f5;background:#0a1422;line-height:1.6;border:0;resize:vertical;min-height:150px;width:100%;padding:14px;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2;outline-offset:-3px}
.builder-source textarea#builder-css{flex:1}
.builder-preview iframe{flex:1;min-height:380px;width:100%;border:0;background:#0c1b2b}
.builder-preview p{padding:12px;color:#9bb0c2;font-size:10px;line-height:1.5}
.studio-alternate h2 em{font-style:normal;color:#c6ddf1}
.code-specimen{margin-top:24px;border:1px solid #4d6c83;border-radius:7px;overflow:hidden}
.code-specimen pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a1421;color:#d7e6f4;padding:23px;font:13px/1.8 ui-monospace,Consolas,monospace;margin:0}
.alternate-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.alternate-chips span{padding:7px 11px;border:1px solid #53738a;border-radius:20px;color:#c7d7e2;font-size:10px}
.alternate-media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:23px}
.alternate-media-grid button{min-width:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;border:1px solid #55758c;background:#162b40;border-radius:7px;padding:5px}
.alternate-media-grid button[aria-pressed=true]{border-color:#ace9ff}
.alternate-media-grid img{height:155px;width:100%;object-fit:cover}
.alternate-media-grid strong{font-size:13px;margin:10px 7px 2px}
.alternate-media-grid small{color:#90b2c7;font-size:9px;margin:0 7px 10px}
.alternate-list{margin:25px 0 26px;border:1px solid #4a697f;border-radius:6px}
.alternate-list>div{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid #365a73;color:#d2dfec;font-size:12px}
.alternate-list>div:last-child{border-bottom:0}
.alternate-list svg{color:#acc9d7}
.alternate-list span{margin-left:auto;color:#e3bc88;font-size:9px;letter-spacing:.09em}
@media(max-width:1360px){.header-motion{display:none}}
@media(max-width:830px){.builder-split{grid-template-columns:1fr}.builder-preview iframe{min-height:250px}.builder-source textarea{min-height:180px}}

@media(max-width:360px){.brand-copy small{font-size:6px;letter-spacing:.08em}.brand-copy strong{font-size:19px}}

  function studio(){return `<section class="studio-shell"><div class="studio-head"><div class="studio-project">${mark('studio-head-mark')}<div><span class="kicker">CREATOR STUDIO / WORKSPACE RESEARCH</span><h1>Origin Workspace <span> / VISUAL CONCEPT</span></h1></div></div><div class="studio-head-actions"><span class="studio-saved">${icon('lock',14)} LOCAL REVIEW ONLY</span><button class="studio-outline" data-action="share-disabled">${icon('people',15)} Share</button><button class="studio-play" data-action="play-preview">${icon('play',15)} Playtest ${icon('chevron',13)}</button></div></div>
    <div class="studio-tabs" role="group" aria-label="Workspace screen">${['Scene','Interface','Scripts','Assets','Playtests','Publish'].map(t=>`<button data-studio-tab="${t}" aria-pressed="${state.studioTab===t}">${t}</button>`).join('')}<span class="tab-fill"></span><button data-action="iren">${icon('spark',16)} IREN ASSISTANT</button></div>
    <div class="studio-main"><aside class="studio-rail glass"><div class="studio-rail-title">WORKSPACE <span>V NEXT</span></div>${[['studio','Workspace','studio'],['scene','Scene composer','layers'],['interface','Interface builder','grid'],['assets','Asset library','box'],['scripts','Script editor','code'],['assist','AI assistant','spark'],['playtests','Playtests','play'],['settings','Project settings','settings']].map(([id,n,g])=>`<button data-action="studio-rail" data-target="${id}" aria-pressed="${(id==='scene'&&state.studioTab==='Scene')||(id==='interface'&&state.studioTab==='Interface')||(id==='assets'&&state.studioTab==='Assets')||(id==='scripts'&&state.studioTab==='Scripts')||(id==='playtests'&&state.studioTab==='Playtests')||false}">${icon(g,17)}<span>${n}</span></button>`).join('')}<div class="studio-rail-bottom"><span class="status-dot"></span> DESIGN MODE / OFFLINE</div></aside>
    <aside class="studio-explorer glass"><div class="explorer-head">${smallKicker('PROJECT EXPLORER','SOURCE PREVIEW')}<h2>Origin Workspace</h2><p>Demo scene hierarchy</p></div><div class="tree"><div class="tree-line parent">${icon('layers',15)} PROJECT ROOT</div><div class="tree-line child">${icon('box',15)} Scenes</div>${studioAssets.map(([id,n])=>`<button class="tree-line nested" data-asset="${id}" aria-pressed="${state.studioAsset===id}">${icon('layers',14)}<span>${n}</span></button>`).join('')}<div class="tree-line child">${icon('grid',15)} Interfaces</div><div class="tree-line child">${icon('code',15)} Scripts</div><div class="tree-line child">${icon('box',15)} Assets</div></div><div class="explorer-footer"><button data-action="studio-add">${icon('plus',15)} Add new concept</button><p>Layout-only. No saved file tree or assets.</p></div></aside>
    <section class="studio-center"><div class="studio-default-scene" ${state.studioTab==='Scene'?'':'hidden'}><div class="canvas-toolbar"><div class="tool-actions">${[['select','compass'],['move','arrow'],['rotate','clock'],['scale','sliders']].map(([k,g])=>`<button title="${k}" aria-label="${k} tool" data-tool="${k}" aria-pressed="${state.studioTool===k}">${icon(g,16)}<span>${k}</span></button>`).join('')}</div><div class="canvas-modes"><span>LOCAL SPACE</span><button data-action="camera">${icon('eye',16)} Perspective</button></div></div>
      <div class="studio-viewport" id="studio-viewport"><div class="viewport-art">${img(studioAssets.find(x=>x[0]===state.studioAsset)[2])}</div><div class="viewport-scanlines"></div><div class="viewport-breadcrumb">${icon('layers',15)} SCENES / ${studioAssets.find(x=>x[0]===state.studioAsset)[1].toUpperCase()}</div><div class="viewport-target"><span class="axis axis-x"></span><span class="axis axis-y"></span><span class="axis-label">${state.studioTool.toUpperCase()}</span></div><div class="viewport-orbit"></div><div class="viewport-footer"><span class="viewport-pill">${icon('eye',14)} LIVE COMPOSITION / SPECIMEN</span><span>EDITOR CAMERA / 3D CONCEPT</span></div></div>
      <div class="studio-asset-tray"><div class="tray-header"><div><span class="kicker">CONTENT LIBRARY</span><strong>Atmospheric assets</strong></div><div><button data-action="asset-prev" aria-label="Previous asset">&larr;</button><button data-action="asset-next" aria-label="Next asset">&rarr;</button></div></div><div class="tray-cards">${studioAssets.map(([id,n,art])=>`<button data-asset="${id}" aria-pressed="${state.studioAsset===id}">${img(art)}<span>${n}</span></button>`).join('')}</div></div>
    </div>${studioAlternate()}</section>
    <aside class="studio-inspector glass"><div class="inspector-tabs"><button aria-pressed="true">INSPECTOR</button><button data-action="inspector-alt">DETAILS</button></div><div class="inspector-block">${smallKicker('SELECTED OBJECT','VIEW ONLY')}<div class="inspector-thumbnail">${img(studioAssets.find(x=>x[0]===state.studioAsset)[2])}</div><h2>${studioAssets.find(x=>x[0]===state.studioAsset)[1]}</h2><span class="selected-type">ENVIRONMENT / CONCEPT SAMPLE</span></div><div class="inspector-block"><h3>World lighting</h3><label for="light-range">Ambient intensity <span id="light-value">72%</span></label><input type="range" id="light-range" min="0" max="100" value="72"><label for="fog-range">Atmospheric depth <span id="fog-value">48%</span></label><input type="range" id="fog-range" min="0" max="100" value="48"><h3>Atmosphere</h3><div class="inspector-pills"><span>Deep cosmos</span><span>Aether blue</span><span>Soft bloom</span></div></div><button class="inspector-iren" data-action="iren">${icon('spark',19)} Ask IREN about this scene ${icon('arrow',15)}</button><div class="inspector-disclaimer">PROPOSED CONTROLS / NO 3D RENDERER OR AI CALL IS CONNECTED</div></aside></div>
    ${state.iren?`<aside class="studio-iren-panel glass" aria-label="IREN assistant design panel"><div class="iren-panel-top"><span>${mark('iren-mark')} IREN / CREATIVE COPILOT</span><button data-action="iren" aria-label="Close IREN panel">&times;</button></div><p>What would you like to make next?</p><textarea id="iren-idea" rows="3" placeholder="Describe an environment, script, or idea..."></textarea><button data-action="iren-proposal">${icon('spark',17)} Inspect a local suggestion</button><span>ILLUSTRATIVE UI / NO MODEL REQUEST OR CHANGE APPLIED</span></aside>`:''}</section>`;}
  function join(){return `<section class="join-shell"><div class="join-art">${img('arrival.webp')}<div class="join-orbit">${mark('join-mark')}</div></div><div class="join-form glass">${cosmicOverline('07 / BECOME A MEMBER')}<span class="kicker">CREATE YOUR SPACE / ANEVUM</span><h1>Make this universe <em>your own.</em></h1><p>Explore without joining. When you are ready, a verified member identity can connect your creative work, interests and earned recognition.</p><div class="join-benefits">${[['compass','Explore freely','No account needed to browse published work.'],['user','Build an identity','Customize your verified member world.'],['shield','Own your decisions','Control privacy and consent.']].map(([g,t,p])=>`<div>${icon(g,22)}<span><strong>${t}</strong><small>${p}</small></span></div>`).join('')}</div><button class="btn btn-primary" data-action="signup-preview">Preview member onboarding ${icon('arrow',18)}</button><button class="text-link" data-route="discover">Keep exploring as a guest ${icon('external',17)}</button><p class="join-note">This is an offline design review. The existing production authentication and email-code flow are deliberately not wired to this specimen.</p></div></section>`;}
  function render(){
    document.title='ANEVUM / '+labels[state.page]+' - Cinematic NEXT Design';
    document.getElementById('header').innerHTML=header();
    document.getElementById('mobile-dock').innerHTML=mobileNav();
    document.getElementById('footer').innerHTML=footer();
    document.getElementById('main').innerHTML=({arrival:home,discover,commons,profile,evolution,studio,join})[state.page]();
    document.body.dataset.page=state.page;
    document.body.dataset.motion=state.motion?'on':'off';
    if(state.page!=='studio')state.iren=false;
    document.getElementById('dialog-destinations').innerHTML=routesWithName.map(([p,l])=>`<button type="button" data-route="${p}">${icon(p==='arrival'?'home':p==='discover'?'compass':p==='commons'?'people':p==='profile'?'user':p==='studio'?'studio':'spark',21)}<span>${l}</span>${icon('arrow',17)}</button>`).join('');
    if(state.page==='studio'&&state.studioTab==='Interface')updateComponentPreview();
  }
  let toastTimer;
  function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true},3900);}
  let beforeModalFocus=null;
  function modal(open){state.modal=open;const el=document.getElementById('dialog-backdrop');el.hidden=!open;document.body.classList.toggle('has-dialog',open);if(open){beforeModalFocus=document.activeElement;el.querySelector('[role="dialog"]').focus();}else if(beforeModalFocus&&beforeModalFocus.focus){beforeModalFocus.focus();}}
  function routeTo(page){if(!labels[page])return;state.page=page;modal(false);render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}
  document.addEventListener('click', e=>{
    const trigger=e.target.closest('button');if(!trigger)return;
    if(trigger.dataset.route){routeTo(trigger.dataset.route);return;}
    if(trigger.dataset.category){state.category=trigger.dataset.category;render();return;}
    if(trigger.dataset.view){state.view=trigger.dataset.view;render();return;}
    if(trigger.dataset.commons){state.commons=trigger.dataset.commons;render();return;}
    if(trigger.dataset.palette){state.profileTheme=trigger.dataset.palette;render();toast('Appearance changed locally. Nothing saved.');return;}
    if(trigger.dataset.asset){state.studioAsset=trigger.dataset.asset;render();return;}
    if(trigger.dataset.tool){state.studioTool=trigger.dataset.tool;render();return;}
    if(trigger.dataset.studioTab){state.studioTab=trigger.dataset.studioTab; if(state.studioTab==='Interface')toast('Local HTML/CSS interface editor opened. Preview is sandboxed and nothing is saved.');else if(state.studioTab==='Assets'||state.studioTab==='Scripts'||state.studioTab==='Playtests')toast(state.studioTab+' design study opened. No project files or runtime are connected.');render();return;}
    const action=trigger.dataset.action;
    if(action==='motion'){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;state.motion=!state.motion;render();toast(state.motion?'Atmospheric motion resumed.':'Atmospheric motion paused.');}
    if(action==='open-dialog')modal(true);
    if(action==='close-dialog')modal(false);
    if(action==='iren'){state.iren=!state.iren; if(state.page==='studio')render();else toast('IREN integration point defined. Existing single IREN companion will be reused.');}
    if(action==='reset-discover'){state.category='all';state.query='';render();}
    if(action==='specimen-detail')toast('Design specimen: '+trigger.dataset.target+'. No public project or link is claimed.');
    if(action==='district')toast(trigger.dataset.target+' district selected in design study. Canonical server data is not connected.');
    if(action==='sample-thread')toast('Thread-reading concept only. No real posts or accounts.');
    if(action==='share-disabled')toast('Sharing is disabled in this design-only prototype.');
    if(action==='play-preview')toast('Playtest is a proposed action. No executable scene exists in this specimen.');
    if(action==='studio-add')toast('Asset creation is deliberately disabled: this is a layout study.');
    if(action==='reset-interface'){state.interfaceHtml='<section class="surface"><p class="eyebrow">ANEVUM / COMPONENT</p><h1>Build a new world.</h1><p>A responsive card created inside the Interface Builder.</p><button type="button">Begin creating</button></section>';render();toast('Local component reset. Nothing saved.');}
    if(action==='studio-rail'){
      const k=trigger.dataset.target;
      if(k==='assist'){state.iren=true;render();return;}
      const next=({'scene':'Scene','interface':'Interface','assets':'Assets','scripts':'Scripts','playtests':'Playtests'})[k];
      if(next){state.studioTab=next;render();}else toast('This workspace module is specified, not implemented in the design specimen.');
    }
    if(action==='camera')toast('Perspective controls are illustrative in this offline review.');
    if(action==='inspector-alt')toast('Inspector detail tab is part of the design contract; no backend scene object exists.');
    if(action==='asset-prev'||action==='asset-next'){const i=studioAssets.findIndex(x=>x[0]===state.studioAsset);state.studioAsset=studioAssets[(i+(action==='asset-next'?1:studioAssets.length-1))%studioAssets.length][0];render();}
    if(action==='iren-proposal')toast('IREN proposal flow must show target, change, approval, undo. No model request was made.');
    if(action==='signup-preview')toast('Sign-up stays connected to the existing verified email-code flow in the real application. No request sent.');
  });
  document.addEventListener('submit',e=>{if(e.target.id==='discover-form'){e.preventDefault();state.query=(document.getElementById('catalogue-query').value||'').trim().slice(0,100);render();}});
  document.addEventListener('input',e=>{if(e.target.id==='builder-html'){state.interfaceHtml=e.target.value;updateComponentPreview();}if(e.target.id==='builder-css'){state.interfaceCss=e.target.value;updateComponentPreview();}if(e.target.id==='light-range'){document.getElementById('light-value').textContent=e.target.value+'%';document.getElementById('studio-viewport')?.style.setProperty('--scene-brightness',(+e.target.value/100)*.56+.6);}if(e.target.id==='fog-range')document.getElementById('fog-value').textContent=e.target.value+'%';});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){modal(false);return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();modal(!state.modal);return;}if(state.modal&&e.key==='Tab'){const nodes=Array.from(document.querySelectorAll('#dialog-backdrop button'));const start=nodes[0],end=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===start){e.preventDefault();end.focus();}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();start.focus();}}});
  document.getElementById('dialog-backdrop').addEventListener('click',e=>{if(e.target.id==='dialog-backdrop')modal(false);});
  const motionPreference=window.matchMedia('(prefers-reduced-motion: reduce)');
  motionPreference.addEventListener?.('change',e=>{state.motion=!e.matches;document.body.dataset.motion=state.motion?'on':'off';});
  render();
})();
</script>
</body>
</html>
