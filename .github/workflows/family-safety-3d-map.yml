name: Family Safety 3D Map Prototype

on:
  pull_request:
    paths:
      - 'prototypes/family-safety-3d-map/**'
      - 'creator-v1/family-safety/**'
      - 'docs/family-safety/**'
      - '.github/workflows/family-safety-3d-map.yml'
  push:
    branches:
      - 'build/family-safety-3d-map-*'
      - 'build/family-safety-circle-privacy-*'
    paths:
      - 'prototypes/family-safety-3d-map/**'
      - 'creator-v1/family-safety/**'
      - 'docs/family-safety/**'
      - '.github/workflows/family-safety-3d-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-prototype:
    name: Static and mocked-interaction privacy acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test map navigation, consent, and server authorization
        run: node --test prototypes/family-safety-3d-map/test.mjs creator-v1/family-safety/presence-policy.test.mjs
      - name: Test private circle SQL schema using an in-memory SQLite database
        run: python3 -m unittest discover -s docs/family-safety/sql -p 'test_schema.py' -v
