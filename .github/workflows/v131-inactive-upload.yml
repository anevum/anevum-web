name: ANEVUM V131 manual inactive upload
on:
  pull_request:
    paths:
      - '.github/workflows/v131-inactive-upload.yml'
      - 'ops/v131/**'
  workflow_dispatch:
    inputs:
      confirm_archive_sha256:
        description: 'Exact V131 archive SHA-256; inactive upload only, no public promotion'
        type: string
        required: true
permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read
concurrency:
  group: anevum-apex-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed release contract without provider credentials
        run: |
          node --check ops/v131/inactive-upload.mjs
          node --test ops/v131/inactive-upload.test.mjs
  inactive-upload:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'anevum/anevum-web' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'anevum' &&
      github.run_attempt == 1 &&
      inputs.confirm_archive_sha256 == 'ff5173806d7195be845b9dfd2b787676a6eca450f3b035d523d5bf085a12fc8d'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      CONFIRM_V131: ${{ inputs.confirm_archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the exact packaging CLI without application rebuild or install scripts
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/v131-cli" --ignore-scripts --no-audit --no-fund wrangler@4.135.0
          test "$(node -p "require(process.env.RUNNER_TEMP+'/v131-cli/node_modules/wrangler/package.json').version")" = '4.135.0'
      - name: Download and hash the original immutable V131 ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/anevum/anevum-web/actions/artifacts/12526930761/zip -o "$RUNNER_TEMP/v131.zip"
          echo "ff5173806d7195be845b9dfd2b787676a6eca450f3b035d523d5bf085a12fc8d  $RUNNER_TEMP/v131.zip" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/v131-package"
          unzip -q "$RUNNER_TEMP/v131.zip" -d "$RUNNER_TEMP/v131-package"
          node ops/v131/inactive-upload.mjs package "$RUNNER_TEMP/v131-package/v131-package"
      - name: Verify reviewed repository workflow, exact CI and fresh provider locks
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node ops/v131/inactive-upload.mjs before
          "$RUNNER_TEMP/v131-package/v131-package"
          "$RUNNER_TEMP/v131-before.json" "$RUNNER_TEMP/v131-config.json"
      - name: Upload the verified Worker as an unselected immutable version only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/v131-before.json"
          node "$RUNNER_TEMP/v131-cli/node_modules/wrangler/bin/wrangler.js" versions upload \
            --no-bundle --no-upload-source-maps --keep-vars --config "$RUNNER_TEMP/v131-config.json" \
            --message 'V131 ad0d3aef473e12c124b003d2c3bb45b79bff520e artifact 12526930761 INACTIVE ONLY'
      - name: Independently verify the new version and unchanged production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          node ops/v131/inactive-upload.mjs after
          "$RUNNER_TEMP/v131-package/v131-package"
          "$RUNNER_TEMP/v131-before.json" "$RUNNER_TEMP/v131-receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anevum-v131-inactive-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/v131-receipt.json
          retention-days: 14
          if-no-files-found: warn
