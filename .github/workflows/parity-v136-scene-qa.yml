name: PARITY V136 Spatial WebGL Architecture QA
on:
  pull_request:
    paths:
      - '.github/workflows/parity-v136-scene-qa.yml'
      - 'creator-v1/web/src/parity/SceneDirectorV136.ts'
      - 'creator-v1/web/src/parity/InstituteHorizonV136017.ts'
      - 'creator-v1/web/src/parity/InstituteCitadelsV136017.ts'
      - 'creator-v1/test/parity-v136-citadel-geometry.test.mjs'
      - 'creator-v1/web/src/parity/CinematicArrivalV136.tsx'
      - 'creator-v1/web/src/parity/CinematicFramesV136.tsx'
      - 'creator-v1/web/src/parity/CinematicVideoV136.tsx'
      - 'creator-v1/web/src/parity/CinematicMediaContractV136.ts'
      - 'creator-v1/web/src/parity/CinematicCameraRegistrationV136.ts'
      - 'creator-v1/web/src/parity/CinematicStageGeometryV136.ts'
      - 'creator-v1/graphics/lod-cinematic-institute-v136.py'
      - 'creator-v1/graphics/optimize-cinematic-runtime-v136.mjs'
      - 'creator-v1/test/parity-v136-stage-geometry.test.mjs'
      - 'creator-v1/test/parity-v136-cinematic-stage-browser.mjs'
      - 'creator-v1/test/parity-v136-camera-registration.test.mjs'
      - 'creator-v1/graphics/inspect-cinematic-camera-v136.mjs'
      - 'creator-v1/graphics/encode-cinematic-v136.mjs'
      - 'creator-v1/graphics/inspect-cinematic-candidate-v136.mjs'
      - 'creator-v1/graphics/smoke-cinematic-v136.mjs'
      - 'creator-v1/graphics/author-cinematic-institute-v136.py'
      - 'creator-v1/test/parity-v136-media-contract.test.mjs'
      - 'creator-v1/web/src/parity/cinematic-director-v136.ts'
      - 'creator-v1/web/src/parity/cinematic-arrival-v136.css'
      - 'creator-v1/web/public/assets/cinematic-v136/**'
      - 'creator-v1/graphics/inspect-cinematic-v136.mjs'
      - 'creator-v1/test/parity-v136-cinematic.test.mjs'
      - 'creator-v1/web/src/parity/ParityPortalV136.tsx'
      - 'creator-v1/web/src/parity/ContinuanceInstrumentV136017.tsx'
      - 'creator-v1/web/src/parity/FileGlyphV136017.tsx'
      - 'creator-v1/web/src/parity/concept-convergence-v136017.css'
      - 'creator-v1/web/src/parity/StudioSpatialWorkspaceV136.tsx'
      - 'creator-v1/web/src/parity/ArtifactWorkbenchV136.tsx'
      - 'creator-v1/web/src/parity/SourcePreviewV136.tsx'
      - 'creator-v1/web/src/parity/artifact-workbench-v136.css'
      - 'creator-v1/web/src/parity/visual-foundation-v136.css'
      - 'creator-v1/web/src/main.tsx'
      - 'creator-v1/test/parity-v136-concept-convergence.test.mjs'
      - 'docs/production/parity-v136-concept-convergence-20261024.md'
      - 'creator-v1/web/src/parity/ControllerBridgeV136.tsx'
      - 'creator-v1/web/src/parity/controller-input-v136.ts'
      - 'creator-v1/web/src/parity/controller-bridge-v136.css'
      - 'creator-v1/web/src/components/Shell.tsx'
      - 'creator-v1/test/parity-v136-controller.test.mjs'
      - 'creator-v1/web/src/parity/Institute*.ts'
      - 'creator-v1/web/src/parity/institute-optics-v136.css'
      - 'creator-v1/web/public/assets/institute/**'
      - 'creator-v1/graphics/**'
      - 'package.json'
      - 'creator-v1/web/src/pages/NativeCreatorStudio.tsx'
      - 'creator-v1/source-ide/**'
      - 'creator-v1/web/src/parity/LivingWorldField.tsx'
      - 'creator-v1/web/src/parity/living-world-shaders.ts'
      - 'creator-v1/web/src/parity/scene-materials-v136.css'
      - 'creator-v1/test/parity-v136-scene-director.test.mjs'
      - 'creator-v1/test/parity-v136-spatial-render-browser.mjs'
      - 'creator-v1/test/parity-v136-full-browser.mjs'
      - 'creator-v1/web/src/parity/ArtifactLensV136.tsx'
      - 'creator-v1/web/src/parity/artifact-lens-v136.css'
      - 'creator-v1/web/src/parity/ParityDiscoverV136.tsx'
      - 'creator-v1/web/src/components/ProjectCard.tsx'
      - 'creator-v1/web/src/components/ProjectThumbnail.tsx'
      - 'creator-v1/web/src/lib/project-thumbnails.ts'
      - 'creator-v1/web/public/assets/default-thumbnails/**'
      - 'creator-v1/test/parity-v136-thumbnails.test.mjs'
      - 'creator-v1/test/parity-v136-integrated-overhaul.test.mjs'
      - 'creator-v1/web/AGENTS.md'
      - 'docs/production/ACTIVE-V136-WEB-OVERHAUL.md'
      - 'creator-v1/web/src/components/CreatorPackageGallery.tsx'
permissions:
  contents: read
concurrency:
  group: parity-v136-spatial-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scene-source-and-compiled-browser:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_HORIZON_QA: 'true'
      VITE_IREN_SPATIAL_GUIDE: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_MEMBER_COLLECTION_NAV_REVIEW: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cinematic arrival asset provenance and handoff invariants
        run: |
          node creator-v1/graphics/inspect-cinematic-v136.mjs
          node --experimental-strip-types --test creator-v1/test/parity-v136-cinematic.test.mjs
      - name: V136.019 approved creator thumbnail priority and type-specific defaults
        run: |
          node --experimental-strip-types --test creator-v1/test/parity-v136-thumbnails.test.mjs
          node --experimental-strip-types --test creator-v1/test/parity-v136-member-world.test.mjs
          node --experimental-strip-types --test creator-v1/test/parity-v136-integrated-overhaul.test.mjs
          python3 -c "import xml.etree.ElementTree as ET; from pathlib import Path; a=list(Path('creator-v1/web/public/assets/default-thumbnails').glob('*.svg')); assert len(a)==10; [ET.parse(p) for p in a]"
      - name: Runtime media approval and single-renderer contract
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-media-contract.test.mjs
      - name: Spatial cinema registration math and GPU-to-vector reveal
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-camera-registration.test.mjs
      - name: Restrict shared authored geometry to protected QA only
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-stage-geometry.test.mjs
      - name: V136.017 authored homepage and private creator workstation contract
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-concept-convergence.test.mjs
      - name: Gamepad standard mapping and repeat contract
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-controller.test.mjs
      - name: Deterministic GPU scene grammar, shader source and pixel budgets
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-scene-director.test.mjs
      - name: Install unchanged project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Assert deterministic original citadel instances and GPU budgets
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-citadel-geometry.test.mjs
      - name: Inspect all original compressed models and device budgets
        run: node creator-v1/graphics/inspect-institute-assets.mjs
      - name: Verify source archive through canonical native compatibility inspector
        run: node --experimental-strip-types --test creator-v1/test/source-archive-v136.test.mjs creator-v1/test/csp-meshopt-v136.test.mjs
      - name: Check current React source and build full spatial presentation
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install local Chromium browser QA
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Compile GLSL in WebGL2 and capture rendered scene families
        run: node --experimental-strip-types creator-v1/test/parity-v136-spatial-render-browser.mjs
      - name: Verify actual compiled UI at six screen sizes
        run: node creator-v1/test/parity-v136-full-browser.mjs
      - name: Upload render samples and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v136-spatial-qa-${{ github.event.pull_request.head.sha }}
          path: evidence/parity-v136/
          retention-days: 14
          if-no-files-found: warn
