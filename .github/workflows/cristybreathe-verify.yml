name: CristyBreathe verification
on:
  pull_request:
    paths: ['apps/cristybreathe/**', '.github/workflows/cristybreathe-verify.yml']
  push:
    branches: [main]
    paths: ['apps/cristybreathe/**', '.github/workflows/cristybreathe-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/cristybreathe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cristybreathe/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --check dist/worker.mjs && node --check public/app.js
      - run: npm test
