name: ANEVUM V077 Front-Facing Earned Player Card QA
# QA-only: never mutate live Worker, public routes, XP, secrets or recognition grants.
on:
  push:
    branches:
      - patch/evolution-player-card-illustrations-v077-20261018
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anevum-v077-visual-qa
  cancel-in-progress: false
jobs:
  test-player-cards:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install checked-in tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate private artwork, syntax, earned access, and collectible inspector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check creator-v1/canonical-auth/evolution-card-art.mjs
          node --check creator-v1/canonical-auth/reward-media.mjs
          node --check creator-v1/test/evolution-card-illustrations-v077.test.mjs
          node --test \
            creator-v1/test/evolution-card-illustrations-v077.test.mjs \
            creator-v1/test/earned-reward-media-v075.test.mjs \
            creator-v1/test/level-artwork-preservation-v074.test.mjs \
            creator-v1/test/player-card-recognition-v065.test.mjs
      - name: Typecheck and bundle the Creator V1 frontend
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Render earned Level 4 in actual desktop and phone Chromium viewports
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "::error::Chromium not available"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v077-card-visual"
          node creator-v1/test/evolution-card-v077-browser.mjs "$chrome" "$RUNNER_TEMP/v077-card-visual"
          test -s "$RUNNER_TEMP/v077-card-visual/v077-level4-player-card-desktop.png"
          test -s "$RUNNER_TEMP/v077-card-visual/v077-level4-player-card-mobile.png"
          echo 'V077_LEVEL4_STATIC_CARD_DESKTOP_MOBILE_CHROME=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve earned Level 4 visual QA (no locked art)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v077-level4-optical-card-qa
          path: ${{ runner.temp }}/v077-card-visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Ensure card plates are never published as static assets
        shell: bash
        run: |
          set -euo pipefail
          test ! -e creator-v1/web/public/evolution-card-plates.json
          test ! -e creator-v1/web/public/assets/levels/evolution-card-plates.json
          test -d creator-v1/dist/web/assets
          if grep -r -l 'M128 20 165 78 128 128' creator-v1/dist/web/assets --include='*.js' >/dev/null; then
            echo "Private Level 4 SVG geometry leaked into public frontend bundle" >&2
            exit 1
          fi
          if grep -r -l 'evolution-card-plates' creator-v1/dist/web/assets --include='*.js' >/dev/null; then
            echo "Private card art registry leaked into public frontend bundle" >&2
            exit 1
          fi
          echo 'V077_PRIVATE_ARTWORK_3D_PRESERVATION_AND_WEB_BUILD=PASS' >> "$GITHUB_STEP_SUMMARY"
