name: ANEVUM A Staging Trusted Second Reviewer V044

# V044 code-only stage: optional separate trusted reviewer secret, preserving primary reviewer IDs. Secret activation is performed later through an independent verified-account lookup.
on:
  push:
    branches: [release/second-reviewer-v044-20261016]
    paths: [.github/workflows/a-staging-v044-second-reviewer-release.yml]

permissions:
  contents: read

concurrency:
  group: anevum-a-canonical-v044-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'anevum/anevum-web' && github.ref == 'refs/heads/release/second-reviewer-v044-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: release/second-reviewer-v044-20261016
      VITE_SERIES_ONE_V037_TRANSPARENT: 'true'
      CF_WORKER: anevum-creator-v1-a-staging
      CF_ZONE: 8abe27259b5436af5966d3b40d9a3760
      CF_ACCOUNT_EXPECTED: 2f7ee83107240152097efd956a4e8335
    steps:
      - name: Checkout exact reviewed code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned source, Worker configuration and closed public signup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          head="$(curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" | jq -r '.object.sha')"
          test "$head" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor d2bdaaeed3c4693277803876e292e5d7d775a052 HEAD
          for entry in \
            "creator-v1/canonical-auth/forum-review-console.mjs:a9d5d4b5e63b571494d992908a6040aace823ecd" \
            "creator-v1/canonical-auth/forums.mjs:bb62934b03974af474c6f513a29e6a19d7334a0a" \
            "creator-v1/web/src/pages/ForumReviewPage.tsx:31a5284d930c27714093b922442702cf107b0f78" \
            "creator-v1/test/forum-review-pagination-v043.test.mjs:ad2ed492a4d5d7f8101b0a33da506abb7720ff52" \
            "creator-v1/test/capture-moderator-pagination-v043.mjs:c5ea26e674f192eb29f7e6eab9b805717fb7a88c" \
            "creator-v1/test/forum-second-reviewer-v044.test.mjs:50f31fd528b7ec715efc258dc4a807abc1cb28f5"; do
            filename="${entry%%:*}"
            expected="${entry##*:}"
            test "$(git hash-object "$filename")" = "$expected" || { echo "::error::V043 source drift detected in $filename"; exit 1; }
          done
          echo V044_PINNED_MODULES=PASS
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {readFileSync} from "node:fs";
          const c=JSON.parse(readFileSync("creator-v1/wrangler.a-progression-v031.jsonc","utf8"));
          assert.equal(c.name,"anevum-creator-v1-a-staging");
          assert.equal(c.account_id,"2f7ee83107240152097efd956a4e8335");
          assert.equal(c.main,"./web/a-canonical-stage.review.mjs");
          assert.deepEqual(c.routes,[]);
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.equal(c.assets?.directory,"./dist/web");
          assert.equal(c.assets?.binding,"ASSETS");
          assert.equal(c.assets?.run_worker_first,true);
          assert.deepEqual(c.d1_databases?.map(x=>[x.binding,x.database_id]),[
            ["COMMUNITY_DB","fa96e36d-6257-4883-bf15-074947e11a13"],
            ["MEMBER_DB","e1d29049-c83b-4534-8355-dc1fa36ba6d8"]
          ]);
          assert.deepEqual(c.vars,{
            ANEVUM_CANONICAL_STAGE_ENABLED:"true",
            CANONICAL_SCHEMA_APPROVED:"true",
            CANONICAL_EMAIL_ENABLED:"true",
            CANONICAL_INVITED_SIGNUP_ENABLED:"true",
            CANONICAL_PUBLIC_SIGNUP_ENABLED:"false",
            CANONICAL_GOOGLE_ENABLED:"false",
            CANONICAL_GITHUB_ENABLED:"false",
            CANONICAL_APPLE_ENABLED:"false",
            CANONICAL_MICROSOFT_ENABLED:"false",
            CANONICAL_XP_TEST_ENABLED:"true"
          });
          NODE
          echo SOURCE_CONFIG_AND_SIGNUP_SCOPE=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify all sixty transparent V037 images, alpha flags and checksums
        shell: bash
        run: |
          set -euo pipefail
          node --test creator-v1/test/series-one-v037-artwork.test.mjs
          echo V037_TRANSPARENT_ARTWORK_INTEGRITY=PASS

      - name: Build and run complete Creator V1 verification
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          grep -R -l 'series-one-v037' creator-v1/dist/web/assets/*.js >/dev/null
          for level in 01 10 20 30 40 50 60; do cmp "creator-v1/web/public/assets/levels/series-one-v037/level-$level.webp" "creator-v1/dist/web/assets/levels/series-one-v037/level-$level.webp"; done
          (cd creator-v1 && npm test)
          node --check creator-v1/web/a-canonical-stage.review.mjs
          node --check creator-v1/canonical-auth/worker.mjs
          node --check creator-v1/canonical-auth/forums.mjs
          node --test creator-v1/test/canonical-forums-v041.test.mjs creator-v1/test/forum-review-console-v042.test.mjs creator-v1/test/forum-review-pagination-v043.test.mjs creator-v1/test/forum-second-reviewer-v044.test.mjs
          node --check creator-v1/canonical-auth/forum-review-console.mjs
          test -s creator-v1/dist/web/index.html
          test -n "$(grep -oE '/assets/index-[^"]+\.js' creator-v1/dist/web/index.html | head -1)"
          echo SOURCE_COMPILED_AND_TESTS=PASS

      - name: Protect V041 forum grants, routes, databases and rollback version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$CF_ACCOUNT_EXPECTED"
          umask 077
          cf() { curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1"; }
          api="https://api.cloudflare.com/client/v4"
          cf "$api/zones/$CF_ZONE/workers/routes" > "$RUNNER_TEMP/routes-before.json"
          jq -e '
            .success and
            ([.result[]|select(.pattern=="anevum.com/*" and .script=="anevum-construction-terminal")]|length)==1 and
            ([.result[]|select(.pattern=="a.anevum.com/*" and .script=="anevum-creator-v1-a-staging")]|length)==1 and
            ([.result[]|select(.pattern=="next.anevum.com/api/v1/member/*" and .script=="anevum-member-auth-staging")]|length)==1
          ' "$RUNNER_TEMP/routes-before.json" >/dev/null
          cf "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER/settings" > "$RUNNER_TEMP/stage-settings-before.json"
          jq -e '
            .success and
            ([.result.bindings[]|select(.type=="d1")]|length)==2 and
            ([.result.bindings[]|select(.type=="d1" and .name=="COMMUNITY_DB" and ((.id//.database_id)=="fa96e36d-6257-4883-bf15-074947e11a13"))]|length)==1 and
            ([.result.bindings[]|select(.type=="d1" and .name=="MEMBER_DB" and ((.id//.database_id)=="e1d29049-c83b-4534-8355-dc1fa36ba6d8"))]|length)==1 and
            ([.result.bindings[]|select(.type=="assets" and .name=="ASSETS")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_BETTER_AUTH_SECRET")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_RESEND_API_KEY")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_INVITE_EMAILS")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_PROTECTED_EMAILS")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_FORUM_ENABLED")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_FORUM_REVIEWER_IDS")]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="ANEVUM_CANONICAL_STAGE_ENABLED" and .text=="true")]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="CANONICAL_INVITED_SIGNUP_ENABLED" and .text=="true")]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="CANONICAL_PUBLIC_SIGNUP_ENABLED" and .text=="false")]|length)==1
          ' "$RUNNER_TEMP/stage-settings-before.json" >/dev/null
          # The second account has not been granted anything yet; never overwrite the original secret.
          jq -e '([.result.bindings[]|select(.name=="CANONICAL_FORUM_ADDITIONAL_REVIEWER_IDS")]|length)==0' "$RUNNER_TEMP/stage-settings-before.json" >/dev/null
          cf "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER/deployments?per_page=1" > "$RUNNER_TEMP/stage-deployments-before.json"
          jq -er '.result.deployments[0].versions[] | select(.percentage==100) | .version_id' "$RUNNER_TEMP/stage-deployments-before.json" > "$RUNNER_TEMP/rollback-version.txt"
          # Preserve the V041 forum activation. This is an in-place reviewer UI promotion.
          test "$(curl --fail --silent --show-error --max-time 20 https://a.anevum.com/api/v1/community/threads | jq -r '(.items|type) + ":" + (has("nextCursor")|tostring)')" = 'array:true'
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://a.anevum.com/api/v1/member/forum-review)" = 401
          echo EXISTING_SECRETS_D1_ROUTES_AND_ROLLBACK=PASS

      - name: Require exact currently active V043 reviewer Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          expected="b26c6ca8-d0bd-4cdd-9020-69d122086192"
          actual="$(cat "$RUNNER_TEMP/rollback-version.txt")"
          test "$actual" = "$expected" || { echo "::error::Staging version drifted. Refusing to overwrite another release."; exit 1; }

      - name: Prove signup and profile saves in a real browser
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$chrome"
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps webkit
          node creator-v1/test/progression-browser-v031.mjs --engine chromium --chrome "$chrome" --output evidence/signup-v031/chromium
          node creator-v1/test/progression-browser-v031.mjs --engine webkit --output evidence/signup-v031/webkit
          mkdir -p evidence/forums-v041
          node creator-v1/test/capture-canonical-forums-v041.mjs --chrome "$chrome" --output evidence/forums-v041
          test -s evidence/forums-v041/acceptance.json
          test -s evidence/forums-v041/forum-320.png
          test -s evidence/forums-v041/forum-detail-390.png
          mkdir -p evidence/moderator-v042
          node creator-v1/test/capture-moderator-console-v042.mjs --chrome "$chrome" --output evidence/moderator-v042
          test -s evidence/moderator-v042/acceptance.json
          test -s evidence/moderator-v042/moderator-1440.png
          test -s evidence/moderator-v042/moderator-390.png
          test -s evidence/moderator-v042/moderator-320.png
          test -s evidence/moderator-v042/moderator-report-390.png
          test -s evidence/moderator-v042/moderator-confirm-390.png
          mkdir -p evidence/moderator-v043
          node creator-v1/test/capture-moderator-pagination-v043.mjs --chrome "$chrome" --output evidence/moderator-v043
          test -s evidence/moderator-v043/acceptance.json
          for width in 1440 1024 390 320; do test -s "evidence/moderator-v043/moderator-pagination-$width.png"; done
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('evidence/moderator-v043/acceptance.json','utf8'));
          assert.equal(r.version,'V043');
          assert.equal(r.initialWindow,50);
          assert.equal(r.afterLoad,65);
          assert.equal(r.noDuplicateIds,true);
          assert.equal(r.secondReviewerRequired,true);
          assert.equal(r.moreLinkGone,true);
          assert.equal(r.localSearchScope,true);
          assert.equal(r.widths?.length,4);
          NODE

      - name: Preserve browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signup-v031-browser-${{ github.run_id }}
          path: evidence/signup-v031/
          if-no-files-found: warn
          retention-days: 14

      # Canonical staging D1 migration 0005 was independently applied and its
      # schema and foreign keys verified with a separately authorized Cloudflare
      # connection. The GitHub Actions token lacks D1 import/query permissions.
      # Require the exact reviewed SQL artifact, then confirm that the deployed
      # runtime can access all three tables; otherwise automatic rollback runs.
      - name: Pin pre-applied additive canonical staging migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object creator-v1/canonical-auth/migrations/0005_progression_notifications.sql)" = "43e5daa9929c226cbfb12d6bbea14d7461ec6a1e"
          test "$(git hash-object creator-v1/canonical-auth/migrations/0006_member_community_forums.sql)" = "d50e6525f995d3b5c78796dcc5abad52cbcfeb87"
          echo "EXACT_PREAPPLIED_STAGING_D1_MIGRATIONS_0005_AND_0006=PASS"

      - name: Deploy only a.anevum.com Worker and validate with automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.cloudflare.com/client/v4"
          cf() { curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1"; }
          old_version="$(cat "$RUNNER_TEMP/rollback-version.txt")"
          deployed=0
          validated=0
          rollback() {
            if [ "$deployed" != 1 ] || [ "$validated" = 1 ]; then return; fi
            echo "::error::V044 source validation failed, restoring the previously active V043 staging Worker version."
            jq -nc --arg id "$old_version" '{strategy:"percentage",versions:[{version_id:$id,percentage:100}],annotations:{"workers/message":"ANEVUM.WEB.RELEASE.2026-10-16.003.SECOND-REVIEWER-CODE safe rollback"}}' > "$RUNNER_TEMP/rollback-request.json"
            curl --fail --silent --show-error --max-time 30 -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data-binary @"$RUNNER_TEMP/rollback-request.json" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER/deployments" > "$RUNNER_TEMP/rollback-response.json" || true
            if jq -e '.success' "$RUNNER_TEMP/rollback-response.json" >/dev/null 2>&1; then echo ROLLBACK_REQUESTED=PASS; else echo "::error::Rollback requires manual intervention"; fi
          }
          trap rollback EXIT
          deployed=1
          npx wrangler deploy --config creator-v1/wrangler.a-progression-v031.jsonc --keep-vars
          cf "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER/settings" > "$RUNNER_TEMP/stage-settings-after.json"
          jq -e '
            .success and
            ([.result.bindings[]|select(.type=="d1")]|length)==2 and
            ([.result.bindings[]|select(.type=="d1" and .name=="MEMBER_DB" and ((.id//.database_id)=="e1d29049-c83b-4534-8355-dc1fa36ba6d8"))]|length)==1 and
            ([.result.bindings[]|select(.type=="d1" and .name=="COMMUNITY_DB" and ((.id//.database_id)=="fa96e36d-6257-4883-bf15-074947e11a13"))]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text")]|length)>=6 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_FORUM_ENABLED")]|length)==1 and
            ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_FORUM_REVIEWER_IDS")]|length)==1 and
            ([.result.bindings[]|select(.name=="CANONICAL_FORUM_ADDITIONAL_REVIEWER_IDS")]|length)==0 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="CANONICAL_INVITED_SIGNUP_ENABLED" and .text=="true")]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="CANONICAL_PUBLIC_SIGNUP_ENABLED" and .text=="false")]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="CANONICAL_XP_TEST_ENABLED" and .text=="true")]|length)==1
          ' "$RUNNER_TEMP/stage-settings-after.json" >/dev/null
          cf "$api/zones/$CF_ZONE/workers/routes" > "$RUNNER_TEMP/routes-after.json"
          jq -e '
            .success and
            ([.result[]|select(.pattern=="anevum.com/*" and .script=="anevum-construction-terminal")]|length)==1 and
            ([.result[]|select(.pattern=="a.anevum.com/*" and .script=="anevum-creator-v1-a-staging")]|length)==1 and
            ([.result[]|select(.pattern=="next.anevum.com/api/v1/member/*" and .script=="anevum-member-auth-staging")]|length)==1
          ' "$RUNNER_TEMP/routes-after.json" >/dev/null
          ready=0
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 https://a.anevum.com/api/v1/member/health | jq -e '.status=="ready" and .registration=="invite-only" and .progressionReady==true' >/dev/null 2>&1 &&
               curl --fail --silent --show-error --max-time 15 https://a.anevum.com/api/v1/member/auth-methods | jq -e '.registration=="invite-only" and .methods.email.available==true and .methods.google.available==false and .methods.github.available==false' >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 3
          done
          test "$ready" = 1
          curl --fail --silent --show-error --max-time 20 https://a.anevum.com/join -o "$RUNNER_TEMP/hosted-join.html"
          grep -q 'id="root"' "$RUNNER_TEMP/hosted-join.html"
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://a.anevum.com/api/v1/member/creator-profile)" = 401
          # Diagnose the owner-reported failure without sending user secrets
          # or creating a real profile: a valid Origin with absent optional
          # Fetch Metadata must reach session auth (401), never CSRF 403.
          profile='https://a.anevum.com/api/v1/member/creator-profile'
          status="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: https://a.anevum.com' -H 'Content-Type: application/json' \
            --data-binary '{"handle":"fixture_only","displayName":"Unauthenticated Probe","bio":""}' "$profile")"
          test "$status" = 401 || { echo "::error::Expected 401 for same-Origin metadata-free anonymous profile claim; got $status"; exit 1; }
          foreign="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X POST \
            -H 'Origin: https://untrusted.invalid' -H 'Content-Type: application/json' \
            --data-binary '{"handle":"fixture_only","displayName":"Unauthenticated Probe","bio":""}' "$profile")"
          test "$foreign" = 403 || { echo "::error::Foreign-Origin mutation boundary failed: $foreign"; exit 1; }
          for route in space wall media/avatar media/banner; do
            test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://a.anevum.com/api/v1/member/$route")" = 401
          done
          for route in members activity; do
            curl --fail --silent --show-error --max-time 20 "https://a.anevum.com/api/v1/community/$route" | jq -e '(.items|type)=="array" and (.items|length)<=12 and has("nextCursor")' >/dev/null
          done
          # V041 remains enabled. Do not create or modify forum records during hosted tests.
          curl --fail --silent --show-error --max-time 20 https://a.anevum.com/api/v1/community/threads | jq -e '(.items|type)=="array" and has("nextCursor")' >/dev/null
          curl --fail --silent --show-error --max-time 20 'https://a.anevum.com/api/v1/community/threads?topic=community' | jq -e '(.items|type)=="array" and has("nextCursor")' >/dev/null
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' 'https://a.anevum.com/api/v1/community/threads?topic=invalid')" = 400
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://a.anevum.com/api/v1/member/forum-review)" = 401
          # Unauthenticated continuation must not disclose any staff-only queue data.
          cursor="1000.00000000-0000-4000-8000-000000000001"
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://a.anevum.com/api/v1/member/forum-review?lane=threads&after=$cursor")" = 401
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://a.anevum.com/api/v1/member/forum-review?lane=reports&after=0.$cursor")" = 401
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' https://a.anevum.com/api/v1/member/forum-submissions)" = 401
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://a.anevum.com' -H 'Content-Type: application/json' --data-binary '{}' https://a.anevum.com/api/v1/member/forum-review)" = 401
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://invalid.example' -H 'Content-Type: application/json' --data-binary '{}' https://a.anevum.com/api/v1/member/forum-review)" = 403
          curl --fail --silent --show-error --max-time 20 https://a.anevum.com/community/review -o "$RUNNER_TEMP/hosted-moderator.html"
          grep -q 'id="root"' "$RUNNER_TEMP/hosted-moderator.html"
          for route in progression notifications; do
            test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "https://a.anevum.com/api/v1/member/$route")" = 401
          done
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://a.anevum.com' -H 'Content-Type: application/json' --data-binary '{}' https://a.anevum.com/api/v1/member/xp-test)" = 401
          curl --fail --silent --show-error --max-time 20 https://a.anevum.com/thebutton -o "$RUNNER_TEMP/hosted-button.html"
          grep -q 'id="root"' "$RUNNER_TEMP/hosted-button.html"
          for level in 01 30 60; do
            curl --fail --silent --show-error --max-time 20 "https://a.anevum.com/assets/levels/level-$level.svg" -o "$RUNNER_TEMP/level-$level.svg"
            cmp "creator-v1/web/public/assets/levels/level-$level.svg" "$RUNNER_TEMP/level-$level.svg"
          done
          for level in 01 10 20 30 40 50 60; do
            curl --fail --silent --show-error --max-time 20 "https://a.anevum.com/assets/levels/series-one-v037/level-$level.webp" -o "$RUNNER_TEMP/v037-level-$level.webp"
            cmp "creator-v1/web/public/assets/levels/series-one-v037/level-$level.webp" "$RUNNER_TEMP/v037-level-$level.webp"
          done
          curl --fail --silent --show-error --max-time 20 https://a.anevum.com/assets/levels/series-one-v037/manifest.json -o "$RUNNER_TEMP/v037-manifest.json"
          cmp creator-v1/web/public/assets/levels/series-one-v037/manifest.json "$RUNNER_TEMP/v037-manifest.json"
          echo "V037_TRANSPARENT_ARTWORK_HOSTED_AND_PROGRESSION_ISOLATED=PASS"
          curl --fail --silent --show-error --max-time 20 https://a.anevum.com/api/v1/member/auth/get-session | jq -e '. == null' >/dev/null
          index_js="$(grep -oE '/assets/index-[^"]+\.js' creator-v1/dist/web/index.html | head -1)"
          test -n "$index_js"
          curl --fail --silent --show-error --max-time 20 "https://a.anevum.com$index_js" -o "$RUNNER_TEMP/hosted-index.js"
          cmp "creator-v1/dist/web$index_js" "$RUNNER_TEMP/hosted-index.js"
          curl --fail --silent --show-error --max-time 20 https://anevum.com/ -o "$RUNNER_TEMP/apex.html"
          grep -q 'THE TRANSMISSION' "$RUNNER_TEMP/apex.html"
          export ANEVUM_CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$ANEVUM_CHROME"
          ANEVUM_V037_OUTPUT=evidence/series-one-v037-hosted node creator-v1/test/series-one-v037-hosted-smoke.mjs
          validated=1
          echo "ANEVUM V044 SECOND REVIEWER SOURCE STAGING PASS (ADDITIONAL SECRET NOT YET GRANTED): $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Live: https://a.anevum.com/join — invite-only; public registration remains OFF." >> "$GITHUB_STEP_SUMMARY"
          echo "Unchanged: https://anevum.com/ countdown, primary forum reviewer grants and staging D1, signup policy, member profiles and XP. Additional permission requires separate activation." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve synthetic V041/V042/V043 forum and moderator browser evidence with V044 auth unit tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v044-second-reviewer-browser-${{ github.run_id }}
          path: |
            evidence/forums-v041/
            evidence/moderator-v042/
            evidence/moderator-v043/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve hosted V037 phone and desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v037-series-one-hosted-${{ github.run_id }}
          path: evidence/series-one-v037-hosted/
          if-no-files-found: warn
          retention-days: 14
