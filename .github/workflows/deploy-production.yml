name: Deploy ANEVUM Production

on:
  # V5 release is a separately owner-approved MANUAL operation only. Pushing or
  # merging to main must NEVER start an uncontrolled production deployment.
  workflow_dispatch:
    inputs:
      release_scope:
        description: 'Public visual update or independently authorized full member release'
        required: true
        type: choice
        default: FULL_V5_MEMBER_AUTHORIZED
        options:
          - PUBLIC_V5_VISUAL_ONLY
          - FULL_V5_MEMBER_AUTHORIZED
      confirmation:
        description: 'Type DEPLOY_ANEVUM_PRODUCTION_V5 after staging acceptance'
        required: true
        type: string
      reviewed_head_sha:
        description: 'Exact reviewed 40-character main commit SHA'
        required: true
        type: string
      rollback_confirmed:
        description: 'Type PRODUCTION_ROLLBACK_VERIFIED after restore/rollback rehearsal'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anevum-production
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY_ANEVUM_PRODUCTION_V5' &&
      inputs.reviewed_head_sha == github.sha &&
      inputs.rollback_confirmed == 'PRODUCTION_ROLLBACK_VERIFIED' &&
      (inputs.release_scope == 'PUBLIC_V5_VISUAL_ONLY' ||
       inputs.release_scope == 'FULL_V5_MEMBER_AUTHORIZED')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify V5 trading suspension boundaries
        run: node --test tests/legacy-rhen-retirement.test.mjs
      - name: Build
        run: npm run build
      - name: Verify generated public artifacts
        run: |
          test -s public/devon-akins-resume.pdf
          test -s dist/client/devon-akins-resume.pdf
          head -c 5 dist/client/devon-akins-resume.pdf | grep -Fq '%PDF-'
      - name: Verify public-only V5 production safety before deployment
        if: inputs.release_scope == 'PUBLIC_V5_VISUAL_ONLY'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_D1_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node scripts/verify-v5-production-public-scope.mjs
          npm run test:members
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for worker in anevum-web-nextgen anevum-member-staging; do
            curl --fail --silent --show-error --max-time 25 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/workers/scripts/$worker/settings" \
              > "$RUNNER_TEMP/public-v5-before-$worker.json"
            jq -e '.success == true and (.result.bindings|type) == "array"' \
              "$RUNNER_TEMP/public-v5-before-$worker.json" > /dev/null
            curl --fail --silent --show-error --max-time 25 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/workers/scripts/$worker/deployments" \
              > "$RUNNER_TEMP/public-v5-deploy-before-$worker.json"
            jq -e '.success == true and
              (.result.deployments[0].versions | length) > 0' \
              "$RUNNER_TEMP/public-v5-deploy-before-$worker.json" > /dev/null
          done
          jq -e '
            ([.result.bindings[] | select(.type=="d1")]|length)==1 and
            any(.result.bindings[]; .name=="MEMBER_DB" and .type=="d1" and
              .database_id=="7f0d4c0c-2e85-4900-8504-1347954e1df1") and
            any(.result.bindings[]; .name=="ANEVUM_MEMBERS_ENABLED" and .text=="true") and
            any(.result.bindings[]; .name=="COMMAND_LIVE_STREAM_ENABLED" and .text=="false")
          ' "$RUNNER_TEMP/public-v5-before-anevum-web-nextgen.json" > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/anevum-web-nextgen/secrets" \
            > "$RUNNER_TEMP/public-v5-secret-names.json"
          for key in BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            jq -e --arg key "$key" '.success == true and
              any(.result[]; .name==$key and .type=="secret_text")' \
              "$RUNNER_TEMP/public-v5-secret-names.json" > /dev/null
          done
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS member_tables FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','rateLimit','member_profiles','member_saved_apps','member_project_follows','member_entitlements')" \
            > "$RUNNER_TEMP/public-v5-schema.json"
          jq -e '.[0].success==true and .[0].results[0].member_tables==9' \
            "$RUNNER_TEMP/public-v5-schema.json" > /dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command 'PRAGMA foreign_key_check' > "$RUNNER_TEMP/public-v5-fk.json"
          jq -e '.[0].success==true and (.[0].results|length)==0' \
            "$RUNNER_TEMP/public-v5-fk.json" > /dev/null
          echo 'PASS: public-only existing production Worker, D1, encrypted auth, disabled trading, zero FK violations.'
      - name: Verify production member release prerequisites before deployment
        if: inputs.release_scope == 'FULL_V5_MEMBER_AUTHORIZED'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          WORKER_SECRETS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:members
          node scripts/verify-member-bindings.mjs --require-live
          jq -e '
            .name == "anevum-web-nextgen" and
            .vars.ANEVUM_MEMBERS_ENABLED == "true" and
            .vars.ANEVUM_MEMBER_RHEN_DRAFTS_ENABLED == "false" and
            .vars.ANEVUM_MEMBER_PREVIEW_ENABLED == "false" and
            .vars.COMMAND_LIVE_STREAM_ENABLED == "false" and
            .vars.ANEVUM_V5_OWNER_MEMBER_BINDING_REQUIRED == "true" and
            .d1_databases[0].database_id == "7f0d4c0c-2e85-4900-8504-1347954e1df1" and
            .previews.d1_databases[0].database_id == "a537432e-d216-4b31-8b22-19662cc3a44a"
          ' wrangler.jsonc >/dev/null
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${WORKER_SECRETS_READ_TOKEN:-}"
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS member_tables FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','rateLimit','member_profiles','member_saved_apps','member_project_follows','member_entitlements')" > "$RUNNER_TEMP/prod-launch-schema.json"
          jq -e '.[0].success == true and .[0].results[0].member_tables == 9' "$RUNNER_TEMP/prod-launch-schema.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS draft_tables FROM sqlite_master WHERE type='table' AND name='member_rhen_drafts'" > "$RUNNER_TEMP/prod-launch-draft-schema.json"
          jq -e '.[0].success == true and .[0].results[0].draft_tables == 1' "$RUNNER_TEMP/prod-launch-draft-schema.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command 'PRAGMA foreign_key_check' > "$RUNNER_TEMP/prod-launch-foreign-keys.json"
          jq -e '.[0].success == true and (.[0].results|length) == 0' "$RUNNER_TEMP/prod-launch-foreign-keys.json" >/dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $WORKER_SECRETS_READ_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-web-nextgen/secrets" \
            -o "$RUNNER_TEMP/prod-launch-secret-bindings.json"
          jq -e '.success == true and (.result|type == "array")' "$RUNNER_TEMP/prod-launch-secret-bindings.json" >/dev/null
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BETTER_AUTH_SECRET RHEN_OWNER_MEMBER_ID; do
            jq -e --arg key "$name" 'any(.result[]; .name == $key and .type == "secret_text")' \
              "$RUNNER_TEMP/prod-launch-secret-bindings.json" >/dev/null
          done
          echo 'PASS release preflight: approved migrated D1, ten required tables, FK integrity and encrypted auth binding names.'
      - name: Reject stale main ref before production deployment
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current_main"
          test "$current_main" = "$GITHUB_SHA"
          test "$current_main" = "${{ inputs.reviewed_head_sha }}"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify public-only live site and protected worker invariants
        if: inputs.release_scope == 'PUBLIC_V5_VISUAL_ONLY'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          base='https://anevum.com'
          for route in / /products /communities /learn /field-notes /about /beta /privacy /terms; do
            code="$(curl --silent --show-error --retry 2 --max-time 20 -o /dev/null -w '%{http_code}' "$base$route")"
            test "$code" = 200
          done
          for route in /api/member/me /api/member/export /api/member/rhen/workspace /api/member/rhen/draft /api/command/trader/status; do
            code="$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base$route")"
            case "$code" in 401|403|503) ;; *) exit 1 ;; esac
          done
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          for worker in anevum-web-nextgen anevum-member-staging; do
            curl --fail --silent --show-error --max-time 25 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$api/workers/scripts/$worker/settings" \
              > "$RUNNER_TEMP/public-v5-after-$worker.json"
            jq -e --slurpfile before "$RUNNER_TEMP/public-v5-before-$worker.json" '
              .success==true and
              ([.result.bindings[]|select(.type=="d1")] ==
               [$before[0].result.bindings[]|select(.type=="d1")])
            ' "$RUNNER_TEMP/public-v5-after-$worker.json" > /dev/null
          done
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/anevum-member-staging/deployments" \
            > "$RUNNER_TEMP/public-v5-reviewer-after.json"
          jq -e --slurpfile before "$RUNNER_TEMP/public-v5-deploy-before-anevum-member-staging.json" '
            .success==true and
            [.result.deployments[0].versions[].version_id] ==
            [$before[0].result.deployments[0].versions[].version_id]
          ' "$RUNNER_TEMP/public-v5-reviewer-after.json" > /dev/null
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/workers/scripts/anevum-web-nextgen/secrets" \
            > "$RUNNER_TEMP/public-v5-secret-names-after.json"
          for key in BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            jq -e --arg key "$key" '.success==true and
              any(.result[]; .name==$key and .type=="secret_text")' \
              "$RUNNER_TEMP/public-v5-secret-names-after.json" > /dev/null
          done
          {
            echo '## ANEVUM V5 — public visual update on existing production'
            echo 'PASS: public pages, private anonymous denial, unchanged member D1 and preserved Google/Auth bindings.'
            echo 'PASS: separate Alpaca reviewer deployment remains unchanged.'
            echo 'RHEN operator binding and member workspaces remain separately gated.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify production member launch boundaries
        if: inputs.release_scope == 'FULL_V5_MEMBER_AUTHORIZED'
        run: node scripts/probe-member-production-launch.mjs
      - name: Verify production visual operations
        env:
          BASE_URL: https://anevum.com
          PUBLIC_ONLY: "1"
        run: node scripts/visual-ops-browser-qa.mjs
      - name: Retain production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-production-visuals
          path: ${{ runner.temp }}/anevum-visuals
          retention-days: 7
