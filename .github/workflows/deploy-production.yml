name: Legacy ANEVUM V5 deployment retired

# The original workflow is preserved verbatim on
# archive/pre-creator-platform-20261011.
# anevum.com now belongs to the isolated creator-v1 Worker.
# Do not re-enable this deployment to the apex domain.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse legacy production deployment
        run: |
          echo "::error::The V5 production deployment is retired. ANEVUM creator V1 owns anevum.com."
          echo "Use the reviewed creator-v1 release process; retain V5 as a read-only archive."
          exit 1
