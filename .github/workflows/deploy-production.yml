name: ANEVUM V5 Approved Production Cutover

on:
  # Devon explicitly approved the production recovery, migration, owner binding
  # and deployment on October 11, then requested plugin execution after the
  # browser stalled. This branch-only trigger executes that one approval.
  # Main retains the original manual workflow. Never merge this trigger.
  push:
    branches: [release/anevum-v5-approved-production-20261011]
    paths: [.github/workflows/deploy-production.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: anevum-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'anevum/anevum-web' &&
      github.ref == 'refs/heads/release/anevum-v5-approved-production-20261011' &&
      github.actor == 'anevum' &&
      github.event.before == '05a0052b52bc655f45a00fd8c54aec4e872d5dac' &&
      github.event.head_commit.message == 'release(v5): execute approved production cutover via plugin'
    env:
      RELEASE_SOURCE_SHA: '05a0052b52bc655f45a00fd8c54aec4e872d5dac'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 05a0052b52bc655f45a00fd8c54aec4e872d5dac
      - name: Verify single approved trigger and immutable release source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = 'anevum/anevum-web'
          test "$GITHUB_REF" = 'refs/heads/release/anevum-v5-approved-production-20261011'
          test "$GITHUB_ACTOR" = 'anevum'
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SOURCE_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 "$GITHUB_SHA")" = "$GITHUB_SHA $RELEASE_SOURCE_SHA"
          test "$(git show -s --format=%B "$GITHUB_SHA")" = 'release(v5): execute approved production cutover via plugin'
          test "$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")" = '.github/workflows/deploy-production.yml'
          echo 'PASS: single approved plugin trigger; exact previously verified main source.'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0" "cryptography==45.0.7"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Verify V5 trading suspension boundaries
        run: |
          node --test tests/legacy-rhen-retirement.test.mjs
          npm run test:members
          npm run test:foundation
      - name: Build
        run: npm run build
      - name: Verify generated public artifacts
        run: |
          test -s public/devon-akins-resume.pdf
          test -s dist/client/devon-akins-resume.pdf
          head -c 5 dist/client/devon-akins-resume.pdf | grep -Fq '%PDF-'
      - name: Verify private production recovery with synthetic accounts only
        run: |
          node --test tests/v5-production-release.test.mjs
          python scripts/verify-v5-production-backup.py selftest
      - name: Reject stale main before private recovery or migration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SOURCE_SHA"
          test "$RELEASE_SOURCE_SHA" = "05a0052b52bc655f45a00fd8c54aec4e872d5dac"
      - name: Require successful verification of this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SOURCE_SHA&status=completed&per_page=100" \
            > "$RUNNER_TEMP/production-source-ci.json"
          jq -e --arg sha "$RELEASE_SOURCE_SHA" \
            'any(.workflow_runs[]; .name=="ANEVUM Verify" and .head_sha==$sha and .event=="push" and .conclusion=="success")' \
            "$RUNNER_TEMP/production-source-ci.json" >/dev/null
      - name: Export, restore-test and encrypt the authorized production backup
        id: recovery
        env:
          ANEVUM_PRIVATE_RECOVERY_AUTHORIZED: "true"
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Existing organization recovery key; keep its custody in encrypted
          # secrets. Dedicated production archive and verified target below.
          ANEVUM_PRODUCTION_BACKUP_FERNET_KEY: ${{ secrets.ANEVUM_PREVIEW_BACKUP_FERNET_KEY }}
        run: node scripts/production-v5-release.mjs backup
      - name: Retain encrypted production recovery and rollback metadata
        uses: actions/upload-artifact@v4
        with:
          name: anevum-production-d1-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/anevum-production-d1.sql.fernet
            ${{ runner.temp }}/production-recovery-report.json
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Re-download the encrypted production recovery archive
        uses: actions/download-artifact@v4
        with:
          name: anevum-production-d1-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/production-recovery-verify
      - name: Verify archived backup before any production migration
        env:
          ANEVUM_PRIVATE_RECOVERY_AUTHORIZED: "true"
          ANEVUM_PRODUCTION_BACKUP_FERNET_KEY: ${{ secrets.ANEVUM_PREVIEW_BACKUP_FERNET_KEY }}
          EXPECTED_PRODUCTION_BACKUP_SHA: ${{ steps.recovery.outputs.sql_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python scripts/verify-v5-production-backup.py verify-encrypted \
            "$RUNNER_TEMP/production-recovery-verify/anevum-production-d1.sql.fernet" \
            > "$RUNNER_TEMP/verified-production-recovery.json"
          jq -e --arg sha "$EXPECTED_PRODUCTION_BACKUP_SHA" \
            '.status=="PRODUCTION_SQLITE_RECOVERY_AND_STUDIO_REHEARSAL_VERIFIED" and .sql_sha256==$sha and .existing_records_preserved==true and .foreign_key_violations==0' \
            "$RUNNER_TEMP/verified-production-recovery.json" >/dev/null
      - name: Reject stale main before Studio activation
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_SOURCE_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
      - name: Apply only the Studio migration and privately bind the existing owner
        env:
          ANEVUM_PRIVATE_RECOVERY_AUTHORIZED: "true"
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_PRODUCTION_BACKUP_SHA: ${{ steps.recovery.outputs.sql_sha256 }}
        run: node scripts/production-v5-release.mjs activate-studio
      - name: Verify production member release prerequisites before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          WORKER_SECRETS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-member-bindings.mjs --require-live
          jq -e '
            .name == "anevum-web-nextgen" and
            .vars.ANEVUM_MEMBERS_ENABLED == "true" and
            .vars.ANEVUM_MEMBER_RHEN_DRAFTS_ENABLED == "false" and
            .vars.ANEVUM_MEMBER_PREVIEW_ENABLED == "false" and
            .vars.COMMAND_LIVE_STREAM_ENABLED == "false" and
            .vars.ANEVUM_V5_OWNER_MEMBER_BINDING_REQUIRED == "true" and
            .vars.RHEN_OBSERVER_ENABLED == "false" and
            .vars.ANEVUM_STUDIO_ENABLED == "true" and
            .vars.ANEVUM_STUDIO_PUBLISH_ENABLED == "false" and
            .d1_databases[0].database_id == "7f0d4c0c-2e85-4900-8504-1347954e1df1" and
            .previews.d1_databases[0].database_id == "a537432e-d216-4b31-8b22-19662cc3a44a"
          ' wrangler.jsonc >/dev/null
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${WORKER_SECRETS_READ_TOKEN:-}"
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS member_tables FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','rateLimit','member_profiles','member_saved_apps','member_project_follows','member_entitlements')" > "$RUNNER_TEMP/prod-launch-schema.json"
          jq -e '.[0].success == true and .[0].results[0].member_tables == 9' "$RUNNER_TEMP/prod-launch-schema.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS draft_tables FROM sqlite_master WHERE type='table' AND name='member_rhen_drafts'" > "$RUNNER_TEMP/prod-launch-draft-schema.json"
          jq -e '.[0].success == true and .[0].results[0].draft_tables == 1' "$RUNNER_TEMP/prod-launch-draft-schema.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command 'PRAGMA foreign_key_check' > "$RUNNER_TEMP/prod-launch-foreign-keys.json"
          jq -e '.[0].success == true and (.[0].results|length) == 0' "$RUNNER_TEMP/prod-launch-foreign-keys.json" >/dev/null
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $WORKER_SECRETS_READ_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-web-nextgen/secrets" \
            -o "$RUNNER_TEMP/prod-launch-secret-bindings.json"
          jq -e '.success == true and (.result|type == "array")' "$RUNNER_TEMP/prod-launch-secret-bindings.json" >/dev/null
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BETTER_AUTH_SECRET ANEVUM_STUDIO_OWNER_MEMBER_ID; do
            jq -e --arg key "$name" 'any(.result[]; .name == $key and .type == "secret_text")' \
              "$RUNNER_TEMP/prod-launch-secret-bindings.json" >/dev/null
          done
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS studio_tables FROM sqlite_master WHERE type='table' AND name IN ('studio_entries','studio_entry_events')" > "$RUNNER_TEMP/prod-studio-schema.json"
          jq -e '.[0].success==true and .[0].results[0].studio_tables==2' "$RUNNER_TEMP/prod-studio-schema.json" >/dev/null
          echo 'PASS release preflight: approved migrated D1, core and Studio tables, FK integrity and encrypted auth binding names.'
      - name: Reject stale main ref before production deployment
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$current_main"
          test "$current_main" = "$RELEASE_SOURCE_SHA"
          test "$current_main" = "05a0052b52bc655f45a00fd8c54aec4e872d5dac"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$GITHUB_SHA"
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify production member launch boundaries
        run: node scripts/probe-member-production-launch.mjs
      - name: Verify production V5 routes and Studio privacy
        run: node scripts/probe-v5-live-release.mjs
      - name: Verify production visual operations
        env:
          BASE_URL: https://anevum.com
          PUBLIC_ONLY: "1"
        run: node scripts/visual-ops-browser-qa.mjs
      - name: Retain production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-production-visuals
          path: ${{ runner.temp }}/anevum-visuals
          retention-days: 7
