name: Deploy ANEVUM Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anevum-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Verify generated public artifacts
        run: |
          test -s public/iren-profile-current.png
          test -s public/iren-profile-current.json
          test -s dist/client/iren-profile-current.png
          test -s dist/client/iren-profile-current.json
          test -s public/devon-akins-resume.pdf
          test -s dist/client/devon-akins-resume.pdf
          head -c 5 dist/client/devon-akins-resume.pdf | grep -Fq '%PDF-'
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify production visual operations
        env:
          BASE_URL: https://anevum.com
          PUBLIC_ONLY: "1"
        run: node scripts/visual-ops-browser-qa.mjs
      - name: Retain production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-production-visuals
          path: ${{ runner.temp }}/anevum-visuals
          retention-days: 7
