name: ANEVUM V111 IREN Transmission Presentation QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/components/AnevumNotifications.tsx'
      - 'creator-v1/web/src/components/IrenGuidedContinuance.tsx'
      - 'creator-v1/web/src/lib/ui-events.ts'
      - 'creator-v1/web/src/lib/notification-delivery.ts'
      - 'creator-v1/web/src/iren-transmissions-v111.css'
      - 'creator-v1/test/iren-scout-v087.test.mjs'
      - 'creator-v1/test/iren-transmissions-v111.test.mjs'
      - 'creator-v1/test/capture-iren-transmissions-v111.mjs'
      - 'creator-v1/package.json'
      - '.github/workflows/iren-transmissions-v111-qa.yml'
permissions:
  contents: read
concurrency:
  group: iren-v111-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck canonical Creator V1 React shell
        run: npm run check:creator-v1-web
      - name: Build canonical Creator V1 production application
        run: npm run build:creator-v1-web
      - name: Build isolated staging-path React for browser verification
        run: npm run build:creator-v1-web:staging
      - name: Verify one queue, one IREN and authentic recognition boundaries
        working-directory: creator-v1
        run: |
          npm run test:iren-v111
          npm run test:iren-v080
          npm run test:iren-v088
      - name: Verify visible transmissions across desktop, phone, hidden state and reduced motion
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          mkdir -p evidence/iren-v111
          node creator-v1/test/portal-offline-preview.mjs > evidence/iren-v111/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:4178/__ready >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4178/__ready >/dev/null
          node creator-v1/test/capture-iren-transmissions-v111.mjs "$chrome" http://127.0.0.1:4178 evidence/iren-v111
          test -s evidence/iren-v111/acceptance.json
          test -s evidence/iren-v111/iren-transmission-1440.png
          test -s evidence/iren-v111/iren-transmission-390.png
          test -s evidence/iren-v111/iren-transmission-320.png
          test -s evidence/iren-v111/iren-priority-1440.png
          test -s evidence/iren-v111/iren-priority-390.png
          test -s evidence/iren-v111/iren-priority-320.png
      - name: Retain real React browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iren-v111-browser-evidence
          path: evidence/iren-v111/
          retention-days: 14
          if-no-files-found: warn
      - name: Identify exact verified source
        run: git rev-parse HEAD
# Source-only; no Cloudflare credentials, sign-in, D1 or deployment writes.
