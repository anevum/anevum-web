name: ANEVUM V064 Optical Release Read-Only QA
# Retired the V064 candidate uploader after promotion to production.
# This workflow reads live public pages only; it never touches Cloudflare bindings, secrets, or deployments.
on:
  push:
    branches: [build/evolution-miniature-native-webgl-v062-20261017-011]
    paths: [.github/workflows/evolution-v064-safe-candidate.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anevum-v064-optical-readonly
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source contract and live poster hashes
        run: |
          set -euo pipefail
          test -s design/evolution-v059/src/micro.py
          test -s creator-v1/ops/apply-evolution-micro-v064.py
          test -s docs/evolution-v064-sha256.txt
          test "$(wc -l < docs/evolution-v064-sha256.txt)" -eq 30
          mkdir -p qa-v064-optical-live
          cd qa-v064-optical-live
          for n in $(seq -w 1 30); do
            curl -fLsS --retry 2 --connect-timeout 12 --max-time 25 "https://anevum.com/evolution/assets/level-$n-compact-128.png" -o "level-$n-compact-128.png"
          done
          sha256sum -c "$GITHUB_WORKSPACE/docs/evolution-v064-sha256.txt" | tee hashes.txt
          test "$(grep -c ': OK' hashes.txt)" = 30
          curl -fLsS --connect-timeout 12 --max-time 25 https://anevum.com/api/v1/member/auth-methods -o auth-methods.json
          jq -e '.registration=="open" and .methods.email.available==true' auth-methods.json >/dev/null
      - name: Read-only native WebGL / mobile / reduced-motion smoke
        run: |
          set -euo pipefail
          /usr/bin/google-chrome --version
          node --check creator-v1/test/evolution-mini-live-browser-v062.mjs
          node creator-v1/test/evolution-mini-live-browser-v062.mjs
      - name: Preserve read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v064-postrelease-readonly-evidence
          path: |
            qa-v064-optical-live/hashes.txt
            qa-v064-optical-live/auth-methods.json
            qa-v062-live-member/
          if-no-files-found: warn
          retention-days: 14
