name: Verify ANEVUM Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check worker.mjs
      - run: node --check site/app.js
      - run: npm install --no-audit --no-fund
      - run: npm run build
