name: Creator Studio V110 First Usable Workspace QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/pages/CreatorStudioWorkspaceV109.tsx'
      - 'creator-v1/web/src/pages/StudioNewProjectDialogV110.tsx'
      - 'creator-v1/web/src/pages/AgentDockV110.tsx'
      - 'creator-v1/web/src/pages/creator-workspace-v110.css'
      - 'creator-v1/web/src/lib/studio-starters-v110.ts'
      - 'creator-v1/test/studio-v110-first-usable.test.mjs'
      - 'creator-v1/test/capture-studio-first-usable-v110.mjs'
      - '.github/workflows/creator-studio-v110-qa.yml'
permissions:
  contents: read
concurrency:
  group: creator-studio-v110-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-usable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify starter, workspace and no-provider-call contracts
        run: |
          node --experimental-strip-types --test creator-v1/test/studio-v110-first-usable.test.mjs
          node --test creator-v1/test/creator-workspace-v109.test.mjs
          npm run check:creator-v1-web
      - name: Build feature-OFF compatibility
        env:
          VITE_CREATOR_WORKSPACE_V109: 'false'
          VITE_CREATOR_AGENT_DOCK_V110: 'false'
        run: npm run build:creator-v1-web:staging
      - name: Build workspace with disconnected agent
        env:
          VITE_CREATOR_WORKSPACE_V109: 'true'
          VITE_CREATOR_AGENT_DOCK_V110: 'true'
          VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
          VITE_CREATOR_WORKBENCH_ALPHA: 'false'
        run: npm run build:creator-v1-web:staging
      - name: Chromium offline project creation and Agent Dock acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/studio-v110
          node creator-v1/test/portal-offline-preview.mjs > evidence/studio-v110/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:4178/__ready > /dev/null; then ready=1; break; fi
            sleep .2
          done
          test "$ready" -eq 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-studio-first-usable-v110.mjs --chrome "$chrome" --output evidence/studio-v110
      - name: Record non-deployment evidence
        run: echo 'V110_FIRST_USABLE=OFFLINE_AUTH_FIXTURE_ONLY_NO_PROVIDER_CALLS_NO_LIVE_ACCEPTANCE' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-studio-v110-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/studio-v110/
          if-no-files-found: ignore
