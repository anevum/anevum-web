name: ANEVUM V078 Premium Player Cards / Earned Collector QA
# No live deployment, account operations, protected secrets, or XP grants.
on:
  push:
    branches:
      - design/player-card-premium-v078-20261018
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anevum-v078-premium-cards
  cancel-in-progress: false
jobs:
  responsive-verified-identity:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate identity, earned reward privacy and original 3D inspector
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check creator-v1/canonical-auth/evolution-card-art.mjs
          node --check creator-v1/canonical-auth/reward-media.mjs
          node --check creator-v1/test/player-card-v078-live-react-browser.mjs
          node --test \
            creator-v1/test/player-card-premium-v078.test.mjs \
            creator-v1/test/evolution-card-illustrations-v077.test.mjs \
            creator-v1/test/earned-reward-media-v075.test.mjs \
            creator-v1/test/level-artwork-preservation-v074.test.mjs \
            creator-v1/test/player-card-recognition-v065.test.mjs
      - name: Compile and build actual production React components
        shell: bash
        run: |
          set -euo pipefail
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Browser-test rendered React, true SVG media headers and privacy on phone and desktop
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome" || { echo "::error::Chromium unavailable"; exit 1; }
          mkdir -p "$RUNNER_TEMP/v078-real-react-card"
          node creator-v1/test/player-card-v078-live-react-browser.mjs "$chrome" "$RUNNER_TEMP/v078-real-react-card"
          test -s "$RUNNER_TEMP/v078-real-react-card/v078-live-react-desktop.png"
          test -s "$RUNNER_TEMP/v078-real-react-card/v078-live-react-mobile.png"
          test -s "$RUNNER_TEMP/v078-real-react-card/result.json"
          echo 'V078_PREMIUM_PLAYER_CARDS_REAL_REACT_BROWSER_AND_PRIVATE_STATE=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Assert unreached optical plates are not bundled publicly
        shell: bash
        run: |
          set -euo pipefail
          test -d creator-v1/dist/web/assets
          test ! -e creator-v1/web/public/evolution-card-plates.json
          if grep -r -l 'M128 20 165 78 128 128' creator-v1/dist/web/assets --include='*.js' >/dev/null; then
            echo "::error::Server-only Level 4 artwork geometry leaked into client bundle"
            exit 1
          fi
          if grep -r -l 'evolution-card-plates' creator-v1/dist/web/assets --include='*.js' >/dev/null; then
            echo "::error::Earned-only artwork registry leaked into client bundle"
            exit 1
          fi
      - name: Attach desktop/mobile screenshot evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v078-premium-real-react-visual-qa
          path: ${{ runner.temp }}/v078-real-react-card/
          if-no-files-found: warn
          retention-days: 14
