name: Creator Studio V112 Visual Scene QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/pages/StudioSceneComposerV112.tsx'
      - 'creator-v1/web/src/pages/studio-scene-composer-v112.css'
      - 'creator-v1/web/src/pages/StudioFileWorkspaceV111.tsx'
      - 'creator-v1/test/studio-visual-scenes-v112.test.mjs'
      - 'creator-v1/test/capture-studio-visual-scenes-v112.mjs'
      - '.github/workflows/creator-studio-v112-visual-scenes-qa.yml'
permissions:
  contents: read
concurrency:
  group: creator-studio-v112-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate existing scene schema and visual adapter
        run: node --test creator-v1/test/studio-visual-scenes-v112.test.mjs
      - name: Preserve V111 private file authorization and recovery
        run: node --test creator-v1/test/studio-file-tree-v111.test.mjs
      - name: Browser TypeScript and fixture safety
        run: |
          npm run check:creator-v1-web
          node --check creator-v1/test/capture-studio-visual-scenes-v112.mjs
      - name: Build with scene composer OFF (existing Studio preserved)
        env:
          VITE_CREATOR_WORKSPACE_V109: 'true'
          VITE_CREATOR_AGENT_DOCK_V110: 'true'
          VITE_CREATOR_FILE_TREE_V111: 'true'
          VITE_CREATOR_VISUAL_SCENE_V112: 'false'
        run: npm run build:creator-v1-web:staging
      - name: Build source workspace with visual scene pilot ON
        env:
          VITE_CREATOR_WORKSPACE_V109: 'true'
          VITE_CREATOR_AGENT_DOCK_V110: 'true'
          VITE_CREATOR_FILE_TREE_V111: 'true'
          VITE_CREATOR_VISUAL_SCENE_V112: 'true'
          VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
          VITE_CREATOR_WORKBENCH_ALPHA: 'false'
        run: npm run build:creator-v1-web:staging
      - name: Chromium source file, safe branching, save, reload and guest isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/studio-v112
          node creator-v1/test/portal-offline-preview.mjs > evidence/studio-v112/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:4178/__ready > /dev/null; then ready=1; break; fi
            sleep .2
          done
          test "$ready" -eq 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-studio-visual-scenes-v112.mjs --chrome "$chrome" --output evidence/studio-v112
      - name: Confirm non-deployment status
        run: echo 'V112=OFFLINE_VISUAL_PREVIEW_ONLY; ANEVUM_BLOCKS_V1; NO_NEW_SOURCE_SCHEMA; NO_PUBLISH; NO_MODEL_CALLS' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-studio-v112-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/studio-v112/
          if-no-files-found: ignore
