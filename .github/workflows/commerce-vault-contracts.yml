name: ANEVUM Commerce Vault V001 Contract Tests
on:
  pull_request:
    paths:
      - "src/server/commerce-contract.mjs"
      - "src/server/commerce-bank-model.mjs"
      - "src/server/commerce-readonly.mjs"
      - "src/server/vault-projects.mjs"
      - "src/pages/CommercePreview.tsx"
      - "src/styles/commerce-preview.css"
      - "src/App.tsx"
      - "src/server/member.mjs"
      - "tests/commerce-vault-contract.test.mjs"
      - "tests/commerce-bank-model.test.mjs"
      - "tests/commerce-readonly.test.mjs"
      - "tests/vault-projects.test.mjs"
      - "tests/test_commerce_review_schema.py"
      - "docs/commerce-vault/**"
      - ".github/workflows/commerce-vault-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify contract syntax
        run: node --check src/server/commerce-contract.mjs && node --check src/server/commerce-bank-model.mjs && node --check src/server/commerce-readonly.mjs && node --check src/server/vault-projects.mjs
      - name: Run price and payment safety tests
        run: node --test tests/commerce-vault-contract.test.mjs tests/commerce-bank-model.test.mjs tests/commerce-readonly.test.mjs tests/vault-projects.test.mjs
      - name: Review isolated schema without touching Cloudflare D1
        run: python3 tests/test_commerce_review_schema.py
