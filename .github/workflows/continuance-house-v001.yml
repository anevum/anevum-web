name: Continuance House V001 isolated verification
on:
  pull_request:
    paths:
      - "apps/continuance-house/**"
      - ".github/workflows/continuance-house-v001.yml"
  push:
    branches:
      - "build/continuance-house-v001-20261024"
    paths:
      - "apps/continuance-house/**"
      - ".github/workflows/continuance-house-v001.yml"
permissions:
  contents: read
jobs:
  verify:
    name: Verify private V001 app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/continuance-house
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify static files, security invariants and command routing
        run: npm run verify
      - name: Browser interaction and responsive screenshots
        run: node scripts/browser-smoke.mjs
      - name: Save V001 desktop and phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuance-house-v001-visual
          path: apps/continuance-house/artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
