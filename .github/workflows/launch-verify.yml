name: Launch Verify

on:
  push:
    branches:
      - "launch-*"
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: launch-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify runtime host contract
        run: npm run runtime:verify

      - name: Verify ownership backend contract
        shell: bash
        run: |
          OWNERSHIP_MIGRATION=supabase/migrations/20260916_reply_ownership_verification_v1.sql
          test -f "$OWNERSHIP_MIGRATION"
          grep -Fq 'create table public.publication_claim_codes' "$OWNERSHIP_MIGRATION"
          grep -Fq 'create table public.member_publication_claims' "$OWNERSHIP_MIGRATION"
          grep -Fq 'create or replace function public.redeem_publication_code' "$OWNERSHIP_MIGRATION"
          grep -Fq 'create or replace function public.issue_publication_claim_codes' "$OWNERSHIP_MIGRATION"
          grep -Fq 'revoke all on public.publication_claim_codes from anon, authenticated' "$OWNERSHIP_MIGRATION"
          grep -Fq 'grant select on public.member_publication_claims to authenticated' "$OWNERSHIP_MIGRATION"
          grep -Fq 'fetchPublicationClaims' src/memberClient.ts
          grep -Fq 'redeemPublicationCode' src/memberClient.ts
          grep -Fq 'rhenlink-ownership-verification' src/RhenlinkV2.tsx

      - name: Production build
        run: npm run build

      - name: Enforce launch asset budgets
        shell: bash
        run: |
          ENTRY_JS=$(grep -oE '/assets/[^" ]+\.js' dist/index.html | head -n 1 | sed 's#^/#dist/#')
          ENTRY_CSS=$(grep -oE '/assets/[^" ]+\.css' dist/index.html | head -n 1 | sed 's#^/#dist/#')

          test -f "$ENTRY_JS"
          test -f "$ENTRY_CSS"

          JS_BYTES=$(wc -c < "$ENTRY_JS")
          CSS_BYTES=$(wc -c < "$ENTRY_CSS")
          echo "Entry JS: ${JS_BYTES} bytes"
          echo "Entry CSS: ${CSS_BYTES} bytes"

          test "$JS_BYTES" -le 350000 || { echo "Entry JS exceeds 350 KB launch budget"; exit 1; }
          test "$CSS_BYTES" -le 185000 || { echo "Entry CSS exceeds 185 KB launch budget"; exit 1; }

      - name: Verify static route metadata
        shell: bash
        run: |
          test -f dist/__meta/stories.html
          test -f dist/__meta/stories-reply.html
          test -f dist/__meta/explore.html
          test -f dist/__meta/archive.html
          test -f dist/__meta/transmissions.html
          test -f dist/__meta/search.html
          test -f dist/__meta/the-book.html
          test -f dist/__meta/the-story.html
          test -f dist/__meta/store.html
          test -f dist/__meta/rhenlink.html
          test -f dist/__meta/about.html
          test -f dist/__meta/privacy.html
          test -f dist/__meta/terms.html
          test -f dist/__meta/contact.html

          grep -Fq '<title>REPLY — A Transcosmic Novel | ANEVUM</title>' dist/index.html
          grep -Fq '<title>Stories — ANEVUM</title>' dist/__meta/stories.html
          grep -Fq '<title>Explore the Universe — ANEVUM</title>' dist/__meta/explore.html
          grep -Fq '<title>REPLY — The Book | ANEVUM</title>' dist/__meta/the-book.html
          grep -Fq 'href="https://anevum.com/the-book"' dist/__meta/the-book.html
          grep -Fq 'content="noindex,follow,noarchive"' dist/__meta/rhenlink.html
          grep -Fq '<title>About ANEVUM — Stories First</title>' dist/__meta/about.html
          grep -Fq 'id="anevum-structured-data"' dist/index.html
          grep -Fq 'id="anevum-structured-data"' dist/__meta/the-book.html

      - name: Validate Cloudflare production bundle
        shell: bash
        run: |
          rm -rf .wrangler-dry-run
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run
          test -d .wrangler-dry-run

      - name: Smoke built public routes
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/anevum-vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done

          for route in / /stories /stories/reply /explore /archive /transmissions /search /the-book /the-story /store /rhenlink /about /privacy /terms /contact /wiki /lattice /command /route-that-does-not-exist; do
            echo "Checking ${route}"
            curl --fail --silent --show-error "http://127.0.0.1:4173${route}" > /dev/null
          done

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anevum-launch-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
