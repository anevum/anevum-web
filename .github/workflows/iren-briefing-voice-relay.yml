name: IREN Briefing 001 Narration Asset
on:
  push:
    branches: [media/iren-briefing-001-voice-relay-20261025-001]
    paths: ['.github/workflows/iren-briefing-voice-relay.yml']
permissions:
  contents: read
jobs:
  relay-approved-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve previously approved generated voice audio
        shell: bash
        env:
          IREN_VOICE_URL: 'https://resource2.heygen.ai/text_to_speech/e058f51b7f054c7e9f7f0a8cb4240c35/4845602c87bc4a3892908ec0c49f509c/id=32ad51f8-954d-4045-b289-cda7032dd86d.wav'
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request
          url=os.environ['IREN_VOICE_URL']
          request=urllib.request.Request(url,headers={'User-Agent':'ANEVUM-IREN-Production/1.0'})
          with urllib.request.urlopen(request,timeout=30) as response:
              data=response.read(25*1024*1024)
          print('Response length:', len(data), 'Content-Type:', response.headers.get('Content-Type'), 'First bytes:', repr(data[:50]))
          if len(data)<100000:
              raise SystemExit('Narration source did not return the expected WAV file')
          pathlib.Path('IREN_Briefing_001_Approved_Female_Narration.wav').write_bytes(data)
          print('Verified approved WAV bytes:',len(data))
          PY
      - name: Export to the isolated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IREN-briefing-001-female-narration
          path: IREN_Briefing_001_Approved_Female_Narration.wav
          retention-days: 7
          if-no-files-found: error
