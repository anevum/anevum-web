name: PARITY V136.025 Public Creator Directory Browser QA
on:
  pull_request:
    paths:
      - '.github/workflows/parity-v136025-creator-directory.yml'
      - 'creator-v1/web/src/pages/CreatorsPage.tsx'
      - 'creator-v1/web/src/parity/sitewide-interface-v136.css'
      - 'creator-v1/test/parity-v136025-creator-directory.test.mjs'
      - 'creator-v1/test/parity-v136025-directory-browser.mjs'
      - 'creator-v1/web/src/components/CompactMemberIdentity.tsx'
      - 'creator-v1/web/src/lib/api.ts'
permissions:
  contents: read
concurrency:
  group: parity-v136025-directory-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-directory:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'false'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public directory source and privacy contracts
        run: node --test creator-v1/test/parity-v136025-creator-directory.test.mjs
      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Typecheck and build actual V136 full-flag React UI
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install isolated Chromium acceptance tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Capture and verify 1440, 390 and 320px public directory
        run: node creator-v1/test/parity-v136025-directory-browser.mjs
      - name: Upload exact-head screenshots and acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v136025-directory-${{ github.event.pull_request.head.sha }}
          path: evidence/parity-v136/creator-directory-025/
          retention-days: 14
          if-no-files-found: warn
