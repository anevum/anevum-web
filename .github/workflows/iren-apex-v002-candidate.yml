name: IREN Apex V002 Unrouted Candidate

# Safe: no production/public routes, D1 mutations, secret copies or role grants.
on:
  push:
    branches: [integrate/iren-apex-staff-v002-20261017]
    paths: [.github/workflows/iren-apex-v002-candidate.yml]
permissions:
  contents: read
concurrency:
  group: anevum-iren-apex-v002-unrouted
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'anevum/anevum-web' && github.ref == 'refs/heads/integrate/iren-apex-staff-v002-20261017'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert isolated release scope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "2f7ee83107240152097efd956a4e8335"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('creator-v1/wrangler.iren-apex-staff.jsonc','utf8'));
          assert.equal(c.name,'anevum-iren-apex-staff-v002');
          assert.equal(c.main,'./staff-portal/worker.mjs');
          assert.deepEqual(c.routes,[]);
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.equal(c.vars.CANONICAL_STAFF_OPS_ENABLED,'false');
          assert.equal(c.vars.CANONICAL_FORUM_ENABLED,'true');
          assert.equal(c.services.length,1);
          assert.equal(c.services[0].binding,'APEX_AUTH');
          assert.equal(c.services[0].service,'anevum-apex-prelaunch-gateway');
          assert.deepEqual(c.d1_databases.map(x=>[x.binding,x.database_id]),[
            ['MEMBER_DB','e1d29049-c83b-4534-8355-dc1fa36ba6d8']]);
          assert.equal(c.assets.directory,'./dist/staff');
          assert.equal(c.assets.binding,'ASSETS');
          assert.equal(c.assets.run_worker_first,true);
          assert.equal(c.vars.ANEVUM_LAUNCH_APPROVED,undefined);
          assert.equal(c.vars.CANONICAL_PUBLIC_SIGNUP_ENABLED,undefined);
          assert.equal(c.r2_buckets,undefined);
          assert.equal(c.triggers,undefined);
          NODE
      - name: Build and verify staff Worker
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:creator-v1-web
          npm run build:iren-apex-staff
          node --check creator-v1/staff-portal/worker.mjs
          node --check creator-v1/canonical-auth/staff-ops.mjs
          (cd creator-v1 && npm run test:staff-command)
          test -s creator-v1/dist/staff/index.html
          grep -q '/staff/assets/' creator-v1/dist/staff/index.html
      - name: Pin existing public routes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.cloudflare.com/client/v4"
          curl --fail --silent --show-error --max-time 35 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/zones/8abe27259b5436af5966d3b40d9a3760/workers/routes" > "$RUNNER_TEMP/iren-routes-before.json"
          jq -e '.success and
            ([.result[]|select(.pattern=="anevum.com/*" and .script=="anevum-apex-prelaunch-gateway")]|length)==1 and
            ([.result[]|select(.pattern=="a.anevum.com/*" and .script=="anevum-a-community-retirement")]|length)==1 and
            ([.result[]|select(.pattern=="anevum.com/staff*" or .pattern=="anevum.com/api/v1/member/staff-ops*" or .pattern=="anevum.com/api/v1/member/forum-review*")]|length)==0
           ' "$RUNNER_TEMP/iren-routes-before.json" >/dev/null
      - name: Deploy only unrouted candidate Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config creator-v1/wrangler.iren-apex-staff.jsonc --keep-vars
      - name: Prove bindings and no route mutation
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          curl --fail --silent --show-error --max-time 35 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-iren-apex-staff-v002/settings" > "$RUNNER_TEMP/iren-worker-settings.json"
          jq -e '.success and
            ([.result.bindings[]|select(.name=="MEMBER_DB" and .type=="d1")]|length)==1 and
            ([.result.bindings[]|select(.name=="APEX_AUTH" and .type=="service")]|length)==1 and
            ([.result.bindings[]|select(.name=="ASSETS" and .type=="assets")]|length)==1 and
            ([.result.bindings[]|select(.name=="CANONICAL_STAFF_OPS_ENABLED" and .type=="plain_text" and .text=="false")]|length)==1
           ' "$RUNNER_TEMP/iren-worker-settings.json" >/dev/null
          curl --fail --silent --show-error --max-time 35 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/zones/8abe27259b5436af5966d3b40d9a3760/workers/routes" > "$RUNNER_TEMP/iren-routes-after.json"
          jq -S '[.result[]|{pattern,script}]|sort_by(.pattern)' "$RUNNER_TEMP/iren-routes-before.json" > "$RUNNER_TEMP/iren-routes.before.sorted"
          jq -S '[.result[]|{pattern,script}]|sort_by(.pattern)' "$RUNNER_TEMP/iren-routes-after.json" > "$RUNNER_TEMP/iren-routes.after.sorted"
          diff -u "$RUNNER_TEMP/iren-routes.before.sorted" "$RUNNER_TEMP/iren-routes.after.sorted"
          echo IREN_UNROUTED_CANDIDATE=PASS
          echo "Only independent Staff Worker uploaded; existing public site/routes untouched." >> "$GITHUB_STEP_SUMMARY"
