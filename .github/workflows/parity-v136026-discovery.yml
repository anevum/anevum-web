name: PARITY V136.026 Public Discover Browser QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/lib/navigation.ts'
      - 'creator-v1/web/src/pages/ProjectPage.tsx'
      - 'creator-v1/web/src/components/ProjectPlayerShell.tsx'
      - 'creator-v1/web/src/parity/concept-convergence-v136017.css'
      - '.github/workflows/parity-v136026-discovery.yml'
      - 'creator-v1/web/src/pages/DiscoverPage.tsx'
      - 'creator-v1/web/src/parity/ParityDiscoverV136.tsx'
      - 'creator-v1/web/src/parity/parity-discover-v136.css'
      - 'creator-v1/test/parity-v136026-discovery.test.mjs'
      - 'creator-v1/test/parity-v136026-discovery-browser.mjs'
permissions:
  contents: read
concurrency:
  group: parity-v136026-discover-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-discovery:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'false'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
      ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require reviewed exact-source head
        run: test "$(git rev-parse HEAD)" = "$ANEVUM_SOURCE_SHA"
      - name: Check source, URL and approved-data contracts
        run: node --test creator-v1/test/parity-v136026-discovery.test.mjs
      - name: Install project dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Typecheck and build full-flag React
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install isolated Chromium acceptance tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test compiled Discover and capture 1440, 390 and 320px
        run: node creator-v1/test/parity-v136026-discovery-browser.mjs
      - name: Preserve exact-head browser screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v136026-discovery-${{ github.event.pull_request.head.sha }}
          path: evidence/parity-v136/discovery-026/
          retention-days: 14
          if-no-files-found: warn
