name: ANEVUM V095/V096 Upload Inactive Candidate Only
# One-time owner marker on the reviewed release branch triggers an upload
# with zero traffic. No active deployment or route changes are authorized.
on:
  push:
    branches: [release/v084-continuance-approved-20261019]
    paths:
      - .github/release-approvals/v095-v096-inactive-upload.json
permissions:
  contents: read
concurrency:
  group: anevum-v095-v096-inactive-version-upload
  cancel-in-progress: false
jobs:
  upload-only:
    env:
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: 'false'
    if: >-
      github.repository == 'anevum/anevum-web' &&
      github.ref == 'refs/heads/release/v084-continuance-approved-20261019' &&
      github.actor == 'anevum' &&
      github.event.head_commit.message == 'release(v095-v096): upload inactive candidate only'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact owner-only authorization marker, source pin and no application edits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'anevum/anevum-web'
          test "$GITHUB_ACTOR" = 'anevum'
          test "$GITHUB_REF" = 'refs/heads/release/v084-continuance-approved-20261019'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git show -s --format=%s HEAD)" = 'release(v095-v096): upload inactive candidate only'
          marker='.github/release-approvals/v095-v096-inactive-upload.json'
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = "$marker"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('.github/release-approvals/v095-v096-inactive-upload.json','utf8'));
          assert.deepEqual(a,{
            source_sha:'d5af32fd8f04b05e0381f7ac12c59d06c0e836a2',
            release_branch:'release/v084-continuance-approved-20261019',
            worker:'anevum-apex-prelaunch-gateway',
            allow_inactive_version_upload:true,
            allow_route_changes:false,
            allow_traffic_promotion:false,
            allow_preview_urls:false,
            confirmed_by:'anevum'
          });
          JS
          echo 'EXACT_OWNER_MARKER=PASS; NO_PRODUCTION_DEPLOYMENT_AUTHORIZED' >> "$GITHUB_STEP_SUMMARY"
      - name: Reproduce approved candidate source and security tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --check creator-v1/ops/v095-v096-cloudflare-ops.mjs
          node --test creator-v1/test/v095-inactive-candidate-gate.test.mjs
          npm run check:creator-v1-web
          VITE_NATIVE_CREATOR_STUDIO_V095=false npm run build:creator-v1-web
          test -s creator-v1/dist/web/index.html
          test -z "$(find creator-v1/dist/web -name '*.map' -print -quit)"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const app=readFileSync('creator-v1/web/src/App.tsx','utf8');
          const guest=readFileSync('creator-v1/web/src/pages/PublicCreatorAlphaPage.tsx','utf8');
          assert.match(app,/path="studio\/alpha"/);
          assert.match(guest,/sandbox=""/);
          assert.doesNotMatch(guest,/sandbox="[^"]*allow-scripts/);
          JS
      - name: Rebuild and require all preserved earned media before packaging
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri
          (
            cd design/evolution-v059
            mkdir -p artwork/{native,textures,vector,masters,web,compact} docs dist previews
            python src/export_native.py
            python src/render_web.py
            python src/build.py
          )
          python creator-v1/ops/install-evolution-v060.py
          VITE_NATIVE_CREATOR_STUDIO_V095=false npm run build:creator-v1-web
          node --input-type=module <<'JS'
          import {verifyCandidateAssets} from './creator-v1/ops/v095-inactive-candidate-gate.mjs';
          const build=verifyCandidateAssets('creator-v1/dist/web');
          console.log('COMPLETE_CANDIDATE_ASSETS',JSON.stringify({files:build.assets.length,sha256:build.sha256,earned:build.earned_media_count}));
          JS
      - name: Lock live Cloudflare versions, secrets, D1 IDs and all 39 routes before upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          umask 077
          mkdir -p "$RUNNER_TEMP/v095-v096-inactive"
          node creator-v1/ops/v095-v096-cloudflare-ops.mjs before \
            "$RUNNER_TEMP/v095-v096-inactive/before.json" \
            "$RUNNER_TEMP/v095-v096-inactive/wrangler.upload.json"
      - name: Upload exactly one inactive Worker version with current public vars and preserved secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/v095-v096-inactive/before.json"
          test -s "$RUNNER_TEMP/v095-v096-inactive/wrangler.upload.json"
          # Never use 'wrangler deploy'; that would send an unaccepted version to 100%.
          npx wrangler versions upload \
            --config "$RUNNER_TEMP/v095-v096-inactive/wrangler.upload.json" \
            --keep-vars \
            --strict \
            --message "ANEVUM V095/V096 inactive only, merged source d5af32fd; no traffic promotion"
      - name: Fail closed unless Cloudflare confirms 100% previous release and 0% new candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node creator-v1/ops/v095-v096-cloudflare-ops.mjs after \
            "$RUNNER_TEMP/v095-v096-inactive/before.json" \
            "$RUNNER_TEMP/v095-v096-inactive/inactive-receipt.json"
          echo 'V095_V096_IMMUTABLE_CANDIDATE=UPLOADED_0_PERCENT_TRAFFIC' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DEPLOYMENT=UNMODIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'AUTHENTICATED_AND_PHYSICAL_DEVICE_ACCEPTANCE=OUTSTANDING' >> "$GITHUB_STEP_SUMMARY"
      - name: Store sanitized immutable candidate receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v095-v096-inactive-upload-${{ github.sha }}
          path: ${{ runner.temp }}/v095-v096-inactive/inactive-receipt.json
          retention-days: 14
          if-no-files-found: ignore
