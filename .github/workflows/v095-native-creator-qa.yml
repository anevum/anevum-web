name: ANEVUM V095 Native Creator Integration QA
on:
  push:
    branches: [build/v095-native-creator-integration-20261020-001]
  pull_request:
    paths:
      - creator-v1/web/**
      - creator-v1/test/*v095*
      - site/alpha/v003/**
      - tests/native-creator-*.mjs
      - .github/workflows/v095-native-creator-qa.yml
permissions:
  contents: read
concurrency:
  group: anevum-v095-native-creator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-integration:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing lifecycle, exact-release decisions, privacy and native presentation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-v095-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/native-v095-evidence/source-sha.txt"
          node --check creator-v1/test/capture-native-creator-v095.mjs
          node --test tests/native-creator-v095.test.mjs tests/native-creator-client-v095.test.mjs tests/alpha-package-v003.test.mjs tests/alpha-package-v009-bridge.test.mjs tests/alpha-package-v009-owner.test.mjs tests/alpha-package-v009-live-owner.test.mjs tests/alpha-package-v010-migration.test.mjs | tee "$RUNNER_TEMP/native-v095-evidence/tests.log"
      - name: Install existing frontend toolchain
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and verify the retained default-OFF interface
        shell: bash
        run: |
          set -euo pipefail
          npm run check:creator-v1-web
          VITE_NATIVE_CREATOR_STUDIO_V095=false npm run build:creator-v1-web
          VITE_NATIVE_CREATOR_STUDIO_V095=false npm run build:creator-v1-web:staging
          cp -R creator-v1/dist/react-staging "$RUNNER_TEMP/native-v095-evidence/compiled-disabled"
          node creator-v1/test/portal-offline-preview.mjs > "$RUNNER_TEMP/native-v095-evidence/disabled-fixture.log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-native-creator-v095.mjs --chrome "$chrome" --output "$RUNNER_TEMP/native-v095-evidence/disabled" --disabled
      - name: Build the same React application with the native Studio enabled in loopback only
        shell: bash
        run: |
          set -euo pipefail
          VITE_NATIVE_CREATOR_STUDIO_V095=true VITE_PACKAGE_CREATOR_GALLERY_V010=true npm run build:creator-v1-web
          VITE_NATIVE_CREATOR_STUDIO_V095=true VITE_PACKAGE_CREATOR_GALLERY_V010=true npm run build:creator-v1-web:staging
          cp -R creator-v1/dist/react-staging "$RUNNER_TEMP/native-v095-evidence/compiled"
          node creator-v1/test/portal-offline-preview.mjs > "$RUNNER_TEMP/native-v095-evidence/native-fixture.log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-native-creator-v095.mjs --chrome "$chrome" --output "$RUNNER_TEMP/native-v095-evidence/enabled"
          node --input-type=module - "$RUNNER_TEMP/native-v095-evidence" <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {join} from 'node:path';
          const expected=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.match(expected,/^[a-f0-9]{40}$/);
          assert.equal(readFileSync(join(process.argv[2],'source-sha.txt'),'utf8').trim(),expected);
          for(const [mode,count] of [['disabled',6],['enabled',24]]){
            const r=JSON.parse(readFileSync(join(process.argv[2],mode,'acceptance.json'),'utf8'));
            assert.equal(r.source,expected,'Browser evidence must identify the checked-out commit');
            assert.equal(r.status,'PASS');
            assert.equal(r.syntheticOnly,true);
            assert.equal(r.physicalDeviceAcceptance,false);
            assert.equal(r.disabled,mode==='disabled');
            assert.equal(r.cases.length,count);
            assert.ok(r.cases.every(item=>item.passed===true));
          }
          JS
          echo 'V095_NATIVE_STUDIO=COMPILED_REACT_SYNTHETIC_QA_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DEPLOY=NONE; AUTHENTICATED_LIVE_ACCEPTANCE=NOT_INFERRED' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify release source strictly for the V095 candidate, never imply approval of later frontend changes
        shell: bash
        env:
          QA_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$QA_SOURCE_BRANCH" = "build/v095-native-creator-integration-20261020-001" ]; then
            # The already-reviewed V095 candidate must keep its exact scope.
            node creator-v1/ops/v091-release-acceptance.mjs --source-only
            echo 'V095_PINNED_SOURCE_SCOPE=PASS; NOT_A_PRODUCTION_DEPLOY' >> "$GITHUB_STEP_SUMMARY"
          else
            # New PRs can verify unchanged V095 functionality without falsely
            # attesting to the old candidate's exact application source.
            # The guarded production workflow still invokes the *full*
            # authenticated release gate, unchanged and fail-closed.
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const evidence=JSON.parse(readFileSync('.github/release-evidence/v091-authenticated.json','utf8'));
          const production=readFileSync('.github/workflows/v084-continuance-production.yml','utf8');
          const client=readFileSync('creator-v1/web/src/lib/native-creator-v095.ts','utf8');
          assert.equal(evidence.native_candidate_pending,true);
          assert.equal(evidence.verified_at,null);
          for(const key of ['founder_staff_session','reviewer_staff_session','creator_journey','cross_account_identity'])
            assert.equal(evidence[key],false,key+' must not be inferred from synthetic QA');
          assert.match(client,/VITE_NATIVE_CREATOR_STUDIO_V095==='true'/);
          assert.ok(production.split(/\r?\n/).some(line=>line.trim()==='node creator-v1/ops/v091-release-acceptance.mjs'));
          assert.ok(!production.split(/\r?\n/).some(line=>line.includes('v091-release-acceptance.mjs --source-only')));
          JS
            echo 'V095_FUNCTIONAL_QA_ONLY=PASS; NON_V095_SOURCE_IS_NOT_AN_APPROVED_RELEASE' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve exact-source screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v095-native-creator-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/native-v095-evidence/
          retention-days: 7
          if-no-files-found: error
