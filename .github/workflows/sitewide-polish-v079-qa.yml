name: ANEVUM V079 Sitewide Polish Candidate QA
# Review only. No provider credentials, deployments, migrations or production writes.
on:
  push:
    branches: [update/v079-sitewide-polish-qa-20261018]
permissions:
  contents: read
concurrency:
  group: anevum-v079-sitewide-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript and production build
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
      - name: Navigation, auth, member privacy, rewards and moderation regressions
        run: |
          node --experimental-strip-types --test \
            creator-v1/test/sitewide-polish-v079.test.mjs \
            creator-v1/test/home-navigation-v079.test.mjs \
            creator-v1/test/v079-reconciled-null-creator.test.mjs \
            creator-v1/test/null-creator-alpha-release.test.mjs \
            creator-v1/test/catalogue-state.test.mjs \
            creator-v1/test/portal-launcher.test.mjs \
            creator-v1/test/player-card-premium-v078.test.mjs \
            creator-v1/test/player-card-recognition-v065.test.mjs \
            creator-v1/test/earned-reward-media-v075.test.mjs \
            creator-v1/test/level-artwork-preservation-v074.test.mjs \
            creator-v1/test/canonical-project-saves-v007.test.mjs \
            creator-v1/test/canonical-forums-v041.test.mjs \
            creator-v1/test/canonical-studio-v043.test.mjs \
            creator-v1/test/canonical-real-session-v019.test.mjs \
            creator-v1/test/progression-v031.test.mjs
      - name: Before and after browser evidence at 320, 390, 768 and 1440 pixels
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          mkdir -p "$RUNNER_TEMP/v079-polish-evidence"
          baseline="$RUNNER_TEMP/anevum-v079-baseline"
          git worktree add --detach "$baseline" cce65fad033f34d97181d44c3d999e2039fc34b0
          ln -s "$GITHUB_WORKSPACE/node_modules" "$baseline/node_modules"
          (cd "$baseline" && npm run build:creator-v1-web:staging)
          for phase in before after; do
            checkout="$GITHUB_WORKSPACE"
            if [ "$phase" = before ]; then checkout="$baseline"; fi
            ANEVUM_UNLINKED_ALPHA_VISUAL_TEST=1 node "$checkout/creator-v1/test/portal-offline-preview.mjs" > "$RUNNER_TEMP/v079-polish-evidence/$phase-fixture.log" 2>&1 &
            fixture_pid=$!
            trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
            for attempt in $(seq 1 80); do
              if curl -fsS http://127.0.0.1:4178/__ready > /dev/null; then break; fi
              sleep 0.25
            done
            curl -fsS http://127.0.0.1:4178/__ready
            node creator-v1/test/capture-sitewide-polish-v079.mjs "$chrome" http://127.0.0.1:4178 "$RUNNER_TEMP/v079-polish-evidence/$phase" "$phase"
            kill "$fixture_pid"
            wait "$fixture_pid" || true
            trap - EXIT
          done
      - name: Preserve actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v079-sitewide-before-after
          path: ${{ runner.temp }}/v079-polish-evidence/
          retention-days: 14
          if-no-files-found: warn
