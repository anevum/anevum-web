name: PARITY V136.027 Public Commons Browser QA
on:
  pull_request:
    paths:
      - '.github/workflows/parity-v136027-commons.yml'
      - 'creator-v1/web/src/pages/CommunityPage.tsx'
      - 'creator-v1/web/src/pages/community-hub-v007.css'
      - 'creator-v1/test/community-hub-v007.test.mjs'
      - 'creator-v1/test/parity-v136-concept-convergence.test.mjs'
      - 'creator-v1/test/parity-v136027-commons.test.mjs'
      - 'creator-v1/test/parity-v136027-commons-browser.mjs'
permissions:
  contents: read
concurrency:
  group: parity-v136027-commons-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-commons:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'false'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
      ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact reviewed source
        run: test "$(git rev-parse HEAD)" = "$ANEVUM_SOURCE_SHA"
      - name: Guard public URLs, identity and moderation boundaries
        run: node --test creator-v1/test/parity-v136027-commons.test.mjs
      - name: Install pinned project dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Typecheck and build full-flag React
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install isolated Chromium acceptance tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test compiled Commons at 1440, 390 and 320px
        run: node creator-v1/test/parity-v136027-commons-browser.mjs
      - name: Preserve exact-head screenshots and public-only acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v136027-commons-${{ github.event.pull_request.head.sha }}
          path: evidence/parity-v136/commons-027/
          retention-days: 14
          if-no-files-found: warn
