# V127: V125 exact-artifact versions-upload command rehearsal. OFFLINE ONLY.
# This workflow never receives provider credentials or writes to Cloudflare.
name: ANEVUM V127 V125 Inactive Upload Dry-Run
on:
  pull_request:
    paths:
      - '.github/workflows/v127-v125-inactive-upload-dryrun.yml'
      - 'creator-v1/ops/v127-v125-inactive-preflight.mjs'
      - 'creator-v1/test/v127-v125-inactive-preflight.test.mjs'
      - 'docs/production/v127-v125-inactive-upload-preflight-20261023.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: anevum-v127-v125-upload-rehearsal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock V126 source, upstream artifact SHA and all five green checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_API_KEY"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          node creator-v1/ops/v127-v125-inactive-preflight.mjs guard
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {PINS} from './creator-v1/ops/v127-v125-inactive-preflight.mjs';
          const base='https://api.github.com/repos/'+PINS.repository;
          async function get(path){
            const r=await fetch(base+path,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
            assert.equal(r.ok,true,'Missing GitHub source evidence '+path+'/'+r.status);
            return r.json();
          }
          const artifact=await get('/actions/artifacts/'+PINS.sourceArtifact);
          const run=await get('/actions/runs/'+PINS.sourceRun);
          assert.equal(artifact.expired,false);
          assert.equal(artifact.digest,'sha256:'+PINS.archiveSha256);
          assert.equal(artifact.workflow_run.head_sha,PINS.v126);
          assert.equal(run.head_sha,PINS.v126);
          assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');
          const reviewed=[39997196627,39997196653,39997196707,39997196530,39997196812];
          for(const id of reviewed){
            const r=await get('/actions/runs/'+id);
            assert.equal(r.head_sha,PINS.v126);
            assert.equal(r.status,'completed');assert.equal(r.conclusion,'success');
          }
          console.log(JSON.stringify({v125:PINS.v125,source:PINS.v126,artifact:PINS.sourceArtifact,allFiveChecksPassed:true,providerWrites:false}));
          JS
      - name: Install reviewed local Wrangler without lifecycle scripts
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Download the exact sealed V126 artifact, not a rebuilt approximation
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12521290324'
          run-id: 39997196812
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v127-input
          merge-multiple: true
      - name: Prove offline artifacts, drift checks and failing-closed cases
        run: |
          set -euo pipefail
          node --check creator-v1/ops/v127-v125-inactive-preflight.mjs
          V127_PACKAGE_DIR="$RUNNER_TEMP/v127-input/v126-package" node --test creator-v1/test/v127-v125-inactive-preflight.test.mjs
      - name: Rehearse exact immutable upload syntax with no API credentials
        run: |
          set -euo pipefail
          node creator-v1/ops/v127-v125-inactive-preflight.mjs dryrun-config "$RUNNER_TEMP/v127-input/v126-package" "$RUNNER_TEMP/v127-only-upload-config.json"
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_API_KEY"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler versions upload --dry-run --no-bundle --no-upload-source-maps --config "$RUNNER_TEMP/v127-only-upload-config.json"
          rm "$RUNNER_TEMP/v127-only-upload-config.json"
          test ! -e "$RUNNER_TEMP/v127-only-upload-config.json"
          node creator-v1/ops/v127-v125-inactive-preflight.mjs receipt "$RUNNER_TEMP/v127-input/v126-package" "$RUNNER_TEMP/v127-local-receipt.json"
          echo 'V127_V125_UPLOAD_COMMAND_DRYRUN=PASS; CLOUDFLARE_TOKEN=NONE; PROVIDER_WRITES=NONE; VERSION_UPLOADED=NONE' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: anevum-v127-inactive-upload-rehearsal-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/v127-local-receipt.json
          retention-days: 14
          if-no-files-found: error
# A separate explicitly owner-approved job with a fresh provider GET and
# immutable artifact version receipt must be designed before an actual upload.
