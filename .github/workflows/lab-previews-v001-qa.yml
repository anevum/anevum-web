name: ANEVUM Private Lab Preview Console V001
on:
  push:
    branches: [build/lab-private-preview-console-v001-20261019]
  pull_request:
    paths:
      - 'lab/previews/**'
      - '.github/workflows/lab-previews-v001-qa.yml'
permissions:
  contents: read
concurrency:
  group: private-lab-previews-v001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated preview Worker
        run: |
          node --check lab/previews/worker.mjs
          node --check lab/previews/worker.test.mjs
          node --test lab/previews/worker.test.mjs
      - name: Run real Chromium visual and interaction checks at 320px / 390px / 1440px
        run: node lab/previews/browser-qa.mjs
      - name: Preserve screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-lab-previews-v001-${{ github.run_id }}
          path: test-artifacts/lab-previews/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Verify exact source identity
        run: git rev-parse HEAD
