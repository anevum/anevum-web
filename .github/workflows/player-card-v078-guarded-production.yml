name: ANEVUM V078 Premium Player Card / Guarded Apex Release
# Explicit one-shot release for source reconciled with the deployed homepage recovery.
# Fail closed on version/route/binding drift; restore the EXACT old Worker version.
on:
  push:
    branches: [release/player-cards-v078-reconciled-20261018]
    paths: [.github/workflows/player-card-v078-guarded-production.yml]
permissions:
  contents: read
concurrency:
  group: anevum-apex-original-evolution-v076-live
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CF_ACCOUNT: "2f7ee83107240152097efd956a4e8335"
      CF_ZONE: "8abe27259b5436af5966d3b40d9a3760"
      CF_WORKER: "anevum-apex-prelaunch-gateway"
      EXPECTED_LIVE_VERSION: "a5277bda-9389-4d28-8de5-25f67afbe04a"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Exact review source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchains
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict repository, Cloudflare identity and recovery-source check
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/player-cards-v078-reconciled-20261018"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$CF_ACCOUNT"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -f creator-v1/web/src/lib/public-creator-handle.ts
          grep -Fq 'public-creator-handle' creator-v1/web/src/components/CommunityHomeFeed.tsx
          grep -Fq 'av78-player-card' creator-v1/web/src/components/CompactMemberIdentity.tsx
          test -f creator-v1/canonical-auth/evolution-card-plates.json
          test -f creator-v1/canonical-auth/evolution-card-art.mjs
          test -f design/evolution-v059/src/export_native.py
          git merge-base --is-ancestor dbfb029ad4a2fa0ac1493e97d65191a9f3146b3c "$GITHUB_SHA"
          git merge-base --is-ancestor ef16717b977fec510ec4651b156103f10fb47e02 "$GITHUB_SHA"
      - name: Read-only live version, bindings, routes and privacy baseline
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/v078-release-evidence"
          hdr="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          cf(){ curl --fail --silent --show-error --retry 2 --max-time 35 -H "$hdr" "$1"; }
          cf "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/deployments?per_page=1" > "$RUNNER_TEMP/v078-release-evidence/deploy.before.json"
          jq -er '.result.deployments[0].versions|map(select(.percentage==100))|.[0].version_id' "$RUNNER_TEMP/v078-release-evidence/deploy.before.json" > "$RUNNER_TEMP/v078-release-evidence/version.before"
          old="$(cat "$RUNNER_TEMP/v078-release-evidence/version.before")"
          if [ "$old" != "$EXPECTED_LIVE_VERSION" ]; then
            echo "::error::Production changed; refusing V078 release. No Cloudflare writes."
            exit 1
          fi
          cf "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/settings" > "$RUNNER_TEMP/v078-release-evidence/settings.before.json"
          jq -e '.success and ([.result.bindings[]]|length)==24 and
             ([.result.bindings[]|select(.type=="d1" and .name=="MEMBER_DB" and ((.id//.database_id)=="e1d29049-c83b-4534-8355-dc1fa36ba6d8"))]|length)==1 and
             ([.result.bindings[]|select(.type=="d1" and .name=="COMMUNITY_DB" and ((.id//.database_id)=="fa96e36d-6257-4883-bf15-074947e11a13"))]|length)==1 and
             ([.result.bindings[]|select(.type=="assets" and .name=="ASSETS")]|length)==1 and
             ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_RESEND_API_KEY")]|length)==1 and
             ([.result.bindings[]|select(.type=="secret_text" and .name=="CANONICAL_BETTER_AUTH_SECRET")]|length)==1 and
             ([.result.bindings[]|select(.type=="plain_text" and .name=="ANEVUM_PRELAUNCH_MODE" and .text=="public")]|length)==1 and
             ([.result.bindings[]|select(.type=="plain_text" and .name=="ANEVUM_LAUNCH_APPROVED" and .text=="true")]|length)==1 and
             ([.result.bindings[]|select(.type=="plain_text" and .name=="CANONICAL_RECOGNITION_ENABLED" and .text=="true")]|length)==1' "$RUNNER_TEMP/v078-release-evidence/settings.before.json" >/dev/null
          jq -S '[.result.bindings[]|{name,type,id:(.id//.database_id//null),text:(if .type=="plain_text" then .text else null end)}]|sort_by(.name)' "$RUNNER_TEMP/v078-release-evidence/settings.before.json" > "$RUNNER_TEMP/v078-release-evidence/bindings.before.json"
          cf "$api/zones/$CF_ZONE/workers/routes" > "$RUNNER_TEMP/v078-release-evidence/routes.before.json"
          jq -e '.success and
            ([.result[]|select(.pattern=="anevum.com/*" and .script=="anevum-native-frame-policy-v001")]|length)==1 and
            ([.result[]|select(.pattern=="anevum.com/assets/index-*" and .script=="anevum-native-project-player-v005")]|length)==1 and
            ([.result[]|select(.pattern=="anevum.com/play/*" and .script=="anevum-unified-creation-routes-v002")]|length)==1 and
            ([.result[]|select(.pattern=="anevum.com/upload*" and .script=="anevum-unified-creation-routes-v002")]|length)==1 and
            ([.result[]|select(.pattern=="anevum.com/staff*" and .script=="anevum-staff-review-navigation-v001")]|length)==1' "$RUNNER_TEMP/v078-release-evidence/routes.before.json" >/dev/null
          jq -S '[.result[]|{pattern,script}]|sort_by(.pattern)' "$RUNNER_TEMP/v078-release-evidence/routes.before.json" > "$RUNNER_TEMP/v078-release-evidence/routes.snapshot.json"
          echo "$EXPECTED_LIVE_VERSION" > "$RUNNER_TEMP/v078-release-evidence/rollback-version.txt"
          for path in /api/v1/member/auth-methods /api/v1/members/devon/rewards/levels/4/icon /api/v1/members/devon/rewards/levels/30/poster; do
            status="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "https://anevum.com$path")"
            test "$status" = 200 -o "$status" = 404 || { echo "Unexpected baseline route: $path HTTP $status"; exit 1; }
            echo "$path $status" >> "$RUNNER_TEMP/v078-release-evidence/media.before.txt"
          done
          echo 'V078_PREFLIGHT_LIVE_V25_ROUTES_AND_24_BINDINGS=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore original 30 premium native Evolution assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri
          (
            cd design/evolution-v059
            mkdir -p artwork/{native,textures,vector,masters,web,compact} docs dist previews
            python src/export_native.py
            python src/render_web.py
            python src/build.py
          )
          python creator-v1/ops/install-evolution-v060.py
          test "$(find creator-v1/web/public/evolution/assets -maxdepth 1 -type f | wc -l)" -eq 152
          test -s creator-v1/web/public/evolution/assets/level-04-scene.gz
          test -s creator-v1/web/public/evolution/assets/level-30-scene.gz
          test -s creator-v1/web/public/evolution/mini-runtime.json
          echo 'V078_NATIVE_30_LEVEL_3D_ASSETS_PRESERVED=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Full production build, static artwork, homeowner-incident and permission tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
          node --experimental-strip-types --test creator-v1/test/null-creator-alpha-release.test.mjs
          node --test \
            creator-v1/test/player-card-premium-v078.test.mjs \
            creator-v1/test/evolution-card-illustrations-v077.test.mjs \
            creator-v1/test/earned-reward-media-v075.test.mjs \
            creator-v1/test/player-card-recognition-v065.test.mjs \
            creator-v1/test/level-artwork-preservation-v074.test.mjs \
            creator-v1/test/apex-prelaunch-gateway.test.mjs \
            creator-v1/test/progression-v031.test.mjs \
            creator-v1/test/canonical-otp-resend-v023.test.mjs
          test "$(find creator-v1/dist/web/evolution/assets -maxdepth 1 -type f | wc -l)" -eq 152
          test -s creator-v1/dist/web/evolution/assets/level-30-scene.gz
          test -s creator-v1/dist/web/index.html
          ! grep -rl 'evolution-card-plates' creator-v1/dist/web/assets --include='*.js' >/dev/null
      - name: Production-built desktop and mobile member UX checks before deploy
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          mkdir -p "$RUNNER_TEMP/v078-release-evidence/browser"
          node creator-v1/test/player-card-v078-live-react-browser.mjs "$chrome" "$RUNNER_TEMP/v078-release-evidence/browser"
          test -s "$RUNNER_TEMP/v078-release-evidence/browser/v078-live-react-desktop.png"
          test -s "$RUNNER_TEMP/v078-release-evidence/browser/v078-live-react-mobile.png"
          ANEVUM_UNLINKED_ALPHA_VISUAL_TEST=1 node creator-v1/test/portal-offline-preview.mjs > "$RUNNER_TEMP/v078-release-evidence/fixture.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS --max-time 3 http://127.0.0.1:4178/__ready > /dev/null 2>&1; then break; fi
            sleep .25
          done
          curl -fsS --max-time 5 http://127.0.0.1:4178/__ready >/dev/null
          mkdir -p "$RUNNER_TEMP/v078-chrome-incident"
          timeout 55 "$chrome" --headless=new --no-sandbox --no-first-run --user-data-dir="$RUNNER_TEMP/v078-chrome-incident" --disable-dev-shm-usage --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4178/creator/ > "$RUNNER_TEMP/v078-release-evidence/unlinked.html" 2> "$RUNNER_TEMP/v078-release-evidence/unlinked-errors.log"
          grep -Fq 'UNLINKED ALPHA RELEASE' "$RUNNER_TEMP/v078-release-evidence/unlinked.html"
          grep -Fq 'Public creator channel not linked.' "$RUNNER_TEMP/v078-release-evidence/unlinked.html"
          ! grep -Fq '/creators/null' "$RUNNER_TEMP/v078-release-evidence/unlinked.html"
          echo 'V078_PRODUCTION_BUILD_BROWSER_AND_HOMEPAGE_INCIDENT=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Guarded Cloudflare release, smoke and exact version rollback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          hdr="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          root="$RUNNER_TEMP/v078-release-evidence"
          deployed=0
          accepted=0
          rollback() {
            if [ "$deployed" != 1 ] || [ "$accepted" = 1 ]; then return; fi
            echo "::error::V078 verification failed; restoring EXACT production version $EXPECTED_LIVE_VERSION."
            printf '{"strategy":"percentage","versions":[{"version_id":"%s","percentage":100}],"annotations":{"workers/message":"V078 guarded rollback on failed smoke"}}' "$EXPECTED_LIVE_VERSION" > "$root/revert.json"
            curl -fsS --max-time 35 -X POST -H "$hdr" -H 'Content-Type: application/json' --data-binary @"$root/revert.json" "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/deployments" > "$root/revert-result.json" || echo "::error::Automatic rollback request failed; manually restore recorded version!"
          }
          trap rollback EXIT
          cf(){ curl -fsS --retry 2 --max-time 35 -H "$hdr" "$1"; }
          cf "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/deployments?per_page=1" > "$root/deploy.recheck.json"
          test "$(jq -er '.result.deployments[0].versions[]|select(.percentage==100)|.version_id' "$root/deploy.recheck.json")" = "$EXPECTED_LIVE_VERSION" || { echo "::error::Worker changed since preflight"; exit 1; }
          cf "$api/zones/$CF_ZONE/workers/routes" > "$root/routes.recheck.json"
          jq -S '[.result[]|{pattern,script}]|sort_by(.pattern)' "$root/routes.recheck.json" > "$root/routes.recheck.snapshot.json"
          cmp -s "$root/routes.snapshot.json" "$root/routes.recheck.snapshot.json" || { echo "::error::Live routes changed since preflight"; exit 1; }
          cf "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/settings" > "$root/settings.recheck.json"
          jq -S '[.result.bindings[]|{name,type,id:(.id//.database_id//null),text:(if .type=="plain_text" then .text else null end)}]|sort_by(.name)' "$root/settings.recheck.json" > "$root/bindings.recheck.json"
          cmp -s "$root/bindings.before.json" "$root/bindings.recheck.json" || { echo "::error::Bindings drifted since preflight"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cfg=JSON.parse(fs.readFileSync('creator-v1/wrangler.apex-prelaunch.jsonc','utf8'));
          const snapshot=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/v078-release-evidence/settings.recheck.json','utf8'));
          if(cfg.name!=='anevum-apex-prelaunch-gateway'||cfg.routes.length!==0||
             cfg.workers_dev!==false||cfg.assets?.binding!=='ASSETS'||
             cfg.assets?.run_worker_first!==true||cfg.d1_databases?.length!==2)
            throw Error('Unsafe V078 Worker deployment config');
          cfg.vars=Object.fromEntries(snapshot.result.bindings.filter(x=>x.type==='plain_text').map(x=>[x.name,x.text]));
          if(cfg.vars.ANEVUM_PRELAUNCH_MODE!=='public'||cfg.vars.ANEVUM_LAUNCH_APPROVED!=='true'||
             cfg.vars.ANEVUM_CANONICAL_APEX_ENABLED!=='true'||cfg.vars.CANONICAL_RECOGNITION_ENABLED!=='true')
            throw Error('Live flags do not match permitted release');
          fs.writeFileSync('creator-v1/wrangler.v078.reconciled.generated.jsonc',JSON.stringify(cfg,null,2));
          NODE
          deployed=1
          npx wrangler deploy --config creator-v1/wrangler.v078.reconciled.generated.jsonc --keep-vars
          cf "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/settings" > "$root/settings.after.json"
          jq -S '[.result.bindings[]|{name,type,id:(.id//.database_id//null),text:(if .type=="plain_text" then .text else null end)}]|sort_by(.name)' "$root/settings.after.json" > "$root/bindings.after.json"
          diff -u "$root/bindings.before.json" "$root/bindings.after.json"
          cf "$api/zones/$CF_ZONE/workers/routes" > "$root/routes.after.json"
          jq -S '[.result[]|{pattern,script}]|sort_by(.pattern)' "$root/routes.after.json" > "$root/routes.after.snapshot.json"
          cmp -s "$root/routes.snapshot.json" "$root/routes.after.snapshot.json" || { echo "::error::Live route drift after release"; exit 1; }
          cf "$api/accounts/$CF_ACCOUNT/workers/scripts/$CF_WORKER/deployments?per_page=1" > "$root/deploy.after.json"
          new="$(jq -er '.result.deployments[0].versions[]|select(.percentage==100)|.version_id' "$root/deploy.after.json")"
          test "$new" != "$EXPECTED_LIVE_VERSION"
          echo "$new" > "$root/version.after"
          bundle="$(node --input-type=module -e 'import{readFileSync}from"node:fs";const s=readFileSync("creator-v1/dist/web/index.html","utf8");console.log(s.match(/src="(\/assets\/index-[^"]+\.js)"/)?.[1]||"")')"
          test -n "$bundle"
          ready=0
          for attempt in $(seq 1 18); do
            status="$(curl -sS --max-time 25 -o "$root/live-index.js" -w '%{http_code}' "https://anevum.com$bundle" || true)"
            if [ "$status" = 200 ] && node --input-type=module - "$root/live-index.js" "creator-v1/dist/web$bundle" <<'NODE'
          import {readFileSync} from 'node:fs';
          const live=readFileSync(process.argv[2]),built=readFileSync(process.argv[3]);
          process.exit(live.length>=built.length&&live.subarray(0,built.length).equals(built)?0:1);
          NODE
            then ready=1;break;fi
            sleep 3
          done
          test "$ready" = 1 || { echo "::error::Exact built React bundle not available on apex"; exit 1; }
          for path in /discover /recognition /join /community; do
            curl -fsS --max-time 25 "https://anevum.com$path" -o "$root/live-page.html"
            grep -q 'id="root"' "$root/live-page.html"
          done
          status="$(curl -sS --max-time 20 -o "$root/auth-methods.json" -w '%{http_code}' https://anevum.com/api/v1/member/auth-methods)"
          test "$status" = 200
          jq -e '.methods.email.available==true' "$root/auth-methods.json" >/dev/null
          test "$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' https://anevum.com/api/v1/member/rewards/inventory)" = 401
          prior="$(grep '/api/v1/members/devon/rewards/levels/4/icon' "$root/media.before.txt"|awk '{print $2}')"
          card="$(curl -sS --max-time 25 -D "$root/card.headers" -o "$root/card.svg" -w '%{http_code}' https://anevum.com/api/v1/members/devon/rewards/levels/4/card)"
          if [ "$prior" = 200 ]; then
            test "$card" = 200
            grep -iq '^content-type: image/svg+xml' "$root/card.headers"
            grep -q '<svg' "$root/card.svg"
          else
            test "$card" = 404
          fi
          future="$(grep '/api/v1/members/devon/rewards/levels/30/poster' "$root/media.before.txt"|awk '{print $2}')"
          actual="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' https://anevum.com/api/v1/members/devon/rewards/levels/30/card)"
          test "$actual" = "$future"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          timeout 50 "$chrome" --headless=new --no-sandbox --no-first-run --disable-dev-shm-usage --disable-background-networking --disable-gpu --virtual-time-budget=7000 --dump-dom https://anevum.com/discover > "$root/live-discover-dom.html" 2> "$root/live-chrome.log"
          grep -q 'av9-shell' "$root/live-discover-dom.html"
          accepted=1
          trap - EXIT
          echo "V078_APEX_RELEASE=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "OLD_VERSION=$EXPECTED_LIVE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "NEW_VERSION=$new" >> "$GITHUB_STEP_SUMMARY"
          echo "EXACT_JS_HASH_3D_XP_LOGIN_ROUTES=PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Record no-secret release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v078-guarded-apex-release-evidence
          path: |
            ${{ runner.temp }}/v078-release-evidence/browser/
            ${{ runner.temp }}/v078-release-evidence/version.before
            ${{ runner.temp }}/v078-release-evidence/version.after
            ${{ runner.temp }}/v078-release-evidence/live-discover-dom.html
          if-no-files-found: warn
          retention-days: 30
