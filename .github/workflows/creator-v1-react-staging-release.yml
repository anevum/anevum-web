name: ANEVUM Creator React Staging Release

# This workflow must be separately installed on the GitHub default branch.
# PR checks cannot deploy. Production, the existing preview, and member routing stay unchanged.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_CREATOR_REACT_STAGING_ONLY
        required: true
        type: string
      reviewed_head_sha:
        description: Exact reviewed 40-character commit SHA from the React review branch
        required: true
        type: string
      reviewed_branch:
        description: Allowlisted source branch; its current head must match the exact reviewed SHA
        required: true
        type: choice
        options:
          - build/creator-v1-react-shell-20261012
          - feature/creator-v1-portal-launcher-20261013
          - design/creator-v1-transcosmic-observatory-20261013
          - design/creator-v1-cinematic-worlds-20261013

permissions:
  contents: read

concurrency:
  group: anevum-creator-react-staging-release
  cancel-in-progress: false

jobs:
  staging:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'DEPLOY_CREATOR_REACT_STAGING_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      RELEASE_REF: ${{ inputs.reviewed_branch }}
      CONFIG: creator-v1/wrangler.react-staging-path.jsonc
    steps:
      - name: Checkout reviewed candidate only
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce exact reviewed SHA and allowlisted source branch
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REVIEWED_SHA" | grep -Eq '^[0-9a-f]{40}$'
          case "$RELEASE_REF" in
            build/creator-v1-react-shell-20261012|feature/creator-v1-portal-launcher-20261013|design/creator-v1-transcosmic-observatory-20261013|design/creator-v1-cinematic-worlds-20261013|release/creator-v1-main-consolidation-20261013) ;;
            *) echo "::error::Unreviewed or unsupported release source branch"; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          latest="$(git ls-remote origin "refs/heads/$RELEASE_REF" | cut -f1)"
          test -n "$latest"
          test "$latest" = "$REVIEWED_SHA"
          echo "EXACT_ALLOWLISTED_RELEASE_HEAD=PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify isolated site with no Cloudflare credentials
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node creator-v1/ops/verify-react-staging.mjs
          npm run check:creator-v1-web
          npm run build:creator-v1-web:staging
          node creator-v1/ops/verify-react-staging.mjs --generated
          node --test creator-v1/test/react-staging-route.test.mjs
          (cd creator-v1 && npm test)
          node --test creator-v1/auth/tests/*.test.mjs creator-v1/integration/*.test.mjs
      - name: Confirm existing Cloudflare routes and staging database bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          dir="$RUNNER_TEMP/creator-react-route-guard"
          mkdir -p "$dir"
          cf() { curl --fail --silent --show-error --retry 2 --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$1"; }
          cf "https://api.cloudflare.com/client/v4/zones?name=anevum.com" > "$dir/zones.json"
          zone="$(jq -r '.result[] | select(.name == "anevum.com" and .status == "active") | .id' "$dir/zones.json" | head -1)"
          test -n "$zone"
          cf "https://api.cloudflare.com/client/v4/zones/$zone/workers/routes" > "$dir/routes.json"
          jq -e '.success == true and ([.result[] | select(.pattern == "anevum.com/*" and (.script == "anevum-creator-v1" or .script == "anevum-creator-v1-main"))] | length) == 1' "$dir/routes.json" >/dev/null
          jq -e '.success == true and ([.result[] | select(.pattern == "next.anevum.com/api/v1/member/*" and .script == "anevum-member-auth-staging")] | length) == 1' "$dir/routes.json" >/dev/null
          jq -e '.success == true and ([.result[] | select(.pattern == "next.anevum.com/creator/*" and .script != "anevum-creator-v1-react-staging")] | length) == 0' "$dir/routes.json" >/dev/null
          production_worker="$(jq -r '.result[] | select(.pattern == "anevum.com/*") | .script' "$dir/routes.json")"
          for worker in anevum-member-auth-staging "$production_worker" anevum-community-preview; do
            cf "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker/settings" > "$dir/$worker.json"
          done
          jq -e '.success == true and any(.result.bindings[]; .name == "COMMUNITY_DB" and .type == "d1" and .database_id == "fa96e36d-6257-4883-bf15-074947e11a13")' "$dir/anevum-member-auth-staging.json" >/dev/null
          jq -e '.success == true and any(.result.bindings[]; .name == "COMMUNITY_DB" and .type == "d1" and .database_id == "fa96e36d-6257-4883-bf15-074947e11a13")' "$dir/anevum-community-preview.json" >/dev/null
          jq -e '.success == true and any(.result.bindings[]; .name == "COMMUNITY_DB" and .type == "d1" and .database_id == "6c7b5f0c-33db-4b6a-9569-0a6af5e07534")' "$dir/$production_worker.json" >/dev/null
          echo STAGING_ROUTE_ISOLATION=PASS
      - name: Baseline existing staging homepage before routing change
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 30 https://next.anevum.com/ > "$RUNNER_TEMP/creator-old-home-before.html"
          sha256sum "$RUNNER_TEMP/creator-old-home-before.html" | cut -d' ' -f1 > "$RUNNER_TEMP/creator-old-home.sha"
      - name: Deploy ONLY isolated creator React staging path
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$CONFIG" = 'creator-v1/wrangler.react-staging-path.jsonc'
          node creator-v1/ops/verify-react-staging.mjs --generated
          npx wrangler deploy --config "$CONFIG"
      - name: Verify React staging and original staging member/preview boundaries
        run: |
          set -euo pipefail
          base=https://next.anevum.com
          code=0
          for attempt in $(seq 1 20); do
            code="$(curl --silent --show-error --max-time 15 -o "$RUNNER_TEMP/creator-new-home.html" -w '%{http_code}' "$base/creator/" || true)"
            if [ "$code" = 200 ] && grep -q 'id="root"' "$RUNNER_TEMP/creator-new-home.html"; then break; fi
            sleep 3
          done
          test "$code" = 200
          grep -q 'id="root"' "$RUNNER_TEMP/creator-new-home.html"
          curl --fail --silent --show-error --max-time 20 "$base/creator/discover" | grep -q 'id="root"'
          if [ "$RELEASE_REF" = "feature/creator-v1-portal-launcher-20261013" ] || [ "$RELEASE_REF" = "design/creator-v1-transcosmic-observatory-20261013" ] || [ "$RELEASE_REF" = "design/creator-v1-cinematic-worlds-20261013" ]; then
            curl --fail --silent --show-error --max-time 20 "$base/creator/start" | grep -q 'id="root"'
            curl --fail --silent --show-error --max-time 20 "$base/creator/guide" | grep -q 'id="root"'
            # New API parameters can briefly hit an older edge version immediately
            # after the Worker is deployed. Retry only public read-only smoke,
            # with bounded attempts and explicit endpoint/status diagnostics.
            free_ready=0
            for attempt in $(seq 1 20); do
              code="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/creator-free-filter.json" -w '%{http_code}' "$base/creator/api/v1/projects?free=1&limit=2" || true)"
              if [ "$code" = 200 ] && jq -e '.items | type == "array"' "$RUNNER_TEMP/creator-free-filter.json" >/dev/null 2>&1; then
                free_ready=1
                echo "FREE_FILTER_EDGE_READY_ON_ATTEMPT=$attempt"
                break
              fi
              echo "::notice::Awaiting verified free-filter endpoint: HTTP $code (attempt $attempt/20)"
              sleep 3
            done
            if [ "$free_ready" != 1 ]; then
              echo "::error::Public free-filter API failed after 20 attempts"
              exit 1
            fi
            echo VISITOR_GUIDE_FREE_FILTER_STAGING=PASS
          fi
          # Design candidates must be visibly active, not just deployed as a
          # successful Worker version while older HTML or CSS remains at the edge.
          # Check a fixed first-party CSS path from the served React HTML and
          # verify immutable theme markers. The candidate has already passed
          # all feature and privacy tests before this post-deploy read-only check.
          if [ "$RELEASE_REF" = "design/creator-v1-transcosmic-observatory-20261013" ] || [ "$RELEASE_REF" = "design/creator-v1-cinematic-worlds-20261013" ]; then
            theme_ready=0
            for attempt in $(seq 1 20); do
              html_code="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/creator-observatory-home.html" -w '%{http_code}' "$base/creator/" || true)"
              if [ "$html_code" = 200 ]; then
                stylesheet="$(sed -n 's/.*href="\([^"]*\.css\)".*/\1/p' "$RUNNER_TEMP/creator-observatory-home.html" | head -1)"
                case "$stylesheet" in
                  /creator/assets/index-*.css)
                    if curl --fail --silent --show-error --max-time 20 -o "$RUNNER_TEMP/creator-observatory.css" "$base$stylesheet" &&
                      grep -Fq -- '--cosmos-void' "$RUNNER_TEMP/creator-observatory.css" &&
                      grep -Fq -- '--cosmos-cyan' "$RUNNER_TEMP/creator-observatory.css"; then
                      theme_ready=1
                      echo "OBSERVATORY_CSS_EDGE_READY_ON_ATTEMPT=$attempt"
                      break
                    fi
                    ;;
                esac
              fi
              echo "::notice::Waiting for approved Observatory CSS to propagate: HTTP $html_code (attempt $attempt/20)"
              sleep 3
            done
            if [ "$theme_ready" != 1 ]; then
              echo "::error::Observatory CSS fingerprint missing from hosted React staging after bounded retries"
              exit 1
            fi
            echo VISUAL_CANDIDATE_STAGING_THEME=PASS
          fi
          if [ "$RELEASE_REF" = "design/creator-v1-cinematic-worlds-20261013" ]; then
            art_ready=0
            for attempt in $(seq 1 20); do
              code="$(curl --silent --show-error --max-time 20 -o "$RUNNER_TEMP/cinematic-manifest.json" -w '%{http_code}' "$base/creator/assets/cinematic/manifest.json" || true)"
              if [ "$code" = 200 ] && jq -e '.kind == "STATIC_DECORATIVE_ARTWORK" and (.assets | length) == 10' "$RUNNER_TEMP/cinematic-manifest.json" >/dev/null 2>&1; then
                if curl --fail --silent --show-error --max-time 20 -o "$RUNNER_TEMP/cinematic-hero.webp" "$base/creator/assets/cinematic/hero/portal-world.webp"; then
                  actual="$(sha256sum "$RUNNER_TEMP/cinematic-hero.webp" | cut -d' ' -f1)"
                  if [ "$actual" = "5dece34caf849fbe48665f59815efd48644e1c1de5ede76f58f3cb321ecb1db7" ]; then
                    art_ready=1
                    break
                  fi
                fi
              fi
              echo "::notice::Waiting for reviewed cinematic WebP assets (attempt $attempt/20)"
              sleep 3
            done
            if [ "$art_ready" != 1 ]; then
              echo "::error::Cinematic media was not served at the reviewed fingerprint"
              exit 1
            fi
            echo STAGING_CINEMATIC_ART_INTEGRITY=PASS
          fi
          curl --fail --silent --show-error --max-time 20 "$base/creator/api/v1/status" | jq -e '.counts.publishedProjects >= 0' >/dev/null
          curl --fail --silent --show-error --max-time 20 "$base/creator/api/v1/projects?limit=2" | jq -e '.items | type == "array"' >/dev/null
          curl --fail --silent --show-error --max-time 20 "$base/api/v1/member/health" | jq -e '.status == "ok"' >/dev/null
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/api/v1/member/me")" = 401
          test "$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/creator/api/v1/member/me")" = 404
          curl --fail --silent --show-error --max-time 30 "$base/" > "$RUNNER_TEMP/creator-old-home-after.html"
          after="$(sha256sum "$RUNNER_TEMP/creator-old-home-after.html" | cut -d' ' -f1)"
          test "$after" = "$(cat "$RUNNER_TEMP/creator-old-home.sha")"
          echo STAGING_REACT_PREFIX=PASS
          echo STAGING_MEMBER_BOUNDARY=PASS
          echo OLD_STAGING_HOMEPAGE_UNCHANGED=PASS
      - name: Record scope and residual real-user acceptance
        if: always()
        run: |
          {
            echo '## ANEVUM Creator React isolated staging'
            echo ''
            echo 'Candidate: ${{ inputs.reviewed_head_sha }}'
            echo 'Reviewed allowlisted source branch: ${{ inputs.reviewed_branch }}'
            echo 'Visual-source candidates preserve existing public member and content API contracts.'
            echo ''
            echo 'Scope: next.anevum.com/creator/* only. No production deploy, migration or member route changes.'
            echo ''
            echo 'Exact member A / staff Studio / anonymous visitor / member B flow remains a separate manual acceptance gate.'
            echo ''
            echo 'Rollback: remove only next.anevum.com/creator/* or restore the independently deployed React staging Worker.'
          } >> "$GITHUB_STEP_SUMMARY"
