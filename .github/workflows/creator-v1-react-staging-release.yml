          jq -e '.success == true and any(.result.bindings[]; .name == "COMMUNITY_DB" and .type == "d1" and .database_id == "fa96e36d-6257-4883-bf15-074947e11a13")' "$dir/anevum-community-preview.json" >/dev/null
          jq -e '.success == true and any(.result.bindings[]; .name == "COMMUNITY_DB" and .type == "d1" and .database_id == "6c7b5f0c-33db-4b6a-9569-0a6af5e07534")' "$dir/anevum-creator-v1.json" >/dev/null
          echo STAGING_ROUTE_ISOLATION=PASS
      - name: Baseline existing staging homepage before routing change
