name: ANEVUM V137 Stage-Focused Website QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/parity/StageFocusedHomeV137.tsx'
      - 'creator-v1/web/src/parity/SeveranceWorldSceneV138.tsx'
      - 'creator-v1/web/src/parity/SeveranceCinematicV139.tsx'
      - 'creator-v1/web/src/severance-motion-v139.css'
      - 'creator-v1/graphics/encode-severance-v139.py'
      - 'creator-v1/web/src/severance-cinematic-v138.css'
      - 'creator-v1/web/src/pages/SeverancePage.tsx'
      - 'creator-v1/web/src/pages/AboutStudioPage.tsx'
      - 'creator-v1/web/src/stage-focus-v137.css'
      - 'creator-v1/web/src/pages/CinematicLandingPage.tsx'
      - 'creator-v1/web/src/pages/StatusPage.tsx'
      - 'creator-v1/web/src/lib/site-navigation.ts'
      - 'creator-v1/web/src/lib/public-page-metadata.ts'
      - 'creator-v1/web/src/components/Shell.tsx'
      - 'creator-v1/web/src/parity/ConsoleWayfinderV136.tsx'
      - 'creator-v1/web/src/App.tsx'
      - 'creator-v1/web/src/main.tsx'
      - 'creator-v1/web/index.html'
      - 'creator-v1/web/vite.config.ts'
      - 'creator-v1/test/stage-focused-severance-v137.test.mjs'
      - 'creator-v1/ops/v138-public-presentation-scope.mjs'
      - 'creator-v1/ops/v138-static-inventory.mjs'
      - 'creator-v1/test/severance-cinematic-v138.test.mjs'
      - 'creator-v1/test/severance-motion-v139.test.mjs'
      - 'creator-v1/test/stage-focused-v137-browser.mjs'
      - '.github/workflows/v137-stage-focused-website.yml'
permissions:
  contents: read
concurrency:
  group: v137-stage-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-studio-front-door:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'false'
      CLOUDFLARE_API_TOKEN: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the V138 release candidate changes presentation only
        run: node creator-v1/ops/v138-public-presentation-scope.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned source and encode original HD cinematic loop
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'numpy==2.3.5' 'opencv-python-headless==4.13.0.92'
          curl --fail --location --silent --show-error --retry 3 --max-time 100 \
            'https://dynamic.heygen.ai/image/82172586a3324f22b5f1d558ef81a0dd/original.png' \
            --output "$RUNNER_TEMP/anevum-severance-source.png"
          python creator-v1/graphics/encode-severance-v139.py \
            "$RUNNER_TEMP/anevum-severance-source.png" \
            creator-v1/web/public/assets/severance
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height \
            -of json creator-v1/web/public/assets/severance/hero-motion-v139-1080p.mp4
      - name: Verify exact source and stage-focused contracts
        run: |
          test "$(git rev-parse HEAD)" = "$ANEVUM_SOURCE_SHA"
          node --test creator-v1/test/stage-focused-severance-v137.test.mjs creator-v1/test/severance-cinematic-v138.test.mjs creator-v1/test/severance-motion-v139.test.mjs
          node --test creator-v1/test/public-page-metadata-v136.test.mjs
      - name: Install and typecheck the real Creator V1 frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install isolated Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Verify home, Severance, About, Status and phone layouts locally
        run: node creator-v1/test/stage-focused-v137-browser.mjs
      - name: Audit review-only compiled assets and retire portfolio media
        run: node creator-v1/ops/v138-static-inventory.mjs
      - name: Attach immutable reviewed static UI build (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v138-static-ui-${{ github.event.pull_request.head.sha }}
          path: creator-v1/dist/web/
          retention-days: 14
          if-no-files-found: error
      - name: Attach review screenshots and acceptance receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anevum-v137-stage-focused-${{ github.event.pull_request.head.sha }}
          path: evidence/stage-focused-v137/
          retention-days: 14
          if-no-files-found: warn
