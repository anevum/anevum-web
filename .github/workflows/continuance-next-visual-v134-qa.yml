name: ANEVUM NEXT V134 Unified Visual QA
on:
  pull_request:
    paths:
      - '.github/workflows/continuance-next-visual-v134-qa.yml'
      - 'creator-v1/web/src/continuance-next-visual-v134.css'
      - 'creator-v1/web/src/next-visual-primitives-v135.css'
      - 'creator-v1/web/src/components/NextVisualPrimitivesV135.tsx'
      - 'creator-v1/web/src/components/PortalHeading.tsx'
      - 'creator-v1/web/src/components/ProjectCard.tsx'
      - 'creator-v1/web/src/pages/CommunityPage.tsx'
      - 'creator-v1/web/src/pages/CreatorsPage.tsx'
      - 'creator-v1/web/src/pages/DiscoverPage.tsx'
      - 'creator-v1/web/src/pages/NextVisualLabV134.tsx'
      - 'creator-v1/web/src/main.tsx'
      - 'creator-v1/web/src/App.tsx'
      - 'creator-v1/test/next-unified-visual-v134.test.mjs'
      - 'creator-v1/test/next-visual-primitives-v135.test.mjs'
      - 'creator-v1/test/next-unified-visual-v134-browser.mjs'
      - 'docs/production/continuance-next-visual-v134-20261024.md'
permissions:
  contents: read
concurrency:
  group: anevum-next-visual-v134-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-head-visual-qa:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify opt-in source isolation, safe preview, accessibility
        run: |
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$CLOUDFLARE_API_KEY"
          test -z "$CLOUDFLARE_ACCOUNT_ID"
          node --test creator-v1/test/next-unified-visual-v134.test.mjs creator-v1/test/next-visual-primitives-v135.test.mjs
      - name: Install frontend without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check actual TypeScript source
        run: npm run check:creator-v1-web
      - name: Check standard V131-compatible build excludes V134
        env:
          VITE_NEXT_VISUAL_SYSTEM: 'false'
          VITE_LIVING_COMMONS_REVIEW: 'false'
        run: |
          npm run build:creator-v1-web
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';
          const all=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?all(path.join(dir,e.name)):[path.join(dir,e.name)]);
          const content=all('creator-v1/dist/web').filter(p=>/\.(js|css)$/.test(p)).map(p=>fs.readFileSync(p,'utf8')).join('\n');
          for(const marker of ['av134-lab','av134-scene-core','--av134-glass','--av135-surface'])if(content.includes(marker))throw Error('V134 leaked into default output: '+marker);
          JS
      - name: Build explicitly enabled NEXT visual review
        env:
          VITE_NEXT_VISUAL_SYSTEM: 'true'
          VITE_LIVING_COMMONS_REVIEW: 'false'
        run: |
          npm run build:creator-v1-web
          node --input-type=module <<'JS'
          import fs from 'node:fs';import path from 'node:path';
          const all=dir=>fs.readdirSync(dir,{withFileTypes:true}).flatMap(e=>e.isDirectory()?all(path.join(dir,e.name)):[path.join(dir,e.name)]);
          const content=all('creator-v1/dist/web').filter(p=>/\.(js|css)$/.test(p)).map(p=>fs.readFileSync(p,'utf8')).join('\n');
          for(const marker of ['av134-lab','av134-scene-core','--av134-glass','--av135-surface'])if(!content.includes(marker))throw Error('Missing V134 flagged content: '+marker);
          JS
      - name: Install pinned Chromium review tooling
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Exercise real compiled React, vector file icons, shared surfaces and editor
        run: node creator-v1/test/next-unified-visual-v134-browser.mjs --output "$RUNNER_TEMP/anevum-next-visual-v134"
      - name: Retain compiled screenshots and precise browser receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-visual-v134-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/anevum-next-visual-v134
          retention-days: 14
          if-no-files-found: warn
      - name: Print exact reviewed source
        run: git rev-parse HEAD
# Read-only preview workflow. No deployment step or provider write credentials.
