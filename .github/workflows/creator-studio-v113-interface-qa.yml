name: Creator Studio V113 Interface Builder QA
on:
  pull_request:
    paths:
      - 'creator-v1/interface-builder/**'
      - 'creator-v1/web/src/pages/StudioInterfaceBuilderV113.tsx'
      - 'creator-v1/web/src/pages/studio-interface-builder-v113.css'
      - 'creator-v1/web/src/pages/StudioFileWorkspaceV111.tsx'
      - 'creator-v1/test/studio-interface-builder-v113.test.mjs'
      - 'creator-v1/test/capture-studio-interface-v113.mjs'
      - '.github/workflows/creator-studio-v113-interface-qa.yml'
permissions:
  contents: read
concurrency:
  group: creator-studio-v113-${{ github.ref }}
  cancel-in-progress: true
jobs:
  declarative-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate bounded declarative UI and interactions
        run: node --test creator-v1/test/studio-interface-builder-v113.test.mjs
      - name: Preserve existing story and revisioned source
        run: |
          node --test creator-v1/test/studio-visual-scenes-v112.test.mjs
          node --test creator-v1/test/studio-file-tree-v111.test.mjs
          node --check creator-v1/test/capture-studio-interface-v113.mjs
      - name: Verify strict Creator Studio TypeScript
        run: npm run check:creator-v1-web
      - name: Build with new builder OFF
        env:
          VITE_CREATOR_WORKSPACE_V109: 'true'
          VITE_CREATOR_AGENT_DOCK_V110: 'true'
          VITE_CREATOR_FILE_TREE_V111: 'true'
          VITE_CREATOR_VISUAL_SCENE_V112: 'true'
          VITE_CREATOR_INTERFACE_BUILDER_V113: 'false'
        run: npm run build:creator-v1-web:staging
      - name: Build with new builder ON in synthetic mode
        env:
          VITE_CREATOR_WORKSPACE_V109: 'true'
          VITE_CREATOR_AGENT_DOCK_V110: 'true'
          VITE_CREATOR_FILE_TREE_V111: 'true'
          VITE_CREATOR_VISUAL_SCENE_V112: 'true'
          VITE_CREATOR_INTERFACE_BUILDER_V113: 'true'
          VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
          VITE_CREATOR_WORKBENCH_ALPHA: 'false'
        run: npm run build:creator-v1-web:staging
      - name: Chromium private files, branching scene and declarative UI authoring
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/studio-v113
          node creator-v1/test/portal-offline-preview.mjs > evidence/studio-v113/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:4178/__ready > /dev/null; then ready=1; break; fi
            sleep .2
          done
          test "$ready" -eq 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-studio-interface-v113.mjs --chrome "$chrome" --output evidence/studio-v113
      - name: Record exact-head synthetic-only acceptance
        run: echo 'V113=SOURCE_ONLY; DECLARATIVE_TEXT_PREVIEW; NO_D1_MIGRATION; NO_PUBLIC_RUNTIME; NO_OPENAI_PROVIDER_CALLS' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-studio-v113-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/studio-v113/
          if-no-files-found: ignore
