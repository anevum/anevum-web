name: ANEVUM V142 Verified Brand and Navigation Release
on:
  push:
    branches: ['release/v142-sitewide-visual-links-20261028-001']
    paths:
      - '.github/workflows/v142-guarded-release.yml'
      - 'creator-v1/ops/v142-guarded-release.mjs'
      - 'docs/production/ANEVUM.WEB.RELEASE.2026-10-28.001.V142-BRAND-NAVIGATION.md'
permissions:
  contents: read
  actions: read
concurrency:
  group: anevum-v142-prod-guarded
  cancel-in-progress: false
jobs:
  verify-package:
    if: >-
      github.repository == 'anevum/anevum-web' && github.event.head_commit.message == 'release(v142): upload verified combined candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ''
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_ANEVUM_OWNER_REVIEW: 'false'
      VITE_IREN_SPATIAL_GUIDE: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_MEMBER_COLLECTION_NAV_REVIEW: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require exact V142 merged UI and approved release-only edits
        run: |
          git switch -C release/v142-sitewide-visual-links-20261028-001 "$GITHUB_SHA"
          node creator-v1/ops/v142-guarded-release.mjs source
      - name: Restore original V139 cinematic media
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12785837975'
          run-id: 40617882293
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v139-original
          merge-multiple: true
      - name: Retrieve sealed V141 icon/share baseline package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12789858557'
          run-id: 40627822021
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v141-original
          merge-multiple: true
      - name: Restore reviewed source media without changing existing URL bytes
        run: |
          test ! -e creator-v1/web/public/assets/severance
          mkdir -p creator-v1/web/public/assets
          cp -R "$RUNNER_TEMP/v139-original/assets/severance" creator-v1/web/public/assets/severance
          for f in "$RUNNER_TEMP"/v141-original/candidate/compiled-web/anevum-severance-*v141*.png; do
            test -f "$f"
            cp "$f" creator-v1/web/public/
          done
          test -f creator-v1/web/public/anevum-severance-share-v141-1200x630.png
          test -f creator-v1/web/public/anevum-severance-icon-v141-512.png
      - name: Install exact locked application toolchain
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Recheck all navigation/payment/brand regressions and TypeScript boundaries
        run: |
          node --test \
            creator-v1/test/v142-game-first-nav-contract.test.mjs \
            creator-v1/test/supporter-compact-v045.test.mjs \
            creator-v1/test/portal-launcher.test.mjs \
            creator-v1/test/stage-focused-severance-v137.test.mjs \
            creator-v1/test/severance-cinematic-v138.test.mjs \
            creator-v1/test/v141-brand-contract.test.mjs
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Seal the exact V69 gateway plus V141 original art and new V142 public frontend
        run: |
          node creator-v1/ops/v142-guarded-release.mjs package \
            "$RUNNER_TEMP/v141-original/baseline" creator-v1/dist/web "$RUNNER_TEMP/v142-paired"
      - name: Browser-check compiled public routes and mobile switchboard nonoverlap
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.64.1
          npx playwright install chromium
          node creator-v1/test/v142-preview-navigation-browser.mjs
      - name: Archive exact V142 baseline and candidate packages for readback
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v142-paired-${{ github.sha }}
          path: ${{ runner.temp }}/v142-paired
          retention-days: 14
          if-no-files-found: error
      - name: Archive compiled visual and navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v142-visual-release-${{ github.sha }}
          path: evidence/v142-compiled
          retention-days: 14
          if-no-files-found: warn
  upload-inactive:
    needs: verify-package
    if: >-
      github.repository == 'anevum/anevum-web' && github.event.head_commit.message == 'release(v142): upload verified combined candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_ANEVUM_OWNER_REVIEW: 'false'
      VITE_IREN_SPATIAL_GUIDE: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_MEMBER_COLLECTION_NAV_REVIEW: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git switch -C release/v142-sitewide-visual-links-20261028-001 "$GITHUB_SHA"
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - uses: actions/download-artifact@v4
        with:
          name: anevum-v142-paired-${{ github.sha }}
          path: ${{ runner.temp }}/v142-paired
      - name: Require V69 still live at 100% with 26 unchanged bindings and 45 routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/v142-guarded-release.mjs before "$RUNNER_TEMP/v142-paired/baseline"
      - name: Upload original V69 HTML with V141 and V142 shared assets, INACTIVE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler versions upload --no-bundle --no-upload-source-maps --keep-vars --strict \
            --config "$RUNNER_TEMP/v142-paired/baseline/upload.json" \
            --message "ANEVUM V142 baseline $GITHUB_SHA; V69 gateway unchanged; INACTIVE"
      - name: Verify no traffic, binding, runtime or route changes after baseline upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/v142-guarded-release.mjs after "$RUNNER_TEMP/v142-paired/baseline"
      - name: Repeat exact source and live-provider preflight before actual UI candidate upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/v142-guarded-release.mjs before "$RUNNER_TEMP/v142-paired/candidate"
      - name: Upload reviewed V142 game-first frontend with V141 original art, INACTIVE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler versions upload --no-bundle --no-upload-source-maps --keep-vars --strict \
            --config "$RUNNER_TEMP/v142-paired/candidate/upload.json" \
            --message "ANEVUM V142 candidate $GITHUB_SHA; V69 gateway unchanged; INACTIVE"
      - name: Verify provider state and candidate bound to exact reviewed source at zero traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/v142-guarded-release.mjs after "$RUNNER_TEMP/v142-paired/candidate"
      - name: Preserve immutable provider receipts for independently reviewed cutover
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v142-inactive-receipts-${{ github.sha }}
          path: |
            ${{ runner.temp }}/v142-paired/baseline/inactive-receipt.json
            ${{ runner.temp }}/v142-paired/candidate/inactive-receipt.json
            ${{ runner.temp }}/v142-paired/package-receipt.json
          retention-days: 14
          if-no-files-found: warn
