name: Cloudflare Access Permission Probe

on:
  push:
    branches:
      - foundation/cloudflare-access-web-20261001

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Access app read/write permissions safely
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          read_status="$(curl --silent --show-error -o "$RUNNER_TEMP/apps.json" -w '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100"             "${auth[@]}")"
          echo "ACCESS_APPS_READ_HTTP_STATUS=$read_status"
          test "$read_status" = "200"
          jq -e '.success == true' "$RUNNER_TEMP/apps.json" > /dev/null
          echo "ACCESS_APP_COUNT=$(jq '.result | length' "$RUNNER_TEMP/apps.json")"

          write_status="$(curl --silent --show-error -o "$RUNNER_TEMP/write.json" -w '%{http_code}'             -X POST             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps"             "${auth[@]}"             --data '{}')"
          echo "ACCESS_APPS_INVALID_CREATE_HTTP_STATUS=$write_status"
          if [ "$write_status" = "403" ]; then
            echo "ACCESS_APPS_WRITE=unauthorized"
          elif [ "$write_status" = "400" ] || [ "$write_status" = "422" ]; then
            echo "ACCESS_APPS_WRITE=authorized_validation_rejected"
          else
            echo "ACCESS_APPS_WRITE=unexpected_status"
            jq -c '{success, errors}' "$RUNNER_TEMP/write.json" || true
            exit 2
          fi
