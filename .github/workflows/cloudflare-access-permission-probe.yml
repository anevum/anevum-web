name: Cloudflare Access Permission Probe

on:
  push:
    branches:
      - foundation/cloudflare-access-web-20261001

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Access configuration read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          apps_status="$(curl --silent --show-error -o "$RUNNER_TEMP/apps.json" -w '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=100"             "${auth[@]}")"
          echo "ACCESS_APPS_HTTP_STATUS=$apps_status"
          test "$apps_status" = "200"
          jq -e '.success == true' "$RUNNER_TEMP/apps.json" > /dev/null
          jq -c '[.result[] | {
            name,
            type,
            domain,
            aud,
            session_duration,
            policy_count: ((.policies // []) | length)
          }]' "$RUNNER_TEMP/apps.json"

          org_status="$(curl --silent --show-error -o "$RUNNER_TEMP/org.json" -w '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/organizations"             "${auth[@]}")"
          echo "ACCESS_ORG_HTTP_STATUS=$org_status"
          test "$org_status" = "200"
          jq -e '.success == true' "$RUNNER_TEMP/org.json" > /dev/null
          jq -c '{
            auth_domain: .result.auth_domain,
            name: .result.name,
            session_duration: .result.session_duration,
            auto_redirect_to_identity: .result.auto_redirect_to_identity,
            deny_unmatched_requests: .result.deny_unmatched_requests
          }' "$RUNNER_TEMP/org.json"
