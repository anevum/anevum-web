name: Cloudflare Access Permission Probe

on:
  push:
    branches:
      - foundation/cloudflare-access-web-20261001

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Access application read permission
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o "$RUNNER_TEMP/access.json" -w '%{http_code}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=1"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")"
          echo "ACCESS_API_HTTP_STATUS=$status"
          if [ "$status" = "200" ]; then
            jq -e '.success == true' "$RUNNER_TEMP/access.json" > /dev/null
            echo "ACCESS_API_READ=authorized"
          else
            jq -r '.errors // [] | map(.message) | join("; ")' "$RUNNER_TEMP/access.json" || true
            echo "ACCESS_API_READ=unauthorized"
            exit 2
          fi
