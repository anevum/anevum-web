name: ANEVUM V095/V096 Inactive Candidate Preflight
on:
  push:
    branches: [ops/v095-inactive-candidate-20261020-001, ops/v100-integrated-inactive-20261020-001, ops/v100-feature-on-inactive-20261021-001]
    paths:
      - creator-v1/operations/v095-inactive-baseline-20261020.json
      - creator-v1/ops/v095-inactive-candidate-gate.mjs
      - creator-v1/ops/v095-v096-cloudflare-ops.mjs
      - creator-v1/test/v095-inactive-candidate-gate.test.mjs
      - .github/workflows/v095-v096-inactive-upload.yml
      - .github/workflows/v095-v096-inactive-preflight.yml
  pull_request:
    paths:
      - creator-v1/operations/v095-inactive-baseline-20261020.json
      - creator-v1/ops/v095-inactive-candidate-gate.mjs
      - creator-v1/ops/v095-v096-cloudflare-ops.mjs
      - creator-v1/test/v095-inactive-candidate-gate.test.mjs
      - .github/workflows/v095-v096-inactive-upload.yml
      - .github/workflows/v095-v096-inactive-preflight.yml
permissions:
  contents: read
concurrency:
  group: anevum-v095-v096-inactive-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    env:
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: ${{ (github.head_ref || github.ref_name) == 'ops/v100-feature-on-inactive-20261021-001' && 'true' || 'false' }}
      VITE_IREN_SPATIAL_GUIDE: ${{ (github.head_ref || github.ref_name) == 'ops/v100-feature-on-inactive-20261021-001' && 'true' || 'false' }}
      ANEVUM_INACTIVE_PROFILE: ${{ (github.head_ref || github.ref_name) == 'ops/v100-feature-on-inactive-20261021-001' && 'v100-feature-on' || (github.head_ref || github.ref_name) == 'ops/v100-integrated-inactive-20261020-001' && 'v100' || 'v095-v096' }}
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application source remains the merged V095 + V096 revision
        env:
          ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('creator-v1/operations/v095-inactive-baseline-20261020.json','utf8'));
          assert.equal(m.source_sha,'d5af32fd8f04b05e0381f7ac12c59d06c0e836a2');
          assert.equal(m.approval.production,false);
          assert.equal(m.approval.live_traffic_promotion,false);
          assert.equal(m.required_plain_vars.CANONICAL_CREATOR_UPLOADS_ENABLED,'false');
          assert.equal(m.routes.length,39);
          const app=readFileSync('creator-v1/web/src/App.tsx','utf8');
          const gateway=readFileSync('creator-v1/apex-prelaunch/gateway.mjs','utf8');
          assert.match(app,/path="studio\/alpha"/);
          assert.match(gateway,/PUBLIC_ALPHA\.test\(pathname\)/);
          const production=readFileSync('.github/workflows/v084-continuance-production.yml','utf8');
          assert.match(production,/node creator-v1\/ops\/v091-release-acceptance\.mjs\s*\n/);
          assert.doesNotMatch(production,/node creator-v1\/ops\/v091-release-acceptance\.mjs --source-only/);
          JS
          source_pin='d5af32fd8f04b05e0381f7ac12c59d06c0e836a2'
          if [ "$ANEVUM_INACTIVE_PROFILE" != 'v095-v096' ]; then source_pin='28f163a0015631b1d8eb58922c03596ae8febd22'; fi
          git merge-base --is-ancestor "$source_pin" HEAD
          if [ "$ANEVUM_INACTIVE_PROFILE" = 'v100-feature-on' ]; then
            CLOUDFLARE_ACCOUNT_ID=2f7ee83107240152097efd956a4e8335 node creator-v1/ops/v095-v096-cloudflare-ops.mjs verify-source
          else
          git diff --exit-code "$source_pin" HEAD -- . \
            ':(exclude)creator-v1/operations/v095-inactive-baseline-20261020.json' \
            ':(exclude)creator-v1/ops/v095-inactive-candidate-gate.mjs' \
            ':(exclude)creator-v1/ops/v095-v096-cloudflare-ops.mjs' \
            ':(exclude)creator-v1/test/v095-inactive-candidate-gate.test.mjs' \
            ':(exclude).github/workflows/v095-v096-inactive-preflight.yml' \
            ':(exclude).github/workflows/v095-v096-inactive-upload.yml' \
            ':(exclude).github/release-approvals/v095-v096-inactive-upload.json' \
            ':(exclude).github/release-approvals/v100-inactive-upload.json' \
            ':(exclude).github/workflows/v084-continuance-production.yml' \
            ':(exclude).github/workflows/v091-live-readonly-qa.yml' \
            ':(exclude).github/release-evidence/v091-authenticated.json' \
            ':(exclude)creator-v1/ops/v091-release-acceptance.mjs' \
            ':(exclude)creator-v1/test/v091-release-acceptance.test.mjs' \
            ':(exclude)creator-v1/operations/staff-transport-v091.json' \
            ':(exclude)creator-v1/test/staff-transport-release-v091.test.mjs' \
            ':(exclude)creator-v1/ops/v095-v096-acceptance-entry.mjs' \
            ':(exclude)creator-v1/test/v095-v096-acceptance-entry.test.mjs' \
            ':(exclude).github/workflows/v096-public-alpha-qa.yml' \
            ':(exclude)creator-v1/ops/v091-controlled-pilot-upload.mjs' \
            ':(exclude)tests/single-production-deploy.test.mjs'
          fi
          echo 'APP_SOURCE_STILL_MERGED_V095_V096=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Run positive and negative inactive candidate preflight tests
        run: |
          set -euo pipefail
          node --check creator-v1/ops/v095-v096-cloudflare-ops.mjs
          node --test creator-v1/test/v095-inactive-candidate-gate.test.mjs creator-v1/test/v095-v096-acceptance-entry.test.mjs
          echo 'INACTIVE_CANDIDATE_TESTS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_CLOUDFLARE_TOKEN_USED; NO_UPLOAD; NO_DEPLOYMENT' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run the actual Wrangler versions upload without secrets or Cloudflare writes
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          test -s creator-v1/dist/web/index.html
          npx wrangler versions upload --dry-run \
            --config creator-v1/wrangler.apex-prelaunch.jsonc \
            --keep-vars --strict \
            --outdir "$RUNNER_TEMP/v095-v096-wrangler-dryrun"
          echo 'WRANGLER_BUNDLE_DRY_RUN=PASS; NO_TOKEN_OR_UPLOAD_USED' >> "$GITHUB_STEP_SUMMARY"
  deployment-reconciliation:
    if: github.repository == 'anevum/anevum-web' && github.event_name == 'push' && github.ref == 'refs/heads/ops/v100-integrated-inactive-20261020-001' && github.actor == 'anevum'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read deployment identifiers and pinned resource checks only
        env:
          VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
          VITE_NATIVE_CREATOR_STUDIO_V095: 'false'
          VITE_IREN_SPATIAL_GUIDE: 'false'
          ANEVUM_INACTIVE_PROFILE: 'v100'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node creator-v1/ops/v095-v096-cloudflare-ops.mjs audit
# No provider configuration artifact or mutation is allowed by reconciliation.

