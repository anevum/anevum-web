name: ANEVUM V095/V096 Inactive Candidate Preflight
on:
  push:
    branches: [ops/v095-inactive-candidate-20261020-001]
    paths:
      - creator-v1/operations/v095-inactive-baseline-20261020.json
      - creator-v1/ops/v095-inactive-candidate-gate.mjs
      - creator-v1/test/v095-inactive-candidate-gate.test.mjs
      - .github/workflows/v095-v096-inactive-preflight.yml
  pull_request:
    paths:
      - creator-v1/operations/v095-inactive-baseline-20261020.json
      - creator-v1/ops/v095-inactive-candidate-gate.mjs
      - creator-v1/test/v095-inactive-candidate-gate.test.mjs
      - .github/workflows/v095-v096-inactive-preflight.yml
permissions:
  contents: read
concurrency:
  group: anevum-v095-v096-inactive-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application source remains the merged V095 + V096 revision
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const m=JSON.parse(readFileSync('creator-v1/operations/v095-inactive-baseline-20261020.json','utf8'));
          assert.equal(m.source_sha,'d5af32fd8f04b05e0381f7ac12c59d06c0e836a2');
          assert.equal(m.approval.production,false);
          assert.equal(m.approval.live_traffic_promotion,false);
          assert.equal(m.required_plain_vars.CANONICAL_CREATOR_UPLOADS_ENABLED,'false');
          assert.equal(m.routes.length,39);
          const app=readFileSync('creator-v1/web/src/App.tsx','utf8');
          const gateway=readFileSync('creator-v1/apex-prelaunch/gateway.mjs','utf8');
          assert.match(app,/path="studio\/alpha"/);
          assert.match(gateway,/PUBLIC_ALPHA\.test\(pathname\)/);
          const production=readFileSync('.github/workflows/v084-continuance-production.yml','utf8');
          assert.match(production,/node creator-v1\/ops\/v091-release-acceptance\.mjs\s*\n/);
          assert.doesNotMatch(production,/node creator-v1\/ops\/v091-release-acceptance\.mjs --source-only/);
          JS
          git diff --exit-code d5af32fd8f04b05e0381f7ac12c59d06c0e836a2 HEAD -- . \
            ':(exclude)creator-v1/operations/v095-inactive-baseline-20261020.json' \
            ':(exclude)creator-v1/ops/v095-inactive-candidate-gate.mjs' \
            ':(exclude)creator-v1/test/v095-inactive-candidate-gate.test.mjs' \
            ':(exclude).github/workflows/v095-v096-inactive-preflight.yml'
          echo 'APP_SOURCE_STILL_MERGED_V095_V096=PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Run positive and negative inactive candidate preflight tests
        run: |
          set -euo pipefail
          node --test creator-v1/test/v095-inactive-candidate-gate.test.mjs
          echo 'INACTIVE_CANDIDATE_TESTS=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'NO_CLOUDFLARE_TOKEN_USED; NO_UPLOAD; NO_DEPLOYMENT' >> "$GITHUB_STEP_SUMMARY"
