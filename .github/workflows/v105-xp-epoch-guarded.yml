name: ANEVUM V105 XP Epoch Guarded Inactive Release
on:
  pull_request:
    paths:
      - .github/workflows/v105-xp-epoch-guarded.yml
      - creator-v1/ops/xp-epoch-v105-live-cutover.mjs
      - creator-v1/test/xp-epoch-v105-guarded.test.mjs
  push:
    branches: [release/v084-continuance-approved-20261019]
    paths:
      - .github/release-approvals/v105-xp-epoch-inactive.json
permissions:
  contents: read
  actions: read
concurrency:
  group: anevum-v105-xp-epoch-inactive-release
  cancel-in-progress: false
jobs:
  verify-live-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned project verification dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify operations source, existing progression tests, and intended live cutover
        shell: bash
        run: |
          set -euo pipefail
          node --check creator-v1/ops/xp-epoch-v105-live-cutover.mjs
          node --test creator-v1/test/xp-epoch-v105-guarded.test.mjs
          (cd creator-v1 && node --test test/progression-epoch-reset-v105.test.mjs)
      - name: Verify exact live bundle and preserved configuration without uploading
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REVIEW_CANDIDATE_FILE: ${{ runner.temp }}/xp-v105-reviewed-gateway.js
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          node creator-v1/ops/xp-epoch-v105-live-cutover.mjs check > "$RUNNER_TEMP/v105-readonly-report.json"
          test -s "$REVIEW_CANDIDATE_FILE"
          node --check "$REVIEW_CANDIDATE_FILE"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/v105-readonly-report.json','utf8'));
          assert.equal(x.mode,'check');
          assert.equal(x.read_only,true);
          assert.equal(x.source_pr,618);
          assert.equal(x.live_version,'93cc7f07-cf39-457e-af69-c9f6f4c02d25');
          assert.deepEqual(x.patched_regions,['epoch helper','readProgression','syncRewardNotifications','notification','canonicalProgression','grantMilestones','spaceSnapshot','memberRecognitionState','publicRecognitionMap','publicMemberColumns']);
          console.log('PASS: exact live source patched; syntax valid; no Cloudflare version uploaded or D1 changed');
          JS
      - name: Record read-only proof only
        run: |
          echo 'V105_XP_EPOCH_READ_ONLY_PREFLIGHT=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_XP_RESET=NOT_ACTIVATED' >> "$GITHUB_STEP_SUMMARY"
          echo 'PUBLIC_TRAFFIC=UNMODIFIED' >> "$GITHUB_STEP_SUMMARY"
# An inactive upload needs separately verified original production assets.
# This workflow intentionally does NOT upload, deploy, or activate a reset.
