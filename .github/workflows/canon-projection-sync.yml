name: Canon Projection Sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canon-projection-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check Notion sync credential
        id: notion-credential
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          if [ -z "$NOTION_API_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Automated canon projection sync is paused because repository secret NOTION_API_TOKEN is not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve live canon projection
        if: steps.notion-credential.outputs.available == 'true'
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_PUBLISHING_QUEUE_DATA_SOURCE_ID: 11bead82-0bfa-45cd-bccb-53b35dacdfdf
          NOTION_CANON_DATA_SOURCE_ID: 8486408d-b9d6-436f-9669-bb92a5a51e9b
        run: npm run canon:sync

      - name: Verify generated production build
        if: steps.notion-credential.outputs.available == 'true'
        run: npm run build

      - name: Commit projection drift
        if: steps.notion-credential.outputs.available == 'true'
        run: |
          if git diff --quiet -- src/publicObjects.ts src/canonProjection.ts public/wiki-sitemap.xml; then
            echo "Live Notion projection already matches production."
            exit 0
          fi
          git config user.name "ANEVUM Canon Sync"
          git config user.email "actions@users.noreply.github.com"
          git add src/publicObjects.ts src/canonProjection.ts public/wiki-sitemap.xml
          git commit -m "Sync live ANEVUM canon projection"
          git push origin HEAD:main
