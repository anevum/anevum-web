name: ANEVUM V091 Guarded Continuance Experience Production
on:
  push:
    branches:
      - release/v084-continuance-approved-20261019
    paths:
      - .github/workflows/v084-continuance-production.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: anevum-v084-guarded-apex-production
  cancel-in-progress: false
jobs:
  staff-transport-repair:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the exact tested staff repair scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/v084-continuance-approved-20261019"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor db2b8c0f8f79061adf1677986b87077856204267 HEAD
          diff -u <(printf '%s\n' '.github/workflows/v084-continuance-production.yml' 'creator-v1/operations/anevum-iren-apex-staff-v002.mjs' 'creator-v1/operations/anevum-iren-staff-entry-v003.mjs' 'creator-v1/operations/anevum-iren-staff-observatory-v001.mjs' 'creator-v1/operations/anevum-iren-staff-session-status-v001.mjs' 'creator-v1/operations/anevum-profile-staff-access-v001.mjs' 'creator-v1/operations/staff-transport-v091.json' 'creator-v1/ops/v091-staff-transport.mjs' 'creator-v1/test/staff-session-transport-v091.test.mjs' 'creator-v1/test/staff-transport-release-v091.test.mjs') <(git diff --name-only db2b8c0f8f79061adf1677986b87077856204267 HEAD)
          git diff --exit-code 8fd6b931af0b68e9cab18a15ccf094b220863076 HEAD -- 'creator-v1/operations/anevum-iren-apex-staff-v002.mjs' 'creator-v1/operations/anevum-iren-staff-entry-v003.mjs' 'creator-v1/operations/anevum-iren-staff-observatory-v001.mjs' 'creator-v1/operations/anevum-iren-staff-session-status-v001.mjs' 'creator-v1/operations/anevum-profile-staff-access-v001.mjs' 'creator-v1/operations/staff-transport-v091.json' 'creator-v1/ops/v091-staff-transport.mjs' 'creator-v1/test/staff-session-transport-v091.test.mjs' 'creator-v1/test/staff-transport-release-v091.test.mjs'
      - name: Require all seven PR checks on the pinned application source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const required=new Set([381706675,388848371,388879414,389311531,389435838,389482179,389880403]);
          const response=await fetch('https://api.github.com/repos/anevum/anevum-web/actions/runs?event=pull_request&head_sha=6e04e2bb6a895afd62d9f004d626c0b90f84b656&per_page=100',{headers:{authorization:'Bearer '+process.env.GH_TOKEN,accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
          if(!response.ok)throw Error('Cannot verify pinned CI results');
          const {workflow_runs:runs}=await response.json();
          for(const id of required){const run=runs.filter(r=>r.workflow_id===id&&r.head_sha==='6e04e2bb6a895afd62d9f004d626c0b90f84b656').sort((a,b)=>b.run_attempt-a.run_attempt)[0];if(!run||run.status!=='completed'||run.conclusion!=='success')throw Error('Pinned release check is not green: '+id);}
          console.log('All seven checks passed on the exact pinned PR head.');
          NODE
      - name: Install the existing Workers runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify the actual Workers runtime and unchanged staff authorization
        run: |
          node --test --test-name-pattern='staff identity checks execute' creator-v1/test/staff-session-transport-v091.test.mjs
          node --test creator-v1/test/staff-transport-release-v091.test.mjs
          node --test creator-v1/test/staff-project-v080.test.mjs creator-v1/test/staff-project-v080-integration.test.mjs
      - name: Apply only the five pinned staff transport repairs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node creator-v1/ops/v091-staff-transport.mjs --apply | tee staff-transport-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v091-staff-transport-repair-${{ github.run_id }}
          path: staff-transport-result.json
          if-no-files-found: ignore
      - name: Record limited production scope
        run: |
          echo 'V091 staff identity transport repaired. No frontend, apex gateway, route, Access policy, database, reward, account or published-project changes were deployed. Full V091 remains on PR #554 pending authenticated acceptance.' >> "$GITHUB_STEP_SUMMARY"
