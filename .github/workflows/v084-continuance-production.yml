# V091 RC: staff transport is repaired in production; full experience release requires authenticated acceptance.
# V091 release candidate: staff transport filename fix pinned; authenticated full release remains gated.
name: ANEVUM V091 Guarded Continuance Experience Production
on:
  push:
    branches:
      - release/v084-continuance-approved-20261019
    paths:
      - .github/workflows/v084-continuance-production.yml
permissions:
  contents: read
concurrency:
  group: anevum-v084-guarded-apex-production
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require recorded V091 authenticated acceptance before release
        shell: bash
        run: |
          set -euo pipefail
          node --test creator-v1/test/v091-release-acceptance.test.mjs
          node creator-v1/ops/v091-release-acceptance.mjs
          # Only release configuration/evidence may differ from the tested app.
          git diff --exit-code ea1d5e7a402c1e85f9645ea76ced8f8cddbe859f HEAD -- . \
            ':(exclude).github/workflows/v084-continuance-production.yml' \
            ':(exclude).github/workflows/v091-live-readonly-qa.yml' \
            ':(exclude).github/release-evidence/v091-authenticated.json' \
            ':(exclude)creator-v1/ops/v091-release-acceptance.mjs' \
            ':(exclude)creator-v1/test/v091-release-acceptance.test.mjs'
      - name: Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild exact preserved V059 native 3D collection assets
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install numpy==2.2.6 scipy==1.15.3 Pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri
          (
            cd design/evolution-v059
            mkdir -p artwork/{native,textures,vector,masters,web,compact} docs dist previews
            python src/export_native.py
            python src/render_web.py
            python src/build.py
          )
          python creator-v1/ops/install-evolution-v060.py
          test "$(find creator-v1/web/public/evolution/assets -maxdepth 1 -type f | wc -l)" -eq 152
          test -s creator-v1/web/public/evolution/assets/level-04-scene.gz
          test -s creator-v1/web/public/evolution/assets/level-30-scene.gz
          test -s creator-v1/web/public/evolution/mini-runtime.json
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify and compile both frontend variants
        env:
          VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
        run: |
          set -euo pipefail
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
          node --experimental-strip-types --test \
            creator-v1/test/null-creator-alpha-release.test.mjs \
            creator-v1/test/v079-reconciled-null-creator.test.mjs \
            creator-v1/test/home-navigation-v079.test.mjs
          node --test \
            creator-v1/test/player-card-premium-v078.test.mjs \
            creator-v1/test/evolution-card-illustrations-v077.test.mjs \
            creator-v1/test/earned-reward-media-v075.test.mjs \
            creator-v1/test/player-card-recognition-v065.test.mjs \
            creator-v1/test/level-artwork-preservation-v074.test.mjs \
            creator-v1/test/apex-prelaunch-gateway.test.mjs \
            creator-v1/test/progression-v031.test.mjs
          test "$(find creator-v1/dist/web/evolution/assets -maxdepth 1 -type f | wc -l)" -eq 152
          test -s creator-v1/dist/web/evolution/assets/level-04-scene.gz
          test -s creator-v1/dist/web/evolution/assets/level-30-scene.gz
          test -s creator-v1/dist/web/index.html
          test ! -e creator-v1/web/public/evolution-card-plates.json
          grep -Fq 'v081-vector-sigil' creator-v1/web/src/components/LevelEmblem.tsx
          grep -Fq 'import "./iren-guided-v080.css";' creator-v1/web/src/main.tsx
          grep -Fq 'import "./continuance-entry-v052.css";' creator-v1/web/src/main.tsx
          grep -Fq "CANONICAL_REPUTATION_ENABLED" creator-v1/canonical-auth/space.mjs
          (cd creator-v1 && npm run test:entry-v082 && npm run test:iren-v080 && npm run test:iren-v088 && npm run test:player-v081 && npm run test:d1-efficiency-v081)
          if grep -rl 'evolution-card-plates' creator-v1/dist/web/assets --include='*.js' >/dev/null; then
            echo "::error::Private earned card artwork registry leaked into public client build"
            exit 1
          fi
      - name: Browser regression using a local synthetic unlinked creator
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$chrome"
          ANEVUM_UNLINKED_ALPHA_VISUAL_TEST=1 node creator-v1/test/portal-offline-preview.mjs > /tmp/anevum-incident-fixture.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:4178/__ready >/dev/null; then break; fi
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4178/__ready > /dev/null
          timeout 50 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --virtual-time-budget=8000 --dump-dom http://127.0.0.1:4178/creator/ > /tmp/anevum-unlinked-home.html 2>/tmp/anevum-chrome-errors.log
          grep -Fq 'UNLINKED ALPHA RELEASE' /tmp/anevum-unlinked-home.html
          grep -Fq 'Public creator channel not linked.' /tmp/anevum-unlinked-home.html
          if grep -Fq '/creators/null' /tmp/anevum-unlinked-home.html; then
            echo "ERROR: An invented creator channel leaked to the DOM"
            exit 1
          fi
          echo "PASS: compiled frontend remains mounted and renders the project with an unlinked creator"
      - name: Exercise V089 home, menu and published-work search in real desktop and phone browsers
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          mkdir -p "$RUNNER_TEMP/v084-release-evidence"
          node creator-v1/test/portal-offline-preview.mjs > "$RUNNER_TEMP/v084-release-evidence/synthetic-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 65); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:4178/__ready >/dev/null; then ready=1; break; fi
            sleep 0.25
          done
          test "$ready" = 1
          node creator-v1/test/capture-home-navigation-v079.mjs "$chrome" http://127.0.0.1:4178 "$RUNNER_TEMP/v084-release-evidence"
          test -s "$RUNNER_TEMP/v084-release-evidence/acceptance.json"
          test -s "$RUNNER_TEMP/v084-release-evidence/home-phone.png"
          test -s "$RUNNER_TEMP/v084-release-evidence/wayfinder-phone.png"
          test -s "$RUNNER_TEMP/v084-release-evidence/search-phone.png"
          # Genuine WebGL animation must render at all four phone/tablet/desktop sizes.
          node creator-v1/test/capture-iren-guided-v080.mjs "$chrome" http://127.0.0.1:4178 "$RUNNER_TEMP/v084-release-evidence"
          test -s "$RUNNER_TEMP/v084-release-evidence/iren-scout-320.png"
          test -s "$RUNNER_TEMP/v084-release-evidence/iren-help-390.png"
          test -s "$RUNNER_TEMP/v084-release-evidence/iren-discover-1440.png"
          test -s "$RUNNER_TEMP/v084-release-evidence/iren-docked-top-320.png"
          echo V089_REAL_WEBGL_AND_RESPONSIVE_ACCEPTANCE=PASS >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare exact candidate promotion guard and verify rebuilt assets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/v091-promotion-guard.mjs" <<'V091_PROMOTION_GUARD'
          import {createHash,randomUUID} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';

          // Reviewed upload run 39430526806, release b0ecd978, application 0116b2ea.
          // Hashes come from that run's build-manifest.json and candidate-version.json.
          export const PIN=Object.freeze({
            original:'93cc7f07-cf39-457e-af69-c9f6f4c02d25',
            candidate:'4b5c5d60-6c8f-431a-a16c-b660c8baf650',
            originalEtag:'2c02ac225ced8bdecd764da9c878c7dd32d0cb0d32b8dc476206ef990f25e40a',
            candidateEtag:'aac1cf1ea0e181d977b2df852023f4bb6ae45b558bba1aacf9d637b1cccaf429',
            originalBindings:'9a3132a806de3fbe47a3f2fb5e5ab021a793835f5a1d6ca7d9f260b1c60efab4',
            candidateBindings:'2cf5986868659ac65f842c438c2a4b89083666ecbda446a85e53d109fbf51b43',
            routes:'45c0bd81f1ebbb401320db1f74a0960121c48a61a25a3a5e012d46ba3c9e3010',
            manifest:'7efc6d34dccf5d42a4d5727fc1b0078920d5453543b9f8a94798a0acac4e7077'
          });
          export const ASSETS=Object.freeze([
            {path:'index.html',bytes:2553,sha256:'b84f86b4dc631d8d621c83b2d41d7c41a1beeb602d01537ed409c8fc0f9a753e'},
            {path:'assets/index-Cmx71yTs.js',bytes:794716,sha256:'dfbeded645663e8396890f4ad1a1d7251334d732e24b3c200c639d0cf7d22a3a'},
            {path:'assets/index-CGCMyZTx.css',bytes:765154,sha256:'dd363a90ed997b687954940ab697ceeb868157ef3965f25c82a4c3672194efde'},
            {path:'assets/iren-living-rig-v088-D_p8xTtN.js',bytes:12647,sha256:'c4539cc4f9124a32a8096293bd8757774838902c4fae30ccd1d3c9ed5b236d0e'}
          ]);
          // Same authorized native CSS suffix observed on the original and pilot bundles.
          export const CSS_OVERLAY=Object.freeze({bytes:29686,sha256:'b2e7546bb679dc2cf323aed14706e33066afd1a2b666df8326e938dc8ca2b773'});
          export const RUNTIME=Object.freeze({
            assets:{not_found_handling:'single-page-application',serve_directly:false,raw_run_worker_first:true,base_path:'/'},
            compatibility_date:'2026-10-17',compatibility_flags:['nodejs_compat'],usage_model:'standard'
          });
          const need=(value,message)=>{if(!value)throw Error('V091 '+message);};
          export const stable=value=>JSON.stringify(value,(_,v)=>v&&typeof v==='object'&&!Array.isArray(v)?
            Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b))):v);
          export const sha=value=>createHash('sha256').update(value).digest('hex');
          const same=(a,b)=>stable(a)===stable(b);
          const uuid=value=>typeof value==='string'&&/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/.test(value);
          export function bindingLock(bindings){
            need(Array.isArray(bindings),'Worker bindings missing');
            need(bindings.every(b=>b&&typeof b.name==='string')&&new Set(bindings.map(b=>b.name)).size===bindings.length,'duplicate or invalid binding');
            return stable(bindings.map(b=>b.type==='d1'?{name:b.name,type:b.type,database_id:b.database_id||b.id}:b)
              .sort((a,b)=>a.name.localeCompare(b.name)));
          }
          export const routeLock=routes=>stable(routes.map(({pattern,script,request_limit_fail_open})=>
            ({pattern,script,request_limit_fail_open})).sort((a,b)=>a.pattern.localeCompare(b.pattern)));
          export function deploymentLock(deployment){
            need(deployment?.strategy==='percentage'&&Array.isArray(deployment.versions),'invalid deployment');
            return stable({strategy:deployment.strategy,versions:[...deployment.versions].sort((a,b)=>a.version_id.localeCompare(b.version_id))});
          }
          export const pilot=()=>({strategy:'percentage',versions:[{version_id:PIN.original,percentage:100},{version_id:PIN.candidate,percentage:0}]});
          export const promoted=()=>({strategy:'percentage',versions:[{version_id:PIN.candidate,percentage:100}]});
          export function requireDeployment(deployment,expected){
            need(deploymentLock(deployment)===deploymentLock(expected),'deployment versions or exact percentages changed');
          }
          const settingsLock=settings=>stable(Object.fromEntries(['placement','usage_model','tags','tail_consumers','logpush','observability']
            .filter(key=>key in settings).map(key=>[key,settings[key]])));
          export function validateSnapshot(snapshot,reviewedRoutes,mode='pilot',pins=PIN){
            requireDeployment(snapshot.deployment,mode==='pilot'?pilot():promoted());
            need(uuid(snapshot.deployment.id),'deployment identifier missing');
            need(snapshot.latest.items?.[0]?.id===PIN.candidate,'latest upload is not the reviewed candidate');
            const original=snapshot.original,candidate=snapshot.candidate;
            need(original.id===PIN.original&&candidate.id===PIN.candidate,'Worker version identity changed');
            need(original.resources?.script?.etag===pins.originalEtag&&candidate.resources?.script?.etag===pins.candidateEtag,'Worker code ETag changed');
            const originalBindings=original.resources.bindings,candidateBindings=candidate.resources.bindings;
            need(originalBindings?.length===24&&candidateBindings?.length===26,'original or candidate binding count changed');
            need(sha(bindingLock(originalBindings))===pins.originalBindings,'original binding lock changed');
            need(sha(bindingLock(candidateBindings))===pins.candidateBindings,'candidate binding lock changed');
            need(bindingLock(candidateBindings)===bindingLock([...originalBindings,
              {name:'CANONICAL_PACKAGE_PROOF_ENABLED',type:'plain_text',text:'true'},
              {name:'CANONICAL_PACKAGE_PROOF_KEY',type:'secret_text'}]),'unreviewed candidate binding delta');
            need(bindingLock(snapshot.settings.bindings)===bindingLock(candidateBindings),'latest settings differ from the candidate');
            const vars=Object.fromEntries(candidateBindings.filter(b=>b.type==='plain_text').map(b=>[b.name,b.text]));
            for(const key of ['ANEVUM_LAUNCH_APPROVED','ANEVUM_CANONICAL_APEX_ENABLED','CANONICAL_SCHEMA_APPROVED','CANONICAL_EMAIL_ENABLED','CANONICAL_RECOGNITION_ENABLED'])
              need(vars[key]==='true','canonical launch flags changed');
            need(vars.ANEVUM_PRELAUNCH_MODE==='public'&&vars.CANONICAL_CREATOR_UPLOADS_ENABLED==='false','public mode or creator upload flag changed');
            need(vars.CANONICAL_VERIFIED_ROLES_ENABLED!=='true'&&vars.CANONICAL_REPUTATION_ENABLED!=='true','optional role or reputation feature enabled');
            need(same(original.resources.script_runtime,RUNTIME)&&same(candidate.resources.script_runtime,RUNTIME),'runtime or asset policy changed');
            need(snapshot.settings.compatibility_date===RUNTIME.compatibility_date&&same(snapshot.settings.compatibility_flags,RUNTIME.compatibility_flags),'latest compatibility settings changed');
            need(settingsLock(snapshot.settings)===stable({placement:{},usage_model:'standard',tags:[],tail_consumers:[],logpush:false}),'non-versioned settings changed');
            need(snapshot.exposure.enabled===false&&snapshot.exposure.previews_enabled===false,'Worker public exposure changed');
            need(Array.isArray(snapshot.routes)&&snapshot.routes.length===38&&Array.isArray(reviewedRoutes)&&reviewedRoutes.length===38,'route count changed');
            need(routeLock(snapshot.routes)===routeLock(reviewedRoutes)&&sha(routeLock(snapshot.routes))===pins.routes,'reviewed route inventory changed');
          }
          export function verifyAsset(bytes,pin,{prefix=false}={}){
            need(prefix?bytes.length>=pin.bytes:bytes.length===pin.bytes,'accepted asset length changed');
            need(sha(prefix?bytes.subarray(0,pin.bytes):bytes)===pin.sha256,'accepted asset hash changed');
          }
          export function verifyBuild(directory){
            for(const pin of ASSETS)verifyAsset(readFileSync(join(directory,pin.path)),pin);
          }
          export function verifyServedCss(bytes,pin=ASSETS.find(asset=>asset.path.endsWith('.css')),suffix=CSS_OVERLAY){
            need(bytes.length===pin.bytes+suffix.bytes,'served stylesheet length differs from the accepted build plus authorized overlay');
            verifyAsset(bytes.subarray(0,pin.bytes),pin);
            verifyAsset(bytes.subarray(pin.bytes),suffix);
          }
          const BASE='/accounts/2f7ee83107240152097efd956a4e8335/workers/scripts/anevum-apex-prelaunch-gateway';
          const ROUTES='/zones/8abe27259b5436af5966d3b40d9a3760/workers/routes';
          export async function snapshot(api){
            const paths=[BASE+'/deployments?per_page=1',BASE+'/versions?per_page=1',BASE+'/versions/'+PIN.original,
              BASE+'/versions/'+PIN.candidate,BASE+'/settings',ROUTES,BASE+'/subdomain'];
            const results=await Promise.allSettled(paths.map(path=>api(path)));
            const failure=results.find(result=>result.status==='rejected');if(failure)throw failure.reason;
            const [deployments,latest,original,candidate,settings,routes,exposure]=results.map(result=>result.value);
            return {deployment:deployments.deployments?.[0],latest,original,candidate,settings,routes,exposure};
          }
          const latestDeployment=async api=>(await api(BASE+'/deployments?per_page=1')).deployments?.[0];
          export async function prepare(api,reviewedRoutes,save,pins=PIN){
            const before=await snapshot(api);validateSnapshot(before,reviewedRoutes,'pilot',pins);
            const journal={before:before.deployment,attempted:false,promotedId:null,marker:'V091 exact-candidate promotion '+randomUUID()};
            save(journal);return journal;
          }
          export async function promote(api,reviewedRoutes,journal,save,pins=PIN){
            const immediate=await snapshot(api);validateSnapshot(immediate,reviewedRoutes,'pilot',pins);
            need(immediate.deployment.id===journal.before.id&&deploymentLock(immediate.deployment)===deploymentLock(journal.before),'deployment changed before promotion');
            need((await latestDeployment(api))?.id===journal.before.id,'concurrent deployment before promotion');
            journal.attempted=true;save(journal);
            const result=await api(BASE+'/deployments',{method:'POST',body:{...promoted(),annotations:{'workers/message':journal.marker}}});
            // POST acknowledges only {id}; GET is authoritative for the deployed shape.
            journal.promotedId=uuid(result?.id)?result.id:null;save(journal);
            need(journal.promotedId,'promotion response lacks a deployment identifier');
            const deployed=await latestDeployment(api);
            need(deployed?.id===journal.promotedId&&deployed.annotations?.['workers/message']===journal.marker,'promotion readback does not match the acknowledged deployment');
            requireDeployment(deployed,promoted());
            return deployed;
          }
          export async function postflight(api,reviewedRoutes,journal,pins=PIN){
            const after=await snapshot(api);validateSnapshot(after,reviewedRoutes,'promoted',pins);
            need(after.deployment.id===journal.promotedId&&after.deployment.annotations?.['workers/message']===journal.marker,'latest deployment does not belong to this promotion');
            return after;
          }
          export async function rollback(api,journal,save=()=>{}){
            if(!journal.attempted)return 'NO_PROMOTION_ATTEMPTED';
            requireDeployment(journal.before,pilot());
            const current=await latestDeployment(api);
            if(current?.id===journal.before.id){
              // A prior-ID GET can be stale even when the POST acknowledgement was lost.
              need(false,journal.promotedId?
                'rollback unconfirmed: prior deployment read is stale or inconclusive after an acknowledged promotion':
                'rollback unconfirmed: prior deployment read cannot establish the outcome of an unacknowledged promotion');
            }
            const markerMatches=current?.annotations?.['workers/message']===journal.marker;
            let owned=uuid(journal.promotedId)&&current?.id===journal.promotedId&&markerMatches;
            if(!journal.promotedId&&markerMatches){
              // A lost POST response is recoverable only with this unique marker AND the intended result.
              try{requireDeployment(current,promoted());owned=true;}catch{}
            }
            need(owned,'rollback refused: latest deployment ownership is unproven or an external writer changed it');
            const immediate=await latestDeployment(api);
            need(immediate?.id===current.id&&same(immediate,current),'rollback refused: deployment changed during ownership check');
            // Restore the recorded 100%/0% pair, retaining the candidate proof secret.
            // Cloudflare offers no conditional deployment POST; all apex writers must serialize.
            const body={strategy:journal.before.strategy,versions:journal.before.versions};
            if(journal.before.annotations)body.annotations=journal.before.annotations;
            const result=await api(BASE+'/deployments',{method:'POST',body});
            journal.rollbackId=uuid(result?.id)?result.id:null;save(journal);
            need(journal.rollbackId,'rollback response lacks a deployment identifier');
            const restored=await latestDeployment(api);
            need(restored?.id===journal.rollbackId,'rollback was superseded or not visible during verification');
            need(restored.annotations?.['workers/message']===journal.before.annotations?.['workers/message'],'rollback readback marker differs from the recorded pilot');
            requireDeployment(restored,journal.before);
            return 'RECORDED_PILOT_RESTORED';
          }
          async function main(){
            const [action,path]=process.argv.slice(2);
            if(action==='assets'){need(!path,'unexpected assets argument');verifyBuild('creator-v1/dist/web');return;}
            if(action==='live-css'){
              need(typeof path==='string','missing downloaded stylesheet');
              verifyServedCss(readFileSync(path));return;
            }
            need(['prepare','promote','postflight','rollback'].includes(action)&&!path,'unknown promotion operation');
            const token=process.env.CLOUDFLARE_API_TOKEN;
            need(token&&process.env.CLOUDFLARE_ACCOUNT_ID==='2f7ee83107240152097efd956a4e8335','Cloudflare context missing or changed');
            const api=async(path,{method='GET',body}={})=>{
              let response;try{response=await fetch('https://api.cloudflare.com/client/v4'+path,{method,
                headers:{authorization:'Bearer '+token,...(body?{'content-type':'application/json'}:{})},
                ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(40000)});}catch{throw Error('V091 Cloudflare request failed; outcome requires verification');}
              let value;try{value=await response.json();}catch{throw Error('V091 Cloudflare returned an invalid response');}
              // Never emit API bodies, bindings, tokens, identities, or private resource IDs.
              need(response.ok&&value.success===true,'Cloudflare operation blocked (HTTP '+response.status+', codes '+
                (value.errors||[]).map(error=>Number.isInteger(error.code)?error.code:'unknown').join(',')+')');
              return value.result;
            };
            const journalPath=join(process.env.RUNNER_TEMP,'v091-promotion-journal.json');
            const save=journal=>writeFileSync(journalPath,JSON.stringify(journal),{mode:0o600});
            const reviewedRoutes=JSON.parse(readFileSync('creator-v1/operations/staff-transport-v091.json','utf8')).routes;
            if(action==='prepare')await prepare(api,reviewedRoutes,save);
            else{
              const journal=JSON.parse(readFileSync(journalPath,'utf8'));
              if(action==='promote')await promote(api,reviewedRoutes,journal,save);
              if(action==='postflight')await postflight(api,reviewedRoutes,journal);
              if(action==='rollback')console.log('V091_ROLLBACK='+await rollback(api,journal,save));
            }
          }
          if(process.argv[1]&&import.meta.url===pathToFileURL(process.argv[1]).href){
            try{await main();}catch(error){console.error('::error::'+(error.message.startsWith('V091 ')?error.message:'V091 promotion guard failed'));process.exitCode=1;}
          }
          V091_PROMOTION_GUARD
          node "$RUNNER_TEMP/v091-promotion-guard.mjs" assets
      - name: Verify the preserved staff identity transport
        run: node --test creator-v1/test/staff-session-transport-v091.test.mjs creator-v1/test/staff-transport-release-v091.test.mjs
      - name: Verify or repair the five pinned staff identity Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node creator-v1/ops/v091-staff-transport.mjs --apply
      - name: Promote exact accepted V091 candidate with pinned pilot rollback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
