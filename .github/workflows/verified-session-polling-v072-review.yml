name: ANEVUM V072 Bounded Session Polling Review

on:
  pull_request:
    branches:
      - integrate/functional-entry-v071-on-v069-20261017-003
    paths:
      - creator-v1/canonical-auth/auth.mjs
      - creator-v1/test/verified-session-polling-v072.test.mjs
      - docs/creator-platform/ANEVUM-V072-SESSION-POLLING-2026-10-18.md
      - .github/workflows/verified-session-polling-v072-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-review:
    runs-on: ubuntu-latest
    if: github.repository == 'anevum/anevum-web'
    timeout-minutes: 20
    steps:
      - name: Checkout pinned exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert tested source equals PR head
        env:
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and production React build
        run: |
          node --check creator-v1/canonical-auth/auth.mjs
          node --check creator-v1/test/verified-session-polling-v072.test.mjs
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Two-session, one-NAT bounded polling plus existing identity tests
        run: |
          node --test creator-v1/test/verified-session-polling-v072.test.mjs
          node --test creator-v1/test/canonical-real-session-v019.test.mjs creator-v1/test/canonical-otp-resend-v023.test.mjs
          node --test creator-v1/test/signup-origin-policy-v029.test.mjs creator-v1/test/canonical-open-signup-gate-v020.test.mjs
      - name: Do not deploy or mutate records
        run: |
          echo "V072_SOURCE_TESTS_ONLY=PASS"
          echo "No Cloudflare write, secret read, real OTP, member change or staff role grant."
