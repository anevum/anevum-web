name: ANEVUM Native Pack V002 - quarantined upload verification
on:
  push:
    branches: [build/native-pack-quarantine-v002-20261017]
    paths:
      - ".github/workflows/native-pack-quarantine-v002-verify.yml"
      - "creator-v1/canonical-auth/native-pack-quarantine.mjs"
      - "creator-v1/canonical-auth/studio-assets.mjs"
      - "creator-v1/canonical-auth/studio-submissions.mjs"
      - "creator-v1/canonical-auth/studio.mjs"
      - "creator-v1/web/src/lib/canonical-studio.ts"
      - "creator-v1/web/src/pages/CanonicalStudioPage.tsx"
      - "creator-v1/test/native-pack-quarantine-v002.test.mjs"
      - "creator-v1/web/src/lib/anevum-native-pack.ts"
      - "docs/creator-platform/ANEVUM-NATIVE-PACKS-V002-2026-10-17.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anevum-native-pack-v002-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-native-quarantine:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate new native quarantine end-to-end
        run: node --experimental-strip-types --test creator-v1/test/native-pack-quarantine-v002.test.mjs
      - name: Regress existing private Studio and data ownership flows
        run: |
          node --experimental-strip-types --test creator-v1/test/canonical-studio-v043.test.mjs
          node --experimental-strip-types --test creator-v1/test/native-pack-v001.test.mjs
      - name: Check private quarantine modules
        run: |
          node --check creator-v1/canonical-auth/native-pack-quarantine.mjs
          node --check creator-v1/canonical-auth/studio-assets.mjs
          node --check creator-v1/canonical-auth/studio.mjs
          node --check creator-v1/canonical-auth/studio-submissions.mjs
      - name: Typecheck Creator V1 frontend
        run: npm run check:creator-v1-web
      - name: Compile production and staging-path frontend artifacts (no deploy)
        run: |
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
      - name: Verify source-only boundary
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const v=fs.readFileSync('creator-v1/canonical-auth/native-pack-quarantine.mjs','utf8');if(/eval\s*\(|new Function|dangerouslySetInnerHTML|execSync\s*\(/.test(v))process.exit(1)"
          git diff --exit-code
