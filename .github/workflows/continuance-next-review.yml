name: ANEVUM Continuance Next Source Review
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/experience/continuance-next/**'
      - 'creator-v1/web/review/continuance-next/**'
      - 'creator-v1/web/vite.continuance-next-review.config.ts'
      - 'creator-v1/test/*continuance-next*'
      - '.github/workflows/continuance-next-review.yml'
permissions:
  contents: read
concurrency:
  group: continuance-next-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record exact head and verify isolation from V131
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/continuance-next
          git rev-parse HEAD > evidence/continuance-next/source-sha.txt
          git diff --name-status ad0d3aef473e12c124b003d2c3bb45b79bff520e HEAD > evidence/continuance-next/source-diff.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const lines=fs.readFileSync('evidence/continuance-next/source-diff.txt','utf8').trim().split('\n');
          const allowed=/^(creator-v1\/web\/src\/experience\/continuance-next\/|creator-v1\/web\/review\/continuance-next\/|creator-v1\/web\/vite\.continuance-next-review\.config\.ts$|creator-v1\/test\/[^/]*continuance-next[^/]*$|docs\/production\/continuance-next-ov03-20261023\.md$|\.github\/workflows\/continuance-next-review\.yml$)/;
          for(const line of lines){const [status,path]=line.split('\t');if(status!=='A'||!allowed.test(path))throw Error('Out-of-scope change: '+line);}
          JS
      - name: Install unchanged repository frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck, deterministic contracts, normal build and no-leak check
        run: |
          set -euo pipefail
          npm run check:creator-v1-web
          node --experimental-strip-types --test creator-v1/test/continuance-next-action-lens.test.mjs creator-v1/test/continuance-next-isolation.test.mjs
          npm run build:creator-v1-web
          AVNEXT_CHECK_PRODUCTION=1 node --test creator-v1/test/continuance-next-isolation.test.mjs
      - name: Build separate review and install browser tooling
        run: |
          npx --no-install vite build --config creator-v1/web/vite.continuance-next-review.config.ts
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Inspect actual compiled React across desktop and mobile
        run: python creator-v1/test/capture-continuance-next.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuance-next-source-review
          path: |
            evidence/continuance-next
            creator-v1/dist/continuance-next-review
          retention-days: 14
