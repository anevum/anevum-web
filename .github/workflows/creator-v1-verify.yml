name: ANEVUM Creator V1 Verify

on:
  workflow_dispatch:
  push:
    branches: [production/creator-v1, build/anevum-v1-foundation-20261011, build/anevum-v1-newyear-overhaul-20261011]
    paths:
      - creator-v1/**
      - community-preview/worker.js
      - docs/production/**
      - .github/workflows/creator-v1-verify.yml
  pull_request:
    paths:
      - creator-v1/**
      - community-preview/worker.js
      - docs/production/**
      - .github/workflows/creator-v1-verify.yml

permissions:
  contents: read

concurrency:
  group: creator-v1-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize evidence directory
        run: mkdir -p evidence
      - name: Install component frontend toolchain
        shell: bash
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck and build component Creator V1 frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
          node --test creator-v1/test/react-staging-route.test.mjs
      - name: Preserve exact source and pre-production checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git archive --format=zip --output=evidence/candidate-source.zip HEAD
          git archive --format=zip --output=evidence/pre-production-source.zip e34faf8ad72d319e469eface8aec7fe26741951f
          sha256sum evidence/*-source.zip > evidence/source-archives.sha256
      - name: Build approved identity and run public isolated tests
        working-directory: creator-v1
        shell: bash
        run: |
          set -euo pipefail
          npm test 2>&1 | tee ../evidence/public-tests.log
          npm run test:project-readiness 2>&1 | tee ../evidence/project-readiness-tests.log
      - name: Build member interface and reject generated brand drift
        run: |
          node creator-v1/auth/build.mjs
          git diff --exit-code -- creator-v1/auth/join.mjs
      - name: Verify all member, staff, privacy and integrated journey tests
        shell: bash
        run: |
          set -euo pipefail
          node --test creator-v1/auth/tests/*.test.mjs creator-v1/integration/*.test.mjs 2>&1 | tee evidence/member-integration-tests.log
      - name: Check deployable Workers and generated browser scripts
        shell: bash
        run: |
          set -euo pipefail
          for file in creator-v1/auth/*.mjs creator-v1/authoring/*.mjs creator-v1/shared/*.mjs creator-v1/site/*.mjs creator-v1/dist/worker.mjs; do
            node --check "$file"
          done
          node --input-type=module -e 'import {Script} from "node:vm"; import {COMMUNITY_CLIENT} from "./creator-v1/auth/community-ui.mjs"; import {VOTE_APP} from "./creator-v1/authoring/vote-moderation-ui.mjs"; import {SOCIAL_CLIENT} from "./creator-v1/auth/social-ui.mjs"; import {PRIVACY_CLIENT} from "./creator-v1/auth/privacy-ui.mjs"; import {PRIVACY_APP} from "./creator-v1/authoring/privacy-queue-ui.mjs"; for (const source of [COMMUNITY_CLIENT,VOTE_APP,SOCIAL_CLIENT,PRIVACY_CLIENT,PRIVACY_APP]) new Script(source);'
      - name: Capture real React at desktop and phone widths for owner design review
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/portal-review
          chrome="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "CAPTURE_UNAVAILABLE: headless browser not installed" | tee evidence/portal-review/capture-status.txt
            exit 1
          fi
          node creator-v1/test/portal-offline-preview.mjs > evidence/portal-review/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:4178/__ready >/dev/null; then ready=1; break; fi
            sleep 0.2
          done
          test "$ready" = 1
          capture() {
            width="$1"
            height="$2"
            name="$3"
            route="$4"
            output="evidence/portal-review/$name-$width.png"
            timeout 35 "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --hide-scrollbars --window-size="$width,$height" --virtual-time-budget=4500 --screenshot="$output" "http://127.0.0.1:4178$route" > evidence/portal-review/chrome-log.txt 2>&1
            test -s "$output"
          }
          capture 1440 900 home /creator/
          capture 1440 900 start /creator/start
          capture 1440 900 field-guide /creator/guide
          capture 1440 900 launcher-host /creator/start
          capture 1440 900 discover-free /creator/discover?free=1
          capture 1440 900 discover /creator/discover
          capture 1440 900 creators /creator/creators
          capture 1440 900 project /creator/projects/00000000000000000000000000000001
          capture 1440 900 levels /creator/levels
          capture 1440 900 community /creator/community
          capture 390 844 home /creator/
          capture 390 844 start /creator/start
          capture 390 844 field-guide /creator/guide
          capture 390 844 discover /creator/discover
          capture 390 844 creators /creator/creators
          capture 1440 900 profile-editor /creator/account/edit
          capture 390 844 profile-editor /creator/account/edit
          capture 1440 900 project-editor /creator/create/new
          capture 390 844 project-editor /creator/create/new
          capture 320 720 home /creator/
          capture 320 720 start /creator/start
          capture 320 720 field-guide /creator/guide
          printf 'These PNG files render the actual compiled React/Vite candidate using explicitly SYNTHETIC OFFLINE design fixtures, including a fake in-memory creator identity for the profile-editor layout only. No fixture records, accounts, cookies or codes are deployed to any staging or production database. Review desktop 1440px before phone 390px. This is visual QA, not authentication, real-user or provider acceptance.\n' > evidence/portal-review/README.txt
          echo "PORTAL_VISUAL_CAPTURE=PASS" | tee evidence/portal-review/capture-status.txt

      - name: Preserve generated public artifact for visual review
        if: always()
        shell: bash
        run: |
          test ! -f creator-v1/site/generated.mjs || cp creator-v1/site/generated.mjs evidence/site-generated.mjs
          test ! -f creator-v1/dist/worker.mjs || cp creator-v1/dist/worker.mjs evidence/worker.mjs
          test ! -f creator-v1/dist/build-manifest.json || cp creator-v1/dist/build-manifest.json evidence/build-manifest.json
          test ! -d creator-v1/dist/web || cp -R creator-v1/dist/web evidence/react-web
          test ! -d creator-v1/dist/react-staging || cp -R creator-v1/dist/react-staging evidence/react-staging
      - name: Upload reproducible source, test logs and public build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-v1-build-${{ github.run_id }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

# No Cloudflare secrets, deployment, migrations, account or broker access.
