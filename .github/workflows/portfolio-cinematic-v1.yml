name: Portfolio Cinematic V1
on:
  pull_request:
    paths:
      - 'creator-v1/web/public/portfolio/**'
      - 'creator-v1/test/portfolio-cinematic-v1.test.mjs'
      - '.github/workflows/portfolio-cinematic-v1.yml'
permissions:
  contents: read
jobs:
  portfolio-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check portfolio client script syntax
        run: |
          node --check creator-v1/web/public/portfolio/app.js
          node --check creator-v1/web/public/portfolio/cinematic-v1.js
      - name: Verify source, assets, accessibility, and gated motion
        run: node --test creator-v1/test/portfolio-cinematic-v1.test.mjs
