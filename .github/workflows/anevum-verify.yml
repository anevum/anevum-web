name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test canonical operational boundary
        run: node --experimental-strip-types --test tests/command-topology.test.mjs tests/command-iren.test.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          current_pdf="$(jq -r '.currentPdfPath' public/release-registry.json)"
          test -s "dist/client$current_pdf"
          test -s dist/client/devon-akins-resume.pdf
          test -f dist/client/sitemap.xml
          test -f dist/client/release-registry.json
          test -n "$(find dist -name wrangler.json -print -quit)"
          python - <<'PY'
          from pathlib import Path
          pdf = Path("dist/client/devon-akins-resume.pdf").read_bytes()
          assert pdf.startswith(b"%PDF-")
          assert len(pdf) > 10_000
          print("resume pdf bytes:", len(pdf))
          PY

      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe routes, SEO, PDF, and public privacy contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.preview.outputs.preview_url }}"
          current_slug="$(jq -r '.currentSlug' public/release-registry.json)"
          public_routes="$(node --input-type=module -e 'import fs from "node:fs"; const routes=JSON.parse(fs.readFileSync("src/data/public-routes.json","utf8")); process.stdout.write(routes.filter((route)=>route.sitemap).map((route)=>route.path).join(" "))')"

          for path in $public_routes "/releases/$current_slug" /private /command /command/performance /iren /iren.webmanifest; do
            curl --fail --show-error --silent "$base$path" > /dev/null
          done

          curl --fail --show-error --silent "$base/devon-akins-resume.pdf" > "$RUNNER_TEMP/devon-akins-resume.pdf"
          test -s "$RUNNER_TEMP/devon-akins-resume.pdf"
          head -c 5 "$RUNNER_TEMP/devon-akins-resume.pdf" | grep -Fq '%PDF-'

          products_html="$(curl --fail --show-error --silent "$base/products")"
          printf '%s' "$products_html" | grep -Fq '<meta property="og:title" content="Products — ANEVUM" />'
          printf '%s' "$products_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/products" />'

          founder_html="$(curl --fail --show-error --silent "$base/founder")"
          printf '%s' "$founder_html" | grep -Fq '<meta property="og:title" content="Devon Akins — Founder, ANEVUM" />'
          printf '%s' "$founder_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/founder" />'

          performance_html="$(curl --fail --show-error --silent "$base/performance")"
          printf '%s' "$performance_html" | grep -Fq '<meta property="og:title" content="Performance — ANEVUM" />'
          printf '%s' "$performance_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/performance" />'

          sitemap="$(curl --fail --show-error --silent "$base/sitemap.xml")"
          for path in /products /products/iren /products/rhen /products/nostra /products/graen /products/velum /performance /research /founder /resume /releases; do
            printf '%s' "$sitemap" | grep -Fq "https://anevum.com$path"
          done

          feed_file="$RUNNER_TEMP/public-trading-feed.json"
          feed_status="$(curl --show-error --silent -o "$feed_file" -w '%{http_code}' "$base/api/public/trading/live")"
          test "$feed_status" = "503"
          jq -e '
            .ok == false and
            .status == "REBUILDING" and
            .source == "anevum_public_rebuild" and
            .data_state == "OFFLINE_BY_DESIGN" and
            .since == "2026-10-01" and
            (.priority_systems == ["RHEN", "GRAEN"]) and
            (.message | type == "string")
          ' "$feed_file" > /dev/null

          curl --fail --show-error --silent --head "$base/command" | grep -qi 'x-robots-tag:.*noindex'

      - name: Verify browser runtime and horizontal overflow
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: node scripts/browser-runtime-qa.mjs

      - name: Capture browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.preview.outputs.preview_url }}"
          mkdir -p "$RUNNER_TEMP/anevum-visuals"

          chrome_retry() {
            local attempt=1
            while true; do
              if google-chrome "$@"; then
                return 0
              fi
              if [ "$attempt" -ge 2 ]; then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 1
            done
          }

          capture() {
            name="$1"
            path="$2"
            marker="$3"
            rendered="$RUNNER_TEMP/anevum-visuals/$name-rendered.html"
            common=(--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-sync --no-first-run --virtual-time-budget=7000)

            chrome_retry "${common[@]}" --hide-scrollbars --window-size=1440,1000 --screenshot="$RUNNER_TEMP/anevum-visuals/$name-desktop.png" "$base$path"
            chrome_retry "${common[@]}" --hide-scrollbars --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/$name-mobile.png" "$base$path"

            for attempt in 1 2 3; do
              if chrome_retry "${common[@]}" --dump-dom "$base$path" > "$rendered" && grep -Fq "$marker" "$rendered"; then
                return 0
              fi
              echo "Rendered marker not ready for $path (attempt $attempt/3): $marker" >&2
              sleep 1
            done

            echo "Rendered marker missing after retries for $path: $marker" >&2
            tail -c 2500 "$rendered" >&2 || true
            return 1
          }

          capture home / 'ANEVUM is rebuilding its core stack from the ground up.'
          capture products /products 'IREN'
          capture rhen /products/rhen 'OBSERVE'
          capture performance /performance 'Separate markets. Separate records.'
          capture research /research 'Development journal.'
          capture field-note /research/multi-market-architecture-equities-crypto 'REPRODUCE / CHALLENGE THIS NOTE'
          capture architecture /architecture 'One company. Specialized systems.'
          capture case-studies /case-studies 'SYSTEM DESIGN'
          capture founder /founder 'Devon Akins'
          capture resume /resume 'Technical Skills'

          grep -Fq 'company-home' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'NOSTRA' "$RUNNER_TEMP/anevum-visuals/products-rendered.html"
          grep -Fq 'VELUM' "$RUNNER_TEMP/anevum-visuals/products-rendered.html"

      - name: Upload browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anevum-preview-visuals
          path: |
            ${{ runner.temp }}/anevum-visuals
            dist/client/devon-akins-resume.pdf
          retention-days: 3
