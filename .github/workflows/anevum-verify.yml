name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0" "Pillow==11.3.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test canonical operational boundary
        run: node --experimental-strip-types --test tests/command-topology.test.mjs tests/command-operations.test.mjs tests/command-trading.test.mjs tests/command-research.test.mjs tests/equity-market-time.test.mjs tests/visual-ops.test.mjs tests/command-live.test.mjs tests/reconciliation-visibility.test.mjs tests/rhen-realtime.test.mjs tests/public-feed-sse.test.mjs
      - name: Verify member boundaries
        run: npm run test:members
      - name: Verify Commons invitation, privacy and moderation boundaries
        run: node --test tests/commons.test.mjs
      - name: Verify member D1 binding isolation
        run: node --test tests/member-bindings.test.mjs tests/member-staging.test.mjs tests/member-preview-migration.test.mjs tests/member-command-cutover.test.mjs tests/member-command-navigation.test.mjs && node scripts/verify-member-bindings.mjs --require-config
      - name: Verify Cloudflare Command Access cutover safety (offline)
        run: python -m unittest discover -s tests -p 'test_command_access_cutover.py' -v
      - name: Verify member schema and tenant separation
        run: python scripts/verify-member-schema.py
      - name: Typecheck and build
        run: npm run build
      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          current_pdf="$(jq -r '.currentPdfPath' public/release-registry.json)"
          test -s "dist/client$current_pdf"
          test -s dist/client/devon-akins-resume.pdf
          test -f dist/client/sitemap.xml
          test -f dist/client/release-registry.json
          test -n "$(find dist -name wrangler.json -print -quit)"
          python - <<'PY'
          from pathlib import Path
          pdf = Path("dist/client/devon-akins-resume.pdf").read_bytes()
          assert pdf.startswith(b"%PDF-")
          assert len(pdf) > 10_000
          print("resume pdf bytes:", len(pdf))
          PY

      - name: Deploy production to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}-${{ github.run_id }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe routes, SEO, PDF, and public privacy contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          base="${{ steps.preview.outputs.preview_url }}"
          current_slug="$(jq -r '.currentSlug' public/release-registry.json)"
          public_routes="$(node --input-type=module -e 'import fs from "node:fs"; const routes=JSON.parse(fs.readFileSync("src/data/public-routes.json","utf8")); process.stdout.write(routes.filter((route)=>route.sitemap).map((route)=>route.path).join(" "))')"

          for path in $public_routes "/products/rhen/releases/$current_slug" /private /command /command/public /command/performance /iren /iren.webmanifest; do
            curl --fail --show-error --silent "$base$path" > /dev/null
          done

          curl --fail --show-error --silent "$base/devon-akins-resume.pdf" > "$RUNNER_TEMP/devon-akins-resume.pdf"
          test -s "$RUNNER_TEMP/devon-akins-resume.pdf"
          head -c 5 "$RUNNER_TEMP/devon-akins-resume.pdf" | grep -Fq '%PDF-'

          live_html="$(curl --fail --show-error --silent "$base/products/rhen/evidence")"
          printf '%s' "$live_html" | grep -Fq '<meta property="og:title" content="RHEN Public Evidence — ANEVUM" />'
          printf '%s' "$live_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/products/rhen/evidence" />'

          about_html="$(curl --fail --show-error --silent "$base/about")"
          printf '%s' "$about_html" | grep -Fq '<meta property="og:title" content="About — ANEVUM" />'
          printf '%s' "$about_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/about" />'

          sitemap="$(curl --fail --show-error --silent "$base/sitemap.xml")"
          for path in /products /feed /field-notes /about /resume /products/rhen /products/rhen/evidence /products/rhen/architecture /products/rhen/releases; do
            printf '%s' "$sitemap" | grep -Fq "https://anevum.com$path"
          done

          for legacy in /founder /live /performance /research /architecture /releases /case-studies /theory /products/iren /products/nostra /products/graen /products/velum; do
            status="$(curl --show-error --silent -o /dev/null -w '%{http_code}' "$base$legacy")"
            test "$status" = "308"
          done

          test "$(curl --show-error --silent -o /dev/null -w '%{http_code}' "$base/products")" = "200"
          test "$(curl --show-error --silent -o /dev/null -w '%{http_code}' "$base/products/rhen")" = "200"

          feed_file="$RUNNER_TEMP/public-trading-feed.json"
          feed_status="$(curl --show-error --silent -o "$feed_file" -w '%{http_code}' "$base/api/public/trading/live")"
          test "$feed_status" = "200"
          jq -e '
            .ok == true and
            .source == "rhen-core-sqlite" and
            .disclosure.level == "aggregate_only" and
            .systems.IREN.independent_runtime == false and
            .systems.RHEN.independent_runtime == false and
            .systems.GRAEN.independent_runtime == false and
            .systems.VELUM.independent_runtime == false and
            .systems.NOSTRA.independent_runtime == false and
            (.systems.NOSTRA.tracking_state | type == "string") and
            (.disclosure.excluded_fields | index("dollar_values") != null) and
            (.disclosure.excluded_fields | index("symbols") != null) and
            (.disclosure.excluded_fields | index("orders") != null) and
            (.disclosure.excluded_fields | index("fills") != null) and
            (.disclosure.excluded_fields | index("credentials") != null)
          ' "$feed_file" > /dev/null

          rhen_health_file="$RUNNER_TEMP/rhen-health.json"
          curl --fail --show-error --silent "https://alpaca-trader-production-bf3e.up.railway.app/health" > "$rhen_health_file"
          jq '{ok, module_failures, iren: .modules.iren, graen: .modules.graen, velum: .modules.velum, nostra: .modules.nostra, research_agent: .modules.research_agent}' "$rhen_health_file"
          jq -e '
            .ok == true and
            (.module_failures | length) == 0 and
            .modules.iren.ok == true and
            .modules.iren.body.durable_state_current == true and
            .modules.iren.body.work_engine.running == true and
            .modules.graen.ok == true and
            .modules.velum.ok == true and
            .modules.nostra.ok == true and
            .modules.research_agent.ok == true
          ' "$rhen_health_file" > /dev/null

          curl --fail --show-error --silent --head "$base/command" | grep -qi 'x-robots-tag:.*noindex'

      - name: Verify browser runtime and horizontal overflow
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          node scripts/browser-runtime-qa.mjs
          node scripts/codex-handoff-browser-qa.mjs
          node scripts/visual-ops-browser-qa.mjs
          node scripts/member-command-browser-qa.mjs
      - name: Visual review contact sheets
        if: github.event_name == 'pull_request'
        run: python scripts/visual-ops-contact-sheet.py

      - name: Verify captured browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/anevum-visuals"
          for name in home products feed rhen terminal research field-note architecture about resume releases; do
            test -s "$evidence/$name-desktop.png"
            test -s "$evidence/$name-mobile.png"
            test -s "$evidence/$name-rendered.html"
          done
          grep -Fq 'commons-welcome' "$evidence/home-rendered.html"
          grep -Fq 'Good questions.' "$evidence/home-rendered.html"
          grep -Fq 'truth-products-page' "$evidence/products-rendered.html"
          grep -Fq 'truth-rhen-page' "$evidence/rhen-rendered.html"
          grep -Fq 'studio-about-page' "$evidence/about-rendered.html"
          grep -Fq 'feed-page' "$evidence/feed-rendered.html"
          grep -Fq 'studio-releases-page' "$evidence/releases-rendered.html"
          grep -Fq 'public-terminal-page' "$evidence/terminal-rendered.html"
          grep -Fq 'RESEARCH' "$evidence/terminal-rendered.html"
          grep -Fq 'REPLAY' "$evidence/terminal-rendered.html"
          grep -Fq 'RHEN' "$evidence/terminal-rendered.html"

      - name: Upload browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anevum-preview-visuals
          path: |
            ${{ runner.temp }}/anevum-visuals
            dist/client/devon-akins-resume.pdf
          retention-days: 3

