name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Export generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: anevum-generated-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Typecheck and build
        run: npm run build
      - name: Verify React and Cloudflare output
        shell: bash
        run: |
          test -f dist/client/index.html
          test -n "$(find dist -name wrangler.json -print -quit)"
          grep -Fq 'ANEVUM' dist/client/index.html
      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Probe preview routes and indexing policy
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ steps.preview.outputs.preview_url }}"
          for path in / /work /lab /record /notes /wiki /about /rhenlink /command; do
            curl --fail --show-error --silent "$base$path" > /dev/null
          done
          curl --fail --show-error --silent --head "$base/" | grep -qi 'x-robots-tag:.*noindex'
      - name: Capture browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ steps.preview.outputs.preview_url }}"
          mkdir -p "$RUNNER_TEMP/anevum-visuals"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=1440,1200 --screenshot="$RUNNER_TEMP/anevum-visuals/home-desktop.png" "$base/"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=5000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/home-mobile.png" "$base/"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$base/" > "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'Build.' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
      - name: Upload browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anevum-preview-visuals
          path: ${{ runner.temp }}/anevum-visuals
          retention-days: 3

