name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Verify React and Cloudflare output
        shell: bash
        run: |
          test -f dist/client/index.html
          test -n "$(find dist -name wrangler.json -print -quit)"
          grep -Fq 'ANEVUM' dist/client/index.html
      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Probe preview routes and public privacy contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ steps.preview.outputs.preview_url }}"
          for path in / /private /command; do
            curl --fail --show-error --silent "$base$path" > /dev/null
          done

          feed="$(curl --fail --show-error --silent "$base/api/public/trading/live")"
          printf '%s' "$feed" | jq -e '
            .ok == true and
            .source == "anevum_public_telemetry" and
            (.telemetry | type == "object") and
            (.events | type == "array") and
            (has("account") | not) and
            (has("positions") | not) and
            (has("recent_closed_positions") | not) and
            (has("recent_orders") | not) and
            (has("equity") | not) and
            ([.events[] | has("symbol")] | any | not) and
            ([.events[] | has("price")] | any | not) and
            ([.events[] | has("reason")] | any | not)
          ' > /dev/null

          curl --fail --show-error --silent --head "$base/" | grep -qi 'x-robots-tag:.*noindex'
      - name: Capture browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ steps.preview.outputs.preview_url }}"
          mkdir -p "$RUNNER_TEMP/anevum-visuals"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1200 --screenshot="$RUNNER_TEMP/anevum-visuals/home-desktop.png" "$base/#top"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/home-mobile.png" "$base/#top"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1200 --screenshot="$RUNNER_TEMP/anevum-visuals/demo-desktop.png" "$base/#demo"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/demo-mobile.png" "$base/#demo"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "$base/" > "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'public-frame' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'landing-hero' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'ANEVUM // PUBLIC CONSOLE' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'PUBLIC / SANITIZED' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
      - name: Upload browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anevum-preview-visuals
          path: ${{ runner.temp }}/anevum-visuals
          retention-days: 3
