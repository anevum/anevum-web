name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Verify React and Cloudflare output
        shell: bash
        run: |
          test -f dist/client/index.html
          test -n "$(find dist -name wrangler.json -print -quit)"
          grep -Fq 'ANEVUM' dist/client/index.html
      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Probe preview
        if: github.event_name == 'pull_request'
        run: curl --fail --show-error --silent "${{ steps.preview.outputs.preview_url }}" > /dev/null
