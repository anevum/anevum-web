name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0" "Pillow==11.3.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test canonical operational boundary
        run: node --experimental-strip-types --test tests/command-topology.test.mjs tests/command-iren.test.mjs tests/command-operations.test.mjs tests/command-trading.test.mjs tests/visual-ops.test.mjs
      - name: Typecheck and build
        run: npm run build
      - name: Verify generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/client/index.html
          current_pdf="$(jq -r '.currentPdfPath' public/release-registry.json)"
          test -s "dist/client$current_pdf"
          test -s dist/client/devon-akins-resume.pdf
          test -f dist/client/sitemap.xml
          test -f dist/client/release-registry.json
          test -n "$(find dist -name wrangler.json -print -quit)"
          python - <<'PY'
          from pathlib import Path
          pdf = Path("dist/client/devon-akins-resume.pdf").read_bytes()
          assert pdf.startswith(b"%PDF-")
          assert len(pdf) > 10_000
          print("resume pdf bytes:", len(pdf))
          PY

      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe routes, SEO, PDF, and public privacy contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euxo pipefail
          base="${{ steps.preview.outputs.preview_url }}"
          current_slug="$(jq -r '.currentSlug' public/release-registry.json)"
          public_routes="$(node --input-type=module -e 'import fs from "node:fs"; const routes=JSON.parse(fs.readFileSync("src/data/public-routes.json","utf8")); process.stdout.write(routes.filter((route)=>route.sitemap).map((route)=>route.path).join(" "))')"

          for path in $public_routes "/releases/$current_slug" /private /command /command/performance /iren /iren.webmanifest; do
            curl --fail --show-error --silent "$base$path" > /dev/null
          done

          curl --fail --show-error --silent "$base/devon-akins-resume.pdf" > "$RUNNER_TEMP/devon-akins-resume.pdf"
          test -s "$RUNNER_TEMP/devon-akins-resume.pdf"
          head -c 5 "$RUNNER_TEMP/devon-akins-resume.pdf" | grep -Fq '%PDF-'

          live_html="$(curl --fail --show-error --silent "$base/live")"
          printf '%s' "$live_html" | grep -Fq '<meta property="og:title" content="RHEN Live Terminal — ANEVUM" />'
          printf '%s' "$live_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/live" />'

          founder_html="$(curl --fail --show-error --silent "$base/founder")"
          printf '%s' "$founder_html" | grep -Fq '<meta property="og:title" content="About ANEVUM — Devon Akins" />'
          printf '%s' "$founder_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/founder" />'

          sitemap="$(curl --fail --show-error --silent "$base/sitemap.xml")"
          for path in /live /research /founder /resume; do
            printf '%s' "$sitemap" | grep -Fq "https://anevum.com$path"
          done

          for legacy in /products /products/rhen /performance /case-studies /theory; do
            status="$(curl --show-error --silent -o /dev/null -w '%{http_code}' "$base$legacy")"
            test "$status" = "308"
          done

          feed_file="$RUNNER_TEMP/public-trading-feed.json"
          feed_status="$(curl --show-error --silent -o "$feed_file" -w '%{http_code}' "$base/api/public/trading/live")"
          test "$feed_status" = "200"
          jq -e '
            .ok == true and
            .source == "rhen-core-sqlite" and
            .disclosure.level == "aggregate_only" and
            .systems.IREN.independent_runtime == false and
            .systems.RHEN.independent_runtime == false and
            .systems.GRAEN.independent_runtime == false and
            .systems.VELUM.independent_runtime == false and
            .systems.NOSTRA.independent_runtime == false and
            (.systems.NOSTRA.tracking_state | type == "string") and
            (.disclosure.excluded_fields | index("dollar_values") != null) and
            (.disclosure.excluded_fields | index("symbols") != null) and
            (.disclosure.excluded_fields | index("orders") != null) and
            (.disclosure.excluded_fields | index("fills") != null) and
            (.disclosure.excluded_fields | index("credentials") != null)
          ' "$feed_file" > /dev/null

          rhen_health_file="$RUNNER_TEMP/rhen-health.json"
          curl --fail --show-error --silent "https://alpaca-trader-production-bf3e.up.railway.app/health" > "$rhen_health_file"
          jq -e '
            .ok == true and
            .modules.iren.ok == true and
            .modules.iren.body.durable_state_current == true and
            .modules.iren.body.work_engine.running == true and
            .modules.graen_research.ok == true
          ' "$rhen_health_file" > /dev/null

          curl --fail --show-error --silent --head "$base/command" | grep -qi 'x-robots-tag:.*noindex'

      - name: Verify browser runtime and horizontal overflow
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          node scripts/browser-runtime-qa.mjs
          node scripts/codex-handoff-browser-qa.mjs
          node scripts/visual-ops-browser-qa.mjs
      - name: Visual review contact sheets
        if: github.event_name == 'pull_request'
        run: python scripts/visual-ops-contact-sheet.py

      - name: Capture browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.preview.outputs.preview_url }}"
          mkdir -p "$RUNNER_TEMP/anevum-visuals"

          chrome_retry() {
            local attempt=1
            while true; do
              if google-chrome "$@"; then
                return 0
              fi
              if [ "$attempt" -ge 2 ]; then
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 1
            done
          }

          capture() {
            name="$1"
            path="$2"
            marker="$3"
            rendered="$RUNNER_TEMP/anevum-visuals/$name-rendered.html"
            common=(--headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --disable-sync --no-first-run --virtual-time-budget=7000)

            chrome_retry "${common[@]}" --hide-scrollbars --window-size=1440,1000 --screenshot="$RUNNER_TEMP/anevum-visuals/$name-desktop.png" "$base$path"
            chrome_retry "${common[@]}" --hide-scrollbars --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/$name-mobile.png" "$base$path"

            for attempt in 1 2 3; do
              if chrome_retry "${common[@]}" --dump-dom "$base$path" > "$rendered" && grep -Fq "$marker" "$rendered"; then
                return 0
              fi
              echo "Rendered marker not ready for $path (attempt $attempt/3): $marker" >&2
              sleep 1
            done

            echo "Rendered marker missing after retries for $path: $marker" >&2
            tail -c 2500 "$rendered" >&2 || true
            return 1
          }

          capture home / 'One runtime. Clear boundaries.'
          capture terminal /live 'EVIDENCE DRAWER'
          capture research /research 'Development journal.'
          capture field-note /research/multi-market-architecture-equities-crypto 'REPRODUCE / CHALLENGE THIS NOTE'
          capture architecture /architecture 'One runtime. Internal modules.'
          capture founder /founder 'Devon Akins'
          capture resume /resume 'Technical Skills'

          grep -Fq 'public-terminal-home' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'public-terminal-page' "$RUNNER_TEMP/anevum-visuals/terminal-rendered.html"
          grep -Fq 'RESEARCH' "$RUNNER_TEMP/anevum-visuals/terminal-rendered.html"
          grep -Fq 'REPLAY' "$RUNNER_TEMP/anevum-visuals/terminal-rendered.html"
          grep -Fq 'RHEN' "$RUNNER_TEMP/anevum-visuals/terminal-rendered.html"

      - name: Upload browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anevum-preview-visuals
          path: |
            ${{ runner.temp }}/anevum-visuals
            dist/client/devon-akins-resume.pdf
          retention-days: 3
