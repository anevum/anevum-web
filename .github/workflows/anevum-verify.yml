name: ANEVUM Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: anevum-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render RHEN release packets
        run: python scripts/render-release-packets.py
      - name: Validate RHEN release registry
        run: node scripts/validate-release-registry.mjs
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Verify React, generated release artifacts, and Cloudflare output
        shell: bash
        run: |
          test -f dist/client/index.html
          current_pdf="$(jq -r '.currentPdfPath' public/release-registry.json)"
          test -f "dist/client$current_pdf"
          test -s "dist/client$current_pdf"
          test -f dist/client/sitemap.xml
          test -f dist/client/release-registry.json
          test -n "$(find dist -name wrangler.json -print -quit)"
          grep -Fq 'ANEVUM' dist/client/index.html
      - id: preview
        if: github.event_name == 'pull_request'
        name: Create or update Cloudflare Preview
        shell: bash
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --json)"
          printf '%s\n' "$output"
          json="$(printf '%s\n' "$output" | sed -n '/^{/,$p')"
          preview_url="$(printf '%s' "$json" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Probe preview routes, release synchronization, and public privacy contract
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ steps.preview.outputs.preview_url }}"
          current_slug="$(jq -r '.currentSlug' public/release-registry.json)"
          current_pdf="$(jq -r '.currentPdfPath' public/release-registry.json)"
          current_version="$(jq -r '.currentVersion' public/release-registry.json)"
          current_codename="$(jq -r '.currentCodename' public/release-registry.json)"

          public_routes="$(node --input-type=module -e 'import fs from "node:fs"; const routes=JSON.parse(fs.readFileSync("src/data/public-routes.json","utf8")); process.stdout.write(routes.filter((route)=>route.sitemap).map((route)=>route.path).join(" "))')"
          for path in $public_routes "/releases/$current_slug" /private /command /command/performance; do
            curl --fail --show-error --silent "$base$path" > /dev/null
          done

          curl --fail --show-error --silent "$base$current_pdf" > "$RUNNER_TEMP/current-release.pdf"
          test -s "$RUNNER_TEMP/current-release.pdf"

          release_html="$(curl --fail --show-error --silent "$base/releases/$current_slug")"
          printf '%s' "$release_html" | grep -Fq "<meta property=\"og:title\" content=\"RHEN $current_version — $current_codename — ANEVUM\" />"
          printf '%s' "$release_html" | grep -Fq "<meta property=\"og:url\" content=\"https://anevum.com/releases/$current_slug\" />"
          printf '%s' "$release_html" | grep -Fq "<link rel=\"canonical\" href=\"https://anevum.com/releases/$current_slug\" />"

          performance_html="$(curl --fail --show-error --silent "$base/performance")"
          printf '%s' "$performance_html" | grep -Fq '<meta property="og:title" content="RHEN Performance — ANEVUM" />'
          printf '%s' "$performance_html" | grep -Fq '<meta property="og:url" content="https://anevum.com/performance" />'
          printf '%s' "$performance_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/performance" />'

          theory_html="$(curl --fail --show-error --silent "$base/theory")"
          printf '%s' "$theory_html" | grep -Fq '<meta property="og:title" content="Mathematics & Theory — ANEVUM" />'
          printf '%s' "$theory_html" | grep -Fq '<meta property="og:url" content="https://anevum.com/theory" />'
          printf '%s' "$theory_html" | grep -Fq '<link rel="canonical" href="https://anevum.com/theory" />'

          theory_feed="$(curl --fail --show-error --silent "$base/api/public/theory")"
          printf '%s' "$theory_feed" | jq -e '
            . as $root |
            .schema_version == "anevum-theory-registry-v1" and
            .program.status == "ACTIVE" and
            (.program.current_problem_id | type == "string" and length > 0) and
            (.problems | type == "array") and
            ([.problems[].problem_id] | index($root.program.current_problem_id) != null) and
            .authority.theory_can_change_live_trading == false and
            .authority.theory_can_open_protected_research_stages == false and
            .authority.theory_can_claim_novelty_without_review == false
          ' > /dev/null

          sitemap="$(curl --fail --show-error --silent "$base/sitemap.xml")"
          printf '%s' "$sitemap" | grep -Fq "https://anevum.com/releases/$current_slug"

          feed="$(curl --fail --show-error --silent "$base/api/public/trading/live")"
          printf '%s' "$feed" | jq -e '
            .ok == true and
            .source == "anevum_public_telemetry" and
            (.telemetry | type == "object") and
            (.events | type == "array") and
            (.performance | type == "object") and
            (.performance.methodology_version == "PUBLIC-PERFORMANCE-v2") and
            (.performance.curve | type == "array") and
            (.performance.closed_trades | type == "number") and
            (.performance.external_cash_flows_present | type == "boolean") and
            (has("account") | not) and
            (has("positions") | not) and
            (has("recent_closed_positions") | not) and
            (has("recent_orders") | not) and
            (has("equity") | not) and
            (.performance | has("equity") | not) and
            (.performance | has("first_equity") | not) and
            (.performance | has("latest_equity") | not) and
            (.performance | has("net_realized_pnl") | not) and
            (.performance | has("deposits") | not) and
            (.performance | has("withdrawals") | not) and
            ([.performance.curve[] | has("equity")] | any | not) and
            ([.events[] | has("symbol")] | any | not) and
            ([.events[] | has("price")] | any | not) and
            ([.events[] | has("reason")] | any | not)
          ' > /dev/null

          curl --fail --show-error --silent --head "$base/" | grep -qi 'x-robots-tag:.*noindex'
      - name: Capture browser QA
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base="${{ steps.preview.outputs.preview_url }}"
          current_slug="$(jq -r '.currentSlug' public/release-registry.json)"
          current_theory_problem="$(curl --fail --show-error --silent "$base/api/public/theory" | jq -er '.program.current_problem_id')"
          mkdir -p "$RUNNER_TEMP/anevum-visuals"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1000 --screenshot="$RUNNER_TEMP/anevum-visuals/home-desktop.png" "$base/"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/home-mobile.png" "$base/"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1000 --screenshot="$RUNNER_TEMP/anevum-visuals/performance-desktop.png" "$base/performance"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/performance-mobile.png" "$base/performance"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1000 --screenshot="$RUNNER_TEMP/anevum-visuals/release-desktop.png" "$base/releases/$current_slug"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/release-mobile.png" "$base/releases/$current_slug"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,1000 --screenshot="$RUNNER_TEMP/anevum-visuals/theory-desktop.png" "$base/theory"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=6000 --window-size=390,844 --screenshot="$RUNNER_TEMP/anevum-visuals/theory-mobile.png" "$base/theory"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "$base/" > "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "$base/performance" > "$RUNNER_TEMP/anevum-visuals/performance-rendered.html"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "$base/releases/$current_slug" > "$RUNNER_TEMP/anevum-visuals/release-rendered.html"
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom "$base/theory" > "$RUNNER_TEMP/anevum-visuals/theory-rendered.html"
          grep -Fq 'anevum-home-v2' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'rhen-launch-sequence' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'ANEVUM PRESENTS' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'LIVE SYSTEMS' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'RHEN' "$RUNNER_TEMP/anevum-visuals/home-rendered.html"
          grep -Fq 'performance-workspace' "$RUNNER_TEMP/anevum-visuals/performance-rendered.html"
          grep -Fq 'PUBLIC-PERFORMANCE-v2' "$RUNNER_TEMP/anevum-visuals/performance-rendered.html"
          grep -Fq 'release-detail' "$RUNNER_TEMP/anevum-visuals/release-rendered.html"
          grep -Fq 'theory-page' "$RUNNER_TEMP/anevum-visuals/theory-rendered.html"
          grep -Fq "$current_theory_problem" "$RUNNER_TEMP/anevum-visuals/theory-rendered.html"
          grep -Fq 'compact-public-frame' "$RUNNER_TEMP/anevum-visuals/theory-rendered.html"
          grep -Fq 'theory-subnav' "$RUNNER_TEMP/anevum-visuals/theory-rendered.html"
      - name: Upload browser QA
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anevum-preview-visuals
          path: ${{ runner.temp }}/anevum-visuals
          retention-days: 3
