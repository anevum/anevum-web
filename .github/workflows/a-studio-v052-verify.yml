name: ANEVUM Creator Studio V052 Safe Integration Verify

# Source-only build and acceptance of merged moderator V044 + Creator Studio V051.
# This workflow must never deploy, provision R2, change D1, or enable uploads.
on:
  push:
    branches: [release/a-studio-v052-integrated-20261016]
    paths:
      - '.github/workflows/a-studio-v052-verify.yml'
      - 'creator-v1/**'
      - 'lab/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a-studio-v052-safe-integration
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'anevum/anevum-web' && github.ref == 'refs/heads/release/a-studio-v052-integrated-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pin reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reject staging signup, worker and migration configuration drift
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('creator-v1/wrangler.a-progression-v031.jsonc'));
          assert.equal(c.name,'anevum-creator-v1-a-staging');
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.deepEqual(c.routes,[]);
          assert.equal(c.vars.CANONICAL_PUBLIC_SIGNUP_ENABLED,'true');
          assert.equal(c.vars.CANONICAL_INVITED_SIGNUP_ENABLED,'true');
          assert.equal(c.vars.CANONICAL_CREATOR_STUDIO_ENABLED,undefined);
          assert.equal(c.vars.CANONICAL_CREATOR_UPLOADS_ENABLED,undefined);
          assert.deepEqual(c.d1_databases.map(x=>x.binding),['COMMUNITY_DB','MEMBER_DB']);
          assert.equal(c.r2_buckets,undefined);
          const studio=fs.readFileSync('creator-v1/canonical-auth/studio.mjs','utf8');
          assert.match(studio,/studioReviewSchemaReady/);
          const v044=fs.readFileSync('creator-v1/canonical-auth/forum-review-console.mjs','utf8');
          assert.ok(v044.length>500);
          const app=fs.readFileSync('creator-v1/web/src/App.tsx','utf8');
          assert.match(app,/CanonicalStudioPage/);
          assert.match(app,/ForumReviewPage/);
          NODE
      - name: Typecheck and bundle complete frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
      - name: Verify syntax for actual staging Worker
        shell: bash
        run: |
          set -euo pipefail
          node --check creator-v1/web/a-canonical-stage.review.mjs
          node --check creator-v1/canonical-auth/worker.mjs
          node --check creator-v1/canonical-auth/studio.mjs
          node --check creator-v1/canonical-auth/studio-submissions.mjs
          node --check creator-v1/canonical-auth/studio-assets.mjs
      - name: Verify security and private Studio acceptance
        shell: bash
        working-directory: creator-v1
        run: |
          set -euo pipefail
          npm run test:studio
          npm run test:canonical-forums
          npm run test:signup-activation
      - name: Verify complete creator experience and public safety
        shell: bash
        working-directory: creator-v1
        run: |
          set -euo pipefail
          npm test
      - name: Record immutable verification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/a-studio-v052-source-sha.txt
          echo "SOURCE-ONLY: no live Worker or D1 change, no R2 provisioning, no upload activation" > evidence/a-studio-v052-status.txt
      - name: Upload source-only verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-studio-v052-source-verification-${{ github.run_id }}
          path: evidence/a-studio-v052-*.txt
          if-no-files-found: warn
          retention-days: 7
