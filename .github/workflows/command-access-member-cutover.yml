name: Scope ANEVUM Command Access

on:
  workflow_run:
    workflows: [Deploy ANEVUM Production]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: anevum-command-access-scoped-cutover
  cancel-in-progress: false

jobs:
  scope-access:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test Access scope safety before touching Cloudflare
        run: python -m unittest discover -s tests -p 'test_command_access_cutover.py' -v
      - name: Verify server-side legacy operator redirects on canonical main
        run: node --test tests/member-command-cutover.test.mjs
      - name: Apply reversible owner-only Access scope to the RHEN terminal
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/command-access-cutover.py
      - name: Document verified Command Access state
        run: |
          {
            echo '## ANEVUM Command Access scope'
            echo ''
            echo 'Owner-only Access restricts /command/rhen* and /api/command*.'
            echo 'The /command member entry is now open to the normal website,'
            echo 'but Google login still requires an explicitly enabled member account.'
            echo ''
            echo 'Production membership remains disabled; RHEN broker-write authority is unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
