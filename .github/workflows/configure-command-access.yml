name: Verify ANEVUM Command Access Edge

on:
  push:
    branches:
      - ops/cloudflare-access-command-20261001

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Access routing
        shell: bash
        run: |
          set -euo pipefail

          command_status="$(curl -sS -o /dev/null -w '%{http_code}' https://anevum.com/command)"
          command_api_status="$(curl -sS -o /dev/null -w '%{http_code}' https://anevum.com/api/command/session)"
          root_status="$(curl -sS -o /dev/null -w '%{http_code}' https://anevum.com/)"
          rhen_status="$(curl -sS -o /dev/null -w '%{http_code}' https://anevum.com/products/rhen)"

          echo "COMMAND_STATUS=$command_status"
          echo "COMMAND_API_STATUS=$command_api_status"
          echo "ROOT_STATUS=$root_status"
          echo "RHEN_STATUS=$rhen_status"

          case "$command_status" in
            302|303) ;;
            *) exit 11 ;;
          esac

          case "$command_api_status" in
            302|303) ;;
            *) exit 12 ;;
          esac

          test "$root_status" = "200"
          test "$rhen_status" = "200"
