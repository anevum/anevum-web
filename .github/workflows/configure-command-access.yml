name: Audit ANEVUM Command Access
on:
  push:
    branches: [ops/cloudflare-access-command-20261001]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Access scope and probe production boundaries
        env:
          CLOUDFLARE_ACCESS_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def api(path):
              req = urllib.request.Request(base + path, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_ACCESS_API_TOKEN"]})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.load(response)
              assert data.get("success"), data.get("errors")
              return data["result"]
          apps = api("/access/apps?per_page=100")
          selected = [a for a in apps if a.get("name") == "ANEVUM Command"]
          assert len(selected) == 1, "Expected exactly one ANEVUM Command app"
          app = api("/access/apps/" + selected[0]["id"])
          policies = api("/access/apps/" + app["id"] + "/policies")
          # Scope this repair to the already verified application and existing policies.
          assert app["id"] == "ea5ecc36-b828-4030-aaf7-c2a7799f6085"
          assert {d["uri"] for d in app["destinations"]} == {"anevum.com/command*", "anevum.com/api/command*"}
          owner_id = "266c244d-1d51-4da8-8a46-4996d4517190"
          staff_id = "c6de87a7-d0dc-48e8-aee1-dae7a5723696"
          owner = next(p for p in policies if p["id"] == owner_id)
          assert owner["decision"] == "allow" and owner["include"] == [{"email":{"email":"devon@anevum.com"}}]
          assert set(p["id"] for p in policies).issubset({owner_id, staff_id}), "Unexpected policy change"
          if any(p["id"] == staff_id for p in policies):
              original_staff = api("/access/policies/" + staff_id)
              fields = ["domain","type","allow_authenticate_via_warp","allow_iframe","allowed_idps","app_launcher_visible","auto_redirect_to_identity","cors_headers","custom_deny_message","custom_deny_url","custom_non_identity_deny_url","custom_pages","destinations","eager_redirect_cookie_setting","enable_binding_cookie","http_only_cookie_attribute","logo_url","mfa_config","name","oauth_configuration","options_preflight_bypass","path_cookie_attribute","policies","read_service_tokens_from_header","same_site_cookie_attribute","scim_config","session_duration","skip_interstitial","tags","use_clientless_isolation_app_launcher_url"]
              payload = {k: app[k] for k in fields if k in app and app[k] is not None}
              payload["policies"] = [{"id": owner_id, "precedence": 1}]
              req = urllib.request.Request(base + "/access/apps/" + app["id"], method="PUT", data=json.dumps(payload).encode(), headers={"Authorization":"Bearer " + os.environ["CLOUDFLARE_ACCESS_API_TOKEN"],"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      result = json.load(response)
              except urllib.error.HTTPError as error:
                  print("ACCESS_UPDATE_ERROR=" + error.read().decode())
                  raise
              assert result.get("success"), result.get("errors")
              app = api("/access/apps/" + app["id"])
              policies = api("/access/apps/" + app["id"] + "/policies")
              retained_staff = api("/access/policies/" + staff_id)
              for field in ["id","name","decision","include","exclude","require"]:
                  assert original_staff.get(field) == retained_staff.get(field), "Reusable policy unexpectedly changed"
              print("ACCESS_POLICY_REPAIR=Detached existing staff policy from Command; reusable policy preserved")
          assert [p["id"] for p in policies] == [owner_id]
          
          org = api("/access/organizations")
          print("ACCESS_APPLICATION=" + json.dumps({k: app.get(k) for k in ["id","name","aud","type","domain","destinations","self_hosted_domains","allowed_idps","auto_redirect_to_identity","session_duration"]}))
          print("ACCESS_POLICIES=" + json.dumps(policies))
          print("ACCESS_AUTH_DOMAIN=" + org["auth_domain"])
          print("ACCESS_APP_INVENTORY=" + json.dumps([{k:a.get(k) for k in ["id","name","domain","destinations"]} for a in apps]))
          assert app["id"] == "ea5ecc36-b828-4030-aaf7-c2a7799f6085"
          assert app["aud"] == "3fabe3c703b4cc972136d2292fda39783c11903c3c6cf5ac0e42c4738f2ee800"
          assert org["auth_domain"] == "wispy-tooth-095a.cloudflareaccess.com"
          assert {d["uri"] for d in app["destinations"]} == {"anevum.com/command*", "anevum.com/api/command*"}
          allows = [p for p in policies if p["decision"] == "allow"]
          assert allows, "Owner allow policy missing"
          for p in policies:
              assert p["decision"] in ("allow","deny"), "Unexpected bypass or service authentication policy"
          for p in allows:
              assert p.get("include") == [{"email":{"email":"devon@anevum.com"}}], "Unexpected identity scope"
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          checks = [
           ("https://anevum.com/", "GET", [200]),
           ("https://anevum.com/products/rhen", "GET", [200]),
           ("https://anevum.com/products/iren", "GET", [200]),
           ("https://anevum.com/command", "GET", [302,303]),
           ("https://anevum.com/command/topology", "GET", [302,303]),
           ("https://anevum.com/api/command/session", "GET", [302,303,401,403]),
           ("https://anevum.com/api/command/trader/status", "GET", [302,303,401,403]),
           ("https://anevum.com/api/command/iren/status", "GET", [302,303,401,403]),
           ("https://anevum.com/api/command/iren/command", "POST", [302,303,401,403]),
           ("https://anevum.com/api/public/trading/live", "GET", [503]),
           ("https://alpaca-trader-production-bf3e.up.railway.app/v1/command/session", "GET", [401]),
           ("https://alpaca-trader-production-bf3e.up.railway.app/v1/command/status", "GET", [401]),
           ("https://foundation-ingest-staging.up.railway.app/v1/command/iren", "GET", [401]),
           ("https://foundation-ingest-staging.up.railway.app/v1/command/iren", "POST", [401]),
          ]
          for url, method, expected in checks:
              req = urllib.request.Request(url, method=method, data=b"{}" if method=="POST" else None, headers={"Content-Type":"application/json"})
              try:
                  response = opener.open(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              status = response.code
              body = response.read()
              result = {"url":url,"method":method,"status":status}
              if status in (302,303):
                  location = response.headers.get("Location","")
                  result["redirect_host"] = urllib.parse.urlparse(location).hostname
                  assert result["redirect_host"] == org["auth_domain"], result
              if "/api/public/trading/live" in url:
                  assert json.loads(body)["data_state"] == "OFFLINE_BY_DESIGN"
                  result["data_state"] = "OFFLINE_BY_DESIGN"
              print("PROBE=" + json.dumps(result))
              assert status in expected, result
          print("READ_ONLY_ACCESS_AUDIT=PASS")
          
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Inventory canonical web source
        shell: bash
        run: |
          git rev-parse HEAD
          rg -n -i --glob '!public/releases/**' --glob '!src/data/releases.json' 'supabase|/functions/v1' . || test "$?" = 1
      - name: Verify Command contracts on canonical main
        run: node --test tests/command-iren.test.mjs tests/command-topology.test.mjs
