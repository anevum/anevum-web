name: Diagnose ANEVUM Command Access Payload

on:
  push:
    branches:
      - ops/cloudflare-access-command-20261001

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate Access application payload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          curl --fail --silent --show-error "$api/access/apps?per_page=100" "${auth[@]}" > "$RUNNER_TEMP/apps.json"
          app_id="$(jq -r '.result[]? | select(.name=="ANEVUM Command") | .id' "$RUNNER_TEMP/apps.json" | head -n1)"

          cat > "$RUNNER_TEMP/app.json" <<'JSON'
          {
            "name": "ANEVUM Command",
            "type": "self_hosted",
            "session_duration": "24h",
            "app_launcher_visible": false,
            "destinations": [
              {"type":"public","uri":"anevum.com/command*"},
              {"type":"public","uri":"anevum.com/api/command*"}
            ]
          }
          JSON

          if [ -z "$app_id" ]; then
            status="$(curl --silent --show-error -o "$RUNNER_TEMP/result.json" -w '%{http_code}'               -X POST "$api/access/apps" "${auth[@]}"               --data-binary @"$RUNNER_TEMP/app.json")"
          else
            status="$(curl --silent --show-error -o "$RUNNER_TEMP/result.json" -w '%{http_code}'               -X PUT "$api/access/apps/$app_id" "${auth[@]}"               --data-binary @"$RUNNER_TEMP/app.json")"
          fi

          echo "ACCESS_APP_STATUS=$status"
          jq -c '{success,errors,messages,result:(.result|if type=="object" then {id,name,aud,type,destinations} else . end)}' "$RUNNER_TEMP/result.json" || true
