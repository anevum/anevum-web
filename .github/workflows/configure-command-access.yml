name: Diagnose ANEVUM Command Access Permissions

on:
  push:
    branches:
      - ops/cloudflare-access-command-20261001

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Access API capabilities
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          verify_status="$(curl --silent --show-error -o "$RUNNER_TEMP/token-verify.json" -w '%{http_code}' "https://api.cloudflare.com/client/v4/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          echo "TOKEN_VERIFY=$verify_status"
          token_id="$(jq -r '.result.id // empty' "$RUNNER_TEMP/token-verify.json" 2>/dev/null || true)"
          echo "TOKEN_ID=$token_id"
          if [ -n "$token_id" ]; then
            detail_status="$(curl --silent --show-error -o "$RUNNER_TEMP/token-detail.json" -w '%{http_code}' "https://api.cloudflare.com/client/v4/user/tokens/$token_id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            echo "TOKEN_DETAIL=$detail_status"
            if [ "$detail_status" = "200" ]; then
              jq -c '{id:.result.id,name:.result.name,status:.result.status,permission_groups:[.result.policies[]?.permission_groups[]? | {id,name}],resources:[.result.policies[]?.resources]}' "$RUNNER_TEMP/token-detail.json"
            else
              jq -c '{success,errors,messages}' "$RUNNER_TEMP/token-detail.json" || true
            fi
          fi

          apps_status="$(curl --silent --show-error -o "$RUNNER_TEMP/apps.json" -w '%{http_code}'             "$api/access/apps?per_page=100" "${auth[@]}")"
          echo "ACCESS_APPS_GET=$apps_status"
          if [ "$apps_status" = "200" ]; then
            jq -c '{success,apps:[.result[]? | {id,name,aud,type,destinations}]}' "$RUNNER_TEMP/apps.json"
          else
            jq -c '{success,errors,messages}' "$RUNNER_TEMP/apps.json" || true
          fi

          org_status="$(curl --silent --show-error -o "$RUNNER_TEMP/org.json" -w '%{http_code}'             "$api/access/organizations" "${auth[@]}")"
          echo "ACCESS_ORG_GET=$org_status"
          jq -c '{success,errors,messages}' "$RUNNER_TEMP/org.json" || true

          write_status="$(curl --silent --show-error -o "$RUNNER_TEMP/write-test.json" -w '%{http_code}'             -X POST "$api/access/apps" "${auth[@]}" --data-binary '{}')"
          echo "ACCESS_APPS_WRITE_TEST=$write_status"
          jq -c '{success,errors,messages}' "$RUNNER_TEMP/write-test.json" || true

          app_id="$(jq -r '.result[]? | select(.name=="ANEVUM Command") | .id' "$RUNNER_TEMP/apps.json" 2>/dev/null | head -n1 || true)"
          if [ -n "$app_id" ]; then
            policy_status="$(curl --silent --show-error -o "$RUNNER_TEMP/policies.json" -w '%{http_code}'               "$api/access/apps/$app_id/policies" "${auth[@]}")"
            echo "ACCESS_POLICIES_GET=$policy_status"
            if [ "$policy_status" = "200" ]; then
              jq -c '{success,policies:[.result[]? | {id,name,decision,precedence,include}]}' "$RUNNER_TEMP/policies.json"
            else
              jq -c '{success,errors,messages}' "$RUNNER_TEMP/policies.json" || true
            fi
          else
            echo "ANEVUM_COMMAND_APP_PRESENT=false"
          fi
