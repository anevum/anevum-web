name: ANEVUM V064 Live Optical Poster Smoke
on:
  push:
    branches: [build/evolution-micro-posters-v064-20261017-012]
    paths:
      - '.github/workflows/evolution-v064-live-smoke.yml'
      - 'docs/evolution-v064-sha256.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anevum-v064-live-readonly
  cancel-in-progress: false
jobs:
  verify-live:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live 30-level metadata and member signup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-v064-live
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 35 https://anevum.com/evolution/ -o qa-v064-live/evolution.html
          grep -q 'id="workshop-data"' qa-v064-live/evolution.html
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 35 https://anevum.com/levels -o qa-v064-live/levels.html
          grep -q 'id="root"' qa-v064-live/levels.html
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 35 https://anevum.com/api/v1/member/auth-methods -o qa-v064-live/auth-methods.json
          jq -e '.registration=="open" and .methods.email.available==true' qa-v064-live/auth-methods.json >/dev/null
          test "$(curl -sS --connect-timeout 15 --max-time 25 -o /dev/null -w '%{http_code}' https://anevum.com/api/v1/member/progression)" = "401"
      - name: Verify every live optical fallback by its exact candidate SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-v064-live/posters
          cd qa-v064-live/posters
          for n in $(seq -w 1 30); do
            curl -fLsS --retry 2 --connect-timeout 15 --max-time 30 "https://anevum.com/evolution/assets/level-$n-compact-128.png" -o "level-$n-compact-128.png"
          done
          sha256sum -c "$GITHUB_WORKSPACE/docs/evolution-v064-sha256.txt" | tee ../optical-hash-results.txt
          test "$(grep -c ': OK' ../optical-hash-results.txt)" = 30
          echo V064_ALL_30_DEPLOYED_POSTERS_HASHED_AND_IDENTICAL=PASS
      - name: Test live native WebGL member badges at desktop/mobile and reduced motion
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/google-chrome --version
          node --check creator-v1/test/evolution-mini-live-browser-v062.mjs
          node creator-v1/test/evolution-mini-live-browser-v062.mjs
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v064-live-smoke-evidence
          path: |
            qa-v064-live/optical-hash-results.txt
            qa-v064-live/auth-methods.json
            qa-v062-live-member/
          if-no-files-found: warn
          retention-days: 14
