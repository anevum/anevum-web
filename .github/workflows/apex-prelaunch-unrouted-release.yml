name: ANEVUM Apex Unrouted Candidate Release

# Safe candidate upload only; no public apex route changes and no release flag.
on:
  push:
    branches: [build/apex-prelaunch-gateway-20261017-001]
    paths: [.github/workflows/apex-prelaunch-unrouted-release.yml]

permissions:
  contents: read

concurrency:
  group: anevum-apex-unrouted-candidate
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Pin route-free candidate and safe launch flags
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/build/apex-prelaunch-gateway-20261017-001"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const c=JSON.parse(readFileSync('creator-v1/wrangler.apex-prelaunch.jsonc','utf8'));
          assert.equal(c.name,'anevum-apex-prelaunch-gateway');
          assert.deepEqual(c.routes,[]);
          assert.equal(c.workers_dev,false);
          assert.equal(c.preview_urls,false);
          assert.equal(c.assets.binding,'ASSETS');
          assert.equal(c.assets.run_worker_first,true);
          assert.equal(c.vars.ANEVUM_PRELAUNCH_MODE,'gated');
          assert.equal(c.vars.ANEVUM_LAUNCH_APPROVED,'false');
          assert.equal(c.vars.ANEVUM_ACCESS_AUD,'6efab9f2821297fa4c965f18813d78d7433ebf7823a8e9e6d9ecfb7e4b2ccde1');
          assert.equal(c.vars.CANONICAL_PUBLIC_SIGNUP_ENABLED,'true');
          for(const p of ['GOOGLE','GITHUB','APPLE','MICROSOFT'])
            assert.equal(c.vars['CANONICAL_'+p+'_ENABLED'],'false');
          assert.deepEqual(c.d1_databases.map(x=>[x.binding,x.database_id]),[
            ['COMMUNITY_DB','fa96e36d-6257-4883-bf15-074947e11a13'],
            ['MEMBER_DB','e1d29049-c83b-4534-8355-dc1fa36ba6d8']
          ]);
          NODE
          echo APEX_CANDIDATE_ISOLATION=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Typecheck, build, signed-JWT and API-denial regressions
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          node --test creator-v1/test/apex-prelaunch-gateway.test.mjs
          for script in creator-v1/apex-prelaunch/*.mjs creator-v1/canonical-auth/{auth,worker,policy,profile}.mjs; do
            node --check "$script"
          done
          test -s creator-v1/dist/web/index.html
          test -d creator-v1/dist/web/assets
          echo APEX_GATE_AND_ASSETS=PASS

      - name: Protect existing public routes before upload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "2f7ee83107240152097efd956a4e8335"
          umask 077
          url="https://api.cloudflare.com/client/v4/zones/8abe27259b5436af5966d3b40d9a3760/workers/routes"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" > "$RUNNER_TEMP/apex-routes-before.json"
          jq -e '
            .success and
            ([.result[]|select(.pattern=="anevum.com/*" and .script=="anevum-construction-terminal")]|length)==1 and
            ([.result[]|select(.pattern=="a.anevum.com/*" and .script=="anevum-creator-v1-a-staging")]|length)==1
          ' "$RUNNER_TEMP/apex-routes-before.json" >/dev/null
          echo EXISTING_COUNTDOWN_AND_STAGE_ROUTES_PRESERVED=PASS

      - name: Upload only unrouted Worker and static assets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config creator-v1/wrangler.apex-prelaunch.jsonc --keep-vars
          echo UNROUTED_APEX_GATE_CANDIDATE_UPLOADED=PASS

      - name: Verify new Worker bindings and no live route changes
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          hdr="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4"
          curl --fail --silent --show-error --max-time 25 -H "$hdr" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-apex-prelaunch-gateway/settings" > "$RUNNER_TEMP/apex-settings-after.json"
          jq -e '
            .success and
            ([.result.bindings[]|select(.type=="assets" and .name=="ASSETS")]|length)==1 and
            ([.result.bindings[]|select(.type=="d1" and .name=="MEMBER_DB" and ((.id//.database_id)=="e1d29049-c83b-4534-8355-dc1fa36ba6d8"))]|length)==1 and
            ([.result.bindings[]|select(.type=="d1" and .name=="COMMUNITY_DB" and ((.id//.database_id)=="fa96e36d-6257-4883-bf15-074947e11a13"))]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="ANEVUM_PRELAUNCH_MODE" and .text=="gated")]|length)==1 and
            ([.result.bindings[]|select(.type=="plain_text" and .name=="ANEVUM_LAUNCH_APPROVED" and .text=="false")]|length)==1
          ' "$RUNNER_TEMP/apex-settings-after.json" >/dev/null
          curl --fail --silent --show-error --max-time 25 -H "$hdr" "$api/zones/8abe27259b5436af5966d3b40d9a3760/workers/routes" > "$RUNNER_TEMP/apex-routes-after.json"
          jq -e '
            .success and
            ([.result[]|select(.pattern=="anevum.com/*" and .script=="anevum-construction-terminal")]|length)==1 and
            ([.result[]|select(.pattern=="a.anevum.com/*" and .script=="anevum-creator-v1-a-staging")]|length)==1
          ' "$RUNNER_TEMP/apex-routes-after.json" >/dev/null
          echo "Candidate Worker: anevum-apex-prelaunch-gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "NO PUBLIC HOSTNAME OR ROUTE WAS CHANGED." >> "$GITHUB_STEP_SUMMARY"
