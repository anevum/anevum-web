name: Publish RHEN Release Packet Email

on:
  push:
    tags:
      - "rhen-v*"
  workflow_dispatch:
    inputs:
      slug:
        description: "Optional release slug. Leave blank to use the current registry pointer."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: pip install "weasyprint==68.0"
      - name: Synchronize RHEN release artifacts
        run: node scripts/sync-release-artifacts.mjs
      - name: Render all registered packets
        run: python scripts/render-release-packets.py
      - name: Validate publication registry
        run: node scripts/validate-release-registry.mjs
      - name: Resolve release
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.slug }}" ]; then
            slug="${{ inputs.slug }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#rhen-v}"
            slug="$(RELEASE_FIELD=slug node scripts/release-cli.mjs version "$version")"
          else
            slug="$(RELEASE_FIELD=slug node scripts/release-cli.mjs current)"
          fi
          pdf="$(RELEASE_FIELD=pdfPath node scripts/release-cli.mjs slug "$slug")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "packet=public$pdf" >> "$GITHUB_OUTPUT"
      - name: Email release packet
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RELEASE_EMAIL_TO: ${{ vars.RELEASE_EMAIL_TO }}
          RELEASE_EMAIL_FROM: ${{ vars.RELEASE_EMAIL_FROM }}
        run: node scripts/email-release-packet.mjs "${{ steps.release.outputs.packet }}" "${{ steps.release.outputs.slug }}"
