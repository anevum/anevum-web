name: ANEVUM Native Pack V003 - audited staff inspection
on:
  push:
    branches: [build/native-pack-staff-inspection-v003-20261017]
    paths:
      - ".github/workflows/native-pack-staff-v003-verify.yml"
      - "creator-v1/canonical-auth/native-pack-review.mjs"
      - "creator-v1/canonical-auth/native-pack-quarantine.mjs"
      - "creator-v1/canonical-auth/studio.mjs"
      - "creator-v1/canonical-auth/worker.mjs"
      - "creator-v1/canonical-auth/migrations/0010_native_inspection_audit.sql"
      - "creator-v1/web/src/lib/canonical-studio.ts"
      - "creator-v1/web/src/pages/CanonicalStudioPage.tsx"
      - "creator-v1/web/src/pages/canonical-studio.css"
      - "creator-v1/test/native-pack-staff-v003.test.mjs"
      - "docs/creator-platform/ANEVUM-NATIVE-PACKS-V003-2026-10-18.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-pack-v003-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  audited-native-staff-inspection:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify native text inspection and durable audit
        run: node --experimental-strip-types --test creator-v1/test/native-pack-staff-v003.test.mjs
      - name: Regress private quarantine, old Studio, and native format foundation
        run: |
          node --experimental-strip-types --test creator-v1/test/native-pack-quarantine-v002.test.mjs
          node --experimental-strip-types --test creator-v1/test/canonical-studio-v043.test.mjs
          node --experimental-strip-types --test creator-v1/test/native-pack-v001.test.mjs
      - name: Syntax check review code
        run: |
          node --check creator-v1/canonical-auth/native-pack-review.mjs
          node --check creator-v1/canonical-auth/native-pack-quarantine.mjs
          node --check creator-v1/canonical-auth/studio.mjs
          node --check creator-v1/canonical-auth/worker.mjs
      - name: Typecheck Creator V1 web UI
        run: npm run check:creator-v1-web
      - name: Compile production and staging frontend variants (no deployment)
        run: |
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
      - name: Enforce private-only staff inspection surface
        run: |
          node -e "const fs=require('fs');const m=fs.readFileSync('creator-v1/canonical-auth/native-pack-review.mjs','utf8');const u=fs.readFileSync('creator-v1/web/src/pages/CanonicalStudioPage.tsx','utf8');if(/dangerouslySetInnerHTML|new Function|eval\s*\(|\bexecSync\s*\(/.test(m+u))process.exit(1);if(!m.includes('member_studio_native_inspections')||!m.includes('SHA-256'))process.exit(1)"
          git diff --exit-code
