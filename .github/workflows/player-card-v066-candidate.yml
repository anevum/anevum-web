name: ANEVUM V066 Player Card Unrouted Candidate
# Only upload an unrouted Worker version after source, privacy, asset, and D1 QA.
# Never directly deploy or mutate secret bindings, member state, or routes.
on:
  push:
    branches:
      - build/player-card-v065-v064-integrate-20261017-014
    paths:
      - .github/workflows/player-card-v066-candidate.yml
permissions:
  contents: read
concurrency:
  group: anevum-v066-unrouted-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPECTED_ACCOUNT: '2f7ee83107240152097efd956a4e8335'
      LIVE_V064: '80c6f0d1-c35b-4524-b97d-7cffdd4063d5'
      WORKER: anevum-apex-prelaunch-gateway
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository, branch, secret presence, and live Worker before any build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/build/player-card-v065-v064-integrate-20261017-014'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$CLOUDFLARE_ACCOUNT_ID" = "$EXPECTED_ACCOUNT"
          latest="$(curl -fsS --retry 2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/build/player-card-v065-v064-integrate-20261017-014" | jq -er '.object.sha')"
          test "$latest" = "$GITHUB_SHA"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          curl -fsS --retry 2 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/deployments?per_page=1" > "$RUNNER_TEMP/v066-before-deploy.json"
          test "$(jq -er '.result.deployments[0].versions[]|select(.percentage==100)|.version_id' "$RUNNER_TEMP/v066-before-deploy.json")" = "$LIVE_V064"
          curl -fsS --retry 2 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/versions/$LIVE_V064" > "$RUNNER_TEMP/v066-live-good.json"
          jq -e '
            .success and (.result.resources.bindings|length)==23 and
            ([.result.resources.bindings[]|select(.type=="secret_text")]|length)==4 and
            ([.result.resources.bindings[]|select(.type=="d1")]|length)==2 and
            ([.result.resources.bindings[]|select(.type=="assets")]|length)==1
          ' "$RUNNER_TEMP/v066-live-good.json" >/dev/null
          curl -fsS --retry 2 --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"sql":"SELECT name FROM sqlite_master WHERE type='\''table'\'' AND name IN ('\''member_recognition_grants'\'','\''member_recognition_preferences'\'') ORDER BY name"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/e1d29049-c83b-4534-8355-dc1fa36ba6d8/query" > "$RUNNER_TEMP/v066-schema.json"
          jq -e '(.success==true) and (([.result[0].results[].name]|sort)==["member_recognition_grants","member_recognition_preferences"])' "$RUNNER_TEMP/v066-schema.json" >/dev/null
          echo 'V066_LIVE_V064_AND_D1_READONLY_PREFLIGHT=PASS'
      - name: Build V064 native and optical artwork from canonical sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet numpy==2.2.6 scipy==1.15.3 Pillow==11.2.1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri
          cd design/evolution-v059
          mkdir -p artwork/{native,textures,vector,masters,web,compact,micro} docs dist previews
          python src/export_native.py
          python src/render_web.py
          python src/micro.py
          python src/build.py
          cd ../..
          python creator-v1/ops/install-evolution-v060.py
          python creator-v1/ops/apply-evolution-micro-v064.py
          test -s creator-v1/web/public/evolution/mini-runtime.json
          test "$(find creator-v1/web/public/evolution/assets -maxdepth 1 -type f | wc -l)" -eq 152
      - name: Validate identity, badge ledger, Worker modules, and native posters
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          for f in creator-v1/canonical-auth/*.mjs; do node --check "$f"; done
          node --experimental-sqlite --test \
            creator-v1/test/player-card-recognition-v065.test.mjs \
            creator-v1/test/player-recognition-issuance-v066.test.mjs \
            creator-v1/test/member-identity-v061.test.mjs
          node --test creator-v1/test/evolution-v060-contract.test.mjs creator-v1/test/evolution-v062-native.test.mjs
          test "$(find creator-v1/dist/web/evolution/assets -maxdepth 1 -type f | wc -l)" -eq 152
      - name: Create a source-local candidate config; preserve production routing
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=JSON.parse(fs.readFileSync('creator-v1/wrangler.apex-prelaunch.jsonc','utf8'));
          if(base.name!=='anevum-apex-prelaunch-gateway'||
             base.main!=='./apex-prelaunch/gateway.mjs'||
             !Array.isArray(base.routes)||base.routes.length!==0||
             base.assets?.binding!=='ASSETS'||base.assets?.run_worker_first!==true||
             base.compatibility_flags?.join(',')!=='nodejs_compat'||
             base.d1_databases?.length!==2||
             base.d1_databases.find(x=>x.binding==='MEMBER_DB')?.database_id!=='e1d29049-c83b-4534-8355-dc1fa36ba6d8'||
             base.d1_databases.find(x=>x.binding==='COMMUNITY_DB')?.database_id!=='fa96e36d-6257-4883-bf15-074947e11a13')
             throw Error('Unexpected production config. Abort candidate.');
          base.vars.ANEVUM_PRELAUNCH_MODE='public';
          base.vars.ANEVUM_LAUNCH_APPROVED='true';
          base.vars.CANONICAL_PUBLIC_SIGNUP_ENABLED='true';
          base.vars.CANONICAL_RECOGNITION_ENABLED='true';
          fs.writeFileSync('creator-v1/wrangler.player-v066.jsonc',JSON.stringify(base,null,2));
          NODE
      - name: Upload an UNROUTED candidate Worker version
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS --max-time 30 -H "$auth" "$api/deployments?per_page=1" > "$RUNNER_TEMP/v066-preupload-deploy.json"
          test "$(jq -er '.result.deployments[0].versions[]|select(.percentage==100)|.version_id' "$RUNNER_TEMP/v066-preupload-deploy.json")" = "$LIVE_V064"
          curl -fsS --max-time 30 -H "$auth" "$api/versions?per_page=1" > "$RUNNER_TEMP/v066-version-before.json"
          prior_latest="$(jq -er '.result.items[0].id' "$RUNNER_TEMP/v066-version-before.json")"
          npx wrangler versions upload --config creator-v1/wrangler.player-v066.jsonc --keep-vars \
            --message 'ANEVUM V066 shared player cards, 26 enamel badges, 12 honors; protected source-only release'
          curl -fsS --max-time 30 -H "$auth" "$api/versions?per_page=1" > "$RUNNER_TEMP/v066-version-after.json"
          candidate="$(jq -er '.result.items[0].id' "$RUNNER_TEMP/v066-version-after.json")"
          test -n "$candidate"
          test "$candidate" != "$prior_latest"
          curl -fsS --max-time 30 -H "$auth" "$api/versions/$candidate" > "$RUNNER_TEMP/v066-candidate.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const folder=process.env.RUNNER_TEMP+'/';
          const prior=JSON.parse(fs.readFileSync(folder+'v066-live-good.json','utf8')).result;
          const cand=JSON.parse(fs.readFileSync(folder+'v066-candidate.json','utf8')).result;
          assert.ok(cand?.resources?.script?.handlers?.includes('fetch'));
          const old=prior.resources.bindings;
          const next=cand.resources.bindings;
          assert.equal(old.length,23);
          assert.equal(next.length,24);
          const priorMap=new Map(old.map(x=>[x.name,x]));
          const nextMap=new Map(next.map(x=>[x.name,x]));
          for(const [name,b] of priorMap){
            const a=nextMap.get(name);
            assert.ok(a,'Binding removed: '+name);
            assert.equal(a.type,b.type,'Binding type changed: '+name);
            if(b.type==='plain_text')assert.equal(a.text,b.text,'Public config drift: '+name);
            if(b.type==='d1')assert.equal(a.id,b.id,'D1 database drift: '+name);
          }
          assert.equal(old.filter(x=>x.type==='secret_text').length,4);
          assert.equal(next.filter(x=>x.type==='secret_text').length,4);
          assert.equal(next.filter(x=>x.type==='d1').length,2);
          assert.equal(next.filter(x=>x.type==='assets').length,1);
          assert.deepEqual([...nextMap.keys()].filter(x=>!priorMap.has(x)),['CANONICAL_RECOGNITION_ENABLED']);
          assert.equal(nextMap.get('CANONICAL_RECOGNITION_ENABLED').type,'plain_text');
          assert.equal(nextMap.get('CANONICAL_RECOGNITION_ENABLED').text,'true');
          console.log('V066_NON_SECRET_BINDING_PARITY_AND_FOUR_OPAQUE_SECRETS=PASS');
          NODE
          curl -fsS --max-time 30 -H "$auth" "$api/deployments?per_page=1" > "$RUNNER_TEMP/v066-afterupload-deploy.json"
          test "$(jq -er '.result.deployments[0].versions[]|select(.percentage==100)|.version_id' "$RUNNER_TEMP/v066-afterupload-deploy.json")" = "$LIVE_V064"
          echo "V066_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "V066_UNROUTED_CANDIDATE=$candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "V066_EXISTING_23_BINDINGS=UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "V066_FOUR_SECRET_BINDINGS=PRESERVED_OPAQUE" >> "$GITHUB_STEP_SUMMARY"
          echo "V066_LIVE_TRAFFIC=UNCHANGED_V064" >> "$GITHUB_STEP_SUMMARY"
          echo "$candidate" > "$RUNNER_TEMP/v066-candidate-id.txt"
      - name: Preserve read-only candidate identifiers and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v066-unrouted-candidate
          path: |
            ${{ runner.temp }}/v066-candidate-id.txt
          if-no-files-found: warn
          retention-days: 7
