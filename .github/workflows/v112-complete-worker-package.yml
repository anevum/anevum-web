# Offline packaging only: no Cloudflare credentials or provider write operations.
name: ANEVUM V112 Complete Offline Apex Worker Package
on:
  pull_request:
    paths:
      - '.github/workflows/v112-complete-worker-package.yml'
      - 'creator-v1/ops/apex-worker-bundle-v112.mjs'
      - 'creator-v1/test/apex-worker-bundle-v112.test.mjs'
      - 'creator-v1/operations/apex-bundle-runtime-baseline-20261022.json'
  push:
    branches: ['release/v084-continuance-approved-20261019']
    paths:
      - '.github/workflows/v112-complete-worker-package.yml'
      - 'creator-v1/ops/apex-worker-bundle-v112.mjs'
      - 'creator-v1/test/apex-worker-bundle-v112.test.mjs'
      - 'creator-v1/operations/apex-bundle-runtime-baseline-20261022.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: anevum-v112-offline-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies and test package safety boundaries
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          node --test creator-v1/test/apex-worker-bundle-v112.test.mjs creator-v1/test/apex-prelaunch-gateway.test.mjs creator-v1/test/native-auth-pin-preflight-v109.test.mjs creator-v1/test/retire-xp-test-page-v105.test.mjs
      - name: Download exact passed approved-source frontend
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12466061529'
          run-id: 39870441272
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v112-frontend
          merge-multiple: true
      - name: Reconcile exact assets and frozen provider bindings, without credentials
        run: node creator-v1/ops/apex-worker-bundle-v112.mjs prepare "$RUNNER_TEMP/v112-frontend" "$RUNNER_TEMP/v112-package"
      - name: Compile complete canonical Worker without uploading
        run: npx --no-install wrangler deploy --dry-run --config "$RUNNER_TEMP/v112-package/wrangler.offline.json" --outdir "$RUNNER_TEMP/v112-package/worker-bundle"
      - name: Seal Worker and frontend hashes with explicit incomplete acceptance gates
        run: |
          node creator-v1/ops/apex-worker-bundle-v112.mjs seal "$RUNNER_TEMP/v112-package"
          npm ls --all --json > "$RUNNER_TEMP/v112-package/dependency-tree.json"
          echo 'COMPLETE_OFFLINE_PACKAGE=PASS; CLOUDFLARE_UPLOAD=NONE; PUBLIC_RELEASE_APPROVAL=NONE' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: anevum-v112-complete-worker-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/v112-package/
          retention-days: 14
          if-no-files-found: error
