name: ANEVUM V103 Private Studio Recovery QA
on:
  pull_request:
    paths:
      - creator-v1/shared/read-deadline*
      - creator-v1/web/src/lib/useResource.ts
      - creator-v1/web/src/lib/workbench-alpha.ts
      - creator-v1/web/src/pages/CanonicalStudioPage.tsx
      - creator-v1/web/src/pages/NativeCreatorStudio.tsx
      - creator-v1/web/src/components/MemberSpaceDashboard.tsx
      - creator-v1/test/*v103*
      - creator-v1/test/capture-native-creator-v095.mjs
      - creator-v1/test/native-creator-fixture-v095.mjs
      - creator-v1/test/capture-v100-apex-root.mjs
      - .github/workflows/v103-private-read-recovery-qa.yml
permissions:
  contents: read
concurrency:
  group: private-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_IREN_SPATIAL_GUIDE: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_CREATOR_WORKBENCH_ALPHA: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify cancellation, server permission preservation, and private state isolation
        run: |
          node --test creator-v1/test/private-read-recovery-v103.test.mjs creator-v1/test/member-space-resilience-v101.test.mjs
          node --experimental-strip-types --test creator-v1/test/v100-forum-review-access-transport.test.mjs creator-v1/test/workbench-alpha.test.mjs creator-v1/test/workbench-alpha-transport.test.mjs creator-v1/test/canonical-studio-v043.test.mjs tests/native-creator-client-v095.test.mjs
          npm run check:creator-v1-web
      - name: Test actual root bundle at 320, 390 and 1440 pixels
        shell: bash
        run: |
          set -euo pipefail
          npm run build:creator-v1-web
          mkdir -p recovery-evidence/root
          git rev-parse HEAD > recovery-evidence/source-sha.txt
          ANEVUM_APEX_ROOT_QA=1 node creator-v1/test/portal-offline-preview.mjs > recovery-evidence/root-fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-v100-apex-root.mjs "$chrome" http://127.0.0.1:4180 recovery-evidence/root
      - name: Test read deadlines, retry, and same-document account replacement in compiled React
        shell: bash
        run: |
          set -euo pipefail
          npm run build:creator-v1-web:staging
          node creator-v1/test/portal-offline-preview.mjs > recovery-evidence/native-fixture.log 2>&1 &
          fixture=$!
          trap 'kill "$fixture" 2>/dev/null || true' EXIT
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-native-creator-v095.mjs --chrome "$chrome" --output recovery-evidence/native --recovery
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const expected=readFileSync('recovery-evidence/source-sha.txt','utf8').trim();
          const r=JSON.parse(readFileSync('recovery-evidence/native/acceptance.json','utf8'));
          assert.equal(r.source,expected);assert.equal(r.status,'PASS');
          assert.equal(r.syntheticOnly,true);assert.equal(r.physicalDeviceAcceptance,false);
          for(const name of ['canonical-studio-read-deadline-and-explicit-retry','same-document-studio-account-switch-hides-old-private-records','native-read-deadline-and-explicit-retry'])assert.ok(r.cases.some(c=>c.case===name&&c.passed));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anevum-v103-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: recovery-evidence/
          if-no-files-found: error
          retention-days: 14
