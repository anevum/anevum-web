name: ANEVUM V138 Private Studio Draft Navigation QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/pages/CanonicalStudioPage.tsx'
      - 'creator-v1/web/src/pages/canonical-studio.css'
      - 'creator-v1/test/studio-draft-navigation-v138.test.mjs'
      - 'creator-v1/test/studio-v138-draft-guard-browser.mjs'
      - '.github/workflows/v138-private-studio-navigation.yml'
permissions:
  contents: read
concurrency:
  group: v138-private-studio-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  compiled-private-studio:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'false'
      CLOUDFLARE_API_TOKEN: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned project dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Exact source and protected drafting contract
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANEVUM_SOURCE_SHA"
          node --test creator-v1/test/studio-draft-navigation-v138.test.mjs
      - name: Compile exact UI bundle without runtime hooks
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install pinned isolated Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install chromium
      - name: Exercise verified synthetic Studio draft on desktop and phones
        run: node creator-v1/test/studio-v138-draft-guard-browser.mjs
      - name: Preserve exact-head anonymized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v138-studio-draft-${{ github.event.pull_request.head.sha }}
          path: evidence/v138-studio-draft/
          retention-days: 14
          if-no-files-found: warn
