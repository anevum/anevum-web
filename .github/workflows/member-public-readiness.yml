name: ANEVUM Member Production Readiness (Read Only)

on:
  workflow_run:
    workflows: ["Deploy ANEVUM Production"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anevum-member-production-readiness
  cancel-in-progress: false

jobs:
  read-only-member-preflight:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify audited commit matches successful website deployment
        if: github.event_name == 'workflow_run'
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Node dependencies
        run: npm install --no-audit --no-fund
      - name: Verify member configuration and local security contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-member-bindings.mjs --require-live
          node scripts/verify-member-staging-deploy.mjs
          node --test tests/member-adversarial.test.mjs tests/member-boundaries.test.mjs tests/member-command-cutover.test.mjs
          test "$(jq -r '.name' wrangler.jsonc)" = 'anevum-web-nextgen'
          test "$(jq -r '.vars.ANEVUM_MEMBERS_ENABLED' wrangler.jsonc)" = 'true'
          test "$(jq -r '.vars.ANEVUM_MEMBER_PREVIEW_ENABLED' wrangler.jsonc)" = 'false'
          test "$(jq -r '.d1_databases[0].database_id' wrangler.jsonc)" = '7f0d4c0c-2e85-4900-8504-1347954e1df1'
          test "$(jq -r '.previews.d1_databases[0].database_id' wrangler.jsonc)" = 'a537432e-d216-4b31-8b22-19662cc3a44a'
      - name: Confirm encrypted names on PRODUCTION Worker only — never read values
        id: production_secrets
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          curl --fail --silent --show-error --retry 2 --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-web-nextgen/secrets" \
            -o "$RUNNER_TEMP/member-prod-secret-inventory.json"
          jq -e '.success == true and (.result | type == "array")' \
            "$RUNNER_TEMP/member-prod-secret-inventory.json" >/dev/null
          missing=0
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BETTER_AUTH_SECRET; do
            if jq -e --arg n "$name" \
              'any(.result[]; .name == $n and .type == "secret_text")' \
              "$RUNNER_TEMP/member-prod-secret-inventory.json" >/dev/null; then
              echo "PASS encrypted production binding name: $name"
            else
              echo "::error::Missing production encrypted Secret: $name on Worker anevum-web-nextgen."
              missing=1
            fi
          done
          if [ "$missing" != '0' ]; then
            echo '::error::One or more production credentials are not encrypted Secret bindings. Convert/rotate these in anevum-web-nextgen, not staging.'
            exit 1
          fi
          echo 'Encryption/binding NAMES verified. Values, validity, Google callback and private Better Auth rotation are NOT verified.'
      - name: Inspect production D1 identity and schema — SELECT only
        id: production_d1
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler d1 list --json > "$RUNNER_TEMP/member-d1-inventory.json"
          jq -e '
            ([.[] | select(.name == "anevum-members" and .uuid == "7f0d4c0c-2e85-4900-8504-1347954e1df1")] | length) == 1 and
            ([.[] | select(.name == "anevum-members-preview" and .uuid == "a537432e-d216-4b31-8b22-19662cc3a44a")] | length) == 1
          ' "$RUNNER_TEMP/member-d1-inventory.json" >/dev/null

          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS member_tables FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','rateLimit','member_profiles','member_saved_apps','member_project_follows','member_entitlements')" \
            > "$RUNNER_TEMP/member-prod-table-count.json"
          jq -e '.[0].success == true and .[0].results[0].member_tables == 9' \
            "$RUNNER_TEMP/member-prod-table-count.json" >/dev/null
          count="$(jq -r '.[0].results[0].member_tables' "$RUNNER_TEMP/member-prod-table-count.json")"
          echo "PROD_D1_MEMBER_TABLES=$count"
          echo "PREVIEW_D1_SEPARATE=PASS"
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS draft_tables FROM sqlite_master WHERE type='table' AND name='member_rhen_drafts'" \
            > "$RUNNER_TEMP/member-prod-draft-table-count.json"
          jq -e '.[0].success == true and .[0].results[0].draft_tables == 1' "$RUNNER_TEMP/member-prod-draft-table-count.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command 'PRAGMA foreign_key_check' > "$RUNNER_TEMP/member-prod-foreign-keys.json"
          jq -e '.[0].success == true and (.[0].results|length) == 0' "$RUNNER_TEMP/member-prod-foreign-keys.json" >/dev/null
          echo 'Production D1 nine core tables and one draft table present; zero foreign-key violations.'
      - name: Read-only live anonymous Access, member and OAuth readiness probes
        id: anonymous_routes
        continue-on-error: true
        run: node scripts/probe-member-production-launch.mjs
      - name: Release readiness checkpoint
        if: always()
        shell: bash
        run: |
          {
            echo '## ANEVUM member production readiness (read-only)'
            echo ''
            echo 'Production registrations: **ENABLED** after a separately approved production merge; no schema migrations, trades or account writes were performed by this probe.'
            echo 'Cloudflare production encrypted auth binding NAMES, D1 identities/schema count, staging Google readiness, anonymous denials and RHEN Access: verified above.'
            echo 'No secret value, Google console client configuration, private auth-secret rotation or real two-member browser cookies were inspected.'
            echo ''
            echo 'Next: complete disposable real-account production Google sign-in, export, deletion, second-account isolation, and session revocation checks before announcing public availability.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Production encrypted Secret bindings: ${{ steps.production_secrets.outcome }}"
          echo "Production D1 identity/schema: ${{ steps.production_d1.outcome }}"
          echo "Anonymous live access and OAuth readiness: ${{ steps.anonymous_routes.outcome }}"
          if [ "${{ steps.production_secrets.outcome }}" != 'success' ] || [ "${{ steps.production_d1.outcome }}" != 'success' ] || [ "${{ steps.anonymous_routes.outcome }}" != 'success' ]; then
            echo '::error::Production member readiness NOT approved. Inspect diagnostics and immediately revert the signup flag if live availability or isolation failed.'
            exit 1
          fi
          echo 'PRODUCTION_MEMBER_READINESS=PASS (read-only; real authenticated production OAuth and private secret rotation remain separate approvals)'
