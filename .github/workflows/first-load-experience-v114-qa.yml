name: ANEVUM V115 First-Contact + IREN QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/pages/CinematicLandingPage.tsx'
      - 'creator-v1/web/src/first-load-experience-v114.css'
      - 'creator-v1/web/src/first-contact-wayfinder-v115.css'
      - 'creator-v1/web/src/components/IrenGuidedContinuance.tsx'
      - 'creator-v1/web/src/main.tsx'
      - 'creator-v1/test/first-load-experience-v114.test.mjs'
      - 'creator-v1/test/iren-first-contact-v092.test.mjs'
      - 'creator-v1/test/home-first-contact-v111.test.mjs'
      - 'creator-v1/test/capture-home-first-contact-v111.mjs'
      - '.github/workflows/first-load-experience-v114-qa.yml'
permissions:
  contents: read
concurrency:
  group: home-v114-${{ github.ref }}
  cancel-in-progress: true
jobs:
  first-load:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies without scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck canonical ANEVUM web application
        run: npm run check:creator-v1-web
      - name: Build first-load production assets
        run: npm run build:creator-v1-web
      - name: Build isolated staging-path assets
        run: npm run build:creator-v1-web:staging
      - name: Validate arrival, navigation and IREN contracts
        working-directory: creator-v1
        run: |
          node --test test/first-load-experience-v114.test.mjs
          node --test test/iren-first-contact-v092.test.mjs
          node --test test/home-first-contact-v111.test.mjs
          npm run test:iren-v080
          npm run test:iren-v088
          npm run test:ux-v079
      - name: Capture actual React first view and guide on three browser sizes
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          mkdir -p evidence/home-v114
          node creator-v1/test/portal-offline-preview.mjs > evidence/home-v114/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:4178/__ready >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4178/__ready >/dev/null
          node creator-v1/test/capture-home-first-contact-v111.mjs "$chrome" http://127.0.0.1:4178 evidence/home-v114
          test -s evidence/home-v114/acceptance.json
          test -s evidence/home-v114/first-arrival-desktop.png
          test -s evidence/home-v114/first-arrival-phone.png
          test -s evidence/home-v114/first-arrival-small-phone.png
          test -s evidence/home-v114/first-contact-iren-tour-phone.png
          test -s evidence/home-v114/first-contact-iren-welcome-phone.png
      - name: Retain visual evidence for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-v114-first-load-browser-evidence
          path: evidence/home-v114/
          retention-days: 14
          if-no-files-found: warn
      - name: Record exact source
        run: git rev-parse HEAD
# No production deploy, database writes, member-role changes or publication changes.
