name: ANEVUM V115 Achievement Bridge Source QA
on:
  pull_request:
    paths:
      - 'creator-v1/canonical-auth/migrations/0016_project_mark_bridge_v115.sql'
      - 'creator-v1/canonical-auth/project-mark-bridge-v115.mjs'
      - 'creator-v1/canonical-auth/worker.mjs'
      - 'creator-v1/sdk/achievement-bridge-v115/**'
      - 'creator-v1/test/project-mark-bridge-v115.test.mjs'
      - 'creator-v1/test/portal-offline-preview.mjs'
      - 'creator-v1/test/capture-project-marks-v115.mjs'
      - 'creator-v1/web/src/components/ProjectMarksV115.tsx'
      - 'creator-v1/web/src/pages/ProjectMarkConnectV115.tsx'
      - 'creator-v1/web/src/pages/project-marks-v115.css'
      - 'creator-v1/web/src/pages/Phase1MemberPage.tsx'
      - 'creator-v1/web/src/pages/Phase1PublicMemberPage.tsx'
      - 'creator-v1/web/src/App.tsx'
      - '.github/workflows/creator-project-marks-v115-qa.yml'
permissions:
  contents: read
concurrency:
  group: creator-project-marks-v115-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Real SQLite consent publisher replay and privacy tests
        run: node --test creator-v1/test/project-mark-bridge-v115.test.mjs creator-v1/test/creator-achievements-v114.test.mjs creator-v1/test/creator-achievements-v114-worker.test.mjs
      - name: Typecheck actual Creator V1 React
        run: npm run check:creator-v1-web
      - name: Build default-OFF React
        run: npm run build:creator-v1-web:staging
      - name: Build opt-in frontend only
        env:
          VITE_PROJECT_MARK_BRIDGE_V115: 'true'
          VITE_CREATOR_ACHIEVEMENTS_V114: 'true'
        run: npm run build:creator-v1-web:staging
      - name: Inspect actual compiled React at 1440 390 and 320
        env:
          ANEVUM_V114_ACHIEVEMENT_FIXTURE: '1'
          ANEVUM_V115_MARK_FIXTURE: '1'
        run: |
          set -euo pipefail
          mkdir -p evidence/creator-project-marks-v115
          node creator-v1/test/portal-offline-preview.mjs > evidence/creator-project-marks-v115/server.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 100); do
            if curl --fail --silent http://127.0.0.1:4178/__ready > /dev/null; then ready=1; break; fi
            sleep .25
          done
          test "$ready" -eq 1
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node creator-v1/test/capture-project-marks-v115.mjs --chrome "$chrome" --output evidence/creator-project-marks-v115
      - name: Retain source-bound synthetic consent/profile captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-project-marks-v115-browser
          path: evidence/creator-project-marks-v115
          if-no-files-found: warn
          retention-days: 14
      - name: Source-only safety receipt
        run: echo 'V115_UNAPPLIED_APPROVAL_PROVISIONING_ONLY_NO_LIVE_GRANTS_NO_GLOBAL_XP_NO_DEPLOYMENT' >> "$GITHUB_STEP_SUMMARY"
