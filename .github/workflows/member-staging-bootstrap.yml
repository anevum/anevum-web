name: ANEVUM Member Staging OAuth

on:
  push:
    branches: [main]
    paths:
      - 'wrangler.member-staging.jsonc'
      - '.github/workflows/member-staging-bootstrap.yml'
      - 'scripts/verify-member-staging-deploy.mjs'
      - 'src/server/member.mjs'
      - 'src/server/member-preflight.mjs'
      - 'src/member/**'
      - 'src/pages/Member*.tsx'
      - 'src/pages/RhenApp.tsx'
      - 'src/pages/RhenDraft.tsx'
      - 'src/pages/SignIn.tsx'
      - 'src/pages/Privacy.tsx'
      - 'src/pages/Terms.tsx'
      - 'src/styles/member*.css'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'worker.mjs'
      - 'vite.config.ts'
  pull_request:
    branches: [main]
    paths:
      - 'wrangler.member-staging.jsonc'
      - '.github/workflows/member-staging-bootstrap.yml'
      - 'scripts/verify-member-staging-deploy.mjs'
      - 'src/server/member.mjs'
      - 'src/server/member-preflight.mjs'
      - 'src/member/**'
      - 'src/pages/Member*.tsx'
      - 'src/pages/RhenApp.tsx'
      - 'src/pages/RhenDraft.tsx'
      - 'src/pages/SignIn.tsx'
      - 'src/pages/Privacy.tsx'
      - 'src/pages/Terms.tsx'
      - 'src/styles/member*.css'
      - 'src/App.tsx'
      - 'src/main.tsx'
      - 'package.json'
      - 'worker.mjs'
      - 'vite.config.ts'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_MEMBER_STAGING_ONLY after reviewing exact source and rollback'
        required: true
        type: string
      reviewed_head_sha:
        description: 'Exact reviewed 40-character main SHA for staging release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: anevum-member-staging-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    # PR/main pushes may run preflight and build, but ONLY a separately approved
    # manual dispatch at the exact current main SHA can deploy staging.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (github.ref == 'refs/heads/main' &&
       inputs.confirmation == 'DEPLOY_MEMBER_STAGING_ONLY' &&
       inputs.reviewed_head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      # Cloudflare Vite's documented entry-config override. This is intentionally
      # not an ordinary 'wrangler deploy --config' after a production build:
      # Vite generates a separate staging Worker bundle and Wrangler config.
      CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.member-staging.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python resume renderer
        run: pip install "weasyprint==68.0" "Pillow==11.3.0"
      - name: Install pinned Node dependencies
        run: npm install --no-audit --no-fund
      - name: Verify names of encrypted staging Worker secrets (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Cloudflare Worker token/account configuration is missing.'
            exit 1
          fi
          # Cloudflare's Secrets List API returns secret NAMES only, never values.
          # The HTTP response is written to an ephemeral file and never printed.
          secret_inventory="$RUNNER_TEMP/anevum-member-staging-secret-names.json"
          if ! curl --fail --silent --show-error --retry 2 --max-time 15 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-member-staging/secrets" \
            -o "$secret_inventory"; then
            echo '::error::Unable to read staging Worker secret names; check Workers Scripts Read/Write token permissions.'
            exit 1
          fi
          if ! jq -e '.success == true and (.result | type == "array")' "$secret_inventory" > /dev/null; then
            echo '::error::Cloudflare staging secret-name lookup returned an invalid response.'
            exit 1
          fi
          missing=0
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BETTER_AUTH_SECRET; do
            if jq -e --arg name "$name" 'any(.result[]; .name == $name and .type == "secret_text")' "$secret_inventory" > /dev/null; then
              echo "Verified encrypted staging secret binding: $name"
            else
              echo "::error::Missing encrypted secret on anevum-member-staging: $name"
              missing=1
            fi
          done
          if [ "$missing" != '0' ]; then
            echo '::error::Add the missing names under Cloudflare Workers & Pages > anevum-member-staging > Settings > Variables and Secrets. Do not paste values into GitHub or chat.'
            exit 1
          fi
      - name: Verify staging source config is isolated and Google OAuth is scoped
        run: |
          node scripts/verify-member-bindings.mjs --require-config
          node scripts/verify-member-staging-deploy.mjs
          node --test tests/member-staging.test.mjs
      - name: Build the separate staging Worker and static assets
        run: npm run build
      - name: Verify generated Worker will not overwrite production
        run: node scripts/verify-member-staging-deploy.mjs --generated
      - name: Deploy isolated staging OAuth Worker
        if: github.event_name == 'workflow_dispatch'
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo '::error::Cloudflare Worker deploy token or account ID is unavailable.'
            exit 1
          fi
          # This uses the generated config, verified to name ONLY anevum-member-staging.
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/anevum-member-staging-deploy.log"
          staging_url="$(grep -Eo 'https://anevum-member-staging\.[[:alnum:]._-]+\.workers\.dev' "$RUNNER_TEMP/anevum-member-staging-deploy.log" | head -n 1 || true)"
          if [ -z "$staging_url" ]; then
            echo '::error::Could not discover the new stable staging URL from the Wrangler deployment output. Inspect the deploy log.'
            exit 1
          fi
          echo "staging_url=$staging_url" >> "$GITHUB_OUTPUT"
          {
            echo '## ANEVUM member staging bootstrap'
            echo ''
            echo "Dedicated staging origin: $staging_url"
            echo ''
            echo 'Preview D1 only. Staging-only Google test authentication configured, pending real two-account acceptance.'
            echo 'Production member database and all RHEN broker-write paths remain unchanged.'
            echo ''
            echo "Google staging callback: $staging_url/api/auth/callback/google"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify staging Google identity readiness and deny operator access
        if: github.event_name == 'workflow_dispatch'
        env:
          STAGING_URL: ${{ steps.deploy.outputs.staging_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_URL"
          # A workers.dev route can become reachable after the
          # deploy API reports success. Curl's default --retry does not retry 404.
          # Wait a bounded time, but never silently accept a live signup response.
          status='not-checked'
          available=0
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --max-time 12 -o "$RUNNER_TEMP/member-availability.json" -w '%{http_code}' "$STAGING_URL/api/member/availability" 2>/dev/null || true)"
            if [ "$status" = '200' ]; then
              if ! jq -e '.available == true and .provider == "google"' "$RUNNER_TEMP/member-availability.json" > /dev/null; then
                echo '::error::Staging OAuth is not ready. Check staging-only Worker secret names, flags, and preview D1 migration without logging secret values.'
                exit 1
              fi
              available=1
              break
            fi
            case "$status" in
              000|404|429|500|502|503|504)
                echo "Staging route not ready (attempt $attempt of 30, HTTP $status)."
                ;;
              *)
                echo "::error::Unexpected staging availability response: HTTP $status"
                exit 1
                ;;
            esac
            sleep 5
          done
          if [ "$available" != 1 ]; then
            echo "::error::Staging URL was not reachable after 30 attempts; last HTTP $status. Check Workers & Pages > anevum-member-staging > Settings > Domains & Routes."
            exit 1
          fi
          member_status="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' "$STAGING_URL/api/member/me")"
          if [ "$member_status" != '401' ]; then
            echo "::error::Unauthenticated staging member endpoint must return 401: HTTP $member_status"
            exit 1
          fi
          draft_status="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' "$STAGING_URL/api/member/rhen/draft")"
          if [ "$draft_status" != '401' ]; then
            echo "::error::Anonymous RHEN draft API must deny access: HTTP $draft_status"
            exit 1
          fi
          workspace_status="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' "$STAGING_URL/api/member/rhen/workspace")"
          if [ "$workspace_status" != '401' ]; then
            echo "::error::Anonymous V5 RHEN workspace API must return 401: HTTP $workspace_status"
            exit 1
          fi
          auth_status="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' "$STAGING_URL/api/auth/get-session")"
          if [ "$auth_status" != '200' ]; then
            echo "::error::Staging auth handler is not responding: HTTP $auth_status"
            exit 1
          fi
          operator_status="$(curl --silent --show-error --max-time 12 -o /dev/null -w '%{http_code}' "$STAGING_URL/api/command/trader/status")"
          if [ "$operator_status" != '401' ]; then
            echo "::error::Staging operator endpoint is not blocked as expected: HTTP $operator_status"
            exit 1
          fi
          headers="$(curl --fail --silent --show-error --max-time 12 -D - -o /dev/null "$STAGING_URL/")"
          if ! printf '%s' "$headers" | grep -iq '^x-robots-tag: noindex, nofollow, noarchive'; then
            echo '::error::Staging public response must be excluded from search indexing.'
            exit 1
          fi
          echo 'Staging OAuth checks passed: availability ready, anonymous member denied, auth handler responsive, operator denied, noindex. Real Google sign-in remains untested.'
