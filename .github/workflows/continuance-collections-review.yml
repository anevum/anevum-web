name: ANEVUM Saved Collections UX Review
on:
  pull_request:
    paths:
      - '.github/workflows/continuance-collections-review.yml'
      - 'creator-v1/web/src/pages/CanonicalSavedWorksPage.tsx'
      - 'creator-v1/web/src/pages/canonical-saved-works.css'
      - 'creator-v1/web/src/lib/saved-works-browse.ts'
      - 'creator-v1/test/saved-works-organization-v010.test.mjs'
permissions:
  contents: read
concurrency:
  group: collections-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-review:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard isolated source scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only',process.env.BASE_SHA,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          const allowed=/^(?:\.github\/workflows\/continuance-collections-review\.yml|creator-v1\/web\/src\/pages\/(?:CanonicalSavedWorksPage\.tsx|canonical-saved-works\.css)|creator-v1\/web\/src\/lib\/saved-works-browse\.ts|creator-v1\/test\/saved-works-organization-v010\.test\.mjs)$/;
          for(const p of paths)if(!allowed.test(p))throw Error('Outside isolated collections review: '+p);
          JS
      - name: Install pinned project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify existing and new private library contracts
        run: node --experimental-strip-types --test creator-v1/test/canonical-saved-works-v009.test.mjs creator-v1/test/saved-works-organization-v010.test.mjs
      - name: React typecheck
        run: npm run check:creator-v1-web
      - name: Build existing app without deployment
        run: npm run build:creator-v1-web
