name: ANEVUM V091 Public Journey and Earned Artwork Canary
on:
  push:
    branches:
      - build/v091-experience-integration-20261019-001
    paths:
      - creator-v1/test/v091-public-live-canary.mjs
      - creator-v1/test/v091-live-emblem-browser.mjs
      - creator-v1/test/v091-release-acceptance.test.mjs
      - creator-v1/ops/v091-release-acceptance.mjs
      - .github/release-evidence/v091-authenticated.json
      - .github/workflows/v084-continuance-production.yml
      - .github/workflows/v091-live-readonly-qa.yml
  pull_request:
    paths:
      - creator-v1/test/v091-public-live-canary.mjs
      - creator-v1/test/v091-release-acceptance.test.mjs
      - creator-v1/ops/v091-release-acceptance.mjs
      - .github/release-evidence/v091-authenticated.json
      - .github/workflows/v084-continuance-production.yml
      - .github/workflows/v091-live-readonly-qa.yml
permissions:
  contents: read
concurrency:
  group: anevum-v091-live-readonly-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-canary:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact release source lock and authenticated acceptance tests
        shell: bash
        run: |
          set -euo pipefail
          node --test creator-v1/test/v091-release-acceptance.test.mjs
      - name: Verify read-only API checks and execute live public canary
        shell: bash
        run: |
          set -euo pipefail
          node --check creator-v1/test/v091-public-live-canary.mjs
          node creator-v1/test/v091-public-live-canary.mjs
      - name: Inspect real public emblems in desktop and mobile Chromium
        shell: bash
        env:
          V091_VISUAL_DIR: ${{ runner.temp }}/v091-art-evidence
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          export CHROME_BIN="$chrome"
          node --check creator-v1/test/v091-live-emblem-browser.mjs
          node creator-v1/test/v091-live-emblem-browser.mjs
      - name: Save public browser visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v091-public-earned-art-browser
          path: ${{ runner.temp }}/v091-art-evidence
          retention-days: 7
          if-no-files-found: warn
      - name: Confirm no deployment, database modification or account writes
        shell: bash
        run: |
          echo 'V091_PUBLIC_CANARY=READ_ONLY' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DEPLOY=NONE_IN_READONLY_CANARY' >> "$GITHUB_STEP_SUMMARY"
          echo 'D1_MIGRATIONS=NONE' >> "$GITHUB_STEP_SUMMARY"
