name: V5 Private Learning Source Assembly (temporary, no deploy)
on:
  push:
    branches: [build/anevum-v5-member-learning-progress-20261011]
    paths: [scripts/v5-learning-progress-assembly.py, .github/workflows/v5-learning-progress-assembly.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'anevum/anevum-web' && github.actor == 'anevum' && contains(github.event.head_commit.message, '[r3-source-assembly]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test exact-parent replacements and create immutable source blobs only
        run: python3 scripts/v5-learning-progress-assembly.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: v5-r3-reviewed-source-blobs
          path: r3-reviewed-blobs.json
          if-no-files-found: error
          retention-days: 3
