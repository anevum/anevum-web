name: ANEVUM V071 Canonical Entry Integration Review

# Review-only source build on V069 recognition lineage. No Cloudflare, D1,
# email, Stripe, privileged account or publication write credentials.
on:
  pull_request:
    branches:
      - patch/player-recognition-catalog-v069-20261017-018
    paths:
      - creator-v1/**
      - tests/creator-v1-cinematic-v005.test.mjs
      - docs/creator-platform/ANEVUM-V071-CANONICAL-ENTRY-INTEGRATION-2026-10-18.md
      - .github/workflows/canonical-v071-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-acceptance:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert immutable review head
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEW_SHA"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript and production/staging bundle build
        run: |
          npm run check:creator-v1-web
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
      - name: Verify canonical signup, community and old-route retirement
        run: |
          node --test creator-v1/test/continuance-entry-v052.test.mjs creator-v1/test/community-entry-v066.test.mjs
          node --test creator-v1/test/community-hub-v007.test.mjs creator-v1/test/canonical-profile-save-error-v027.test.mjs
          node --experimental-strip-types --test creator-v1/test/canonical-saved-works-v009.test.mjs
          node --test creator-v1/test/canonical-forums-v041.test.mjs creator-v1/test/apex-prelaunch-gateway.test.mjs
          node --test creator-v1/test/canonical-open-signup-gate-v020.test.mjs creator-v1/test/canonical-otp-resend-v023.test.mjs
      - name: Preserve V069 recognition, private Studio and original source navigation
        run: |
          node --test tests/creator-v1-cinematic-v005.test.mjs
          node --test creator-v1/test/member-profile-ui.test.mjs creator-v1/test/sitewide-canonical-cleanup-v012.test.mjs creator-v1/test/sitewide-experience-v009.test.mjs
          node --experimental-strip-types --test creator-v1/test/a-staging-v013-integration.test.mjs creator-v1/test/atlas-morph-navigation.test.mjs
      - name: Confirm nondeployed review boundary
        run: |
          echo "V071_SOURCE_REVIEW_ONLY=PASS"
          echo "No D1 migrations, live Worker deployment, feature flags, account creation, public publishing, role grants or charges."
