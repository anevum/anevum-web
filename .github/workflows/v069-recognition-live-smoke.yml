name: ANEVUM V069 Public Recognition and WebGL Live Smoke
# Read-only production QA; never publishes, changes D1, modifies bindings, or issues awards.
on:
  push:
    branches: [patch/player-recognition-catalog-v069-20261017-018]
    paths:
      - ".github/workflows/v069-recognition-live-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check actual open signup and anonymous recognition privacy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-v069-live-catalog
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 35             https://anevum.com/recognition -o qa-v069-live-catalog/recognition.html
          grep -q 'id="root"' qa-v069-live-catalog/recognition.html
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 35             https://anevum.com/api/v1/member/auth-methods -o qa-v069-live-catalog/auth-methods.json
          jq -e '.registration=="open" and .methods.email.available==true' qa-v069-live-catalog/auth-methods.json >/dev/null
          code="$(curl -sS --connect-timeout 12 --max-time 25 -o /dev/null -w '%{http_code}'             https://anevum.com/api/v1/member/recognition)"
          test "$code" = 401
          code="$(curl -sS --connect-timeout 12 --max-time 25 -o /dev/null -w '%{http_code}'             https://anevum.com/api/v1/member/progression)"
          test "$code" = 401
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 35             https://anevum.com/api/v1/public/recognition/catalog -o qa-v069-live-catalog/public-catalog.json
          jq -e '.version==1 and (.activeBadgeIds|length)==6 and (.activeRibbonIds|length)==0 and (.activeMedalIds|length)==0 and
            (.activeBadgeIds|index("first_orbit")!=null) and (.activeBadgeIds|index("first_thread")!=null)'             qa-v069-live-catalog/public-catalog.json >/dev/null
          code="$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}'             'https://anevum.com/api/v1/public/recognition/catalog?member=anything')"
          test "$code" = 400
          code="$(curl -sS --max-time 25 -X POST -o /dev/null -w '%{http_code}'             https://anevum.com/api/v1/public/recognition/catalog)"
          test "$code" = 405
          echo V069_LIVE_SIGNUP_PRIVATE_RECOGNITION_AND_PUBLIC_ISSUER_CATALOG=PASS
      - name: Verify guest award catalog and first viewport across desktop, tablet, and phones
        shell: bash
        env:
          ANEVUM_REGISTRY_LIVE_QA: '1'
        run: |
          set -euo pipefail
          node --check creator-v1/test/recognition-public-catalog-v069-browser.mjs
          node creator-v1/test/recognition-public-catalog-v069-browser.mjs
          test -s qa-v069-live-catalog/registry-1440.png
          test -s qa-v069-live-catalog/registry-390.png
          echo V069_REAL_LIVE_PUBLIC_CATALOG_AND_FIRST_FOLD=PASS
      - name: Confirm V064 WebGL native Evolution miniatures survive V069
        shell: bash
        run: |
          set -euo pipefail
          node creator-v1/test/evolution-mini-live-browser-v062.mjs
      - name: Retain live production evidence without user data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v069-real-live-recognition-and-native-smoke
          path: |
            qa-v069-live-catalog/
            qa-v062-live-member/
          if-no-files-found: warn
          retention-days: 14
