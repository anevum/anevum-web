name: ANEVUM V117 Continuance Entry and IREN QA
on:
  pull_request:
    paths:
      - 'creator-v1/web/src/pages/CinematicLandingPage.tsx'
      - 'creator-v1/web/src/pages/Phase1JoinPage.tsx'
      - 'creator-v1/web/src/components/IrenGuidedContinuance.tsx'
      - 'creator-v1/web/src/main.tsx'
      - 'creator-v1/web/src/continuance-entry-v117.css'
      - 'creator-v1/test/continuance-entry-v117.test.mjs'
      - 'creator-v1/test/capture-continuance-entry-v117.mjs'
      - '.github/workflows/continuance-entry-v117-qa.yml'
permissions:
  contents: read
concurrency:
  group: continuance-entry-v117-${{ github.ref }}
  cancel-in-progress: true
jobs:
  entry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repo dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check canonical creator TypeScript
        run: npm run check:creator-v1-web
      - name: Build canonical React site and isolated staging-path assets
        run: |
          npm run build:creator-v1-web
          npm run build:creator-v1-web:staging
      - name: Test first-contact, signup, IREN and V117 invariants
        working-directory: creator-v1
        run: |
          node --test test/continuance-entry-v117.test.mjs
          node --test test/first-load-experience-v114.test.mjs
          node --test test/signup-access-states-v082.test.mjs
          node --test test/iren-first-contact-v092.test.mjs
          node --test test/iren-home-integration-v116.test.mjs
          npm run test:iren-v111
      - name: Capture actual 1440, 390 and 320 pixel React member entrance
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          mkdir -p evidence/continuance-v117
          node creator-v1/test/portal-offline-preview.mjs > evidence/continuance-v117/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:4178/__ready >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4178/__ready >/dev/null
          node creator-v1/test/capture-continuance-entry-v117.mjs "$chrome" http://127.0.0.1:4178 evidence/continuance-v117
          test -s evidence/continuance-v117/acceptance.json
          test -s evidence/continuance-v117/join-arrival-desktop.png
          test -s evidence/continuance-v117/join-panel-phone.png
          test -s evidence/continuance-v117/join-panel-small-phone.png
          test -s evidence/continuance-v117/join-iren-phone.png
      - name: Retain member-entry acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuance-v117-member-entry-browser-acceptance
          path: evidence/continuance-v117/
          retention-days: 14
          if-no-files-found: warn
      - name: Record exact reviewed SHA
        run: git rev-parse HEAD
# No deploy, D1 write, account creation, XP action or creator publishing.
