name: ANEVUM Unified Member Collections Review
on:
  pull_request:
    paths:
      - '.github/workflows/continuance-member-collections-review.yml'
      - 'creator-v1/web/src/components/MemberCollectionNav.tsx'
      - 'creator-v1/web/src/components/EarnedRewardVault.tsx'
      - 'creator-v1/web/src/components/MemberSpaceDashboard.tsx'
      - 'creator-v1/web/src/lib/member-collection-map.ts'
      - 'creator-v1/web/src/member-collection-nav.css'
      - 'creator-v1/web/src/pages/LevelsPage.tsx'
      - 'creator-v1/web/src/pages/RecognitionRegistryPage.tsx'
      - 'creator-v1/web/src/pages/CanonicalSavedWorksPage.tsx'
      - 'creator-v1/test/member-collections-v011.test.mjs'
      - 'creator-v1/test/member-collections-v011-browser.mjs'
      - 'docs/production/continuance-member-collections-v011.md'
permissions:
  contents: read
concurrency:
  group: member-collections-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-head-review:
    if: github.repository == 'anevum/anevum-web' && github.event.pull_request.head.repo.full_name == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ''
      CLOUDFLARE_API_KEY: ''
      CLOUDFLARE_ACCOUNT_ID: ''
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard isolated changes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          const base='47db4dddb3795a0c9c876a680fc0a46b7b392539';
          execFileSync('git',['merge-base','--is-ancestor',base,'HEAD']);
          const paths=execFileSync('git',['diff','--name-only',base,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          const allowed=/^(?:\.github\/workflows\/continuance-member-collections-review\.yml|creator-v1\/web\/src\/(?:components\/(?:MemberCollectionNav\.tsx|EarnedRewardVault\.tsx|MemberSpaceDashboard\.tsx)|lib\/member-collection-map\.ts|member-collection-nav\.css|pages\/(?:LevelsPage\.tsx|RecognitionRegistryPage\.tsx|CanonicalSavedWorksPage\.tsx))|creator-v1\/test\/member-collections-v011(?:\.test|-browser)\.mjs|docs\/production\/continuance-member-collections-v011\.md)$/;
          for(const path of paths)if(!allowed.test(path))throw Error('Unreviewed file in isolated source diff: '+path);
          JS
      - name: Install pinned project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify existing earned-only and collections contracts
        run: |
          node --experimental-strip-types --test \
            creator-v1/test/member-collections-v011.test.mjs \
            creator-v1/test/canonical-saved-works-v009.test.mjs \
            creator-v1/test/saved-works-organization-v010.test.mjs \
            creator-v1/test/member-space-resilience-v101.test.mjs \
            creator-v1/test/earned-reward-media-v075.test.mjs
      - name: Full React source typecheck
        run: npm run check:creator-v1-web
      - name: Verify normal build remains default-off
        env:
          VITE_MEMBER_COLLECTION_NAV_REVIEW: 'false'
        run: npm run build:creator-v1-web
      - name: Explicitly enable isolated review
        env:
          VITE_MEMBER_COLLECTION_NAV_REVIEW: 'true'
        run: npm run build:creator-v1-web
      - name: Install Chromium without persisting manifest changes
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Review compiled app at 1440, 390 and 320
        run: node creator-v1/test/member-collections-v011-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-collections-${{ github.event.pull_request.head.sha }}
          path: /tmp/member-collections-v011
          retention-days: 14
          if-no-files-found: warn
