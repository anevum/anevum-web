name: ANEVUM V041 Hosted Forum Activation Verification

# Non-mutating, unauthenticated smoke checks for the owner's staging hostname.
on:
  push:
    branches: [build/community-forums-v041-20261016]
    paths: [.github/workflows/a-staging-v041-live-verify.yml]

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live community posts, privacy, profile health and apex isolation
        shell: bash
        run: |
          set -euo pipefail
          root=https://a.anevum.com
          get(){
            curl --fail --silent --show-error --max-time 25 "$root$1"
          }
          status(){
            curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' "$root$1"
          }
          ready=0
          for attempt in $(seq 1 12); do
            if get /api/v1/community/threads | jq -e '(.items|type)=="array" and has("nextCursor")' >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1 || { echo "::error::Hosted canonical forums not enabled/healthy"; exit 1; }
          get /api/v1/community/threads?topic=games | jq -e '(.items|type)=="array" and has("nextCursor")' >/dev/null
          test "$(status '/api/v1/community/threads?topic=invalid')" = 400
          test "$(status '/api/v1/community/threads?after=bad')" = 400
          test "$(status /api/v1/member/forum-review)" = 401
          test "$(status /api/v1/member/forum-submissions)" = 401
          test "$(status /api/v1/member/creator-profile)" = 401
          test "$(status /api/v1/member/notifications)" = 401
          test "$(status /api/v1/community/reports)" = 401
          test "$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://a.anevum.com' -H 'Content-Type: application/json' --data-binary '{}' "$root/api/v1/community/threads")" = 401
          test "$(curl --silent --show-error --max-time 25 -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://foreign.invalid' -H 'Content-Type: application/json' --data-binary '{}' "$root/api/v1/community/threads")" = 403
          get /api/v1/member/health | jq -e '.status=="ready" and .progressionReady==true' >/dev/null
          get /api/v1/member/auth-methods | jq -e '.methods.email.available==true' >/dev/null
          get /api/v1/member/auth/get-session | jq -e '. == null' >/dev/null
          for route in members activity; do
            get "/api/v1/community/$route" | jq -e '(.items|type)=="array" and has("nextCursor")' >/dev/null
          done
          for route in / /community /community/review /join /levels /thebutton; do
            get "$route" | grep -q 'id="root"'
          done
          for level in 01 30 60; do
            curl --fail --silent --show-error --max-time 25 "$root/assets/levels/series-one-v037/level-$level.webp" -o "/tmp/v041-level-$level.webp"
            test -s "/tmp/v041-level-$level.webp"
          done
          curl --fail --silent --show-error --max-time 25 https://anevum.com/ | grep -q 'THE TRANSMISSION'
          echo 'V041_STAGING_LIVE_FORUMS_AUTH_PRIVACY_AND_APEX=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only anonymous reads and unauthorized-denied writes were exercised; no real member records were created.' >> "$GITHUB_STEP_SUMMARY"
