name: PARITY V136 Targeted Live-Compatible Release
on:
  pull_request:
    paths:
      - '.github/workflows/parity-v136-release.yml'
      - 'creator-v1/ops/parity-v136-release.mjs'
      - 'creator-v1/ops/parity-v136-asset-pair.mjs'
      - 'creator-v1/test/parity-v136-asset-pair.test.mjs'
      - 'creator-v1/test/parity-v136-full-browser.mjs'
      - 'creator-v1/test/parity-v136-discover-browser.mjs'
      - 'creator-v1/web/src/pages/DiscoverPage.tsx'
      - 'creator-v1/web/src/parity/**'
      - 'creator-v1/web/vite.config.ts'
      - 'creator-v1/web/src/main.tsx'
      - 'creator-v1/web/src/components/Shell.tsx'
      - 'creator-v1/web/src/pages/CinematicLandingPage.tsx'
      - 'creator-v1/web/public/assets/parity-v136/**'
      - 'creator-v1/web/public/assets/institute/**'
      - 'creator-v1/graphics/**'
      - 'package.json'
      - 'creator-v1/web/src/pages/NativeCreatorStudio.tsx'
      - 'creator-v1/source-ide/**'
      - 'site/alpha/v003/archive.d.mts'
  push:
    branches: ['release/parity-v136-home-navigation-20261024-001', 'release/parity-v136-living-world-20261024-005', 'release/parity-v136-institute-20261024-011', 'release/parity-v136-unified-ui-20261025-004', 'release/parity-v136-unified-baseline-20261026-005']
permissions:
  contents: read
  actions: read
concurrency:
  group: parity-v136-targeted-release-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify-package:
    if: >-
      github.event_name == 'pull_request' || (github.event.head_commit.message == 'release(parity-v136): upload verified homepage candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified living-world candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified institute candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified unified UI candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified unified baseline candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ''
      WRANGLER_SEND_METRICS: 'false'
      VITE_PARITY_V136_FULL: 'true'
      VITE_PARITY_V136_CINEMATIC: 'true'
      VITE_PARITY_V136_HORIZON_QA: 'false'
      VITE_PARITY_V136_SHARED_SCENE_QA: 'false'
      VITE_PARITY_V136_NATIVE_VIDEO: 'false'
      VITE_IREN_SPATIAL_GUIDE: 'true'
      VITE_NATIVE_CREATOR_STUDIO_V095: 'true'
      VITE_PACKAGE_CREATOR_GALLERY_V010: 'true'
      VITE_MEMBER_COLLECTION_NAV_REVIEW: 'true'
      VITE_ANEVUM_OWNER_REVIEW: 'false'
      ANEVUM_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact reviewed release source
        run: test "$(git rev-parse HEAD)" = "$ANEVUM_SOURCE_SHA"
      - run: node creator-v1/ops/parity-v136-release.mjs source
      - name: Exact reviewed UI bytes and protected release boundaries
        run: node --test creator-v1/test/parity-v136-release-scope.test.mjs creator-v1/test/visual-convergence-v136.test.mjs
      - name: Controller input mapping and repeat safety
        run: node --experimental-strip-types --test creator-v1/test/parity-v136-controller.test.mjs
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Existing data, collections, rewards and auth contracts
        run: |
          node --experimental-strip-types --test creator-v1/test/member-collections-v011.test.mjs creator-v1/test/saved-works-organization-v010.test.mjs creator-v1/test/canonical-saved-works-v009.test.mjs creator-v1/test/member-space-resilience-v101.test.mjs creator-v1/test/earned-reward-media-v075.test.mjs creator-v1/test/apex-worker-bundle-v117.test.mjs
      - run: node creator-v1/graphics/inspect-institute-assets.mjs
      - run: node --experimental-strip-types --test creator-v1/test/source-archive-v136.test.mjs creator-v1/test/csp-meshopt-v136.test.mjs creator-v1/test/parity-v136-asset-pair.test.mjs
      - run: npm run check:creator-v1-web
      - run: npm run build:creator-v1-web
      - run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - run: node creator-v1/test/parity-v136-full-browser.mjs
      - name: Production-mode public baseline at all five widths
        env:
          MOTION_QA_OUTPUT: evidence/parity-v136/production-baseline
        run: node creator-v1/test/motion-first-browser.mjs --production
      - name: V136 Discover composition, filters, catalogue and responsive acceptance
        run: node creator-v1/test/parity-v136-discover-browser.mjs
      - name: Preserve verified member collections, guest and disabled states
        run: node creator-v1/test/v132-member-collections-browser.mjs
      - name: Retain original sealed V131 gateway and earned artwork
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12526930761'
          run-id: 40011027824
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v131-preserved
          merge-multiple: true
      - run: node creator-v1/ops/parity-v136-release.mjs package "$RUNNER_TEMP/v131-preserved/v131-package" creator-v1/dist/web "$RUNNER_TEMP/parity-package"
      - name: Recover exact verified baseline frontend package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12568230255'
          run-id: 40114163357
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v136-baseline
          merge-multiple: true
      - name: Recover exact previous canary asset package
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '12604142447'
          run-id: 40207577332
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/v136-previous-canary
          merge-multiple: true
      - name: Preserve baseline HTML and build identical shared asset inventories
        run: node creator-v1/ops/parity-v136-asset-pair.mjs "$RUNNER_TEMP/v136-baseline" "$RUNNER_TEMP/v136-previous-canary/candidate" "$RUNNER_TEMP/parity-package" "$RUNNER_TEMP/parity-paired"
      - uses: actions/upload-artifact@v4
        with:
          name: parity-v136-package-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/parity-paired
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-v136-release-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/parity-v136
            /tmp/member-collections-v011
          retention-days: 14
  upload-inactive:
    needs: verify-package
    if: >-
      github.event_name == 'push' && (github.event.head_commit.message == 'release(parity-v136): upload verified homepage candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified living-world candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified institute candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified unified UI candidate' || github.event.head_commit.message == 'release(parity-v136): upload verified unified baseline candidate')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - uses: actions/download-artifact@v4
        with:
          name: parity-v136-package-${{ github.sha }}
          path: ${{ runner.temp }}/parity-paired
      - name: Fresh immutable baseline preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/parity-v136-release.mjs before "$RUNNER_TEMP/parity-paired/baseline"
      - name: Upload unchanged baseline frontend plus shared assets; zero traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler versions upload --no-bundle --no-upload-source-maps --keep-vars --strict --config "$RUNNER_TEMP/parity-paired/baseline/upload.json" --message "PARITY V136 baseline-assets-only $GITHUB_SHA; V131 gateway unchanged; INACTIVE"
      - name: Verify immutable bindings and original live traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/parity-v136-release.mjs after "$RUNNER_TEMP/parity-paired/baseline"
      - name: Fresh immutable candidate preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/parity-v136-release.mjs before "$RUNNER_TEMP/parity-paired/candidate"
      - name: Upload verified candidate with identical shared assets; zero traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler versions upload --no-bundle --no-upload-source-maps --keep-vars --strict --config "$RUNNER_TEMP/parity-paired/candidate/upload.json" --message "PARITY V136 frontend $GITHUB_SHA; V131 gateway unchanged; INACTIVE"
      - name: Verify candidate bindings and unchanged production allocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node creator-v1/ops/parity-v136-release.mjs after "$RUNNER_TEMP/parity-paired/candidate"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-v136-inactive-receipt-${{ github.sha }}
          path: |
            ${{ runner.temp }}/parity-paired/baseline/inactive-receipt.json
            ${{ runner.temp }}/parity-paired/candidate/inactive-receipt.json
            ${{ runner.temp }}/parity-paired/asset-pair-report.json
          retention-days: 14
