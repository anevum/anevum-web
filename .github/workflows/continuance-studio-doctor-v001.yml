name: Continuance Lab - Studio Project Doctor V001

on:
  push:
    branches:
      - research/studio-project-doctor-v001-20261023
    paths:
      - creator-v1/agent-quality-lab/**
      - creator-v1/workbench-alpha/document.mjs
      - creator-v1/interface-builder/document.mjs
      - .github/workflows/continuance-studio-doctor-v001.yml
  pull_request:
    paths:
      - creator-v1/agent-quality-lab/**
      - creator-v1/workbench-alpha/document.mjs
      - creator-v1/interface-builder/document.mjs
      - .github/workflows/continuance-studio-doctor-v001.yml

permissions:
  contents: read

jobs:
  project-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated read-only Studio diagnostics tests
        run: node --test creator-v1/agent-quality-lab/project-doctor-v001.test.mjs
