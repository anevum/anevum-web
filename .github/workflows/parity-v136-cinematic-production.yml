name: PARITY V136 Cinematic Production QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/parity-v136-cinematic-production.yml'
      - 'creator-v1/graphics/author-cinematic-institute-v136.py'
      - 'creator-v1/graphics/lod-cinematic-institute-v136.py'
      - 'creator-v1/graphics/optimize-cinematic-runtime-v136.mjs'
      - 'creator-v1/web/src/parity/CinematicStageGeometryV136.ts'
      - 'creator-v1/test/parity-v136-stage-geometry.test.mjs'
      - 'creator-v1/test/parity-v136-cinematic-stage-browser.mjs'
      - 'docs/production/parity-v136-cinematic-runtime-20261024.md'
      - 'creator-v1/graphics/inspect-cinematic-camera-v136.mjs'
      - 'creator-v1/test/parity-v136-camera-registration.test.mjs'
      - 'creator-v1/web/src/parity/CinematicCameraRegistrationV136.ts'
      - 'creator-v1/graphics/encode-cinematic-v136.mjs'
      - 'creator-v1/graphics/inspect-cinematic-candidate-v136.mjs'
      - 'creator-v1/graphics/smoke-cinematic-v136.mjs'
      - 'creator-v1/test/parity-v136-media-contract.test.mjs'
      - 'creator-v1/web/src/parity/CinematicMediaContractV136.ts'
      - 'creator-v1/web/src/parity/CinematicFramesV136.tsx'
      - 'creator-v1/web/src/parity/CinematicVideoV136.tsx'
      - 'creator-v1/web/src/parity/CinematicArrivalV136.tsx'
      - 'docs/production/parity-v136-cinematic-production-20261024.md'
permissions:
  contents: read
concurrency:
  group: cinematic-v136-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  candidate-media-pipeline:
    if: github.repository == 'anevum/anevum-web' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'anevum/anevum-web')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg/FFprobe codecs for offline media QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Verify local FFmpeg and original Blender authoring syntax
        run: |
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 2
          python3 -m py_compile creator-v1/graphics/author-cinematic-institute-v136.py
      - name: Frame-accurate source, approval and runtime security contracts
        run: |
          node --experimental-strip-types --test creator-v1/test/parity-v136-media-contract.test.mjs
          node --experimental-strip-types --test creator-v1/test/parity-v136-cinematic.test.mjs
          node --experimental-strip-types --test creator-v1/test/parity-v136-camera-registration.test.mjs
          node --experimental-strip-types --test creator-v1/test/parity-v136-stage-geometry.test.mjs
      - name: Encode real short footage and verify both image/video derivatives
        run: node creator-v1/graphics/smoke-cinematic-v136.mjs

  authored-scene-preview:
    # Historical Blender/GPU background candidate; no longer a pull-request default.
    if: github.repository == 'anevum/anevum-web' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install offline authored scene renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg python3-numpy
          python3 -c 'import numpy; print("NumPy", numpy.__version__)'
          blender --version | head -n 2
      - name: Verify native arrival and retired artwork invariants
        run: |
          node --experimental-strip-types --test creator-v1/test/parity-v136-sitewide-art-retirement.test.mjs
      - name: Render four authored all-3D Institute camera frames (PREVIEW only)
        run: PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python creator-v1/graphics/author-cinematic-institute-v136.py -- --out "$RUNNER_TEMP/continuance-blender" --quality preview --frames 4
      - name: Encode original all-3D frames and MP4/WebM without external APIs
        run: node creator-v1/graphics/encode-cinematic-v136.mjs --frames "$RUNNER_TEMP/continuance-blender" --out "$RUNNER_TEMP/continuance-cinematic" --fps 8
      - name: Verify file hashes, frame chronology, native source resolution and video codecs
        run: node creator-v1/graphics/inspect-cinematic-candidate-v136.mjs --candidate "$RUNNER_TEMP/continuance-cinematic"
      - name: Check camera transforms against exported ORIGINAL review GLB and landmarks
        run: node --experimental-strip-types creator-v1/graphics/inspect-cinematic-camera-v136.mjs --source "$RUNNER_TEMP/continuance-blender" --candidate "$RUNNER_TEMP/continuance-cinematic"
      - name: Create desktop/mobile material-batched geometry from packed Blender source
        run: |
          PYTHONPATH=/usr/lib/python3/dist-packages blender --background --python creator-v1/graphics/lod-cinematic-institute-v136.py -- --blend "$RUNNER_TEMP/continuance-blender/continuance-institute-atrium-v136014.blend" --camera-manifest "$RUNNER_TEMP/continuance-blender/camera-manifest.json" --out "$RUNNER_TEMP/continuance-lod"
      - name: Install pinned project optimization and stage preview dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Compress original scene variants with Meshopt and enforce source/budget gates
        run: node creator-v1/graphics/optimize-cinematic-runtime-v136.mjs --lod "$RUNNER_TEMP/continuance-lod" --camera "$RUNNER_TEMP/continuance-blender/camera-manifest.json" --out "$RUNNER_TEMP/continuance-stage"
      - name: Compile opt-in stage geometry into a disposable compiled QA site only
        env:
          VITE_PARITY_V136_FULL: 'true'
          VITE_PARITY_V136_CINEMATIC: 'true'
          VITE_PARITY_V136_SHARED_SCENE_QA: 'true'
        run: |
          mkdir -p creator-v1/web/public/assets/cinematic-v136/stage
          cp "$RUNNER_TEMP/continuance-stage/"*.glb "$RUNNER_TEMP/continuance-stage/manifest.json" creator-v1/web/public/assets/cinematic-v136/stage/
          npm run check:creator-v1-web
          npm run build:creator-v1-web
      - name: Install isolated Chromium browser with software WebGL
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Render real shared cinematic geometry and camera in desktop/mobile QA
        env:
          VITE_PARITY_V136_SHARED_SCENE_QA: 'true'
        run: node creator-v1/test/parity-v136-cinematic-stage-browser.mjs
      - name: Upload original and optimized 3D plus QA evidence (never production assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v136-cinematic-runtime-STAGE-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/continuance-lod/
            ${{ runner.temp }}/continuance-stage/
            evidence/parity-v136/cinematic-shared-stage/
          retention-days: 14
          if-no-files-found: warn
      - name: Publish reviewer-only render source and playback derivatives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v136-original-cinematic-PREVIEW-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/continuance-blender/
            ${{ runner.temp }}/continuance-cinematic/
          retention-days: 14
          if-no-files-found: warn
