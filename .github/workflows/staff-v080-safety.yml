name: ANEVUM Staff V080 Safety
on:
  pull_request:
    paths:
      - "creator-v1/operations/**"
      - "creator-v1/test/staff-project-v080*.test.mjs"
      - "creator-v1/package.json"
      - "creator-v1/test/staff-session-transport-v091.test.mjs"
      - "creator-v1/test/staff-observatory-ux-v091.test.mjs"
      - "creator-v1/test/staff-observatory-aura-v092.test.mjs"
      - "creator-v1/test/capture-staff-observatory-v092.mjs"
      - ".github/workflows/staff-v080-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staff-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker, UI and lifecycle module syntax
        run: |
          node --check creator-v1/operations/staff-project-worker-v080.mjs
          node --check creator-v1/operations/staff-project-control-v080.mjs
          node --check creator-v1/operations/staff-project-ui-v080.mjs
      - name: Validate staff access, lifecycle, and preview contracts
        run: node --test creator-v1/test/staff-project-v080.test.mjs creator-v1/test/staff-project-v080-integration.test.mjs
      - name: Install the existing Workers runtime for V091 service-binding regression
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Exercise the preserved staff Workers in workerd
        run: node --test creator-v1/test/staff-session-transport-v091.test.mjs creator-v1/test/staff-transport-release-v091.test.mjs
      - name: Check isolated V092 Observatory candidate and unchanged protected V091 staff source
        run: node --test creator-v1/test/staff-observatory-ux-v091.test.mjs creator-v1/test/staff-observatory-aura-v092.test.mjs
      - name: Validate V099 authenticated staff shortcut boundaries and finite Observatory failures
        run: node --test creator-v1/test/staff-navigation-and-connecting-v099.test.mjs
      - name: Capture isolated V092 owner and reviewer desktop/phone browser views
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          node --check creator-v1/test/capture-staff-observatory-v092.mjs
          node creator-v1/test/capture-staff-observatory-v092.mjs "$chrome" "$RUNNER_TEMP/observatory-v092"
          test -s "$RUNNER_TEMP/observatory-v092/owner-desktop.png"
          test -s "$RUNNER_TEMP/observatory-v092/owner-phone.png"
          test -s "$RUNNER_TEMP/observatory-v092/owner-small-phone.png"
          test -s "$RUNNER_TEMP/observatory-v092/reviewer-phone.png"
          test -s "$RUNNER_TEMP/observatory-v092/acceptance.json"
      - name: Verify native V099 React Founder/Reviewer shortcuts in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          node --check creator-v1/test/capture-native-staff-link-v099.mjs
          node creator-v1/test/capture-native-staff-link-v099.mjs "$chrome" "$RUNNER_TEMP/staff-v099"
          test -s "$RUNNER_TEMP/staff-v099/native-link-acceptance.json"
          test -s "$RUNNER_TEMP/staff-v099/founder-390.png"
          test -s "$RUNNER_TEMP/staff-v099/reviewer-390.png"
          node --input-type=module - "$RUNNER_TEMP/staff-v099/native-link-acceptance.json" <<'JS'
          import {readFileSync} from "node:fs";
          const data=JSON.parse(readFileSync(process.argv[2],"utf8"));
          if(!data.pass||data.productionRequests!==0||data.productionWrites!==0||data.evidence.length!==8||data.evidence.some(x=>!x.passed))throw Error("V099_SYNTHETIC_BROWSER_ACCEPTANCE_FAILED");
          console.log("V099_NATIVE_FOUNDER_REVIEWER_ORDINARY_GUEST_BROWSER=PASS");
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anevum-staff-v099-native-browser-qa
          path: ${{ runner.temp }}/staff-v099/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anevum-observatory-v092-mobile-desktop-qa
          path: ${{ runner.temp }}/observatory-v092/
          retention-days: 14
          if-no-files-found: warn
