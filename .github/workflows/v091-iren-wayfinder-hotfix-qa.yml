name: ANEVUM V091 IREN Wayfinder Binary-Only Hotfix QA
on:
  push:
    branches: [hotfix/v091-iren-wayfinder-live-css-20261019-001]
  pull_request:
    paths:
      - 'creator-v1/web/src/iren-guided-v080.css'
      - 'creator-v1/test/iren-guided-v080.test.mjs'
      - 'creator-v1/test/capture-home-navigation-v079.mjs'
      - 'creator-v1/ops/v091-wayfinder-binary-hotfix.py'
      - '.github/workflows/v091-iren-wayfinder-hotfix-qa.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: anevum-v091-iren-binary-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verified-hotfix:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require unchanged live-matching application source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2938f8d387cf08ee3de4abc32c4fabf737556597 HEAD
          diff -u <(printf '%s\n' \
            '.github/workflows/v091-iren-wayfinder-hotfix-qa.yml' \
            'creator-v1/ops/v091-wayfinder-binary-hotfix.py' \
            'creator-v1/test/capture-home-navigation-v079.mjs' \
            'creator-v1/test/iren-guided-v080.test.mjs' \
            'creator-v1/web/src/iren-guided-v080.css' | sort) \
            <(git diff --name-only 2938f8d387cf08ee3de4abc32c4fabf737556597 HEAD | sort)
          test "$(git hash-object creator-v1/web/src/components/Shell.tsx)" = "8b4e87f9f000db04e854c4b0b71e168f04a82d5d"
          test "$(git hash-object creator-v1/web/src/main.tsx)" = "bea62c4b49d329de62c59aef3af16ba0b5691586"
      - name: Download two exact-head, green, immutable CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            39339804557:2938f8d387cf08ee3de4abc32c4fabf737556597 \
            39345116874:6c750fa8d3d2b8fd67964fb7c68b8dfdf66d4ccf; do
            run="$(printf '%s' "$pair" | cut -d: -f1)"
            sha="$(printf '%s' "$pair" | cut -d: -f2)"
            state="$(gh api "repos/anevum/anevum-web/actions/runs/$run" --jq '.head_sha+" "+.conclusion+" "+.status')"
            test "$state" = "$sha success completed"
          done
          gh run download 39339804557 -R anevum/anevum-web -n creator-v1-build-39339804557 -D reference
          gh run download 39345116874 -R anevum/anevum-web -n creator-v1-build-39345116874 -D fixed
          test -s reference/react-web/assets/index-DU9BE5mP.css
          test -s reference/react-web/assets/index-AsGe25lN.js
          test -s fixed/react-web/assets/index-D0zm7CJm.css
      - name: Build byte-preserving HTML and CSS-only binary hotfix
        shell: bash
        run: |
          set -euo pipefail
          python creator-v1/ops/v091-wayfinder-binary-hotfix.py \
            --baseline reference --fixed fixed \
            --output creator-v1/dist/web --evidence evidence/wayfinder-css
          test -s creator-v1/dist/web/assets/index-iren-wayfinder-17edd74201ac4e89.css
          test -s evidence/wayfinder-css/binary-parity.json
      - name: Run IREN and home navigation unit contracts
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node --test creator-v1/test/iren-guided-v080.test.mjs
          node --experimental-strip-types --test creator-v1/test/home-navigation-v079.test.mjs
      - name: Check production-matching patched binary in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          node creator-v1/test/portal-offline-preview.mjs > evidence/wayfinder-css/fixture.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 80); do
            if curl -fsS http://127.0.0.1:4178/__ready >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:4178/__ready >/dev/null
          node creator-v1/test/capture-home-navigation-v079.mjs "$chrome" http://127.0.0.1:4178 evidence/wayfinder-css
          test -s evidence/wayfinder-css/acceptance.json
          test -s evidence/wayfinder-css/wayfinder-iren-desktop.png
          test -s evidence/wayfinder-css/wayfinder-iren-phone.png
          test -s evidence/wayfinder-css/wayfinder-iren-small-phone.png
      - name: Archive binary release candidate and responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anevum-v091-iren-binary-css-qa
          path: |
            creator-v1/dist/web/
            evidence/wayfinder-css/
          retention-days: 30
          if-no-files-found: warn
      - name: Report read-only QA
        run: |
          echo 'IREN_CSS_ONLY_HOTFIX=VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'APP_JAVASCRIPT_UNCHANGED=YES' >> "$GITHUB_STEP_SUMMARY"
          echo 'PRODUCTION_DEPLOY=NONE' >> "$GITHUB_STEP_SUMMARY"
