name: RHEN Cloud Billing Refresh Diagnostics (Read Only)

on:
  push:
    branches:
      - work/rhen-cloud-billing-foundation-2026-10-09
    paths:
      - '.github/workflows/rhen-cloud-refresh-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anevum-rhen-cloud-billing-refresh-read-only
  cancel-in-progress: false

jobs:
  diagnose-staging-only:
    if: github.ref == 'refs/heads/work/rhen-cloud-billing-foundation-2026-10-09'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Assert exact preview D1 and production-disabled state
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          jq -e '
            .name=="anevum-member-staging" and .vars.ANEVUM_STRIPE_MODE=="test" and
            .d1_databases[0].database_name=="anevum-members-preview" and
            .d1_databases[0].database_id=="a537432e-d216-4b31-8b22-19662cc3a44a"
          ' wrangler.member-staging.jsonc >/dev/null
          jq -e '
            .name=="anevum-web-nextgen" and .vars.ANEVUM_STRIPE_MODE=="disabled" and
            .vars.ANEVUM_RHEN_BILLING_ENABLED=="false" and
            .vars.ANEVUM_RHEN_BILLING_CHECKOUT_ENABLED=="false" and
            .d1_databases[0].database_id=="7f0d4c0c-2e85-4900-8504-1347954e1df1"
          ' wrangler.jsonc >/dev/null
      - name: Inspect cancellation synchronization timestamps without member identities
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.preview-migrations.jsonc --json \
            --command "SELECT COUNT(*) AS matches, COALESCE(MAX(s.cancel_at_period_end),0) AS scheduled, COALESCE(MAX(s.source_checked_at_ms),0) AS source_checked_at_ms, COALESCE(MAX(t.last_attempt_ms),0) AS last_attempt_ms, COALESCE(MAX(t.last_success_ms),0) AS last_success_ms FROM member_billing_subscriptions s LEFT JOIN member_billing_sync_state t ON t.user_id=s.user_id WHERE s.stripe_subscription_id='sub_1UOedYDSvwYS3kwTgDj5vPYI' AND s.stripe_customer_id='cus_VPTZXJPJKj3vNM' AND s.status='active'" \
            > "$RUNNER_TEMP/rhen-cloud-sync.json"
          jq -e '.[0].success==true and .[0].results[0].matches==1' "$RUNNER_TEMP/rhen-cloud-sync.json" >/dev/null
          jq -r '.[0].results[0] |
            "AUDIT_SCHEDULED_FLAG=\(.scheduled)",
            "AUDIT_SYNC_ATTEMPT_OCCURRED=\(if .last_attempt_ms>0 then "yes" else "no" end)",
            "AUDIT_SYNC_SUCCESS_OCCURRED=\(if .last_success_ms>0 then "yes" else "no" end)",
            "AUDIT_SOURCE_LAST_CHECKED_MS=\(.source_checked_at_ms)",
            "AUDIT_LAST_SYNC_SUCCESS_MS=\(.last_success_ms)"' "$RUNNER_TEMP/rhen-cloud-sync.json"
          {
            echo "## RHEN Cloud: read-only refresh diagnostic"
            echo
            echo "One exact sandbox member subscription matched in preview D1."
            echo "Local scheduled flag: $(jq -r '.[0].results[0].scheduled' "$RUNNER_TEMP/rhen-cloud-sync.json")"
            echo "Member subscription refresh has succeeded: $(jq -r '.[0].results[0].last_success_ms>0' "$RUNNER_TEMP/rhen-cloud-sync.json")"
            echo "Stored local status is diagnostic only; Stripe's scheduled cancellation is authoritative."
            echo "No personal identifiers, card details, Stripe secret values, D1 changes, or production access."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect anonymous member count and mapping integrity only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.preview-migrations.jsonc --json \
            --command "SELECT (SELECT COUNT(*) FROM \"user\") AS staging_member_count, (SELECT COUNT(*) FROM member_billing_customers) AS mapped_billing_members, (SELECT COUNT(*) FROM member_billing_subscriptions s LEFT JOIN member_billing_customers c ON s.user_id=c.user_id AND s.stripe_customer_id=c.stripe_customer_id WHERE c.user_id IS NULL) AS mismatched_subscriptions" \
            > "$RUNNER_TEMP/rhen-cloud-isolation.json"
          jq -e '.[0].success==true and .[0].results[0].mismatched_subscriptions==0' "$RUNNER_TEMP/rhen-cloud-isolation.json" >/dev/null
          jq -r '.[0].results[0] |
            "AUDIT_STAGING_MEMBER_COUNT=\(.staging_member_count)",
            "AUDIT_MAPPED_BILLING_MEMBERS=\(.mapped_billing_members)",
            "AUDIT_INVALID_SUBSCRIPTION_OWNERSHIP_LINKS=\(.mismatched_subscriptions)"' "$RUNNER_TEMP/rhen-cloud-isolation.json"
          echo 'PASS anonymous counts and 0 invalid subscription-owner mappings; this does not replace authenticated two-user isolation testing.'
