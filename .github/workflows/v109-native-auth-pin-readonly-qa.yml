name: ANEVUM V109 Native AUTH Pin Read-only QA
on:
  pull_request:
    paths:
      - "creator-v1/ops/native-auth-pin-preflight-v109.mjs"
      - "creator-v1/test/native-auth-pin-preflight-v109.test.mjs"
      - ".github/workflows/v109-native-auth-pin-readonly-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'anevum/anevum-web'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate fail-closed zero-traffic override preflight
        run: |
          set -euo pipefail
          node --check creator-v1/ops/native-auth-pin-preflight-v109.mjs
          node --check creator-v1/test/native-auth-pin-preflight-v109.test.mjs
          node --test creator-v1/test/native-auth-pin-preflight-v109.test.mjs
          echo 'NATIVE_AUTH_PIN_READ_ONLY_QA=PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PROVIDER_EVIDENCE=NOT_SUPPLIED; LIVE_PIN_NOT_APPROVED; NO_DEPLOYMENT' >> "$GITHUB_STEP_SUMMARY"
