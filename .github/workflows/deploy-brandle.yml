name: Verify BRANDLE legacy source (no deployment)

# CUTOVER CANDIDATE: on this review branch only. Do not merge until the
# standalone Brandle environment, credentials, release and rollback are verified.
# Merging retires BOTH the original push-triggered and manual deployment paths.
# Keep the original source and read-only verification for history and recovery.
# Production release ownership remains with the existing monorepo workflow
# until this retirement is actually merged and independently verified.
on:
  pull_request:
    paths:
      - 'games/brandle/**'
      - '.github/workflows/deploy-brandle.yml'
  push:
    branches: [main]
    paths:
      - 'games/brandle/*.mjs'
      - 'games/brandle/*.js'
      - 'games/brandle/*.html'
      - 'games/brandle/*.css'
      - 'games/brandle/*.svg'
      - 'games/brandle/*.png'
      - 'games/brandle/*.webmanifest'
      - 'games/brandle/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: games/brandle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax
        run: |
          node --check app.mjs
          node --check logic.mjs
          node --check build-worker.mjs
      - name: Test word logic
        run: node --test tests.mjs
      - name: Build isolated Worker without deployment
        run: node build-worker.mjs
      - name: Check generated Worker syntax
        run: node --check dist/worker.mjs
