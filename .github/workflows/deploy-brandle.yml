name: Deploy BRANDLE to Cloudflare Worker
on:
  pull_request:
    paths:
      - 'games/brandle/**'
      - '.github/workflows/deploy-brandle.yml'
  push:
    branches: [main]
    paths:
      - 'games/brandle/**'
      - '.github/workflows/deploy-brandle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: games/brandle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check app.mjs
          node --check logic.mjs
          node --check build-worker.mjs
      - name: Test word logic
        run: node --test tests.mjs
      - name: Build isolated worker
        run: node build-worker.mjs
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
