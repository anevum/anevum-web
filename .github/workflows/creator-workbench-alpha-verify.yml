name: Creator Workbench Private Alpha

on:
  push:
    branches: [build/creator-workbench-private-alpha-20261020-001]
  pull_request:
    paths:
      - 'creator-v1/**/workbench*'
      - 'creator-v1/**/Workbench*'
      - 'creator-v1/workbench-alpha/**'
      - 'creator-v1/canonical-auth/worker.mjs'
      - 'creator-v1/canonical-auth/migrations/0013_workbench_alpha_access.sql'
      - 'creator-v1/web/src/App.tsx'
      - '.github/workflows/creator-workbench-alpha-verify.yml'

permissions:
  contents: read

concurrency:
  group: workbench-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install retained project dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify private access, persistence, transport and retained Studio
        run: |
          node --check creator-v1/canonical-auth/worker.mjs
          node --test creator-v1/test/workbench-alpha.test.mjs creator-v1/test/workbench-alpha-transport.test.mjs
          node --test creator-v1/test/canonical-studio-v043.test.mjs creator-v1/test/canonical-auth-worker-v013.test.mjs
      - name: Typecheck canonical React application
        run: npm run check:creator-v1-web
      - name: Compile default-OFF application
        env:
          VITE_CREATOR_WORKBENCH_ALPHA: 'false'
        run: npm run build:creator-v1-web
      - name: Compile opt-in alpha for synthetic testing only
        env:
          VITE_CREATOR_WORKBENCH_ALPHA: 'true'
        run: npm run build:creator-v1-web:staging
      - name: Package exact source and compiled code for independent review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workbench-evidence
          git rev-parse HEAD > workbench-evidence/source-sha.txt
          python3 - <<'PY'
          import pathlib, subprocess, tarfile
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          allowed = {'.mjs', '.js', '.cjs', '.ts', '.tsx', '.jsx', '.json', '.jsonc', '.mts', '.css', '.html', '.sql', '.yml', '.yaml', '.md'}
          with tarfile.open('workbench-evidence/tracked-source.tar.gz', 'w:gz') as archive:
              for name in names:
                  p = pathlib.Path(name)
                  if p.is_file() and not p.is_symlink() and p.suffix in allowed and p.stat().st_size < 2000000:
                      archive.add(p, arcname=name, recursive=False)
          with tarfile.open('workbench-evidence/compiled-code.tar.gz', 'w:gz') as archive:
              for folder in ['creator-v1/dist/web', 'creator-v1/dist/react-staging']:
                  for p in pathlib.Path(folder).rglob('*'):
                      if p.is_file() and p.suffix in {'.js', '.css', '.html'}:
                          archive.add(p, arcname=str(p), recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-alpha-source-${{ github.sha }}
          path: workbench-evidence/
          retention-days: 3
