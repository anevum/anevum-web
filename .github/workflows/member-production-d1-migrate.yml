name: Prepare ANEVUM Production Member D1 (Approved Manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type MIGRATE_PRODUCTION_MEMBER_DB; production signup stays disabled'
        required: true
        type: string
      privacy_terms_approved:
        description: 'Owner has reviewed and approved current privacy and terms content'
        required: true
        type: boolean
        default: false
      staging_security_approved:
        description: 'Two-account staging OAuth, isolation, deletion, and adversarial checks accepted'
        required: true
        type: boolean
        default: false
      google_production_confirmed:
        description: 'Production Google OAuth origins/callback and private auth secret rotation verified'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: anevum-production-member-migration
  cancel-in-progress: false

jobs:
  migrate-production:
    if: inputs.confirmation == 'MIGRATE_PRODUCTION_MEMBER_DB' && inputs.privacy_terms_approved && inputs.staging_security_approved && inputs.google_production_confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wrangler
        run: npm install --no-audit --no-fund
      - name: Validate production is disabled and D1 target is precisely isolated
        run: |
          set -euo pipefail
          node scripts/verify-member-bindings.mjs --require-config
          node --test tests/member-bindings.test.mjs tests/member-staging.test.mjs tests/member-command-cutover.test.mjs
          jq -e '.name == "anevum-web-nextgen" and .vars.ANEVUM_MEMBERS_ENABLED == "false" and .vars.ANEVUM_MEMBER_PREVIEW_ENABLED == "false" and (.d1_databases | length) == 1' wrangler.jsonc >/dev/null
          test "$(jq -r '.d1_databases[0].database_id' wrangler.jsonc)" = "7f0d4c0c-2e85-4900-8504-1347954e1df1"
          test "$(jq -r '.previews.d1_databases[0].database_id' wrangler.jsonc)" = "a537432e-d216-4b31-8b22-19662cc3a44a"
          test "$(jq -r '.d1_databases[0].database_name' wrangler.jsonc)" = "anevum-members"
          test "$(ls migrations/*.sql | wc -l | tr -d ' ')" = "2"
      - name: Check scoped D1 token and exact Cloudflare database inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > "$RUNNER_TEMP/member-db-inventory.json"
          jq -e '
            ([.[]|select(.name=="anevum-members" and .uuid=="7f0d4c0c-2e85-4900-8504-1347954e1df1")]|length)==1 and
            ([.[]|select(.name=="anevum-members-preview" and .uuid=="a537432e-d216-4b31-8b22-19662cc3a44a")]|length)==1
          ' "$RUNNER_TEMP/member-db-inventory.json" >/dev/null
      - name: Confirm production Worker secret names only (never values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/anevum-web-nextgen/secrets" \
            -o "$RUNNER_TEMP/prod-secret-names.json"
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET BETTER_AUTH_SECRET; do
            if ! jq -e --arg n "$name" 'any(.result[]; .name==$n and .type=="secret_text")' "$RUNNER_TEMP/prod-secret-names.json" >/dev/null; then
              echo "::error::Missing production Worker encrypted binding: $name"
              exit 1
            fi
          done
          echo 'Production Worker contains three encrypted auth bindings; their values were neither read nor validated.'
      - name: Read production schema state before any mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS member_tables FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','rateLimit','member_profiles','member_saved_apps','member_project_follows','member_entitlements')" \
            > "$RUNNER_TEMP/prod-schema-before.json"
          jq -e '.[0].success == true and (.[0].results[0].member_tables == 0 or .[0].results[0].member_tables == 9)' "$RUNNER_TEMP/prod-schema-before.json" >/dev/null
      - name: Migrate production D1 schema only, without enabling signup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply MEMBER_DB --remote --config wrangler.jsonc
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS member_tables FROM sqlite_master WHERE type='table' AND name IN ('user','session','account','verification','rateLimit','member_profiles','member_saved_apps','member_project_follows','member_entitlements')" \
            > "$RUNNER_TEMP/prod-schema-after.json"
          jq -e '.[0].success == true and .[0].results[0].member_tables == 9' "$RUNNER_TEMP/prod-schema-after.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command "SELECT COUNT(*) AS draft_tables FROM sqlite_master WHERE type = 'table' AND name = 'member_rhen_drafts'" \
            > "$RUNNER_TEMP/prod-drafts-after.json"
          jq -e '.[0].success == true and .[0].results[0].draft_tables == 1' "$RUNNER_TEMP/prod-drafts-after.json" >/dev/null
          npx wrangler d1 execute MEMBER_DB --remote --config wrangler.jsonc --json \
            --command 'PRAGMA foreign_key_check' > "$RUNNER_TEMP/prod-schema-fk.json"
          jq -e '.[0].success == true and (.[0].results|length)==0' "$RUNNER_TEMP/prod-schema-fk.json" >/dev/null
      - name: Verify production signup is still unavailable
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "https://anevum.com/api/member/availability" |
            jq -e '.available == false and .provider == null' > /dev/null
          {
            echo '## Production member D1 migration'
            echo ''
            echo 'PRODUCTION D1: 9 core tables + 1 optional inactive draft table; zero foreign-key violations.'
            echo 'Production signup is STILL DISABLED.'
            echo 'No Access, broker-write, RHEN deployment, or production member flags were changed.'
            echo ''
            echo 'Next: separately approved production feature-gate activation with live post-deploy tests.'
          } >> "$GITHUB_STEP_SUMMARY"
